# Repo-root cargo config. Cargo reads `.cargo/config.toml` from its CWD upward,
# so this file applies to cargo runs started at the repo root AND under
# src-tauri/ (src-tauri/.cargo/config.toml is read first and may add to it).
# Keep keys that must hold whatever the CWD here.
[env]
# The PostgreSQL release that `postgresql_embedded`'s `bundled` build script
# embeds in the binary. Unset, the build script resolves "*", meaning the newest
# theseus-rs/postgresql-binaries release at build time, so a fresh build ships
# whatever upstream published last.
#
# - 2026-10-18 21:15Z: upstream published 18.6.1. Its Linux binaries need
#   GLIBC 2.36, and ubuntu-22.04 has 2.35 (so does any user on an older glibc).
#   Every embedded_pg test on the ubuntu-22.04 CI leg then failed at initdb
#   (coord finding ed52d2f3).
# - 2026-11-24: the pin lived in src-tauri/.cargo/config.toml, which cargo does
#   not read for a build started at the repo root. The primary runner on device
#   bcf4751a was built that way, bundled PG 19.0.0, and could not start its
#   PG 18 cluster ("control file appears to be corrupt"). It booted without a
#   database for over a day (coord finding 25c336a1).
#
# The value is an EXACT requirement, so a version bump is a deliberate edit here.
# Three readers parse the `NAME = "=X.Y.Z"` shape, so keep it:
# `embedded_pg::tests::bundled_postgres_is_the_pinned_release` fails when the
# binary embeds anything else; src-tauri/build.rs refuses a build whose
# environment does not carry this pin (a build started outside the repo, with
# --manifest-path, reads no file here); scripts/ci/purge-stale-bundled-postgres.mjs
# drops cached build units that embed another release.
#
# A MAJOR bump also needs an upgrade path for users' existing cluster data dirs:
# `embedded_pg::bootstrap` will not start a server of another major against an
# existing cluster. An explicit POSTGRESQL_VERSION in the environment still wins
# (`[env]` does not force by default), and build.rs refuses it when its major
# differs from this pin.
POSTGRESQL_VERSION = "=18.6.0"
