# actionlint configuration — read by the `workflow-lint` job. Plan:
# 2026-10-04-adopt-self-hosted-ci-scout-improvements, Phase 1. actionlint is
# pinned at 1.7.12 and run with `-shellcheck=` (shellcheck is not a pinned
# input of the job, so its findings would depend on the host).
self-hosted-runner:
  labels:
    # The only runner registered to this repo: merytshost-public
    # [self-hosted, Linux, X64, public-pool] (measured 2026-10-04).
    - public-pool
paths:
  .github/workflows/**/*.{yml,yaml}:
    ignore:
      # SC ignores apply to local runs only: the workflow-lint job passes
      # `-shellcheck=`, so CI never runs shellcheck and these are inert there.
      # They mute info/style noise when a developer runs actionlint locally
      # with shellcheck enabled.
      - 'SC2086:info'
      - 'SC2016:info'
      - 'SC2129:style'
