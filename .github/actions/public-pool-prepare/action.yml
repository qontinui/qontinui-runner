# Make a PERSISTENT public-pool host safe for one routed job, before anything
# else in that job runs. Used ONLY on the self-hosted lane (the caller guards it
# with `if: env.SELF_HOSTED_LANE == 'true'`); the hosted lane never runs it.
#
# Plan 2026-10-03-runner-pr-branch-windows-ci-has-no-off-hosted-path (qontinui-
# dev-notes), Phase 1. A hosted runner is a fresh VM per job; a public-pool host
# (`merytshost-public` today, user `runner-public`, no sudo) is not. Three things
# this workflow assumed of a fresh VM are false there, and each is handled here:
#
#   1. SIBLING CHECKOUTS PERSIST. `checkout-sibling` checks each sibling out to
#      `$GITHUB_WORKSPACE/../<name>` and REFUSES a destination that already
#      exists (by design: it is the one contract for sibling checkouts). On a
#      persistent host the previous job's siblings are still there, so this step
#      removes exactly the named sibling directories -- never anything else under
#      the workspace parent -- before the caller's checkout-sibling steps run.
#
#   2. NO SUDO, NO APT. The hosted lane `sudo apt-get install`s the webkit/gtk
#      build deps; `runner-public` cannot, and must not be given sudo. They are a
#      host prerequisite installed once by the operator; this step VERIFIES them
#      (dpkg-query) and fails naming what is missing, rather than letting a
#      cargo build fail an hour later on a missing pkg-config file.
#
#   3. A PERSISTENT TARGET DIR PER PR replaces rust-cache. `actions/checkout`
#      cleans the workspace (`git clean -ffdx`), so `./target` would be cold every
#      run. The target dir lives OUTSIDE the workspace, keyed by `target-key` (the
#      PR number + job): repeat pushes to one PR build incrementally, and PRs do
#      not share artifacts BY ACCIDENT. This is accident isolation, not
#      adversarial: every job runs as `runner-public` and can write any key; the
#      adversarial fix is the host prerequisite (one uid per repo, `_work`/`_tool`
#      wiped between jobs). Keys untouched for 3+ days are pruned, and the oldest
#      go first when the total passes `max-target-gb`. No key, no target dir.
#
#   5. THE RUST TOOLCHAIN IS VERIFIED, NOT INSTALLED. On the pool, ci.yml skips
#      dtolnay/rust-toolchain (it writes RUSTUP_HOME); this step requires
#      toolchain 1.95.0 with clippy+rustfmt to be present AND RUSTUP_HOME to be
#      read-only to the job account -- the host prerequisite, enforced here.
#
#   4. A PER-JOB HOME. More than one runner listener can run as `runner-public`
#      (qontinui-web's does today), so `$HOME` is shared between concurrent jobs.
#      ci.yml's ambient-state poison bracket writes `~/.qontinui`, and tests read
#      `dirs::home_dir()` -- which on Linux is `$HOME`. So the job gets its own
#      `$HOME` under `$RUNNER_TEMP` (discarded with the job), with CARGO_HOME and
#      RUSTUP_HOME pinned to the account's real home FIRST so the toolchain is still
#      found. Linux only: on Windows `dirs::home_dir()` ignores `$HOME`
#      (SHGetKnownFolderPath), so this would void the poison canary there.
#
# Prints /etc/os-release: on the pool, `test (ubuntu-22.04)` runs on the HOST's OS,
# not an ubuntu-22.04 image -- a PR-head green there is a verdict about that host.
# Merge-candidate pushes stay hosted, so the land verdict is unaffected.
#
# NOT a security boundary. Job code runs as `runner-public`; host isolation (an
# ephemeral runner, a runner install the job cannot write, no reach to the host's
# loopback/LAN services) is a host prerequisite, recorded in the plan's Phase 2.
name: public-pool-prepare
description: Prepare a persistent public-pool host for one routed job (self-hosted lane only).
inputs:
  siblings:
    description: Space-separated sibling repo names this job checks out with checkout-sibling.
    required: false
    default: ''
  check-build-deps:
    description: "'true' to verify the Linux webkit/gtk build dependencies are installed."
    required: false
    default: 'false'
  max-target-gb:
    description: Prune the oldest per-PR target dirs while their total exceeds this many GiB.
    required: false
    default: '200'
  target-key:
    description: Key for the persistent target dir (e.g. pr-1234-test); [A-Za-z0-9._-] only. Empty = no target dir.
    required: false
    default: ''
  check-rust:
    description: "'true' to require toolchain 1.95.0 (+clippy, rustfmt) preinstalled and RUSTUP_HOME read-only."
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SIBLINGS: ${{ inputs.siblings }}
        CHECK_BUILD_DEPS: ${{ inputs.check-build-deps }}
        MAX_TARGET_GB: ${{ inputs.max-target-gb }}
        TARGET_KEY: ${{ inputs.target-key }}
        CHECK_RUST: ${{ inputs.check-rust }}
      run: |
        set -euo pipefail
        set -f   # no glob expansion of the sibling list
        echo "public-pool host: $(hostname) user=$(id -un) runner=${RUNNER_NAME:-?}"
        if [ "${RUNNER_OS:-}" != "Linux" ]; then
          echo "::error::public-pool-prepare is Linux-only today (per-job HOME is wrong on Windows)"
          exit 1
        fi
        grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release 2>/dev/null || true

        # Remove a path, tolerating read-only modes; never fail the job on it.
        zap() {
          # A symlink is removed, never followed (chmod -R would follow it).
          if [ -L "$1" ]; then rm -f -- "$1"; return; fi
          chmod -R u+w -- "$1" 2>/dev/null || true
          rm -rf -- "$1" 2>/dev/null || { echo "::warning::could not remove $1"; return 1; }
        }

        # 1. Stale sibling checkouts -- exactly the named directories.
        parent="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
        for name in ${SIBLINGS}; do
          case "${name}" in
            ''|*/*|.|..|*'*'*|*'?'*|*'['*) echo "::error::refusing sibling name '${name}'"; exit 1 ;;
          esac
          if [ "${parent}/${name}" = "${GITHUB_WORKSPACE}" ]; then
            echo "::error::sibling '${name}' is the workspace itself"; exit 1
          fi
          if [ -e "${parent}/${name}" ] || [ -L "${parent}/${name}" ]; then
            echo "removing stale sibling checkout ${parent}/${name}"
            zap "${parent:?}/${name}" || { echo "::error::cannot clear ${parent}/${name}"; exit 1; }
          fi
        done

        # 2. Host build prerequisites (verified, never installed).
        if [ "${CHECK_BUILD_DEPS}" = "true" ]; then
          missing=()
          for pkg in libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
                     libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
                     libatspi2.0-dev at-spi2-core python3-yaml; do
            if ! dpkg-query -W -f='${Status}' "${pkg}" 2>/dev/null | grep -q "install ok installed"; then
              missing+=("${pkg}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=public-pool host is missing build deps::${missing[*]} -- install them on the host once (operator, apt); runner-public has no sudo by design"
            exit 1
          fi
          echo "build deps present"
        fi

        real_home="${HOME}"
        rustup_home="${RUSTUP_HOME:-${real_home}/.rustup}"

        # 5. (runs before 3 and 4) Rust toolchain: verified, never installed. The job account must neither
        #    own nor be able to write anything under RUSTUP_HOME, or the toolchain's bin;
        #    PATH gets the TOOLCHAIN's bin dir, never the rustup proxy dir (which a
        #    default install puts in the job account's own ~/.cargo/bin).
        if [ "${CHECK_RUST}" = "true" ]; then
          me_u="$(id -u)"; me_n="$(id -un)"
          if [ ! -d "${rustup_home}" ] || [ "$(stat -L -c %u "${rustup_home}")" = "${me_u}" ] \
             || [ -n "$(find -H "${rustup_home}" \( -user "${me_n}" -o -writable \) -print -quit 2>/dev/null)" ]; then
            echo "::error title=public-pool RUSTUP_HOME is not operator-owned read-only::${rustup_home} is missing, owned by ${me_n}, or writable by it somewhere; a routed job could change the toolchain every later job runs. Host prerequisite: operator-owned, read-only RUSTUP_HOME with 1.95.0 (+clippy, rustfmt) preinstalled"
            exit 1
          fi
          command -v rustup >/dev/null || { echo "::error::rustup not on PATH for ${me_n} -- host prerequisite"; exit 1; }
          cargo_bin="$(RUSTUP_HOME="${rustup_home}" rustup which --toolchain 1.95.0 cargo)" \
            || { echo "::error::rustup which --toolchain 1.95.0 cargo failed -- host prerequisite"; exit 1; }
          tc_bin="$(dirname "${cargo_bin}")"
          case "$(readlink -f -- "${tc_bin}")" in
            "$(readlink -f -- "${rustup_home}")"/toolchains/*) ;;
            *) echo "::error::toolchain bin ${tc_bin} is not under ${rustup_home}/toolchains"; exit 1 ;;
          esac
          if [ "$(stat -L -c %u "${tc_bin}")" = "${me_u}" ] || [ -w "${tc_bin}" ]; then
            echo "::error::toolchain bin ${tc_bin} is owned or writable by ${me_n} -- host prerequisite"; exit 1
          fi
          "${tc_bin}/rustc" --version
          comps="$(RUSTUP_HOME="${rustup_home}" rustup component list --toolchain 1.95.0 --installed)" \
            || { echo "::error::rustup component list failed -- host prerequisite"; exit 1; }
          for c in clippy rustfmt; do
            grep -q "^${c}" <<<"${comps}" || { echo "::error::toolchain 1.95.0 lacks ${c} -- host prerequisite"; exit 1; }
          done
          echo "RUSTUP_TOOLCHAIN=1.95.0" >> "${GITHUB_ENV}"
          echo "${tc_bin}" >> "${GITHUB_PATH}"
        fi

        # 3. Persistent per-key target dir outside the cleaned workspace (real home).
        target=""
        if [ -n "${TARGET_KEY}" ]; then
          [[ "${TARGET_KEY}" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad target-key '${TARGET_KEY}'"; exit 1; }
          [[ "${MAX_TARGET_GB}" =~ ^[0-9]+$ ]] || { echo "::error::bad max-target-gb '${MAX_TARGET_GB}'"; exit 1; }
          root="${real_home}/.cache/qontinui-runner-ci/targets"
          mkdir -p "${root}"
          # Prune keys untouched for 3+ days.
          while IFS= read -r -d '' d; do zap "${d}" || true; done \
            < <(find "${root}" -mindepth 1 -maxdepth 1 -type d -mtime +2 -print0 2>/dev/null)
          # Oldest first while over the cap. `set -f` is on, so enumerate with
          # find, never a glob.
          entries=()
          total=0
          while IFS= read -r -d '' rec; do
            path="${rec#* }"
            # du may exit non-zero on a file vanishing under a concurrent build;
            # that must never fail the job.
            gb="$( { du -s --block-size=1G -- "${path}" 2>/dev/null || true; } | awk 'NR==1{print $1+0}')"
            entries+=("${gb:-0} ${path}")
            total=$(( total + ${gb:-0} ))
          done < <(find "${root}" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\0' 2>/dev/null | sort -zn)
          now="$(date +%s)"
          for e in "${entries[@]}"; do
            [ "${total}" -gt "${MAX_TARGET_GB}" ] || break
            gb="${e%% *}"; path="${e#* }"
            # A key prepared within the last 3 h may belong to a job still building
            # (job timeout 150 min); never prune it under that job.
            if [ $(( now - $(stat -c %Y -- "${path}" 2>/dev/null || echo "${now}") )) -lt 10800 ]; then
              continue
            fi
            echo "target cache ${total} GiB > ${MAX_TARGET_GB}; removing ${path}"
            zap "${path}" || break
            total=$(( total - gb ))
          done
          if [ "${total}" -gt "${MAX_TARGET_GB}" ]; then
            echo "::warning::target cache still ${total} GiB > ${MAX_TARGET_GB} (remaining keys are in use)"
          fi
          target="${root}/${TARGET_KEY}"
          mkdir -p "${target}"
          touch "${target}"
        fi

        # 4. Per-job HOME, XDG dirs and CARGO_HOME; RUSTUP_HOME stays the
        #    (read-only, operator-owned) real one so the toolchain is found.
        job_home="${RUNNER_TEMP:?}/home"
        rm -rf -- "${job_home:?}"
        mkdir -p "${job_home}/.config" "${job_home}/.cache" "${job_home}/.local/share" "${job_home}/.local/state" "${job_home}/.cargo"
        {
          [ -z "${target}" ] || echo "CARGO_TARGET_DIR=${target}"
          echo "CARGO_HOME=${job_home}/.cargo"
          echo "RUSTUP_HOME=${rustup_home}"
          echo "XDG_CONFIG_HOME=${job_home}/.config"
          echo "XDG_CACHE_HOME=${job_home}/.cache"
          echo "XDG_DATA_HOME=${job_home}/.local/share"
          echo "XDG_STATE_HOME=${job_home}/.local/state"
          echo "HOME=${job_home}"
        } >> "${GITHUB_ENV}"
        echo "target=${target:-<none>}; HOME=${job_home} (CARGO_HOME + XDG per job); RUSTUP_HOME=${rustup_home}"
