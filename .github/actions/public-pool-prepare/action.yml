# Make a PERSISTENT public-pool host safe for one routed job, before anything
# else in that job runs. Used ONLY on the self-hosted lane (the caller guards it
# with `if: env.SELF_HOSTED_LANE == 'true'`); the hosted lane never runs it.
#
# Plan 2026-10-03-runner-pr-branch-windows-ci-has-no-off-hosted-path (qontinui-
# dev-notes), Phase 1. A hosted runner is a fresh VM per job; a public-pool host
# (`merytshost-public` today, user `runner-public`, no sudo) is not. Three things
# this workflow assumed of a fresh VM are false there, and each is handled here:
#
#   1. SIBLING CHECKOUTS PERSIST. `checkout-sibling` checks each sibling out to
#      `$GITHUB_WORKSPACE/../<name>` and REFUSES a destination that already
#      exists (by design: it is the one contract for sibling checkouts). On a
#      persistent host the previous job's siblings are still there, so this step
#      removes exactly the named sibling directories -- never anything else under
#      the workspace parent -- before the caller's checkout-sibling steps run.
#
#   2. NO SUDO, NO APT. The hosted lane `sudo apt-get install`s the webkit/gtk
#      build deps; `runner-public` cannot, and must not be given sudo. They are a
#      host prerequisite installed once by the operator; this step VERIFIES them
#      (dpkg-query) and fails naming what is missing, rather than letting a
#      cargo build fail an hour later on a missing pkg-config file.
#
#   3. A PERSISTENT TARGET DIR replaces rust-cache. `actions/checkout` cleans the
#      workspace (`git clean -ffdx`), so `./target` would be cold every run. The
#      target dir is pointed OUTSIDE the workspace, at a per-host cache under the
#      runner account's home, and wiped when it grows past `max-target-gb`.
#
#   4. A PER-JOB HOME. More than one runner listener can run as `runner-public`
#      (qontinui-web's does today), so `$HOME` is shared between concurrent jobs.
#      ci.yml's ambient-state poison bracket writes `~/.qontinui`, and tests read
#      `dirs::home_dir()` -- which on Linux is `$HOME`. So the job gets its own
#      `$HOME` under `$RUNNER_TEMP` (discarded with the job), with CARGO_HOME and
#      RUSTUP_HOME pinned to the account's real home FIRST so the toolchain is still
#      found. Linux only: on Windows `dirs::home_dir()` ignores `$HOME`
#      (SHGetKnownFolderPath), so this would void the poison canary there.
#
# Prints /etc/os-release: on the pool, `test (ubuntu-22.04)` runs on the HOST's OS,
# not an ubuntu-22.04 image -- a PR-head green there is a verdict about that host.
# Merge-candidate pushes stay hosted, so the land verdict is unaffected.
#
# NOT a security boundary. Job code runs as `runner-public`; host isolation (an
# ephemeral runner, a runner install the job cannot write, no reach to the host's
# loopback/LAN services) is a host prerequisite, recorded in the plan's Phase 2.
name: public-pool-prepare
description: Prepare a persistent public-pool host for one routed job (self-hosted lane only).
inputs:
  siblings:
    description: Space-separated sibling repo names this job checks out with checkout-sibling.
    required: false
    default: ''
  check-build-deps:
    description: "'true' to verify the Linux webkit/gtk build dependencies are installed."
    required: false
    default: 'false'
  max-target-gb:
    description: Wipe the persistent target dir when it is larger than this many GiB.
    required: false
    default: '200'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SIBLINGS: ${{ inputs.siblings }}
        CHECK_BUILD_DEPS: ${{ inputs.check-build-deps }}
        MAX_TARGET_GB: ${{ inputs.max-target-gb }}
      run: |
        set -euo pipefail
        set -f   # no glob expansion of the sibling list
        echo "public-pool host: $(hostname) user=$(id -un) runner=${RUNNER_NAME:-?}"
        if [ "${RUNNER_OS:-}" != "Linux" ]; then
          echo "::error::public-pool-prepare is Linux-only today (per-job HOME is wrong on Windows)"
          exit 1
        fi
        grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release 2>/dev/null || true

        # 1. Stale sibling checkouts -- exactly the named directories.
        parent="$(cd "${GITHUB_WORKSPACE}/.." && pwd)"
        for name in ${SIBLINGS}; do
          case "${name}" in
            ''|*/*|.|..|*'*'*|*'?'*|*'['*) echo "::error::refusing sibling name '${name}'"; exit 1 ;;
          esac
          if [ "${parent}/${name}" = "${GITHUB_WORKSPACE}" ]; then
            echo "::error::sibling '${name}' is the workspace itself"; exit 1
          fi
          if [ -e "${parent}/${name}" ]; then
            echo "removing stale sibling checkout ${parent}/${name}"
            rm -rf -- "${parent:?}/${name}"
          fi
        done

        # 2. Host build prerequisites (verified, never installed).
        if [ "${CHECK_BUILD_DEPS}" = "true" ]; then
          missing=()
          for pkg in libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev \
                     libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev \
                     libatspi2.0-dev at-spi2-core; do
            if ! dpkg-query -W -f='${Status}' "${pkg}" 2>/dev/null | grep -q "install ok installed"; then
              missing+=("${pkg}")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=public-pool host is missing build deps::${missing[*]} -- install them on the host once (operator, apt); runner-public has no sudo by design"
            exit 1
          fi
          echo "build deps present"
        fi

        # 3. Persistent target dir outside the cleaned workspace (real home).
        real_home="${HOME}"
        target="${real_home}/.cache/qontinui-runner-ci/target"
        mkdir -p "${target}"
        size_gb="$(du -s --block-size=1G "${target}" 2>/dev/null | awk 'NR==1{print $1}')"
        size_gb="${size_gb:-0}"
        case "${size_gb}" in *[!0-9]*|'') size_gb=0 ;; esac
        if [ "${size_gb}" -gt "${MAX_TARGET_GB}" ]; then
          echo "persistent target ${target} is ${size_gb} GiB > ${MAX_TARGET_GB}; wiping"
          rm -rf -- "${target:?}"
          mkdir -p "${target}"
        fi

        # 4. Per-job HOME, toolchain homes pinned to the real one first.
        job_home="${RUNNER_TEMP:?}/home"
        rm -rf -- "${job_home:?}"
        mkdir -p "${job_home}"
        {
          echo "CARGO_TARGET_DIR=${target}"
          echo "CARGO_HOME=${CARGO_HOME:-${real_home}/.cargo}"
          echo "RUSTUP_HOME=${RUSTUP_HOME:-${real_home}/.rustup}"
          echo "HOME=${job_home}"
        } >> "${GITHUB_ENV}"
        echo "CARGO_TARGET_DIR=${target} (${size_gb} GiB); HOME=${job_home}; CARGO_HOME/RUSTUP_HOME pinned under ${real_home}"
