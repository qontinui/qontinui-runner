name: Resolve sibling qontinui-schemas ref
description: >-
  Resolve which qontinui-schemas branch this build should compile against:
  a branch of the same name if one exists there, otherwise the default branch.

# Why this exists (the deadlock it breaks):
#
# src-tauri/Cargo.toml has a path dep on ../../qontinui-schemas/rust, so runner
# CI compiles against whatever schemas ref it clones. A BREAKING types change
# therefore deadlocks the two repos against each other:
#
#   - the schemas PR reds on `consumer-compile` (runner main does not build
#     against the new type), and
#   - the runner PR reds on `test` (schemas main still has the OLD type).
#
# Neither can land first. qontinui-schemas already solves its half in
# .github/workflows/runner-consumer-check.yml, which resolves a qontinui-runner
# branch of the SAME NAME and compiles against it. Runner had no counterpart —
# every clone site was an unconditional `git clone` of the default branch — so
# the escape hatch only worked in one direction and depended on an undocumented
# naming convention. This action is the mirror image: name both branches
# identically (schemas feat/x + runner feat/x) and the coordinated pair goes
# green together, after which coord's downstream-of ordering lands the catch-up.
#
# This is the same resolution schema-pg-sql-fresh.yml and atlas-exclude-fresh.yml
# already do for the qontinui-web sibling ("Resolve qontinui-web ref") — that
# pattern simply was never applied to qontinui-schemas, which is the sibling
# that actually gates compilation. As noted there, a pure YAML expression can't
# express it: `${{ github.head_ref || 'main' }}` never reaches the fallback,
# because head_ref is always non-empty on a PR whether or not the branch exists
# on the other repo. Existence has to be probed with `git ls-remote`.
#
# Deliberately `github.head_ref` ONLY — no `|| github.ref_name` fallback, so
# this resolves the sibling branch on `pull_request` events and nothing else.
# That matches the schemas-side mirror (runner-consumer-check.yml) exactly, and
# it is NOT an oversight: coord's merge scheduler pushes the SAME
# `refs/heads/merge-candidate/<proposal_id>` into every repo of a multi-repo
# proposal (merge_scheduler.rs `push_merge_candidates`), so on a candidate push
# `ref_name` WOULD match a real schemas branch. That would be actively harmful
# twice over — the ref is force-pushed and deleted as the proposal resolves, so
# the clone can race `ls-remote` and hard-fail a required check; and the build
# would go green against a candidate tree that may never land. Candidate pushes
# must resolve to the default branch, which head_ref-only gives us for free.
#
# Requires actions/checkout to have run first. In jobs that check the runner out
# under `path:`, reference this action through that path
# (`./qontinui-runner/.github/actions/resolve-schemas-ref`).

outputs:
  ref:
    description: Branch of qontinui-schemas to clone.
    value: ${{ steps.resolve.outputs.ref }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      # Passed via env rather than interpolated into the script body. A refname
      # may legally contain `" $ ` ( ) ; & |`, so `${{ }}` splicing into shell
      # is a real injection sink on a fork PR — not a theoretical one. The
      # pre-existing "Resolve qontinui-web ref" steps in this repo splice; this
      # is the pattern to copy instead.
      env:
        BRANCH: ${{ github.head_ref }}
      run: |
        set -euo pipefail
        REF="main"
        if [ -n "${BRANCH:-}" ]; then
          # Distinguish "branch absent" (rc 2) from "probe failed" (rc 128).
          # Treating them alike would silently clone main on a network blip and
          # surface the result as a TYPE error in a downstream job — an
          # infra flake wearing a semantic red's clothes. An unanswered probe
          # is UNKNOWN, not NO, so it hard-fails here where the cause is legible.
          set +e
          git ls-remote --exit-code --heads \
            https://github.com/qontinui/qontinui-schemas.git \
            "refs/heads/${BRANCH}" >/dev/null
          rc=$?
          set -e
          case "$rc" in
            0) REF="${BRANCH}"
               echo "Using qontinui-schemas ref: ${REF} (matches this PR's branch)" ;;
            2) echo "Using qontinui-schemas ref: main (branch '${BRANCH}' absent on qontinui-schemas)" ;;
            *) echo "::error::git ls-remote on qontinui-schemas failed (rc=${rc}); refusing to guess a ref"
               exit 1 ;;
          esac
        else
          echo "Using qontinui-schemas ref: main (no head_ref — not a pull_request event)"
        fi
        echo "ref=${REF}" >> "$GITHUB_OUTPUT"
