name: Prepare a self-hosted Windows CI host
description: >-
  The Windows twin of the `test` job's two self-hosted Linux steps, for every job
  that can land on the self-hosted Windows pool `[self-hosted, Windows, X64,
  qontinui-runner-ci-windows, ram-40g]` (first host: a Windows Server 2025 VM on
  nawa, runners nawa-winvm-*; qontinui-claude-config scripts/winvm/). Run it right
  after actions/checkout, gated `runner.environment == 'self-hosted' && runner.os ==
  'Windows'`. It (1) removes what the previous job on this registration left behind:
  PowerShell profiles, sibling checkouts, a qontinui-runner / WebView2 process,
  (2) fails NAMING THE RUNNER when the host is not provisioned for this pool, so a
  host fault is the host's red and not the PR's, (3) exports a memory-derived
  CARGO_BUILD_JOBS and the hosted leg's RUST_TEST_THREADS, and (4) points ./target
  at a persistent per-registration cargo target through a directory junction.

  The pool assumes ONE dedicated, non-admin account per registration (the host
  provisioning creates `ci-win-<n>`); step 2 refuses an account whose profile holds a
  real `~/.qontinui`, so it is never run against a person's or a live runner's profile.

inputs:
  require-webview2:
    description: >-
      "true" fails the job when the WebView2 runtime is absent. The `test` job's
      contract smoke renders through it (`uiBridgeIpcObserved:true`).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Prepare the self-hosted Windows host
      # -NoProfile: this step deletes the account's PowerShell profiles before any
      # later pwsh/powershell step can load one, so it must not load one itself.
      shell: pwsh -NoProfile -NonInteractive -Command ". '{0}'"
      env:
        REQUIRE_WEBVIEW2: ${{ inputs.require-webview2 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $me = [Security.Principal.WindowsIdentity]::GetCurrent().Name
        if (-not $env:RUNNER_NAME) { "::error title=self-hosted host not provisioned::RUNNER_NAME is empty"; exit 1 }

        # 1. What an earlier job on this registration left behind.
        #    a. PowerShell profiles: a pwsh / Windows PowerShell step loads the
        #       account's profile, and the account persists between jobs, so a
        #       profile one job wrote would run inside every later job.
        $docs = [Environment]::GetFolderPath('MyDocuments')
        foreach ($dir in 'PowerShell', 'WindowsPowerShell') {
          Get-ChildItem -LiteralPath (Join-Path $docs $dir) -Filter '*profile*.ps1' -File -ErrorAction SilentlyContinue |
            ForEach-Object { Remove-Item -LiteralPath $_.FullName -Force; "removed a persisted PowerShell profile: $($_.FullName)" }
        }
        #    b. Sibling checkouts live at $GITHUB_WORKSPACE/.. (checkout-sibling
        #       writes them there and refuses an existing tree).
        $parent = Split-Path -Parent $env:GITHUB_WORKSPACE
        foreach ($name in 'qontinui-schemas', 'qontinui-web', 'ui-bridge') {
          $p = Join-Path $parent $name
          if (Test-Path -LiteralPath $p) {
            Remove-Item -LiteralPath $p -Recurse -Force
            "removed the previous job's $p"
          }
        }
        #    c. A runner exe started from this workspace, or a WebView2 host serving
        #       one, still alive under this account would hold
        #       target/debug/qontinui-runner.exe open and fail this job's link.
        #       Only processes of THIS account whose image lives under the
        #       workspace, and WebView2 hosts whose command line names that exe.
        $ws = [IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
        $ours = @(Get-CimInstance Win32_Process -Filter "Name='qontinui-runner.exe' OR Name='msedgewebview2.exe'" -ErrorAction SilentlyContinue |
          Where-Object {
            $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwner -ErrorAction SilentlyContinue
            ($o -and "$($o.Domain)\$($o.User)" -eq $me) -and (
              ($_.Name -eq 'qontinui-runner.exe' -and $_.ExecutablePath -and $_.ExecutablePath.StartsWith($ws, [StringComparison]::OrdinalIgnoreCase)) -or
              ($_.Name -eq 'msedgewebview2.exe' -and $_.CommandLine -match 'qontinui-runner\.exe'))
          })
        foreach ($p in $ours) {
          "::warning title=leftover process::stopping $($p.Name) pid $($p.ProcessId) left under $me by an earlier job"
          Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
        }
        if ($ours.Count) { Wait-Process -Id $ours.ProcessId -Timeout 30 -ErrorAction SilentlyContinue }

        # 2. Host preflight. git and bash (Git for Windows) are the host's; the
        #    MSVC toolchain and WebView2 cannot be installed by a non-admin job;
        #    QONTINUI_CI_MEMORY_BUDGET_GIB is the host's declaration of this
        #    registration's share of its RAM (Windows has no cgroup to read).
        $missing = @()
        foreach ($tool in 'git', 'bash') {
          if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { $missing += $tool }
        }
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vc = if (Test-Path -LiteralPath $vswhere) {
          & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        }
        if (-not $vc) { $missing += 'MSVC x64 build tools (VC.Tools.x86.x64)' }
        if ($env:REQUIRE_WEBVIEW2 -eq 'true') {
          $wv = (Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          if (-not $wv -or $wv -eq '0.0.0.0') { $missing += 'WebView2 runtime' }
        }
        if ($env:QONTINUI_CI_MEMORY_BUDGET_GIB -notmatch '^[1-9][0-9]*$') { $missing += 'QONTINUI_CI_MEMORY_BUDGET_GIB (the registration''s RAM share, in its .env)' }
        $q = Join-Path $env:USERPROFILE '.qontinui'
        $profiles = Join-Path $q 'profiles.json'
        if ((Test-Path -LiteralPath $q) -and (-not (Test-Path -LiteralPath $profiles) -or -not (Select-String -LiteralPath $profiles -SimpleMatch 'poison.invalid' -Quiet))) {
          $missing += "a dedicated CI account ($q holds a real profile, which Poison/Unpoison would overwrite and delete)"
        }
        if ($missing.Count) {
          "::error title=self-hosted host not provisioned::runner '$env:RUNNER_NAME' lacks: $($missing -join '; '). The HOST is at fault, not this change: provision it (qontinui-claude-config scripts/winvm/). A re-run goes to the hosted floor; RUNNER_CI_WINDOWS_LANE=hosted keeps new runs off the pool."
          exit 1
        }

        # 3. Compile caps: the registration's budget / 5 GiB per job, the Linux
        #    pool's measured divisor, clamped to [1, nproc] and never above the
        #    machine's RAM; 1 at or below 8 GiB. RUST_TEST_THREADS and
        #    VITEST_MAX_WORKERS are 4, the hosted leg's own (nproc of its 4-core
        #    VM): a suite's concurrency regime does not change with the machine it
        #    lands on. Measured 2026-11-03 on the nawa VM (32 vCPU) with vitest's
        #    default worker count: rank.registry.test.ts's beforeAll timed out at
        #    10 s (import 402 s summed across workers) while a sibling
        #    registration compiled on the same VM; it never does on hosted.
        $budgetKb = [math]::Min([int64]$env:QONTINUI_CI_MEMORY_BUDGET_GIB * 1048576, [int64](Get-CimInstance Win32_OperatingSystem).TotalVisibleMemorySize)
        $cpus = [Environment]::ProcessorCount
        $jobs = [int][math]::Floor($budgetKb / 5242880)
        if ($budgetKb -le 8388608) { $jobs = 1 }
        $jobs = [math]::Max(1, [math]::Min($jobs, $cpus))
        "CARGO_BUILD_JOBS=$jobs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "RUST_TEST_THREADS=4" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "VITEST_MAX_WORKERS=4" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "memory budget $([math]::Round($budgetKb / 1048576)) GiB, nproc $cpus -> CARGO_BUILD_JOBS=$jobs RUST_TEST_THREADS=4 VITEST_MAX_WORKERS=4"

        # 4. A warm, persistent target, ONE per registration (two jobs never share
        #    a cargo build lock): <root>\<RUNNER_NAME>, the root from the host's
        #    QONTINUI_CI_CARGO_TARGET_ROOT or else under this registration's _work.
        #    actions/checkout's `git clean -ffdx` removes the junction, never the
        #    tree behind it (measured on Git for Windows 2.56); CARGO_TARGET_DIR
        #    stays unset so in-tree paths (the contract smoke's
        #    target/debug/qontinui-runner.exe) keep working, as on the Linux pool.
        #    Under 60 GiB free on its drive the tree starts cold -- and only a tree
        #    carrying this action's marker is ever deleted.
        $root = $env:QONTINUI_CI_CARGO_TARGET_ROOT
        if (-not $root) { $root = Join-Path (Split-Path -Parent $env:RUNNER_WORKSPACE) '_qontinui-cargo-target' }
        $target = Join-Path $root $env:RUNNER_NAME
        $marker = Join-Path $target '.qontinui-ci-target'
        New-Item -ItemType Directory -Force -Path $target | Out-Null
        if (-not (Test-Path -LiteralPath $marker)) {
          if (@(Get-ChildItem -LiteralPath $target -Force).Count) {
            "::error title=self-hosted host not provisioned::$target is not empty and carries no $([IO.Path]::GetFileName($marker)): refusing to adopt a directory this action did not create"
            exit 1
          }
          Set-Content -LiteralPath $marker -Value $env:RUNNER_NAME
        }
        $free = ([IO.DriveInfo]::new([IO.Path]::GetPathRoot((Resolve-Path -LiteralPath $target).Path))).AvailableFreeSpace
        if ($free -lt 60GB) {
          "::notice title=persistent target reset::$([math]::Round($free / 1GB)) GiB free on the drive of $target`: starting cold"
          Get-ChildItem -LiteralPath $target -Force | Where-Object { $_.Name -ne '.qontinui-ci-target' } | Remove-Item -Recurse -Force
        }
        $link = Join-Path $env:GITHUB_WORKSPACE 'target'
        $existing = Get-Item -LiteralPath $link -Force -ErrorAction SilentlyContinue
        if ($existing) {
          if ($existing.LinkType) { $existing.Delete() } else { Remove-Item -LiteralPath $link -Recurse -Force }
        }
        New-Item -ItemType Junction -Path $link -Target $target | Out-Null
        Push-Location $env:GITHUB_WORKSPACE
        try {
          $exclude = git rev-parse --git-path info/exclude
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $exclude) | Out-Null
          if (-not ((Get-Content -LiteralPath $exclude -ErrorAction SilentlyContinue) -contains '/target')) {
            Add-Content -LiteralPath $exclude -Value '/target'
          }
        } finally { Pop-Location }
        "target -> $target (junction)"
