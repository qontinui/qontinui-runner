name: Prepare a self-hosted Windows CI host
description: >-
  The Windows twin of the `test` job's two self-hosted Linux steps, for every job
  that can land on the self-hosted Windows pool `[self-hosted, Windows, X64,
  qontinui-runner-ci-windows, ram-40g]` (first host: a Windows Server 2025 VM on nawa,
  runners nawa-winvm-*; qontinui-claude-config scripts/winvm/). Run it right after
  actions/checkout, gated `runner.environment == 'self-hosted' && runner.os ==
  'Windows'`. It (1) removes the previous job's sibling checkouts and any
  qontinui-runner / WebView2 process the previous job left running under this
  runner's account, (2) fails NAMING THE RUNNER when the host lacks a tool, so a
  missing tool is the host's red and not the PR's, (3) exports a memory-derived
  CARGO_BUILD_JOBS and the hosted leg's RUST_TEST_THREADS, and (4) points ./target
  at a persistent per-registration cargo target through a directory junction.

inputs:
  require-webview2:
    description: >-
      "true" fails the job when the WebView2 runtime is absent. The `test` job's
      contract smoke renders through it (`uiBridgeIpcObserved:true`).
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Prepare the self-hosted Windows host
      shell: pwsh
      env:
        REQUIRE_WEBVIEW2: ${{ inputs.require-webview2 }}
      run: |
        $ErrorActionPreference = 'Stop'
        $me = [Security.Principal.WindowsIdentity]::GetCurrent().Name

        # 1. What the previous job on this registration left behind. Sibling
        #    checkouts live at $GITHUB_WORKSPACE/.. (checkout-sibling writes them
        #    there and refuses an existing tree). A runner exe or a re-parented
        #    WebView2 host still running under this account would hold
        #    target/debug/qontinui-runner.exe open and fail this job's link.
        $parent = Split-Path -Parent $env:GITHUB_WORKSPACE
        foreach ($name in 'qontinui-schemas', 'qontinui-web', 'ui-bridge') {
          $p = Join-Path $parent $name
          if (Test-Path -LiteralPath $p) {
            Remove-Item -LiteralPath $p -Recurse -Force
            "removed the previous job's $p"
          }
        }
        $left = @(Get-CimInstance Win32_Process -Filter "Name='qontinui-runner.exe' OR Name='msedgewebview2.exe'" |
          Where-Object { $o = Invoke-CimMethod -InputObject $_ -MethodName GetOwner; "$($o.Domain)\$($o.User)" -eq $me })
        foreach ($p in $left) {
          "::warning title=leftover process::stopping $($p.Name) pid $($p.ProcessId) left under $me by an earlier job"
          Stop-Process -Id $p.ProcessId -Force -ErrorAction SilentlyContinue
        }

        # 2. Host preflight. rustup must pre-exist: dtolnay/rust-toolchain installs
        #    it only off Windows. Node comes from actions/setup-node, not the host.
        $missing = @()
        foreach ($tool in 'git', 'bash', 'rustup', 'pwsh') {
          if (-not (Get-Command $tool -ErrorAction SilentlyContinue)) { $missing += $tool }
        }
        $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
        $vc = if (Test-Path -LiteralPath $vswhere) {
          & $vswhere -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
        }
        if (-not $vc) { $missing += 'MSVC x64 build tools (VC.Tools.x86.x64)' }
        if ($env:REQUIRE_WEBVIEW2 -eq 'true') {
          $wv = (Get-ItemProperty -LiteralPath 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}' -ErrorAction SilentlyContinue).pv
          if (-not $wv -or $wv -eq '0.0.0.0') { $missing += 'WebView2 runtime' }
        }
        if ($missing.Count) {
          "::error title=self-hosted host not provisioned::runner '$env:RUNNER_NAME' lacks: $($missing -join ', '). The HOST is at fault, not this change: provision it (qontinui-claude-config scripts/winvm/). A re-run goes to the hosted floor; RUNNER_CI_WINDOWS_LANE=hosted keeps new runs off the pool."
          exit 1
        }

        # 3. Compile caps. Windows has no cgroup, so the budget is the machine's
        #    physical RAM, narrowed by QONTINUI_CI_MEMORY_BUDGET_GIB when the host
        #    sets one in the runner's .env (a VM serving several registrations
        #    gives each its share). / 5 GiB per job, the Linux pool's measured
        #    divisor, clamped to [1, nproc]; 1 at or below 8 GiB. RUST_TEST_THREADS
        #    is 4, the hosted leg's own (nproc of its 4-core VM): the suite's
        #    concurrency regime does not change with the machine it lands on.
        $budgetKb = [int64](Get-CimInstance Win32_OperatingSystem).TotalVisibleMemorySize
        if ($env:QONTINUI_CI_MEMORY_BUDGET_GIB -match '^[0-9]+$') {
          $share = [int64]$env:QONTINUI_CI_MEMORY_BUDGET_GIB * 1048576
          if ($share -gt 0 -and $share -lt $budgetKb) { $budgetKb = $share }
        }
        $cpus = [Environment]::ProcessorCount
        $jobs = [int][math]::Floor($budgetKb / 5242880)
        if ($budgetKb -le 8388608) { $jobs = 1 }
        $jobs = [math]::Max(1, [math]::Min($jobs, $cpus))
        "CARGO_BUILD_JOBS=$jobs" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "RUST_TEST_THREADS=4" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "memory budget $([math]::Round($budgetKb / 1048576)) GiB, nproc $cpus -> CARGO_BUILD_JOBS=$jobs RUST_TEST_THREADS=4"

        # 4. A warm, persistent target, ONE per registration (two jobs never share
        #    a cargo build lock). actions/checkout's `git clean -ffdx` removes the
        #    junction, never the tree behind it; CARGO_TARGET_DIR stays unset so
        #    in-tree paths (the contract smoke's target/debug/qontinui-runner.exe)
        #    keep working, exactly as the Linux pool's symlink does. The host names
        #    the location in QONTINUI_CI_CARGO_TARGET; otherwise it lives under
        #    this registration's _work. Under 60 GiB free on its drive: start cold.
        $target = $env:QONTINUI_CI_CARGO_TARGET
        if (-not $target) { $target = Join-Path (Split-Path -Parent $env:RUNNER_WORKSPACE) '_qontinui-cargo-target' }
        New-Item -ItemType Directory -Force -Path $target | Out-Null
        $free = ([IO.DriveInfo]::new([IO.Path]::GetPathRoot((Resolve-Path -LiteralPath $target).Path))).AvailableFreeSpace
        if ($free -lt 60GB) {
          "::notice title=persistent target reset::$([math]::Round($free / 1GB)) GiB free on $target's drive: starting cold"
          Remove-Item -LiteralPath $target -Recurse -Force
          New-Item -ItemType Directory -Force -Path $target | Out-Null
        }
        $link = Join-Path $env:GITHUB_WORKSPACE 'target'
        $existing = Get-Item -LiteralPath $link -Force -ErrorAction SilentlyContinue
        if ($existing) {
          if ($existing.LinkType) { $existing.Delete() } else { Remove-Item -LiteralPath $link -Recurse -Force }
        }
        New-Item -ItemType Junction -Path $link -Target $target | Out-Null
        Push-Location $env:GITHUB_WORKSPACE
        try {
          $exclude = git rev-parse --git-path info/exclude
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $exclude) | Out-Null
          if (-not ((Get-Content -LiteralPath $exclude -ErrorAction SilentlyContinue) -contains '/target')) {
            Add-Content -LiteralPath $exclude -Value '/target'
          }
        } finally { Pop-Location }
        "target -> $target (junction)"
