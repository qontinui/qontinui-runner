# Which sibling COMMIT this repo's CI compiles and asserts against.
#
# Format: one entry per line, `<owner>/<repo>` <whitespace> `<40-hex-sha>`.
# Blank lines and `#` comments are ignored.
#
# TWO things parse this file, and they must agree FIELD-FOR-FIELD:
#   - `.github/actions/checkout-sibling` READS it (`apply_pin`) — the consumer
#     that decides which commit CI compiles and asserts against.
#   - `.github/workflows/sibling-pin-bump.yml` reads AND WRITES it — the daily
#     bump, plus a validate-only arm on any PR that edits this file.
# A format change that teaches one and not the other breaks CI for everyone, so
# change both in the same PR.
#
# ---------------------------------------------------------------------------
# WHY THIS FILE EXISTS
# ---------------------------------------------------------------------------
#
# Sibling repos are NOT npm deps and NOT vendored, so no lockfile can pin them.
# CI used to materialise them with `git clone --depth 1 https://…/<repo>.git`,
# i.e. the producer's default-branch tip AT RUN TIME. That makes every peer
# repo's merge button a write to this repo's `main`:
#
#   2026-08-20 01:57Z  ui-bridge lands 912a3e301, adding
#                      POST /ui-bridge/control/page/send-keys to UI_BRIDGE_ROUTES.
#                      ui-bridge CI GREEN.
#   2026-08-20 02:53Z  qontinui-runner main CI clones ui-bridge floating, and
#                      `sdk_manifest_routes_are_exposed_by_runner` fails.
#                      1 test of 6960, on BOTH ubuntu and windows, attempt=1.
#   2026-08-20 03:42Z  main RED. No runner commit was involved at any point —
#                      the two commits in the window touch profiles.rs /
#                      agent_runtime.rs / ci_node/subscription.rs and nothing
#                      else. main was green, untouched, and went red anyway.
#   → 07:00Z+          coord holds the whole merge train on `main-red` for 5h+.
#                      #1067, #1072 and others sit `queued` with no
#                      candidate_ref. Recovery needed a hand-diagnosed fix PR
#                      (#1078) labelled `coord:red-main-fix`, because `main-red`
#                      also blocks the PR that would un-red main.
#
# The drift test is NOT the defect and is deliberately left alone — it caught a
# real SDK↔runner divergence within an hour, which is exactly its job. The
# defect is WHEN the signal arrives: unbounded, on someone else's schedule,
# straight onto `main`. Pinning relocates that same signal from `main` (where it
# blocks the repo) to a bump PR (where it blocks one PR). Expect no fewer drift
# findings — only better-timed ones.
#
# ---------------------------------------------------------------------------
# HOW A PIN IS OVERRIDDEN — the cross-repo escape hatch
# ---------------------------------------------------------------------------
#
# A pin that could never advance would make coordinated breaking changes
# unlandable, which historically gets "solved" by deleting the gate. So the pin
# is the LOWEST-priority answer, not the only one. `checkout-sibling` resolves
# in this order:
#
#   1. the DECLARED adaptation PR's head SHA — a coord dep-edge label on this
#      PR (`coord:downstream-of=<repo>#N` / `coord:upstream-of=<repo>#N`) or on
#      the sibling's open PR pointing back here. This BEATS the pin, so a
#      declared cross-repo pair still compiles against its partner's tree and
#      lands normally. Use the `coord-pr-label` skill to apply the label.
#   2. this file's recorded SHA.
#   3. the sibling's default branch — ONLY for a repo absent from this file.
#
# qontinui-schemas is deliberately ABSENT below. It resolves by rule 3 exactly
# as it did before this file existed, so its long-standing consumer-compile /
# mirror-gate contract (plan 2026-08-05-runner-schemas-ref-declared-adaptation)
# is untouched. Adding it here is a design decision about that gate, not a
# lint fix.
#
# ---------------------------------------------------------------------------
# HOW THIS FILE STAYS CURRENT  (a stale pin is a real cost, not a free win)
# ---------------------------------------------------------------------------
#
# A pin nobody updates silently freezes the contract and the drift test stops
# meaning anything — trading a loud failure for a quiet one. So the bump is
# AUTOMATED rather than remembered:
#
#   .github/workflows/sibling-pin-bump.yml
#
# runs daily (and on `workflow_dispatch`), resolves every repo listed below to
# its sibling's current default-branch head, and — when any is behind — opens or
# updates ONE draft PR on `chore/sibling-pin-bump` carrying the new SHAs.
#
# That PR runs the drift test BEFORE landing, which is the entire point:
# divergence surfaces on a branch that blocks one PR instead of on `main`, where
# it blocks the repo. **If the bump PR reds, that is the mechanism working** —
# the fix (wire the new SDK route) belongs in that same PR, landing the bump and
# the adaptation together.
#
# Adding a repo here is enough; the bump job reads this file rather than a list
# of its own. The same workflow also VALIDATES this file on any pull request
# that edits it — parse shape, duplicate entries, and whether each recorded SHA
# is still a real commit in the sibling.
#
# To bump by hand anyway (the workflow is the primary path, not the only one):
#
#   gh api repos/qontinui/ui-bridge/commits/main --jq .sha
#
# then edit the line below and open an ordinary PR.
#
# ---------------------------------------------------------------------------

# Read by `sdk_manifest_routes_are_exposed_by_runner`
# (src-tauri/src/mcp/ui_bridge/mod.rs), which parses UI_BRIDGE_ROUTES out of
# packages/ui-bridge/src/server/types.ts, and by the windows `test` job's
# `SDK↔runner contract smoke` step (scripts/contract-smoke.ps1). Without the
# checkout the Rust test hits its "file unreadable, skip" branch and silently
# passes, so this pin must stay present as well as current.
#
# First pinned 2026-08-26 (#1158) to the commit the last green `main` run was
# already building against, so the pin changed WHO could move this repo's
# contract without changing CI's verdict that day. The SHA below is maintained
# by the bump workflow; `git log -p -- .github/sibling-pins.conf` is the record
# of when it moved and why, so no date is restated here to go stale.
qontinui/ui-bridge      0aedd171fc4ef777ab4da6c08b75fb806b0bd414

