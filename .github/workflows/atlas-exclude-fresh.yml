name: atlas/exclude.txt freshness

# Guards the Atlas pilot's exclude-list against silent drift. atlas/exclude.txt
# is the `--exclude` list that scopes Atlas Community to the pilot-owned tables
# only (everything else in the project/coord schemas is alembic/coord-owned).
# It is regenerated by atlas/scripts/regen_exclude.ps1 from the live schema.
# When a qontinui-web alembic migration ADDS a project/coord table and nobody
# re-runs the script, the new table is no longer excluded -> the next
# `atlas schema apply` tries to DROP it (a data-loss-class footgun). This job
# regenerates the list against a fresh `alembic upgrade head` schema and acts on
# drift.
#
# Trigger posture (deliberately NOT a required per-PR check):
#   - schedule (nightly): catches qontinui-web-side drift within <=24h. The
#     staleness source is a *web* migration, not a runner change, so a per-PR
#     REQUIRED check would red every unrelated runner PR the moment web adds a
#     table -- and block the coord merge train. Nightly surfaces it loudly
#     without that entanglement.
#   - workflow_dispatch: on-demand pre-apply check.
#   - pull_request (paths: atlas/**): validates runner-side atlas edits (a
#     schema.hcl pilot-table add that forgot to regen, or a hand-edit to
#     exclude.txt) at PR time. Paths-filtered so it only fires when the PR
#     touches atlas/**, so it can never red an unrelated runner PR.
#
# TWO BEHAVIOURS ON DRIFT, split by trigger:
#   - pull_request (and any dispatch off a non-main ref): FAIL. A PR must never
#     merge a stale exclude list; there is a human in the loop to fix it.
#   - schedule / workflow_dispatch on main: SELF-HEAL. Open (or update) a PR on
#     the long-lived `chore/atlas-exclude-refresh` branch carrying the list this
#     very job regenerated, and exit 0.
#
# Why self-heal rather than just failing: the drift source is a *qontinui-web*
# migration, so there is no runner-side author to notify and nothing to "fix" --
# the remedy is mechanical ("commit the file the job just regenerated"). A
# failing nightly with no owner is a notification into the void, and that is
# exactly what happened: this workflow last passed 2026-07-23 and then failed
# 12 consecutive nights (2026-07-24 .. 2026-08-03) unnoticed, guarding a
# data-loss footgun the whole time. A one-off manual refresh does not fix it
# either -- PR #896 refreshed the list on 2026-07-28 and web had drifted it
# again inside 24h. Only automation keeps pace with a peer repo's migration
# cadence.
#
# Why this cannot flap: regen_exclude.ps1 is a pure function of the pg catalog
# (four `ORDER BY 1` queries, fixed concatenation order, LF serialization -- no
# map iteration, no timestamps). Verified end-to-end: run 30360799778's
# `atlas-exclude-fresh` artifact is byte-identical (sha256 3b0e2ddf...) to what
# was committed as 12aaf101b, and the independent later run 30361411790
# re-regenerated that same schema in a fresh container and went GREEN. Same
# schema in => same bytes out, so a self-heal PR converges instead of
# re-detecting its own output.
#
# One configuration prerequisite for the self-heal half: opening a PR from CI
# needs either "Allow GitHub Actions to create and approve pull requests"
# enabled on the repo (it is currently OFF --
# `can_approve_pull_request_reviews: false`) or a PAT carrying
# `Pull requests: write`. The branch push only needs `Contents: write`, which
# the job's `permissions:` block grants outright, so if PR creation is blocked
# the refreshed exclude.txt still lands on `chore/atlas-exclude-refresh` and the
# step fails with both remediations spelled out.
#
# TWO JOBS, split by what they depend on:
#   - `pilot-consistency`: four files in THIS repo, no DB. Asserts schema.hcl,
#     atlas.hcl, exclude.txt and regen_exclude.ps1 agree about which tables
#     Atlas owns. Its verdict never depends on qontinui-web, so it is the one
#     signal an atlas PR can actually act on.
#   - `verify`: the DB-backed freshness check + self-heal described above. Red
#     whenever web has drifted, by design.
# They are independent (no `needs:`) so a web-drift red on `verify` never hides
# a runner-side ownership mistake, and vice versa.
#
# This workflow is intentionally NOT registered as a required status check, so
# it needs none of the detect/aggregator ghost-check scaffolding that
# schema-pg-sql-fresh.yml carries.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlas/**"
      # This file itself. `pilot-consistency` runs
      # atlas/scripts/tests/test_pr_step_guards.sh, whose subject is the
      # refresh-PR step BELOW -- so without this line a PR that renames the
      # step, re-indents it, adds an unguarded `gh pr` call, adds `|| true`, or
      # restores the reopen path runs NO job from this workflow, and the test
      # that exists to catch exactly that never executes. This file is also
      # absent from ci-integrity.yml's GATING list, so nothing else stops it
      # either. A guard that does not run on its own subject is not a guard.
      - ".github/workflows/atlas-exclude-fresh.yml"

# Least-privilege, stated explicitly rather than inherited.
#
# This workflow resolves the sibling qontinui-schemas ref. On a `pull_request`
# event that resolution reads this PR's labels and the sibling's open PRs via
# the API, so `pull-requests: read` is a real requirement here, not
# boilerplate. (On every other event the resolver short-circuits to the default
# branch and makes no API call at all — but the grant is stated once, at
# workflow level, rather than per-job.)
#
# It USED to work by inheriting the repo-level `default_workflow_permissions`
# (currently "read"), an operator-flippable setting that is INVISIBLE in this
# file. Flipping it to `restricted` would have broken sibling resolution across
# six workflows at once, with nothing in any diff to explain it. State it here.
#
# This block is the workflow DEFAULT only, and is what `pilot-consistency`
# runs on (it only ever checks out and reads files). The `verify` job overrides
# it and widens to exactly the two scopes the self-heal path needs
# (`contents: write` + `pull-requests: write`) and nothing else. A job-level
# block REPLACES this one wholesale rather than merging with it, so on the
# `verify` job it is that block's `pull-requests: write` -- not the `read`
# stated here -- that keeps sibling resolution working. Keep the two in step:
# a future job that reads PRs and states its own `permissions:` must grant
# itself `pull-requests: read`, because inheriting from here is not a thing
# once it states any block at all.
permissions:
  contents: read
  pull-requests: read

jobs:
  # DB-free, seconds-long, and deliberately a SEPARATE job from `verify`.
  #
  # `verify` needs Postgres + qontinui-web's alembic chain, so its verdict is a
  # function of a PEER REPO's migration state: while web has drifted, `verify`
  # is red on every atlas PR and no runner-side change can green it. That is
  # precisely why PR #955 had to avoid touching `atlas/**` at all. A guard that
  # can only speak when an unrelated repo is quiet is not a usable guard for
  # runner-side atlas edits.
  #
  # This job reads four files in this repo and nothing else, so it is green or
  # red purely on the diff in front of it -- the signal an atlas PR actually
  # needs. It catches the failure class `verify` structurally cannot see:
  # schema.hcl and exclude.txt disagreeing about who owns a table (see the
  # script's header for the two live instances that motivated it).
  pilot-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      # pwsh is preinstalled on ubuntu-latest. The script shells back into the
      # same host to read regen_exclude.ps1's exported sets, so nothing here
      # re-parses PowerShell source.
      - name: Check schema.hcl / atlas.hcl / exclude.txt / regen script agree
        shell: bash
        run: pwsh atlas/scripts/check_pilot_consistency.ps1

      # Pins the exit-code contract the `verify` job's self-heal decision is
      # built on (2 = drift, 1 = failure) plus the pilot carve-out, against a
      # stubbed psql. Both are things `verify` cannot test: it only ever
      # exercises whichever single path the live schema happens to produce, and
      # never the DB-failure path at all.
      - name: Test regen_exclude.ps1's exit contract (stubbed psql, no DB)
        shell: bash
        run: pwsh atlas/scripts/tests/test_regen_exit_contract.ps1

      # Same idea one layer up: the `verify` job's SELF-HEAL step -- the one
      # that turns a regenerated exclude.txt into a pull request -- is decided
      # entirely by `gh` exit codes under `set -euo pipefail`, and `verify` can
      # never test it (it only ever walks whichever single path the live schema
      # and the live PAT happen to produce, and its success path went
      # unexercised for the six no-drift nights before it failed nine nights
      # running). This extracts that step's body from this very file and runs it
      # against a stubbed `gh`/`git`: no DB, no network, no PAT.
      - name: Test the refresh-PR step's guards (stubbed gh, no network)
        shell: bash
        run: bash atlas/scripts/tests/test_pr_step_guards.sh

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Two runs on main (the nightly plus a workflow_dispatch, or two dispatches)
    # would otherwise interleave `checkout -B` / `push --force` on the same bot
    # branch and both call `gh pr create` -- leaving the branch tip from the
    # LOSING run and reddening the other on "a pull request already exists".
    # Keyed on github.ref so pull_request runs get their own groups.
    # cancel-in-progress: false so a dispatch never kills a nightly mid-push.
    concurrency:
      group: atlas-exclude-fresh-${{ github.ref }}
      cancel-in-progress: false

    # `contents: write` pushes the refresh branch; `pull-requests: write` lets
    # the self-heal step list/edit/reopen its PR. Job-level permissions are NOT
    # event-conditional, so a same-repo pull_request run also carries this token
    # even though no step on that path writes anything -- the gating is in the
    # step `if:`, not in the token. (Fork PRs are capped read-only by GitHub.)
    # Note `pull-requests: write` does not buy `gh pr create` while the repo has
    # "Allow GitHub Actions to create and approve pull requests" disabled; see
    # the header.
    permissions:
      contents: write
      pull-requests: write

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qontinui_user
          POSTGRES_PASSWORD: qontinui_dev_password
          POSTGRES_DB: qontinui_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U qontinui_user -d qontinui_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      # The self-heal path pushes a branch, so it needs a token that can write.
      # CLORINDE_AUTOCOMMIT_TOKEN is this repo's existing CI auto-commit PAT
      # (see clorinde-bindings-fresh.yml, which uses the same fallback shape);
      # a PAT-authored push/PR also re-triggers downstream workflows, which
      # GITHUB_TOKEN deliberately does not. Narrower than clorinde's version:
      # the PAT is withheld on `pull_request` entirely, so a PR run -- including
      # one from a fork -- never gets a token stronger than GITHUB_TOKEN.
      - name: Checkout qontinui-runner
        uses: actions/checkout@v5
        with:
          path: qontinui-runner
          token: ${{ (github.event_name != 'pull_request' && secrets.CLORINDE_AUTOCOMMIT_TOKEN) || secrets.GITHUB_TOKEN }}

      # Resolve which qontinui-web ref to use: prefer the same branch name as
      # this PR (so coordinated cross-repo changes test together), else main.
      # A pure YAML expression can't do this -- github.head_ref is always
      # non-empty on PRs, so `${{ github.head_ref || 'main' }}` never reaches
      # the fallback. On schedule/dispatch head_ref is empty and ref_name is the
      # default branch, so this resolves to main. (Mirrors
      # schema-pg-sql-fresh.yml:102-120.)
      - name: Resolve qontinui-web ref
        id: resolve_ref
        shell: bash
        # Branch name via env, not `${{ }}` splicing: a refname may contain
        # `" $ ( ) ; & |`, which would be executable shell here. Same reason as
        # .github/actions/checkout-sibling.
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          branch="$BRANCH"
          if [ -n "$branch" ] && git ls-remote --heads https://github.com/qontinui/qontinui-web.git "$branch" | grep -q .; then
            echo "Using qontinui-web ref: $branch (matches this PR's branch)"
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "Using qontinui-web ref: main (branch '$branch' absent on qontinui-web)"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout qontinui-web (sibling)
        uses: actions/checkout@v5
        with:
          repository: qontinui/qontinui-web
          path: qontinui-web
          ref: ${{ steps.resolve_ref.outputs.ref }}

      # qontinui-web/backend/pyproject.toml has path-deps on sibling repos
      # (qontinui-schemas, qontinui). alembic's env.py transitively imports the
      # whole model layer, so a minimal `pip install alembic` is insufficient --
      # the backend import graph must resolve. Mirror schema-pg-sql-fresh.yml:
      # clone the public siblings, install via poetry (skip the private
      # cloud-control repo and the optional ml group -- the model layer doesn't
      # import them).
      # This job checks the runner out under `path: qontinui-runner`, so the
      # siblings live beside it at the workspace ROOT — not at the action's
      # default `$GITHUB_WORKSPACE/../<name>`. Hence the explicit `path:`.
      - name: Check out sibling qontinui-schemas
        uses: ./qontinui-runner/.github/actions/checkout-sibling
        with:
          path: ${{ github.workspace }}/qontinui-schemas

      - name: Checkout sibling repo (qontinui)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 https://github.com/qontinui/qontinui.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install backend dependencies (poetry, default groups only)
        working-directory: qontinui-web/backend
        run: poetry install --no-interaction --no-root

      - name: Apply alembic chain
        working-directory: qontinui-web/backend
        env:
          DATABASE_URL: postgresql://qontinui_user:qontinui_dev_password@localhost:5433/qontinui_db
        run: poetry run alembic upgrade head

      # Bounded against a job-time apt hang — see the rationale on the
      # `Install dependencies (Ubuntu)` step in .github/workflows/ci.yml.
      # Sizing: 19 successful runs, p50 6s, p90 9s, max 10s — but NONE of them
      # falls inside the 2026-08-18..08-20 mirror event (this workflow is
      # path-gated and barely ran), so that 10s max characterises the DOWNLOAD
      # and says nothing about the tail.
      #
      # 10 min, not the 5 a 10-second sample would suggest, because the step
      # runs `apt-get update` first and the index refresh is
      # package-list-independent: qontinui-web's run 32294962345 spent ~32 min
      # in `apt-get update` alone, having downloaded no packages at all. A
      # 5-minute bound would fail that phase while ci.yml's 10-minute bound
      # survives it (its worst surviving 08-19 sample was 564s) — i.e. the two
      # bounds would disagree about an identical `apt-get update`. Aligned at 10.
      - name: Install Postgres client (native psql for the regen script)
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      # -Container "" selects the script's native-psql path (no docker exec);
      # -Check regenerates against the fresh schema and diffs vs the committed
      # atlas/exclude.txt, exiting 2 on drift, 1 on failure, 0 when fresh.
      # -Out writes the freshly-regen'd
      # list once (for the on-drift artifact upload) so we never regen twice.
      # pwsh is preinstalled on ubuntu-latest. The password is passed as
      # -PgPassword (the script re-exports it to PGPASSWORD itself), so no
      # step-level env is needed.
      #
      # NOTE on the baseline: -Check compares the committed exclude.txt against
      # a list regenerated from THIS job's `alembic upgrade head` schema. For
      # the comparison to mean "web migrations drifted" (and not "the committed
      # baseline came from a different DB"), the committed exclude.txt must
      # itself have been generated by THIS workflow's schema — i.e. seed/refresh
      # it from the 'atlas-exclude-fresh' artifact this job uploads, not from a
      # local dev PG. After that first CI-sourced commit, drift == real web
      # migration changes.
      - name: Check atlas/exclude.txt is fresh
        id: exclude_check
        working-directory: qontinui-runner
        shell: bash
        env:
          # The one place the trigger split is decided. Scheduled and dispatched
          # runs SELF-HEAL; everything else (pull_request, or a dispatch off a
          # non-main ref, where a branch-built refresh PR would be nonsense)
          # stays a hard check.
          SELF_HEAL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          fresh="$RUNNER_TEMP/exclude.fresh.txt"
          log="$RUNNER_TEMP/exclude.check.log"

          # Publish the trigger split as an OUTPUT, unconditionally and before
          # any exit path, so the self-heal step consumes the same value this
          # step branched on. Re-encoding the predicate in the step `if:` would
          # let the two silently diverge -- and the divergence that matters
          # (SELF_HEAL true, `if:` false) is a GREEN nightly with undelivered
          # drift, i.e. exactly the 12-silent-nights failure being fixed here.
          echo "self_heal=$SELF_HEAL" >> "$GITHUB_OUTPUT"

          # Capture rather than stream: on drift the script prints GitHub
          # `::error::` annotations, and on the self-heal path this job ends
          # GREEN -- letting the annotation through would paint a successful run
          # red in the UI. We re-emit the log below, with or without the
          # annotation prefix, once we know which path we are on.
          set +e
          pwsh atlas/scripts/regen_exclude.ps1 -Check \
            -Out "$fresh" \
            -Container "" -PgHost localhost -PgPort 5433 \
            -PgUser qontinui_user -PgDb qontinui_db \
            -PgPassword qontinui_dev_password > "$log" 2>&1
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            cat "$log"
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # A non-zero exit is NOT proof of drift: the script also throws when
          # the DB is unreachable or when its zero-pattern guard trips, and a
          # broken DB that read as drift would "refresh" exclude.txt from a bad
          # read. The script therefore reserves exit 2 for drift and leaves
          # every failure path on 1 (see its EXIT CODES block) -- so the
          # classification is a number, not a phrase.
          #
          # This used to `grep -q 'is STALE relative to a fresh regen'` on the
          # captured log, because drift and DB failure both exited 1. That
          # coupled a data-loss-adjacent decision to a human-readable sentence
          # in a script humans also run by hand: reword the message and the
          # nightly silently stops self-healing forever. It failed safe, but it
          # was untested and invisible. Keep the contract numeric.
          if [ "$rc" -ne 2 ]; then
            cat "$log"
            echo "::error::regen_exclude.ps1 failed for a reason other than drift (exit $rc). Not self-healing."
            exit "$rc"
          fi

          # Independent of the exit code: drift means the regenerated list is
          # about to become a commit, so it must actually exist and be
          # non-empty before anything downstream trusts it.
          if [ ! -s "$fresh" ]; then
            cat "$log"
            echo "::error::regen_exclude.ps1 reported drift (exit 2) but wrote no regenerated list to '$fresh'. Not self-healing."
            exit 1
          fi

          # SHAPE GUARD -- the difference between "a migration moved a table" and
          # "a whole schema read as empty". regen_exclude.ps1's own guard only
          # rejects a GLOBALLY empty list, and Invoke-PgQuery only throws on a
          # non-zero psql exit: a query that exits 0 with zero rows (schema
          # renamed, not visible, search_path/permissions changed) yields a
          # plausible-looking list, writes -Out, and reports STALE. Without this,
          # self-heal would auto-author a PR that DROPS every coord.* exclusion
          # -- the precise footgun this workflow exists to prevent. `-s` alone is
          # far weaker than the real invariant.
          #
          # wc -l, never `grep -c`: a `grep -c ... || echo 0` style guard reads
          # as passing on an empty file, which is the failure being guarded.
          if ! grep -q '^project\.' "$fresh" || ! grep -q '^coord\.' "$fresh"; then
            cat "$log"
            echo "::error::Regenerated list is missing an ENTIRE schema (no project.* or no coord.* patterns). That is a bad read, not drift. Not self-healing."
            exit 1
          fi
          committed_n=$(wc -l < atlas/exclude.txt)
          fresh_n=$(wc -l < "$fresh")
          if [ "$fresh_n" -lt $(( committed_n * 3 / 4 )) ]; then
            cat "$log"
            echo "::error::Regenerated list shrank $committed_n -> $fresh_n patterns (>25%). Refusing to self-heal a mass removal; regenerate by hand and inspect."
            exit 1
          fi

          echo "drift=true" >> "$GITHUB_OUTPUT"
          # The drift entries (header line dropped -- the PR body supplies its
          # own heading) become the body's diff block, so a reviewer sees which
          # tables moved and why. `//` reuses the range's own regex, so the
          # matched header is the only line excluded.
          sed -n '/^Drift (committed vs fresh):/,${//!p}' "$log" > "$RUNNER_TEMP/exclude.drift.txt"

          if [ "$SELF_HEAL" = "true" ]; then
            sed 's/^::error:://' "$log"
            echo "Drift detected on a scheduled/dispatched main run -- opening or updating the refresh PR instead of failing."
            exit 0
          fi

          cat "$log"
          exit 1

      # Self-heal, schedule/dispatch-on-main only. One long-lived branch,
      # force-rebuilt from main on every run, so N nights of drift converge on
      # ONE pull request rather than N. No drift => this step is skipped
      # entirely, so a clean nightly writes nothing at all.
      - name: Open or update the exclude.txt refresh PR
        if: >-
          steps.exclude_check.outputs.drift == 'true'
          && steps.exclude_check.outputs.self_heal == 'true'
        working-directory: qontinui-runner
        shell: bash
        env:
          # Same PAT as the checkout above, so the push and the PR are authored
          # consistently. The checkout's expression additionally withholds the
          # PAT on pull_request; that clause is unnecessary here because this
          # step is gated to schedule/dispatch on main and never runs on a PR.
          # Whether the PAT was actually available changes what a reviewer must
          # do next, so surface it in the body.
          GH_TOKEN: ${{ secrets.CLORINDE_AUTOCOMMIT_TOKEN || secrets.GITHUB_TOKEN }}
          PAT_AVAILABLE: ${{ secrets.CLORINDE_AUTOCOMMIT_TOKEN != '' }}
          REPO: ${{ github.repository }}
          BRANCH: chore/atlas-exclude-refresh
          TITLE: "chore(atlas): refresh exclude.txt against the current qontinui-web schema"
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Declared, not inherited from the ambient $GITHUB_SERVER_URL, for
          # the same reason REPO/BRANCH/RUN_URL are: under this step's
          # `set -u` an ambient var the harness does not supply is an
          # unbound-variable abort, and the stubbed-gh test can only run what
          # it can supply. atlas/scripts/tests/test_pr_step_guards.sh asserts
          # that every UPPERCASE var this body reads appears in its own env
          # list, so an inherited one fails there rather than at 07:17 UTC.
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail

          # ---------------------------------------------------------------
          # ONE remediation block, shared by every guarded `gh pr *` call in
          # this step, so the call sites cannot drift apart.
          #
          # Under the `set -euo pipefail` above, an UNGUARDED `gh` call kills
          # this step on the spot -- taking the remediation with it. That is not
          # hypothetical: the `gh pr reopen` that used to sit below the push
          # failed on NINE consecutive nightlies (2026-08-15 .. 2026-08-24) with
          # `Resource not accessible by personal access token
          # (reopenPullRequest)`, and the ::error:: block naming the exact fix
          # never printed once. The workflow knew the answer and could not reach
          # the line that says it.
          #
          # NEVER "repair" a failure here with `|| true`. Suppressing it ends the
          # step GREEN with real drift undelivered, which is strictly WORSE than
          # a loud red -- and reintroducing silent success while fixing a
          # silent-failure bug is this fleet's most-repeated regression. This
          # function EXPLAINS the failure; every caller still `exit 1`s.
          # `branch_pushed` only selects which by-hand remediation is accurate.
          branch_pushed=0
          pr_op_failed() {
            local op="$1"
            echo "::error::The pull-request '$op' operation failed on $REPO (head branch '$BRANCH')."
            echo "::error::Usually permissions/config, not schema drift (see gh's error above). Fix EITHER of:"
            echo "::error::  (a) Settings > Actions > General > Workflow permissions: enable 'Allow GitHub Actions to create and approve pull requests'; or"
            echo "::error::  (b) grant the CLORINDE_AUTOCOMMIT_TOKEN PAT 'Pull requests: write' on $REPO."
            if [ "$branch_pushed" = "1" ]; then
              echo "::error::Meanwhile, open the PR by hand from '$BRANCH' -- the fix is already committed there."
            else
              echo "::error::Meanwhile, deliver the drift by hand -- this run's 'atlas-exclude-fresh' artifact carries the regenerated exclude.txt."
            fi
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Resolve the PR BEFORE touching the branch. Once a human marks it
          # ready for review it can be a live merge-train candidate, and moving
          # the branch tip out from under an in-flight proposal is a known wedge
          # class in this fleet. Leave it strictly alone and say so; the nightly
          # after it lands refreshes normally against the new main.
          # NO `|| true` here. An error suppressed into an empty value reads as a
          # confident "there is no PR" and silently skips the ready-guard below,
          # letting a transient gh 403 force-push under a live merge-train
          # candidate -- the exact wedge this guard exists to prevent. `set -e`
          # failing loud is the right posture for a step about to force-push.
          # (`// empty` already covers the genuinely-absent case: jq exits 0 and
          # emits nothing on an empty array.)
          existing_num="$(gh pr list --repo "$REPO" --head "$BRANCH" --base main --state open \
            --json number --jq '.[0].number // empty')"

          if [ -n "$existing_num" ]; then
            # Queried separately rather than parsed out of a "<num> <bool>"
            # string: that parse depends on gh emitting raw scalars, and if it
            # ever quoted them every draft PR would read as ready and this step
            # would become a permanent SILENT no-op -- the failure class this
            # whole change exists to remove.
            if ! existing_draft="$(gh pr view "$existing_num" --repo "$REPO" --json isDraft --jq '.isDraft')"; then
              pr_op_failed "view --json isDraft on #$existing_num"
              exit 1
            fi
            if [ "$existing_draft" != "true" ]; then
              # Ready for review => possibly a live merge-train candidate, so the
              # branch is left strictly alone. But exiting green with real drift
              # undelivered is the same void this change exists to close (and
              # would contradict the create-failure path below), and a PR can sit
              # marked-ready in the train for days. So deliver it as a comment on
              # the PR the human is already watching -- keyed on a hash of the
              # drift block, so a PR that sits there does not collect an
              # identical comment every night.
              echo "::warning::Refresh PR #$existing_num is marked ready for review (possible merge-train candidate)."
              echo "::warning::Not force-pushing '$BRANCH' under it. The next run after it lands will refresh against the new main."
              drift_sha="$(sha256sum "$RUNNER_TEMP/exclude.drift.txt" | cut -c1-16)"
              # Materialize the comments before grepping instead of piping into
              # `grep -q`: grep exits early on a match, which SIGPIPEs gh, and
              # under `pipefail` that turns a successful dedup HIT into a
              # non-zero pipeline -- i.e. the dedup would fail open and comment
              # again every night, the exact spam it exists to prevent.
              if ! gh pr view "$existing_num" --repo "$REPO" --json comments \
                   --jq '.comments[].body' > "$RUNNER_TEMP/pr-comments.txt"; then
                pr_op_failed "view --json comments on #$existing_num"
                exit 1
              fi
              if grep -qF "atlas-drift:$drift_sha" "$RUNNER_TEMP/pr-comments.txt"; then
                echo "Drift unchanged since the last comment on #$existing_num; not commenting again."
              else
                {
                  printf 'Further drift was detected after this PR was marked ready for review, so `%s` was **not** force-pushed — it may be a live merge-train candidate.\n\n' "$BRANCH"
                  printf 'Run: %s\n\n' "$RUN_URL"
                  printf 'Once this PR lands, the next scheduled run refreshes against the new `main`.\n\n```\n'
                  cat "$RUNNER_TEMP/exclude.drift.txt"
                  printf '```\n\n<!-- atlas-drift:%s -->\n' "$drift_sha"
                } > "$RUNNER_TEMP/pr-comment.md"
                if ! gh pr comment "$existing_num" --repo "$REPO" --body-file "$RUNNER_TEMP/pr-comment.md"; then
                  pr_op_failed "comment on #$existing_num"
                  exit 1
                fi
                echo "Commented the new drift on #$existing_num."
              fi
              exit 0
            fi
          fi

          # Rebuild the branch from THIS run's triggering commit every time, so
          # the PR stays a single commit against current main and never
          # accumulates a stale base across nights. Anchored on $GITHUB_SHA
          # rather than bare HEAD: `checkout -B "$BRANCH"` would silently base
          # the branch on whatever HEAD happened to be, which is only main by
          # convention.
          git checkout -B "$BRANCH" "$GITHUB_SHA"
          cp "$RUNNER_TEMP/exclude.fresh.txt" atlas/exclude.txt

          # Explicit path, never `git add -A`: the job checks out sibling repos
          # and installs toolchains, and none of that belongs in the commit.
          git add -- atlas/exclude.txt
          if git diff --cached --quiet; then
            # Contradiction guard. This step only runs when the check step found
            # drift, so main's exclude.txt cannot equal the fresh list: the
            # script normalizes CRLF before comparing, a missing trailing
            # newline shows up as a line-set difference, and a case-only delta
            # still produces a real byte diff after the cp above. Unreachable by
            # construction -- which is exactly why it exits 1 rather than 0.
            # Failing costs nothing in the impossible case, and a ::warning:: on
            # a green nightly would be precisely as invisible as the 12 red
            # nights were. This closes the last silent-green path in the step.
            echo "::error::drift was reported but exclude.txt already matches the fresh list. This should be unreachable -- investigate before trusting the guard."
            exit 1
          fi
          git commit -m "$TITLE"

          # Plain --force is the correct verb here, not a footgun: this branch
          # is bot-owned, single-purpose, and deliberately rebuilt from main
          # each run. --force-with-lease would be theatre -- we never fetched
          # the remote branch, so there is no lease to check.
          git push --force origin "HEAD:refs/heads/$BRANCH"
          # Only selects which by-hand remediation pr_op_failed prints.
          branch_pushed=1

          body="$RUNNER_TEMP/pr-body.md"
          {
            printf 'Automated by the `atlas/exclude.txt freshness` workflow: %s\n\n' "$RUN_URL"
            # Quoted heredocs throughout: the body is full of backticks, which
            # an unquoted heredoc would run as command substitution.
            cat <<'EOF'
          `atlas/exclude.txt` is the `--exclude` list that scopes `atlas schema apply` to the
          Atlas-pilot-owned tables. A `qontinui-web` alembic migration changed the `project` /
          `coord` schemas, so the committed list no longer matches the live schema — and **a
          table missing from this list is a table `atlas schema apply` will try to DROP.**

          The commit on this branch is the list this workflow regenerated against a fresh
          `alembic upgrade head` of `qontinui-web@main`: byte-identical to the
          `atlas-exclude-fresh` artifact on the run linked above.

          ### Drift (committed vs fresh)

          ```
          EOF
            cat "$RUNNER_TEMP/exclude.drift.txt"
            cat <<'EOF'
          ```

          ---

          **Opened as a draft on purpose**, so a PR that may carry no checks cannot sit in a
          merge-train slot. Mark it ready for review once CI is satisfied.
          EOF
            if [ "$PAT_AVAILABLE" = "true" ]; then
              cat <<'EOF'

          This PR was authored with the repo's CI PAT, so normal `pull_request` checks fire on
          it as usual.
          EOF
            else
              cat <<'EOF'

          This PR was authored with `GITHUB_TOKEN`, which by design does **not** fire
          `pull_request` workflows — so it starts with no checks at all. Close and reopen it
          (that fires `reopened`), or push an empty commit, to make CI run.
          EOF
            fi
            cat <<'EOF'

          This branch is force-rebuilt from `main` on every scheduled run, so it stays a
          one-commit diff and later drift updates THIS PR instead of opening another.
          EOF
          } > "$body"

          # THERE IS DELIBERATELY NO REOPEN PATH HERE, and adding one back is a
          # regression. A closed-unmerged head with no OPEN pull request falls
          # straight through to the guarded `gh pr create` below.
          #
          # What used to be here: a `--state closed` lookup plus `gh pr reopen`,
          # written to stop "one PR per night". Both halves were wrong.
          #
          #   1. The selector matched ANY closed-unmerged PR on the head branch,
          #      and the only one that has ever existed is #896 -- authored by a
          #      HUMAN (`jspinak`, `is_bot: false`) and deliberately closed
          #      unmerged on 2026-07-28, ELEVEN DAYS before this code was
          #      written. So every nightly from 2026-08-15 to 2026-08-24 tried to
          #      resurrect a maintainer's closed PR under its old title, carrying
          #      a completely different one-line diff.
          #
          #      Narrowing the selector to bot-authored PRs carrying a body
          #      marker does NOT fix this, so do not "improve" it that way: a BOT
          #      PR that a maintainer deliberately closed is still wrongly
          #      reopened, and a bot PR closed BEFORE such a marker shipped is
          #      skipped -- which sends the run to `gh pr create` and opens a
          #      SECOND PR on the same head. `reopen` fundamentally cannot tell
          #      "closed because superseded" from "closed because rejected";
          #      author and body markers do not carry that distinction.
          #
          #   2. The "one PR per night" it was defending against cannot happen.
          #      One-PR-per-head is enforced by the OPEN-state lookup at the top
          #      of this step: night 1 creates the PR, night 2 finds it open and
          #      takes the `gh pr edit` path below. A genuine one-per-night
          #      stream would require a human to close the PR every single night
          #      -- at which point a loud stream of PRs is the correct signal,
          #      not silent resurrection.
          #
          # Creating a fresh PR is attributable, closable, and carries the
          # current drift in its title and body. The human's close stands.
          # Deleting this also removed the repo's only `gh pr reopen`, so the
          # reopen verb's PAT-permission dependency is gone entirely.

          if [ -n "$existing_num" ]; then
            if ! gh pr edit "$existing_num" --repo "$REPO" --title "$TITLE" --body-file "$body"; then
              pr_op_failed "edit #$existing_num"
              exit 1
            fi
            if ! url="$(gh pr view "$existing_num" --repo "$REPO" --json url --jq .url)"; then
              pr_op_failed "view --json url on #$existing_num"
              exit 1
            fi
            # The URL is announced AFTER the empty-read-back block below, never
            # here: an empty read-back would otherwise print
            # "Updated refresh PR: " as fact and only then be corrected by a
            # warning citing a different, real link.
          else
            # A failure here is almost always CONFIGURATION rather than drift:
            # the repo currently has "Allow GitHub Actions to create and approve
            # pull requests" disabled (`can_approve_pull_request_reviews:
            # false`), and a fine-grained PAT needs `Pull requests: write` on top
            # of `Contents: write`. (Other 422 causes exist -- a >65536-char body,
            # a branch-protection refusal -- so gh's own stderr above is the
            # authority.) Fail the job: the branch was pushed above, so the fix
            # is one click away, but a nightly that found REAL drift and could
            # not deliver it must not end green.
            if ! url="$(gh pr create --repo "$REPO" --base main --head "$BRANCH" --draft --title "$TITLE" --body-file "$body")"; then
              pr_op_failed "create"
              exit 1
            fi
          fi

          # Exit code 0 is not the same as "a pull request exists". A `gh` that
          # succeeds while printing nothing would fall through to the summary
          # block below and write an EMPTY section -- a green step that
          # delivered nothing, which is verbatim the silent-green signature this
          # change exists to remove (and which V6 of the plan names). Checked
          # once here rather than at each site: it is a property of `url`, not
          # of any one call.
          # Exit code 0 is not the same as "a pull request exists". A `gh` that
          # succeeds while printing nothing would otherwise fall through to the
          # summary block below and write an EMPTY section -- a green step that
          # delivered nothing, verbatim the silent-green signature this change
          # exists to remove. The two arms differ, deliberately:
          if [ -z "${url:-}" ]; then
            if [ -n "$existing_num" ]; then
              # EDIT ARM -- do NOT red the night. `gh pr edit` already SUCCEEDED
              # here: the refreshed exclude.txt IS delivered, to a PR a human is
              # already watching. Only the read-back was empty, and the URL is
              # not a guess -- the number came from `gh pr list` and `gh pr edit`
              # accepted it moments ago, so <server>/<repo>/pull/<n> is the
              # canonical link. Failing here would add a FALSE-RED class to the
              # one workflow whose actual disease is unowned reds, which is the
              # same reasoning that makes 'open the PR by hand' wrong advice on
              # this arm. This is NOT silent green: the summary below still
              # carries a real PR URL and the anomaly is stated out loud.
              url="$SERVER_URL/$REPO/pull/$existing_num"
              echo "::warning::Reading back the URL of refresh PR #$existing_num returned nothing, but the edit succeeded."
              echo "::warning::The refreshed exclude.txt IS on that PR. Citing the canonical link: $url"
            else
              # CREATE ARM -- hard failure. Nothing was delivered and there is no
              # PR number to build a link from, so there is nothing to cite and
              # real drift is still undelivered.
              echo "::error::A pull-request operation reported success but returned no URL."
              pr_op_failed "create (URL read-back)"
              exit 1
            fi
          fi

          echo "Refresh PR: $url"

          {
            echo "### atlas/exclude.txt refresh"
            echo ""
            echo "$url"
          } >> "$GITHUB_STEP_SUMMARY"

      # On drift, upload the fresh list -Out already wrote, so a contributor can
      # download + commit without spinning up Postgres + alembic locally
      # (mirrors schema-pg-sql-fresh.yml:214-220). Keyed on the step's `drift`
      # output rather than `failure()`, because the self-heal path now ends the
      # job GREEN while still having produced a fresh list worth keeping.
      # `!cancelled()` is required for this step to run at all after the check
      # step exits 1 on the pull_request path (and is tighter than `always()`,
      # which would also fire on cancellation). `warn` (not `error`) on missing
      # file: a DB-connection failure throws before -Out is written, and we
      # don't want an artifact-missing error to mask the real DB error.
      - name: Upload regenerated exclude.txt (on drift)
        if: ${{ !cancelled() && steps.exclude_check.outputs.drift == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: atlas-exclude-fresh
          path: ${{ runner.temp }}/exclude.fresh.txt
          if-no-files-found: warn
