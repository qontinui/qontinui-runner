name: atlas/exclude.txt freshness

# Guards the Atlas pilot's exclude-list against silent drift. atlas/exclude.txt
# is the 393-pattern `--exclude` list that scopes Atlas Community to the
# pilot-owned tables only (everything else in the project/coord schemas is
# alembic/coord-owned). It is regenerated by atlas/scripts/regen_exclude.ps1
# from the live schema. When a qontinui-web alembic migration ADDS a
# project/coord table and nobody re-runs the script, the new table is no longer
# excluded -> the next `atlas schema apply` tries to DROP it (a data-loss-class
# footgun). This job regenerates the list against a fresh `alembic upgrade head`
# schema and fails on drift.
#
# Trigger posture (deliberately NOT a required per-PR check):
#   - schedule (nightly): catches qontinui-web-side drift within <=24h. The
#     staleness source is a *web* migration, not a runner change, so a per-PR
#     REQUIRED check would red every unrelated runner PR the moment web adds a
#     table -- and block the coord merge train. Nightly surfaces it loudly
#     without that entanglement.
#   - workflow_dispatch: on-demand pre-apply check.
#   - pull_request (paths: atlas/**): validates runner-side atlas edits (a
#     schema.hcl pilot-table add that forgot to regen, or a hand-edit to
#     exclude.txt) at PR time. Paths-filtered so it only fires when the PR
#     touches atlas/**, so it can never red an unrelated runner PR.
#
# This workflow is intentionally NOT registered as a required status check, so
# it needs none of the detect/aggregator ghost-check scaffolding that
# schema-pg-sql-fresh.yml carries -- a single `verify` job suffices.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "atlas/**"

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qontinui_user
          POSTGRES_PASSWORD: qontinui_dev_password
          POSTGRES_DB: qontinui_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U qontinui_user -d qontinui_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout qontinui-runner
        uses: actions/checkout@v5
        with:
          path: qontinui-runner

      # Resolve which qontinui-web ref to use: prefer the same branch name as
      # this PR (so coordinated cross-repo changes test together), else main.
      # A pure YAML expression can't do this -- github.head_ref is always
      # non-empty on PRs, so `${{ github.head_ref || 'main' }}` never reaches
      # the fallback. On schedule/dispatch head_ref is empty and ref_name is the
      # default branch, so this resolves to main. (Mirrors
      # schema-pg-sql-fresh.yml:102-120.)
      - name: Resolve qontinui-web ref
        id: resolve_ref
        shell: bash
        run: |
          branch="${{ github.head_ref || github.ref_name }}"
          if [ -n "$branch" ] && git ls-remote --heads https://github.com/qontinui/qontinui-web.git "$branch" | grep -q .; then
            echo "Using qontinui-web ref: $branch (matches this PR's branch)"
            echo "ref=$branch" >> "$GITHUB_OUTPUT"
          else
            echo "Using qontinui-web ref: main (branch '$branch' absent on qontinui-web)"
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout qontinui-web (sibling)
        uses: actions/checkout@v5
        with:
          repository: qontinui/qontinui-web
          path: qontinui-web
          ref: ${{ steps.resolve_ref.outputs.ref }}

      # qontinui-web/backend/pyproject.toml has path-deps on sibling repos
      # (qontinui-schemas, qontinui). alembic's env.py transitively imports the
      # whole model layer, so a minimal `pip install alembic` is insufficient --
      # the backend import graph must resolve. Mirror schema-pg-sql-fresh.yml:
      # clone the public siblings, install via poetry (skip the private
      # cloud-control repo and the optional ml group -- the model layer doesn't
      # import them).
      - name: Checkout sibling repos (qontinui-schemas, qontinui)
        shell: bash
        run: |
          cd "$GITHUB_WORKSPACE"
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/qontinui/qontinui.git

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install backend dependencies (poetry, default groups only)
        working-directory: qontinui-web/backend
        run: poetry install --no-interaction --no-root

      - name: Apply alembic chain
        working-directory: qontinui-web/backend
        env:
          DATABASE_URL: postgresql://qontinui_user:qontinui_dev_password@localhost:5433/qontinui_db
        run: poetry run alembic upgrade head

      - name: Install Postgres client (native psql for the regen script)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      # -Container "" selects the script's native-psql path (no docker exec);
      # -Check regenerates against the fresh schema and diffs vs the committed
      # atlas/exclude.txt, exiting 1 on drift. -Out writes the freshly-regen'd
      # list once (for the on-drift artifact upload) so we never regen twice.
      # pwsh is preinstalled on ubuntu-latest. The password is passed as
      # -PgPassword (the script re-exports it to PGPASSWORD itself), so no
      # step-level env is needed.
      #
      # NOTE on the baseline: -Check compares the committed exclude.txt against
      # a list regenerated from THIS job's `alembic upgrade head` schema. For
      # the comparison to mean "web migrations drifted" (and not "the committed
      # baseline came from a different DB"), the committed exclude.txt must
      # itself have been generated by THIS workflow's schema — i.e. seed/refresh
      # it from the 'atlas-exclude-fresh' artifact this job uploads, not from a
      # local dev PG. After that first CI-sourced commit, drift == real web
      # migration changes.
      - name: Check atlas/exclude.txt is fresh
        id: exclude_check
        working-directory: qontinui-runner
        shell: bash
        run: |
          pwsh atlas/scripts/regen_exclude.ps1 -Check \
            -Out "${{ runner.temp }}/exclude.fresh.txt" \
            -Container "" -PgHost localhost -PgPort 5433 \
            -PgUser qontinui_user -PgDb qontinui_db \
            -PgPassword qontinui_dev_password

      # On drift, upload the fresh list -Out already wrote, so a contributor can
      # download + commit without spinning up Postgres + alembic locally
      # (mirrors schema-pg-sql-fresh.yml:214-220). `warn` (not `error`) on
      # missing file: a DB-connection failure throws before -Out is written, and
      # we don't want an artifact-missing error to mask the real DB error.
      - name: Upload regenerated exclude.txt (on drift)
        if: failure() && steps.exclude_check.conclusion == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: atlas-exclude-fresh
          path: ${{ runner.temp }}/exclude.fresh.txt
          if-no-files-found: warn
