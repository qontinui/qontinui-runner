name: audit ignore review

# Says when a `cargo audit --ignore` in ci.yml's `security` job needs another
# look: its `REVIEW BY` date passed, or the advisory stopped firing on
# Cargo.lock. scripts/ci-audit-ignore-review.mjs upserts one issue for it.
#
# THE NIGHTLY GATES NOTHING, deliberately. A check on a date reds with no change
# in the tree, and it would red every open PR at once. That is the failure the
# `security` job already has when an advisory lands (#2501 fixed the latest one),
# and it is not worth copying to enforce a comment. A red nightly means only that
# the check is blind: see the script's exit codes.
#
# The unit tests can red a PR, but only one that edits this tool or ci.yml, and
# never because of the date. ci.yml is in `paths` because the script parses it,
# and a PR that rewrites the command or a date's form should find out there
# rather than from a blind nightly.
#
# Trigger posture follows flake-escalation.yml: a daily schedule because this is
# a repo-level fact rather than a verdict on one branch, a dispatch with
# `dry_run`, and a path-filtered pull_request arm for the unit tests.
#
# TWO JOBS, because `cargo install` runs third-party build scripts. Those must
# not share a job with an `issues: write` token: a build script can read the
# environment, write $GITHUB_ENV and $GITHUB_PATH, and read the credential
# `checkout` persists. So `audit` holds no write scope and passes only a JSON
# file along, and `report` installs nothing and runs only the script.

on:
  schedule:
    # Daily, 06:43 UTC: off the hour, and clear of flake-escalation's 06:17.
    - cron: "43 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the plan without creating, editing or closing the issue"
        type: boolean
        default: false
  pull_request:
    branches: [main]
    paths:
      - scripts/ci-audit-ignore-review.mjs
      - scripts/__tests__/ci-audit-ignore-review.test.mjs
      - .github/workflows/audit-ignore-review.yml
      - .github/workflows/ci.yml

permissions:
  contents: read

# PR-SCOPED SUPERSESSION: the same one-expression group as flake-escalation.yml,
# whose comment explains why it is one expression. A first-attempt PR run
# replaces the run for the older head; every other run gets a group of its own.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  unit-tests:
    name: Audit-ignore review unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # No install step: the script and its tests import only Node built-ins.
      - name: Run unit tests
        run: |
          node --version
          node --test scripts/__tests__/ci-audit-ignore-review.test.mjs

  audit:
    name: Audit Cargo.lock with no ignores
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The same bound as ci.yml's `security` job, which does this same install.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run cargo audit
        run: |
          set -euo pipefail
          # --locked for the reason given in ci.yml's `security` job.
          cargo install cargo-audit --locked
          # Unlike that job, this passes no --ignore: it is measuring which
          # ignores still fire. So it exits non-zero on most days, and the
          # script is what decides whether the report is usable.
          # --file reads the lockfile alone, so no sibling checkout is needed.
          cargo audit --file Cargo.lock --json > audit.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: audit-report
          path: audit.json
          retention-days: 7
          if-no-files-found: error

  report:
    name: Upsert the review issue
    needs: audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A schedule and a dispatch that overlap would otherwise both create the issue.
    concurrency:
      group: audit-ignore-review-report
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: audit-report
          path: ${{ runner.temp }}/audit-report
      - name: Read the report and upsert the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          REPORT: ${{ runner.temp }}/audit-report/audit.json
        run: |
          set -euo pipefail
          args=(--audit-json "$REPORT" --repo "$REPO")
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          node scripts/ci-audit-ignore-review.mjs "${args[@]}"
