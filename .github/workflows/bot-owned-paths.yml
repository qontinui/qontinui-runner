name: bot-owned-paths

# Flags a PR that edits a BOT-OWNED path (`.github/sibling-pins.conf`,
# `src-tauri/src/fleet_{commands,skills,agents}/**`) alongside other work. The
# rule, its four passing arms and the remedies live in scripts/ci/bot-owned-paths.sh;
# its fixture suite is scripts/ci/bot-owned-paths-test.sh.
#
# Plan: qontinui-dev-notes plans/2026-11-04-runner-generated-and-ledger-files-are-
# merge-neutral-and-land-behind-a-drain.md, Phase 0 and Design decision 4.
#
# ADVISORY FIRST. The job is named `bot-owned-paths (advisory)` and is NOT in
# ruleset `main-merge-gates`' required checks. It reds a violating PR but holds
# nothing for its first week. Promoting it to a required check is an operator
# action the plan surfaces. When that happens, drop "(advisory)" from the job name
# in the same change, because a required context is matched by name.
#
# THE VERDICT RUNS MAIN'S SCRIPT, IN A JOB THAT RUNS NO PR CODE. A `pull_request`
# run checks out the PR's merge ref, so a PR could otherwise loosen the rule in its
# own copy. Running the PR's fixture suite in the same job would be no better: it
# runs on the same disk first, and could overwrite main's copy or plant a `gh` on
# $GITHUB_PATH before the decision. So the work is split in two:
#   * `bot-owned-paths (advisory)`, the context to require, checks out ONLY the
#     default branch and runs main's script over API reads. It falls back to the
#     PR's copy only while main has no script, which holds for the PR that adds
#     it, and it says so in a ::warning.
#   * `bot-owned-paths selftest` runs the PR's fixture suite, which is the change
#     under test, on its own runner. It lives in bot-owned-paths-selftest.yml,
#     which does NOT trigger on `labeled` / `unlabeled` (see TRIGGERS).
# Residual bound, stated plainly: a PR can still edit THIS workflow. That edit is
# caught only by ci-integrity.yml's gate-change declaration, not here.
#
# NO `paths:` FILTER, deliberately. The verdict is about the PR's whole diff, and
# a required context that is path-filtered never reports on the PRs it skips, so
# it would hold them forever (ci-integrity.yml, "WHY THIS IS NOT A REQUIRED STATUS
# CONTEXT"). A PR touching no bot-owned path passes in seconds.
#
# TRIGGERS.
#   * `labeled` / `unlabeled`: two arms are labels, so adding the override or the
#     schemas-pair label must re-decide without a push. Labels and their history
#     are read live through the API, not from the event payload. These fire for
#     EVERY label, and coord applies `coord:*` labels constantly, so this job is a
#     real share of the org's hosted-runner queue. It is NOT narrowed with a
#     job-level `if:` on `github.event.label.name`: an `if:`-skipped job still
#     publishes a `skipped` check run, coord counts `skipped` as passing, and an
#     unrelated label would flip a red verdict green (ci.yml and
#     ci-rerun-on-declaration.yml state the same trap). A step-level no-op is no
#     better: it reports `success` over the same red. Every run here must decide.
#     The fixture suite reads no labels, so it was moved to its own workflow,
#     which halves the jobs a label event costs; with no run there is no check
#     row, so the previous selftest conclusion stands.
#   * `edited`: covers a base re-target, which changes the diff.
#   * `push`: the selftest workflow runs, and the advisory job reports a no-op
#     success. It covers main and the same merge-candidate globs ci.yml lists, so
#     the context reports on every sha coord validates once it is required.
#   * Closed PRs are skipped. Label churn after a land (e.g. `coord:landed`)
#     would otherwise re-run it for nothing.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review, edited]
  push:
    branches:
      - main
      - develop
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'

permissions:
  contents: read
  pull-requests: read
  issues: read

# PR-SCOPED SUPERSESSION, in the one-expression form that schemas-pair-follow-tests.yml
# explains. A first-attempt PR run replaces the older run for the same PR, since
# label bursts fire several events in a row. Every other run gets its own group.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  bot-owned-paths:
    name: bot-owned-paths (advisory)
    if: github.event_name != 'pull_request' || github.event.pull_request.state != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # On a push (main, merge-candidate) there is no PR to decide. The job still
      # reports, so the context exists on every sha coord validates.
      - name: Nothing to decide on a push
        if: github.event_name != 'pull_request'
        run: echo "push to ${GITHUB_REF}; no PR diff to decide"

      - name: Check out main's rule (no PR code)
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: trusted
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Bootstrap only - main has no rule yet, take the PR's copy
        if: github.event_name == 'pull_request' && hashFiles('trusted/scripts/ci/bot-owned-paths.sh') == ''
        uses: actions/checkout@v5
        with:
          path: change
          persist-credentials: false
          sparse-checkout: scripts/ci

      - name: Decide this PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          script=trusted/scripts/ci/bot-owned-paths.sh
          if [ ! -f "$script" ]; then
            echo "::warning::main has no bot-owned-paths.sh yet; deciding with this PR's copy"
            script=change/scripts/ci/bot-owned-paths.sh
          fi
          bash "$script" pr "$REPO" "$PR_NUMBER"
