# CI Integrity — self-gating guard for an autonomous, auto-merging fleet.
#
# THREAT: coord auto-merges green PRs with zero human review, so the integrity
# of the gating workflows IS the security boundary. An agent PR that edits or
# deletes a gate (e.g. neuters a job in ci.yml, removes a drift check) could
# then auto-land using the weakened gate. This guard makes any change to a
# gating workflow surface as RED CI, so coord will NOT auto-land it and an
# operator reviews the diff. "Red CI" is the project's sanctioned merge-stopper
# — this is deliberately NOT a GitHub *required* status context and NOT a coord
# escalate-path:
#   * Required contexts desync GitHub's mergeStateStatus from coord (the real
#     merge authority) and — when path-filtered or producer-less — BLOCK every
#     PR forever (the 2026-06-26 fleet wedge: phantom `secret-scan`/`ci-integrity`
#     required contexts). Enforce gate integrity as red CI instead, never as
#     branch protection. Keep `required_status_checks.contexts: []` (matches web).
#
# WHY pull_request_target: GitHub runs the workflow file from the BASE branch
# (trusted main), not the PR's copy — so a PR cannot neuter THIS check by editing
# its own ci-integrity.yml. We never check out or execute PR code; we only read
# the PR's changed-file LIST via the API. Permissions are read-only.
#
# Maintaining GATING_WORKFLOWS: list only files that exist and that actually
# gate merges. Both halves of that rule bite, in opposite directions. The
# original listed a `secret-scan.yml` that did not exist — a guard over nothing.
# It was removed for that reason, the file later came BACK carrying the required
# `Gitleaks Secret Detection` context, and the entry was never restored: from
# then until 2026-08-06 the repo's secret-scanning gate was the one merge-gate an
# agent PR could weaken with this guard staying green. So when a listed file is
# dropped as non-existent, leave a note to re-add it if it returns — a removal
# justified by "does not exist" is only correct while that stays true.
# ci-integrity.yml guards itself, so removing a gate from this list is itself a
# guarded edit (goes red -> operator review).
#
# Cross-check against the ruleset rather than intuition, since a workflow's own
# header comment can drift:
#   gh api repos/qontinui/qontinui-runner/rulesets/16044811 \
#     --jq '.rules[]|select(.type=="required_status_checks")
#           .parameters.required_status_checks[].context'
# (`/branches/main/protection` 404s on this repo — gates are a RULESET, and that
# 404 reads misleadingly like "no gates at all".) Every required context should
# trace back to a workflow file listed below.
name: CI Integrity

# NO BASE-BRANCH FILTER, deliberately. This used to read
# `pull_request_target: branches: [main]`, which produces NO run at all on a
# STACKED PR whose base is another feature branch — and this repo actively
# stacks PRs (stacked-pr-fastlane.yml). That meant a PR editing a gating
# workflow, or `scripts/check_untimed_subprocess.py`, got no integrity signal
# for as long as it sat in a stack. Re-targeting it to `main` later does NOT
# rescue that: a re-target fires the `edited` activity type, and a
# `pull_request_target` trigger with no explicit `types:` listens only for
# `opened`, `synchronize` and `reopened`. So the guard would only ever fire on
# the next PUSH to the stacked branch, if one happened at all.
#
# That gap was pre-existing for every other entry in GATING_WORKFLOWS, but
# forbid-untimed-subprocess.yml is the first gate to delegate its entire verdict
# to a guarded SCRIPT and to cite this guard as its self-protection — so the
# filter became load-bearing, and is removed rather than reasoned around. The
# job is an API read of one PR's changed-file list; running it on stacked PRs
# too costs seconds.
on:
  pull_request_target:
    paths:
      - '.github/workflows/**'
      # Composite actions are gate logic too: a gating workflow that delegates a
      # decision to `uses: ./.github/actions/...` executes that action's shell
      # inside required contexts. Without this glob a PR touching ONLY an action
      # would not even trigger this guard.
      - '.github/actions/**'
      # Same argument one level out: forbid-untimed-subprocess.yml delegates its
      # entire verdict to a script in scripts/. A PR that edits ONLY that script
      # — narrowing BLOCKING_WAITS, loosening the receiver resolver, widening
      # what suppresses a finding — would not match either glob above, so the
      # guard would never even run. List the
      # checker explicitly rather than globbing scripts/**, which is full of
      # non-gating tooling and would make this guard fire constantly.
      - 'scripts/check_untimed_subprocess.py'

permissions:
  contents: read
  pull-requests: read

jobs:
  guard-gating-workflows:
    name: Guard gating workflows from self-edits
    runs-on: ubuntu-latest
    steps:
      - name: Flag edits/deletes to gating workflows
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Integrity-critical workflows. Editing or DELETING any of these is a
          # high-trust change that must not auto-merge. Only list files that
          # exist (verify with: ls .github/workflows). ci-integrity.yml guards
          # itself.
          #
          # ci-rerun-on-declaration.yml is listed for LEVERAGE, not for a gating
          # role: it is not a gate, but it holds `actions: write` and is the only
          # thing in this repo that can CANCEL or RE-RUN ci.yml. That is at least
          # as much power over the merge boundary as editing a gate — an agent PR
          # could weaken it to suppress the re-resolution that makes a cross-repo
          # declaration binding, or to cancel a gating run outright.
          #
          # forbid-untimed-subprocess.yml is listed with its SCRIPT, because the
          # workflow is a two-line shim and the entire verdict lives in
          # scripts/check_untimed_subprocess.py. Guarding only the .yml would
          # leave the actual gate — BLOCKING_WAITS, the receiver resolver, the
          # scope discovery, the baseline format check — editable with no review
          # signal. (There is no longer a SKIPPED_FILES to add your own file to:
          # a whole-file skip was itself a bypass — the one file whose name read
          # as "sanctioned" was the blind spot — so the checker has no such
          # mechanism.) Its baseline JSON is deliberately NOT listed: it is
          # edited by every legitimate ratchet-tightening PR, and its integrity
          # is enforced by rules that live in the guarded script (required
          # reason, reason_covers_waits == waits, and an exact per-wait program
          # list so a count-preserving SWAP cannot pass either).
          # The `paths:` trigger above carries the script too — without that,
          # listing it here would guard nothing.
          #
          # NOTE: everything between the EOF markers is DATA, one path per line.
          # `run: |` dedents the block, so entries land at column 0 and are
          # matched with `grep -qxF`. A `#` line in there is NOT a comment — it
          # becomes a list entry that can never match. Keep prose up here.
          read -r -d '' GATING <<'EOF' || true
          .github/workflows/ci.yml
          .github/workflows/ci-integrity.yml
          .github/workflows/ci-rerun-on-declaration.yml
          .github/workflows/reproducibility-gate.yml
          .github/workflows/forbid-runner-schema.yml
          .github/workflows/clorinde-bindings-fresh.yml
          .github/workflows/schema-pg-sql-fresh.yml
          .github/workflows/qontinui-types-drift.yml
          .github/workflows/secret-scan.yml
          .github/workflows/forbid-untimed-subprocess.yml
          scripts/check_untimed_subprocess.py
          .github/actions/checkout-sibling/action.yml
          EOF

          # Changed files in this PR (paths only). No checkout of untrusted
          # code; `removed` files are included so deletions are caught too.
          #
          # BOTH `filename` and `previous_filename` — a rename is the one way to
          # remove a gate without the old path ever appearing in `filename`.
          # GitHub reports a rename with status `renamed`, `filename` = the NEW
          # path and `previous_filename` = the old one; it does NOT emit a
          # separate `removed` entry for the old path. So a PR doing
          # `git mv .github/workflows/ci.yml .github/workflows/ci-old.yml`
          # matched nothing in GATING while actually deleting the gate at its
          # guarded path — the trigger fired (`.github/workflows/**`) and the
          # job went green. Reading both keys closes that. `// empty` is
          # required because `previous_filename` is ABSENT on non-renamed
          # entries, and a bare `.previous_filename` would emit `null` lines.
          CHANGED="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"

          HITS=""
          while IFS= read -r gate; do
            [ -z "${gate}" ] && continue
            if printf '%s\n' "${CHANGED}" | grep -qxF "${gate}"; then
              HITS="${HITS}  - ${gate}"$'\n'
            fi
          done <<< "${GATING}"

          if [ -n "${HITS}" ]; then
            echo "::error::This PR changes gating workflow(s) that protect merge integrity:"
            printf '%s' "${HITS}"
            echo ""
            echo "Gate-workflow changes do NOT auto-merge — they surface as red CI so an"
            echo "operator can review the diff before it lands. If the change is intended"
            echo "and safe, an operator merges it after review."
            exit 1
          fi

          echo "No gating workflow modified — CI integrity intact."
