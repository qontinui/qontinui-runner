# CI Integrity — self-gating guard for an autonomous, auto-merging fleet.
#
# THREAT: coord auto-merges green PRs with zero human review, so the integrity
# of the gating workflows IS the security boundary. An agent PR that edits or
# deletes a gate could then auto-land using the weakened gate. This guard exists
# to make that impossible to do SILENTLY.
#
# ---------------------------------------------------------------------------
# WHAT THIS DOES AND DOES NOT DETECT — read this before trusting it
# ---------------------------------------------------------------------------
#
# DETECTED, by digesting a structural "gate surface" between the MERGE BASE
# and the PR head:
#   * per job, its ENTIRE spec mapping — steps (each step's `run`, `uses`, `if`,
#     `with`, `env`, `shell`, `working-directory`, `timeout-minutes`, ...),
#     `if`, `continue-on-error`, `strategy`/matrix, `needs`, `runs-on`,
#     `permissions`, `container`, `services`, `outputs`, `environment`,
#     `defaults`, and anything else the job carries
#   * per workflow, EVERYTHING outside `jobs:` — `on` (triggers, `paths`,
#     `branches`, `types`), `permissions`, `env`, `defaults`, `concurrency`, and
#     a composite action's `runs:`
#   * a job disappearing, or its whole file being deleted or renamed away
#
# It captures whole mappings rather than a list of named fields ON PURPOSE, so
# Actions syntax that does not exist yet is covered by default. An earlier
# revision named the fields it thought mattered and missed twelve — `shell:`
# most sharply, since GitHub expands `bash` to
# `bash --noprofile --norc -eo pipefail {0}` and a custom value silently drops
# `-e`, after which a multi-line `run:` passes iff its LAST line passes.
#
# NOT DETECTED, and no claim is made otherwise:
#   * anything a gate SHELLS OUT TO. A step is compared by its `run:` TEXT, so
#     `run: bash scripts/foo.sh` is unchanged when `scripts/foo.sh` is gutted,
#     and files the trigger does not name (its two globs and its one exact path)
#     never reach this job at all.
#   * `.github/CODEOWNERS`, a merge gate under the ruleset that lives in
#     `.github/` but NOT under `workflows/` or `actions/`, so it does not even
#     trigger this workflow.
#   * repository/organisation VARIABLES and SECRETS, `environments` and their
#     protection rules, and the branch RULESET itself — none of which live in
#     these files. (Job-level `env:`/`environment:` DO live here and ARE
#     captured; an earlier revision of this list wrongly disclaimed them.)
#   * (no longer a gap) duplicate YAML keys. `yaml.safe_load` takes last-wins
#     while Actions rejects them, and Python also collides keys YAML keeps apart
#     (`on` reads as True, and True == 1 == 1.0), so a head file with any two keys
#     of one mapping that construct equal is refused as `!DUPKEY` instead.
#   * semantics. This computes CHANGED vs UNCHANGED, never "weaker vs
#     stronger". Every alteration to an existing gate is treated alike and must
#     be declared; the guard does not try to judge intent.
#
# An earlier revision compared only job NAMES and claimed weakening was
# "impossible by construction". That was false — gutting a job body, adding
# `continue-on-error`, or narrowing `on:` all preserve every name. An overstated
# claim in a security control is itself a defect, so the lists above are
# deliberately concrete about what remains uncovered.
#
# ---------------------------------------------------------------------------
# WHY DECLARATION + VERIFICATION, AND NOT AN OPERATOR
# ---------------------------------------------------------------------------
#
# This guard used to go RED on any touch of a gating workflow so an operator
# reviewed and merged it by hand. That made an OPERATOR PERMISSION the
# protection mechanism, which is the wrong tool for this fleet: routine,
# mechanical CI work — adding a job, wiring a new test gate, renaming a step —
# is exactly the work agents are meant to absorb, and routing all of it through
# a human click both stalls agents and trains the operator to rubber-stamp,
# which is worse than no review because it looks like review.
#
# So the agent DECLARES, and this job VERIFIES the declaration against the
# actual diff rather than believing it.
#
#   * Purely ADDITIVE changes (new jobs, new files, nothing existing altered)
#     need only `ci:gate-change=declared`.
#
#   * Any change to an EXISTING gate surface needs `ci:gate-change=alters-a-gate`
#     AND a line in the PR body naming each altered item —
#     `Gate-Change: <stem>#<job-key>` or `Gate-Removal: <stem>#<job-key>`, and
#     `<stem>#workflow` for a change outside `jobs:`, and
#     `check_untimed_subprocess#file` for scripts/check_untimed_subprocess.py, the
#     one non-YAML gating path (WHOLE_FILE_GATES; compared as a whole file, so any
#     edit to it counts). Matched
#     WHOLE-LINE, so a body cannot satisfy it by containing the token inside a
#     longer name, an HTML comment, or a pasted CI log.
#
#   * Undeclared gate edits stay RED — not because a human is needed, but
#     because an undeclared change to the security boundary is
#     indistinguishable from an accidental one.
#
#   * Either way the guard POSTS A NOTIFICATION naming every gating file touched
#     and every surface change found. The durable, attributed record is what
#     protects the repo; the human click never did.
#
# RESIDUAL RISK, stated plainly: a determined agent can still alter a gate by
# declaring it, including altering THIS file. What it cannot do is alter one
# silently, accidentally, or while claiming the change was additive — the
# surface diff is computed here, from trusted main, and contradicts a false
# declaration. That is a visibility guarantee, not a permission one, which is
# the deliberate design choice.
#
# ---------------------------------------------------------------------------
# WHY THIS IS NOT A REQUIRED STATUS CONTEXT
# ---------------------------------------------------------------------------
#
# "Red CI" is the project's sanctioned merge-stopper — this is deliberately NOT
# a GitHub *required* status context and NOT a coord escalate-path:
#   * Required contexts desync GitHub's mergeStateStatus from coord (the real
#     merge authority) and — when path-filtered or producer-less — BLOCK every
#     PR forever (the 2026-06-26 fleet wedge: phantom `secret-scan`/`ci-integrity`
#     required contexts). Enforce gate integrity as red CI instead, never as
#     branch protection. Keep `required_status_checks.contexts: []` (matches web).
#
# WHY pull_request_target: GitHub runs the workflow file from the BASE branch
# (trusted main), not the PR's copy — so a PR cannot neuter THIS check by
# editing its own ci-integrity.yml. We never check out or execute PR code. We
# read the PR's changed-file LIST and the CONTENT of gating files via the API
# and parse that YAML as DATA with `yaml.safe_load`; nothing from the PR runs.
#
# WHY `ci:` AND NOT `coord:`. The obvious precedent was coord's version-bump
# gate honouring `coord:version-bump=deliberate-release` — but that label and
# `coord:operator-review` are both RETIRED and actively REJECTED by coord's
# namespace validator, because labels no longer hold PRs there (a hold is a
# draft PR or a coord gate with a `MergePr` continuation). A new `coord:` key
# would be unsettable through /coord-pr-label. This is also not a coord signal:
# it is read here by GitHub Actions from the labels API with nothing but a
# GITHUB_TOKEN, and this job cannot reach coord (that needs device auth).
#
# WHAT COUNTS AS GATING: everything this workflow triggers on. The scope used to
# be a hand-maintained allowlist, which drifted in the dangerous direction — it
# once named a `secret-scan.yml` that did not exist, the entry was dropped as
# dead, the file later came BACK carrying the required `Gitleaks Secret
# Detection` context, and from then until 2026-08-06 the repo's secret-scanning
# gate was the one merge-gate an agent PR could weaken with this guard staying
# green. An allowlist fails open for every file nobody remembered to add. The
# scope is now the trigger itself, minus an explicit NON_GATING exception list
# whose entries each need a justification.
#
# Cross-check against the ruleset rather than intuition, since a workflow's own
# header comment can drift:
#   gh api repos/qontinui/qontinui-runner/rulesets/16044811 \
#     --jq '.rules[]|select(.type=="required_status_checks")
#           .parameters.required_status_checks[].context'
# (`/branches/main/protection` 404s on this repo — gates are a RULESET, and that
# 404 reads misleadingly like "no gates at all".)
name: CI Integrity

# NO BASE-BRANCH FILTER, deliberately. This used to read
# `pull_request_target: branches: [main]`, which produces NO run at all on a
# STACKED PR whose base is another feature branch — and this repo actively
# stacks PRs (stacked-pr-fastlane.yml). That meant a PR editing a gating
# workflow, or `scripts/check_untimed_subprocess.py`, got no integrity signal
# for as long as it sat in a stack. Re-targeting it to `main` later does NOT
# rescue that: a re-target fires the `edited` activity type, and a
# `pull_request_target` trigger with no explicit `types:` listens only for
# `opened`, `synchronize` and `reopened`. So the guard would only ever fire on
# the next PUSH to the stacked branch, if one happened at all.
#
# forbid-untimed-subprocess.yml delegates its entire verdict to a guarded
# SCRIPT and cites this guard as its self-protection, so the filter became
# load-bearing and is removed rather than reasoned around. The job is an API
# read of one PR's changed-file list; running it on stacked PRs too costs
# seconds. (qontinui-runner#1253)
on:
  pull_request_target:
    paths:
      - '.github/workflows/**'
      # Composite actions are gate logic too: a gating workflow that delegates a
      # decision to `uses: ./.github/actions/...` executes that action's shell
      # inside required contexts. Without this glob a PR touching ONLY an action
      # would not even trigger this guard.
      - '.github/actions/**'
      # Same argument one level out: forbid-untimed-subprocess.yml delegates its
      # entire verdict to a script in scripts/. A PR that edits ONLY that script
      # — narrowing BLOCKING_WAITS, loosening the receiver resolver, widening
      # what suppresses a finding — would not match either glob above, so the
      # guard would never even run. Listed explicitly rather than globbing
      # scripts/**, which is full of non-gating tooling. The scope filter in the
      # job body carries the same path as a `case` arm — a `paths:` entry alone
      # would trigger the run and then be silently dropped by that filter — and
      # WHOLE_FILE_GATES names it too, or a non-YAML path can never pass. Add a path
      # to all three, keeping that table on one line because the suite lifts it as
      # one: scripts/tests/ci-integrity/test-surface.py section 7 fails when they
      # disagree, and it compares the globs above the same way.
      - 'scripts/check_untimed_subprocess.py'

permissions:
  contents: read
  pull-requests: write

# PR-SCOPED SUPERSESSION (shared hosted-job cap relief, 2026-10-05). A FIRST-
# attempt `pull_request_target` run joins a per-workflow, per-PR group and cancels the
# run it supersedes there: a `synchronize` cancels the older head's run, and a
# `reopened` cancels the same-head run it re-does (coord's ci-abandoned
# recovery is a close+reopen). Every OTHER run -- whichever of push (main,
# develop, merge-candidate*/** -- coord's candidate CI), schedule,
# workflow_dispatch and workflow_run this file has, and EVERY re-run (run_attempt > 1) -- gets a
# group unique to its run id + attempt, so it is never cancelled, never reaped
# while pending, and never queues behind anything.
# The group is ONE expression on purpose: coord models a group template by
# interpolating only `github.event_name` / `github.ref` and collapsing every
# other expression to "" (qontinui-coord ci_observer.rs resolve_group_template),
# and run_is_reaper_at_risk never matches an empty group, so no push run here is
# modelled as reapable by a land.
# RESIDUAL: two pushes seconds apart can have
# their runs CREATED out of order, so the older head's run cancels the newer
# head's; the next push (or a close+reopen) heals it.
# Pattern: qontinui-claude-config#1475.
concurrency:
  group: ${{ (github.event_name == 'pull_request_target' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' && github.run_attempt == 1 }}

jobs:
  guard-gating-workflows:
    name: Guard gating workflows from self-edits
    runs-on: ubuntu-latest
    # Bounded so a malformed head file cannot pin a runner for the repo default
    # (up to 6h): `yaml.safe_load` has no alias-expansion limit, so a ~200-byte
    # billion-laughs document in a gating file would otherwise hang this job.
    timeout-minutes: 15
    steps:
      - name: Verify and record gating-workflow changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # Paths under the trigger that are NOT gate logic. Every entry
          # needs a justification, because anything listed here is invisible to
          # this guard. Empty is the correct default: a file earns a place only
          # once someone can say why weakening it could not affect a merge.
          #
          # NOTE: everything between the markers is DATA, one path per line.
          # `run: |` dedents the block, so entries land at column 0. A `#` line
          # in there is NOT a comment — it becomes an entry that matches nothing.
          read -r -d '' NON_GATING <<'NONGATING' || true
          NONGATING

          # Changed files in this PR (paths only). No checkout of untrusted
          # code; `removed` files are included so deletions are caught too.
          #
          # BOTH `filename` and `previous_filename` — a rename is the one way to
          # remove a gate without the old path ever appearing in `filename`.
          # GitHub reports a rename with `filename` = the NEW path and
          # `previous_filename` = the old one; it does NOT emit a separate
          # `removed` entry for the old path. `// empty` is required because
          # `previous_filename` is ABSENT on non-renamed entries, and a bare
          # `.previous_filename` would emit `null` lines.
          CHANGED="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)')"

          # `GET /pulls/{n}/files` returns at most 3000 files and SILENTLY
          # truncates; `--paginate` does not lift the cap. That is the same
          # "just open a big PR" bypass the SIGPIPE note below closed, so cross-
          # check the count and fail closed rather than certifying a prefix.
          DECLARED_COUNT="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.changed_files')"
          SEEN_COUNT="$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" --jq '.[].filename' | wc -l)"
          # Validate BEFORE comparing. `set -e` does not fire for a failing command in
          # an `if` CONDITION, so `[ "" -lt 5 ]` prints "integer expected" and execution
          # simply CONTINUES past the check -- silently skipping the truncation guard at
          # exactly the moment the API is misbehaving and truncation is most likely.
          case "${DECLARED_COUNT}" in "" | *[!0-9]*) BAD=1 ;; *) BAD=0 ;; esac
          case "${SEEN_COUNT}"     in "" | *[!0-9]*) BAD=1 ;; esac
          if [ "${BAD}" -ne 0 ]; then
            echo "::error::Could not read this PR's file counts from the API"
            echo "(changed_files='${DECLARED_COUNT}', listed='${SEEN_COUNT}'). Without them the"
            echo "gating scan cannot be shown to cover the whole diff, so it certifies nothing."
            exit 1
          fi
          if [ "${SEEN_COUNT}" -lt "${DECLARED_COUNT}" ]; then
            echo "::error::This PR reports ${DECLARED_COUNT} changed files but the API listed"
            echo "only ${SEEN_COUNT} (GitHub caps /pulls/files at 3000). The gating scan would"
            echo "cover a prefix of the diff, so it cannot certify anything. Split the PR."
            exit 1
          fi

          # Scope = the trigger's paths, minus NON_GATING.
          #
          # NO PIPE into `grep -q` anywhere in this job, deliberately.
          # `printf ... | grep -q` is a silent fail-OPEN under `set -o pipefail`:
          # grep exits at the first match, printf dies on SIGPIPE, and the
          # PIPELINE returns 141 — so an `if` around it reads FALSE and the gate
          # looks untouched. Measured on the previous revision of this file:
          # 500 changed files -> rc 0 (detected); 1500 -> rc 141 (MISSED);
          # 3000 -> rc 141 (MISSED). `.github/...` sorts first in GitHub's file
          # list so the match is always early, making the bypass merely "open a
          # big PR" — a vendored directory or a bindings regen reaches it.
          # Herestrings have no second process and cannot lose that race.
          HIT_PATHS=""
          while IFS= read -r f; do
            [ -z "${f}" ] && continue
            case "${f}" in
              .github/workflows/*|.github/actions/*) ;;
              # The one script that IS a gate: forbid-untimed-subprocess.yml's
              # whole verdict lives in it. Kept in step with the `paths:`
              # trigger above — either half alone guards nothing.
              scripts/check_untimed_subprocess.py) ;;
              *) continue ;;
            esac
            if grep -qxF "${f}" <<< "${NON_GATING}"; then continue; fi
            # Anchored on BOTH sides. As a bare substring test this was a total
            # bypass: a decoy path `.github/actions/x/.github/workflows/ci.yml` is
            # collected first (`.github/actions/...` sorts earlier) and then SWALLOWS
            # the real `.github/workflows/ci.yml`, which is then never scanned at all
            # -- the guard reports "purely additive" for a PR that gutted every gate
            # in it. Verified before the fix.
            case $'\n'"${HIT_PATHS}" in
              *$'\n'"${f}"$'\n'*) continue ;;
            esac
            HIT_PATHS="${HIT_PATHS}${f}"$'\n'
          done <<< "${CHANGED}"

          if [ -z "${HIT_PATHS}" ]; then
            echo "No gating workflow modified — CI integrity intact."
            exit 0
          fi

          echo "Gating file(s) touched by this PR:"
          printf '%s' "${HIT_PATHS}" | sed 's/^/  - /'
          echo ""

          # The MERGE BASE, not the base-branch tip. `base.sha` is where main was
          # when the event fired, so a branch merely BEHIND main would report
          # every job main has added since as "removed" — a false red that also
          # trains agents to write Gate-Removal lines for jobs they never
          # touched, destroying the signal this design depends on.
          MERGE_BASE="$(gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" \
            --jq '.merge_base_commit.sha')"
          if [ -z "${MERGE_BASE}" ]; then
            echo "::error::Could not resolve the merge base; refusing to guess."
            exit 1
          fi
          echo "Comparing ${MERGE_BASE} (merge base) -> ${HEAD_SHA} (head)"
          echo ""

          export HIT_PATHS MERGE_BASE
          python3 - <<'PY' > "${RUNNER_TEMP}/findings.tsv"
          import base64, hashlib, json, os, subprocess

          # No pip install. PyYAML ships on ubuntu-latest, and installing
          # unpinned third-party code into a job holding `pull-requests: write`
          # and a GH_TOKEN — in order to check a security control — is a worse
          # trade than failing closed. An ImportError exits non-zero, which
          # `set -e` turns into a red job.
          import yaml

          repo = os.environ["REPO"]
          TAB = chr(9)
          def content_at(path, ref):
              """File text at a ref, or None ONLY when the path genuinely 404s.

              Every other failure RAISES. Returning None on a rate-limit or a 5xx
              would be a silent fail-OPEN on the BASE side: `before` comes back
              empty, the diff is empty, and the guard reports "nothing altered"
              for a PR that gutted every gate. The head side fails CLOSED
              instead, so the two sides are asymmetric and only this one is
              dangerous. An exception exits non-zero -> red, which is the right
              answer when the truth is unknown."""
              p = subprocess.run(
                  ["gh", "api", f"repos/{repo}/contents/{path}?ref={ref}", "--jq", ".content"],
                  capture_output=True, text=True)
              if p.returncode != 0:
                  err = p.stderr or ""
                  if "404" in err or "Not Found" in err:
                      return None
                  raise RuntimeError(f"cannot read {path}@{ref}: {err.strip()[:300]}")
              blob = p.stdout.strip()
              if not blob:
                  # A 200 carrying no content is not an absence we can interpret
                  # (files over ~1MB come back this way).
                  raise RuntimeError(f"empty content for {path}@{ref}")
              return decode_blob(blob)

          def decode_blob(blob):
              """The file's text, decoded STRICTLY. A replacement-character decode
              would let two different byte strings read as one text; invalid UTF-8
              raises UnicodeDecodeError, which the loop below turns into `!UTF8`."""
              return base64.b64decode(blob).decode("utf-8")

          def canon(o):
              """Type-preserving canonical form. `repr` is what makes it safe.

              Neither `str(k)` nor `json.dumps` can be used to key a security digest:
              both COLLAPSE distinct keys. YAML 1.1 parses a bare `on:` as the boolean
              True, and `str(True) == str("True")` while `json.dumps` coerces True to
              "true" — so a head file could narrow `on.paths` to nothing and re-add a
              STRING key "True" carrying the original value. Last-wins in the mapping
              left the digest IDENTICAL to base: no finding, the weak self-appliable
              label sufficed, and the guard's own trigger was narrowed to nothing while
              it reported the change as purely additive. Verified before this fix.

              `repr` keeps True ("True") and "True" ("'True'") apart, and sorting on it
              is total, so mixed-type keys cannot raise the way `json.dumps(sort_keys=
              True)` does on a bool/str mix."""
              if isinstance(o, dict):
                  return ("d", sorted((repr(k), canon(v)) for k, v in o.items()))
              if isinstance(o, (list, tuple)):
                  return ("l", [canon(v) for v in o])
              return ("v", repr(o))


          def digest(obj):
              return hashlib.sha256(repr(canon(obj)).encode()).hexdigest()[:12]
          def uses_yaml_merge_key(text):
              """Does this document use a YAML merge key (`<<:`, or a key tagged `!!merge`)?

              Digest equality only means "same gate" if OUR parser agrees with the one
              GitHub Actions uses. Anchors and aliases no longer diverge: Actions has
              resolved them since 2025-09-18, as PyYAML does, so an anchored file
              digests to exactly the jobs Actions runs, and an edit to an anchored
              block changes the digest of EVERY job that aliases it. The merge key is
              not documented as supported by Actions, and this guard's parser (PyYAML)
              resolves it: if Actions does not, it may refuse the file outright and
              never run the gate. That is a weakening that would read here as "no
              change at all".
              Verified: a `<<:` merge rewrite produced a job digest identical to the
              plain form.

              So for a merge key we do not try to decide who is right; we refuse to
              certify. Checked on HEAD only: base is what is already live, and
              tripping on it would wedge every PR in the repo rather than the one
              proposing the change."""
              MERGE_TAG = "tag:yaml.org,2002:merge"
              try:
                  # 1. The event stream: ANY node -- scalar, sequence or mapping --
                  #    explicitly tagged as a merge (`!!merge`, a %TAG shorthand
                  #    or a verbatim `!<tag:yaml.org,2002:merge>`; the parser
                  #    expands each to the full tag), and every `<<` scalar in any
                  #    style. An aliased merge key is caught at its anchored
                  #    definition, which is one of these same events.
                  node_events = (yaml.events.ScalarEvent, yaml.events.SequenceStartEvent,
                                 yaml.events.MappingStartEvent)
                  for ev in yaml.parse(text, Loader=yaml.SafeLoader):
                      if not isinstance(ev, node_events):
                          continue
                      if ev.tag == MERGE_TAG:
                          return True
                      if isinstance(ev, yaml.events.ScalarEvent) and ev.value == "<<":
                          return True
                  # 2. Exactly what PyYAML's flatten_mapping keys on: a mapping KEY
                  #    node whose RESOLVED tag is the merge tag, whether explicit
                  #    or implicit. Pass 1 already covers every way to get one;
                  #    this pass checks the constructor's own predicate, so a
                  #    resolver path pass 1 did not anticipate is still refused.
                  root = yaml.compose(text, Loader=yaml.SafeLoader)
                  seen, stack = set(), [root] if root is not None else []
                  while stack:
                      node = stack.pop()
                      if id(node) in seen:
                          continue
                      seen.add(id(node))
                      if isinstance(node, yaml.MappingNode):
                          for k, v in node.value:
                              if k.tag == MERGE_TAG:
                                  return True
                              stack.extend((k, v))
                      elif isinstance(node, yaml.SequenceNode):
                          stack.extend(node.value)
              except Exception:
                  # Unparseable is a separate verdict, reached below.
                  return False
              return False

          # The expanded-cost budget for yaml_alias_expansion_exceeds. Aliases are
          # resolved by REFERENCE when parsed but walked IN FULL by canon(), so a
          # ~600-byte file of nested aliases (each level aliasing the one below ten
          # times) costs 10^levels nodes there (measured 0.02 / 0.28 / 5.3 s at 4 /
          # 5 / 6 levels), which runs this job into its timeout or out of memory.
          # canon() and digest() also COPY every scalar they reach, so one large
          # scalar aliased many times is the same attack in bytes (measured: 11k
          # aliases of a 50 KB scalar, from a 51 KB file, cost 1.7 GB RSS and
          # 9.4 s). So each node costs 1, plus 1 per 64 bytes of a scalar's text:
          # the budget bounds nodes AND bytes walked (100,000 units is at most
          # ~6.4 MB of expanded scalar text). The worst case is larger than that
          # text: canon() keys on repr(), which escapes non-printable characters,
          # and astral non-printables inflate ~11x (`\U000xxxxx` per character);
          # measured near the budget at ~120 MB RSS and ~2.5 s, inside this job's
          # limits. The largest gating workflow here, ci.yml with
          # its one shared `test-steps` anchor, costs ~2,400 units (2026-11-26);
          # 100,000 is ~40x that, and canon() walks it in well under a second.
          ALIAS_EXPANSION_BUDGET = 100000
          def yaml_alias_expansion_exceeds(text):
              """Would walking this document with its aliases expanded exceed the budget?

              Composes the node graph (linear: an alias is the SAME node object, not a
              copy) and sums each node's expanded size once, memoised by identity, so
              this costs the size of the file, not of its expansion. A scalar costs
              1 + len(text) // 64, so a large aliased scalar is charged for the
              bytes canon() would copy each time it is reached. A recursive alias
              (a node that contains itself) has no finite expansion and counts as
              exceeding. Unparseable is a separate verdict, reached below."""
              try:
                  root = yaml.compose(text, Loader=yaml.SafeLoader)
              except Exception:
                  return False
              sizes, open_nodes = {}, set()
              def size(node):
                  key = id(node)
                  if key in sizes:
                      return sizes[key]
                  if key in open_nodes:
                      raise OverflowError("recursive alias")
                  open_nodes.add(key)
                  if isinstance(node, yaml.MappingNode):
                      total = 1 + sum(size(k) + size(v) for k, v in node.value)
                  elif isinstance(node, yaml.SequenceNode):
                      total = 1 + sum(size(c) for c in node.value)
                  else:
                      total = 1 + len(node.value) // 64
                  open_nodes.discard(key)
                  sizes[key] = total
                  return total
              try:
                  return root is not None and size(root) > ALIAS_EXPANSION_BUDGET
              except (OverflowError, RecursionError):
                  return True

          # The longest scalar yaml11_divergences / yaml_duplicate_keys will BUILD
          # (plain or explicitly tagged; untagged quoted and block scalars are
          # strings and are not built). PyYAML's sexagesimal int construction is
          # quadratic in its segment count (measured 0.18 / 0.64 / 2.32 s at 50 /
          # 100 / 200 KB), so a longer one is refused instead of built. The longest
          # such scalar in this repo's tracked .github YAML is 673 characters
          # (2026-11-26); 4096 is ~6x that, and builds in well under a millisecond.
          SCALAR_LENGTH_CAP = 4096
          def yaml11_divergences(text):
              """Scalars and line breaks that THIS guard's parser reads differently from Actions.

              PyYAML implements YAML 1.1; Actions documents its workflow syntax as YAML,
              and is assumed here to parse YAML 1.2 (its parser is not measured from this
              repo). The two disagree on some scalars, so two spellings PyYAML digests
              IDENTICALLY can mean different things to Actions -- the digest-equality
              premise again, as with the merge key. Measured on the PyYAML side:
              renaming the top-level `on:` to `yes:`, `true:`, `True:` or `ON:` keeps
              the digest (PyYAML reads every one as the bool True); under YAML 1.2 none
              of them is the key `on`, so the workflow would have no trigger. A value
              respelled `yes` for `true`, `1:00` for `60` or `074` for `60` is the same
              trick in a value.

              Returned as (line, column, text), in the order the checks run:
              1. On the raw text, first: U+0085, U+2028 or U+2029 ANYWHERE -- YAML 1.1
                 treats them as line breaks (so they end a comment) and YAML 1.2 does
                 not, so text after one in a comment is live to PyYAML and a comment to
                 Actions; with last-wins duplicate keys, a hidden second value -- and a
                 U+FEFF (byte-order mark) anywhere but offset 0.
              2. A `%YAML` directive: it selects a YAML version, and the two parsers
                 disagree on what a 1.1 or 1.2 document means.
              3. A top-level key other than the plain, untagged, un-anchored `on` that
                 PyYAML reads as True (`true:` included: both parsers read it as a
                 bool, but it digests exactly like `on:`), and an anchored `on`.
              Then per scalar, key or value, in the composed walk:
              4. A plain or explicitly tagged scalar longer than SCALAR_LENGTH_CAP:
                 refused WITHOUT being built, because building some (a sexagesimal
                 int) is quadratic in their length.
              5. A scalar with an explicit tag, ANY style (`!!bool "yes"`, `!!int |-`),
                unless PyYAML builds it as a string: what Actions makes of an
                explicit tag is not documented. The non-specific `!` tag is returned
                unless PyYAML's value is that same text as a string (YAML 1.2 makes a
                `!` scalar a string; PyYAML resolves `! true` as True).
              6. A plain, untagged scalar whose type or value differs between PyYAML's
                 resolver+constructor and the YAML 1.2 core schema (core12 below), or
                 whose value cannot be built (a decimal over Python's digit limit).
              ONE exemption: the top-level key `on` -- plain, untagged and carrying NO
              anchor, so it cannot be aliased into a value somewhere else -- which PyYAML
              reads as True and YAML 1.2 as the string "on". Untagged quoted scalars are
              strings to both parsers and pass. PyYAML resolves no y/n bool, so `y` and
              `n` are strings to both and are not returned.

              Linear in the file: one event pass and one composed walk (aliases
              visited once), and every scalar it builds is at most SCALAR_LENGTH_CAP
              long. Unparseable returns [] (the !PARSE verdict is reached below)."""
              import math, re

              for ch in ("\u0085", "\u2028", "\u2029", "\ufeff"):
                  # A BOM is allowed only as the very first character.
                  at = text.find(ch, 1 if ch == "\ufeff" else 0)
                  if at >= 0:
                      line = text.count("\n", 0, at) + 1
                      return [(line, at - text.rfind("\n", 0, at), "U+%04X" % ord(ch))]

              def core12(s):
                  # YAML 1.2.2 core schema (section 10.3.2), plain scalars only.
                  if s in ("", "~", "null", "Null", "NULL"):
                      return ("null", None)
                  if s in ("true", "True", "TRUE"):
                      return ("bool", True)
                  if s in ("false", "False", "FALSE"):
                      return ("bool", False)
                  if re.fullmatch(r"[-+]?[0-9]+", s):
                      return ("int", int(s, 10))
                  if re.fullmatch(r"0o[0-7]+", s):
                      return ("int", int(s[2:], 8))
                  if re.fullmatch(r"0x[0-9a-fA-F]+", s):
                      return ("int", int(s[2:], 16))
                  if re.fullmatch(r"[-+]?(\.[0-9]+|[0-9]+(\.[0-9]*)?)([eE][-+]?[0-9]+)?", s):
                      return ("float", float(s))
                  if re.fullmatch(r"[-+]?\.(inf|Inf|INF)", s):
                      return ("float", float(s[0] + "inf") if s[0] in "+-" else float("inf"))
                  if re.fullmatch(r"\.(nan|NaN|NAN)", s):
                      return ("float", "nan")
                  return ("str", s)

              def typed(v):
                  if v is None:
                      return ("null", None)
                  if isinstance(v, bool):
                      return ("bool", v)
                  if isinstance(v, int):
                      return ("int", v)
                  if isinstance(v, float):
                      return ("float", "nan" if math.isnan(v) else v)
                  if isinstance(v, str):
                      return ("str", v)
                  return (type(v).__name__, repr(v))

              try:
                  root = yaml.compose(text, Loader=yaml.SafeLoader)
                  # What the source said, by position: a node records neither its
                  # written tag nor its anchor.
                  written, directives = {}, []
                  for ev in yaml.parse(text, Loader=yaml.SafeLoader):
                      if isinstance(ev, yaml.events.ScalarEvent):
                          written[(ev.start_mark.line, ev.start_mark.column)] = (ev.tag, ev.anchor)
                      elif isinstance(ev, yaml.events.DocumentStartEvent) and ev.version is not None:
                          directives.append((ev.start_mark.line + 1, ev.start_mark.column + 1,
                                             "%%YAML %d.%d" % ev.version))
              except Exception:
                  return []
              if root is None:
                  return []
              build = yaml.constructor.SafeConstructor()

              def value_of(node, tag):
                  if (node.style is None or tag is not None) and len(node.value) > SCALAR_LENGTH_CAP:
                      return ("overlong", len(node.value))
                  try:
                      return typed(build.construct_object(node))
                  except Exception:
                      return ("unconstructable", node.value)

              def where(node):
                  return (node.start_mark.line + 1, node.start_mark.column + 1, node.value)

              found = list(directives)
              top_on = set()
              if isinstance(root, yaml.MappingNode):
                  for k, _ in root.value:
                      if not isinstance(k, yaml.ScalarNode):
                          continue
                      tag, anchor = written.get((k.start_mark.line, k.start_mark.column), (None, None))
                      if k.style is None and k.value == "on" and tag is None:
                          if anchor is None:
                              top_on.add(id(k))
                          else:
                              found.append(where(k))
                          continue
                      if value_of(k, tag) == ("bool", True):
                          found.append(where(k))

              seen, stack = set(), [root]
              while stack:
                  node = stack.pop()
                  if id(node) in seen:
                      continue
                  seen.add(id(node))
                  if isinstance(node, yaml.MappingNode):
                      for k, v in node.value:
                          stack.extend((k, v))
                      continue
                  if isinstance(node, yaml.SequenceNode):
                      stack.extend(node.value)
                      continue
                  if id(node) in top_on:
                      continue
                  tag, _ = written.get((node.start_mark.line, node.start_mark.column), (None, None))
                  mine = value_of(node, tag)
                  # Tags first, whatever the style: `!!int "074"` is quoted.
                  if tag == "!":
                      if mine != ("str", node.value):
                          found.append(where(node))
                      continue
                  if tag is not None:
                      if mine[0] != "str":
                          found.append(where(node))
                      continue
                  if node.style is not None:
                      continue
                  try:
                      theirs = core12(node.value)
                  except ValueError:
                      theirs = ("unbuildable", node.value)
                  if mine != theirs:
                      found.append(where(node))
              return sorted(found)

          def yaml_duplicate_keys(text):
              """Keys of one mapping that construct EQUAL: positions (line, column, text).

              `yaml.safe_load` keeps the LAST of two equal keys, and Python equality
              collides keys YAML keeps apart: the trigger key `on` reads as True, and
              True == 1 == 1.0 == 0x1, so `on:` narrowed plus a later `1:` carrying
              the original trigger builds the same dict as the original -- the first
              key with the last value. A plain duplicate (`timeout-minutes: 1` then
              `timeout-minutes: 60`) is the same last-wins digest. Actions rejects
              duplicate keys, so either way the digest is not what Actions runs.
              Every key is built once into a set per mapping; a key that collides,
              a non-scalar key, or a key that cannot be built or hashed is returned.
              A key over SCALAR_LENGTH_CAP is returned unbuilt. Linear: one composed
              walk, aliases visited once. Unparseable returns []."""
              try:
                  root = yaml.compose(text, Loader=yaml.SafeLoader)
              except Exception:
                  return []
              if root is None:
                  return []
              build = yaml.constructor.SafeConstructor()
              found, seen, stack = [], set(), [root]
              while stack:
                  node = stack.pop()
                  if id(node) in seen:
                      continue
                  seen.add(id(node))
                  if isinstance(node, yaml.SequenceNode):
                      stack.extend(node.value)
                      continue
                  if not isinstance(node, yaml.MappingNode):
                      continue
                  keys = set()
                  for k, v in node.value:
                      stack.extend((k, v))
                      text_of = k.value if isinstance(k, yaml.ScalarNode) else "<non-scalar key>"
                      where = (k.start_mark.line + 1, k.start_mark.column + 1, text_of)
                      if not isinstance(k, yaml.ScalarNode) or len(k.value) > SCALAR_LENGTH_CAP:
                          found.append(where)
                          continue
                      try:
                          key = build.construct_object(k)
                          hash(key)
                      except Exception:
                          found.append(where)
                          continue
                      if key in keys:
                          found.append(where)
                      keys.add(key)
              return sorted(found)

          def surface(text):
              """(workflow_surface, {job_key: job_spec}) or None if unparseable.

              Captures WHOLE mappings, not a chosen list of fields. An earlier revision
              named the fields it thought mattered and silently missed twelve that change
              what a gate executes -- `shell:` (GitHub expands `bash` to
              `bash --noprofile --norc -eo pipefail {0}`, so a custom value drops -e and a
              multi-line `run:` then passes iff its LAST line passes), `defaults.run`,
              workflow- and job-level `env:`, `container:`, `services:`, `outputs:`,
              `environment:`, `working-directory:`, `concurrency:`, step `shell:` and step
              `timeout-minutes:`. That allowlist had exactly the failure mode this file
              condemns in the old GATING allowlist: it fails open for everything nobody
              remembered to add, including Actions syntax that does not exist yet.
              Inverting it means new syntax is captured by default.

              Key order does not survive parsing (canon sorts), so reordering keys does
              not move a digest; anything that reaches the Actions runtime does.

              COMMENTS ARE NOT UNIFORMLY COSMETIC, and an earlier version of this
              paragraph said they were. A YAML-level comment is dropped by the parser and
              moves nothing. A SHELL comment inside a `run:` block scalar is part of that
              scalar's VALUE -- the block scalar IS the shell text -- so editing one moves
              a digest and the PR needs `alters-a-gate` plus a `Gate-Change:` line, not
              the plain declaration.

              WHICH digest depends on the file, and getting this wrong leaves an author
              red with a token that matches nothing. In a WORKFLOW the run: block sits
              inside a job, so the token is `<stem>#<job-key>`. A COMPOSITE ACTION
              (`.github/actions/<name>/action.yml`) has no `jobs:` key at all -- its
              `runs.steps[].run` lands in the WORKFLOW surface -- so the token there is
              `<stem>#workflow`, and `<stem>` is the action's DIRECTORY name.

              One more that is easy to get backwards: a trailing `# ...` on a PLAIN
              `run: cargo test` IS stripped, because that value is a flow scalar; the same
              text inside a `run: |` block is not.

              BEYOND THAT, DO NOT REASON FROM YAML RULES HERE -- READ THE ASSERTIONS.
              Re-indenting a block scalar, and re-wrapping a folded `>` one, are cosmetic
              in some shapes and not in others, and this docstring is a bad place to
              decide which: every attempt to summarise those rules in prose here has been
              WRONG at least once, including three drafts of this very paragraph. The last
              of them claimed a folded re-wrap "can neither reproduce a wider gap", which
              a trailing space before the break does exactly. Prose cannot go red; the
              suite can. The cases are enumerated as executable assertions in
              scripts/tests/ci-integrity/test-surface.py -- read them, or just read the
              guard's own log, which prints the directive lines it actually wants.

              What IS asserted here: the comment rules above, and the token rules in the
              paragraph before them, are measured against the guard's own lifted
              `canon`/`digest`/`surface`/`token` by that suite, so a change to these
              functions that makes one of them false goes red rather than quietly
              misinforming. `token` is lifted for exactly that reason: while it was not,
              deleting its composite-action branch left the suite green while misrouting
              every action author.

              An ABSENT file is ({}, {}) -- every job it had at base then reads as
              removed. A PRESENT but unparseable file is None, which the caller turns into
              a hard error rather than 'nothing changed'."""
              if text is None:
                  return ({}, {})
              try:
                  doc = yaml.safe_load(text)
              except Exception:
                  return None
              if not isinstance(doc, dict):
                  return None
              jobs = doc.get("jobs")
              if jobs is not None and not isinstance(jobs, dict):
                  return None
              # Everything except `jobs` -- `on` (which YAML 1.1 parses as the boolean
              # True), `permissions`, `env`, `defaults`, `concurrency`, and a composite
              # action's `runs:`, all without having to name them.
              wf = {k: v for k, v in doc.items() if k != "jobs"}
              return (wf, {k: v for k, v in (jobs or {}).items()})
          def token(path, leaf):
              """Stable `<stem>#<leaf>` identifier an author writes into the PR body.

              `leaf` is the job KEY, not its display `name:`. Keys are unique by YAML
              construction; display names are not -- two jobs may share one, and the old
              80-char truncation made distinct long names collide, so a single body line
              could authorise two different gate changes."""
              stem = os.path.basename(path)
              for ext in (".yml", ".yaml"):
                  if stem.endswith(ext):
                      stem = stem[: -len(ext)]
              # A composite action is <dir>/action.yml; its directory is the name.
              if stem == "action":
                  stem = os.path.basename(os.path.dirname(path))
              # Collapse whitespace: a newline or tab would forge rows in this TSV and
              # lines in the posted record.
              leaf = " ".join(str(leaf).split())[:120]
              return f"{stem}#{leaf}"
          #: The ONLY non-YAML gating path. Matched EXACTLY: every other path the
          #: trigger hits is a workflow or action file and must parse as YAML, so a
          #: non-YAML file there (a composite action's run.sh, a README) still fails
          #: CLOSED as `!PARSE` rather than being waved through a whole-file compare.
          WHOLE_FILE_GATES = {"scripts/check_untimed_subprocess.py": "check_untimed_subprocess#file"}
          def file_findings(path, base_text, head_text):
              """[(kind, token)] for a WHOLE_FILE_GATES path.

              `scripts/check_untimed_subprocess.py` is gating (it IS
              forbid-untimed-subprocess.yml's whole verdict), but it is Python, so
              surface() cannot parse it -- and a None from surface() is the hard
              `!PARSE` error. Until this existed that made the script UNCHANGEABLE:
              every PR touching it went red with "An unverifiable gate cannot be
              declared away", whatever it declared, while the script itself FAILS any
              PR that links a new crate without adding it to EXPECTED_SCAN_ROOTS. The
              two gates deadlocked every such PR.

              The whole file is the gate surface, compared byte for byte -- there is
              no structure to be cosmetic about, so ANY edit (a comment included) is
              an alteration and needs `alters-a-gate` plus `Gate-Change: <token>`. The
              token is fixed per path in WHOLE_FILE_GATES, never derived, so it cannot
              collide with a `<stem>#<job>` token. Absent at base is a brand-new gate
              (additive, nothing to name); absent at head is `Gate-Removal: <token>`."""
              tok = WHOLE_FILE_GATES[path]
              if base_text is None:
                  return []
              if head_text is None:
                  return [("REMOVED", tok)]
              if base_text != head_text:
                  return [("CHANGED", tok)]
              return []
          def path_findings(path, base_text, head_text):
              """Every finding row (kind, path, token) for ONE hit path.

              The whole per-path decision lives here rather than inline in the loop so
              test-surface.py can lift and exercise it -- including the routing between
              the whole-file and the YAML branch, which is the part a regression would
              silently undo."""
              # A tab or newline in a path would forge a column or a row in this TSV.
              clean = " ".join(str(path).split())
              if path in WHOLE_FILE_GATES:
                  return [(kind, clean, tok) for kind, tok in file_findings(path, base_text, head_text)]
              if head_text is not None and uses_yaml_merge_key(head_text):
                  return [("!MERGE", clean, "-")]
              # Before surface()/digest(), which would walk every alias in full.
              if head_text is not None and yaml_alias_expansion_exceeds(head_text):
                  return [("!ALIASBOMB", clean, "-")]
              # A respelling only YAML 1.1 equates (e.g. `on:` -> `yes:`).
              if head_text is not None and yaml11_divergences(head_text):
                  return [("!YAML11", clean, "-")]
              # Two keys of one mapping that build equal (last-wins, True == 1).
              if head_text is not None and yaml_duplicate_keys(head_text):
                  return [("!DUPKEY", clean, "-")]
              b = surface(base_text)
              h = surface(head_text)
              if b is None or h is None:
                  return [("!PARSE", clean, "-")]
              rows = []
              (b_wf, b_jobs), (h_wf, h_jobs) = b, h
              # A file absent at base is a brand-new gate: additive, not an alteration.
              if b_wf or b_jobs:
                  if digest(b_wf) != digest(h_wf):
                      rows.append(("CHANGED", clean, token(clean, "workflow")))
                  # Two distinct job keys that stringify alike would share one token, so a
                  # single body line would authorise both changes. Refuse instead.
                  seen = {}
                  for key in list(b_jobs) + list(h_jobs):
                      prior = seen.setdefault(str(key), key)
                      if prior != key:
                          rows.append(("!PARSE", clean, "-"))
                          return rows
                  for key, spec in b_jobs.items():
                      if key not in h_jobs:
                          rows.append(("REMOVED", clean, token(clean, key)))
                      elif digest(spec) != digest(h_jobs[key]):
                          rows.append(("CHANGED", clean, token(clean, key)))
              return rows
          def findings_for(path, read):
              """Every finding row for one hit path, read through `read(path, ref)`.
              A file that is not valid UTF-8 at either side is `!UTF8`: strictly
              decoded it cannot be read, and a lossy decode could read two different
              files as one text."""
              texts = {}
              for side, ref in (("base", os.environ["MERGE_BASE"]), ("head", os.environ["HEAD_SHA"])):
                  try:
                      texts[side] = read(path, ref)
                  except UnicodeDecodeError:
                      # The side rides in the token column, for the message below.
                      return [("!UTF8", " ".join(str(path).split()), side)]
              base_text, head_text = texts["base"], texts["head"]
              return path_findings(path, base_text, head_text)
          for path in [p for p in os.environ["HIT_PATHS"].splitlines() if p.strip()]:
              for kind, clean, tok in findings_for(path, content_at):
                  print(f"{kind}{TAB}{clean}{TAB}{tok}")
          PY

          FINDINGS="$(cat "${RUNNER_TEMP}/findings.tsv")"

          if grep -q '^!PARSE' <<< "${FINDINGS}"; then
            echo "::error::Could not parse a gating file at the merge base or head:"
            grep '^!PARSE' <<< "${FINDINGS}" | cut -f2 | sed 's/^/  - /'
            echo "An unverifiable gate cannot be declared away."
            exit 1
          fi
          
          # Merge keys: our parser resolves them and Actions does not document
          # support for them, so a rewritten-but-identical-looking file could be one
          # this repo can no longer run. We do not adjudicate that -- we decline to
          # certify.
          if grep -q '^!MERGE' <<< "${FINDINGS}"; then
            echo "::error::A gating file uses a YAML merge key (<<: or !!merge) at head:"
            grep '^!MERGE' <<< "${FINDINGS}" | cut -f2 | sed 's/^/  - /'
            echo "Merge keys are not documented as supported by GitHub Actions, and this"
            echo "check RESOLVES them -- so a merge-key rewrite can digest as unchanged"
            echo "while the gate stops running. Write the mapping out (anchors and"
            echo "aliases are fine)."
            exit 1
          fi

          # Alias expansion past the budget: digesting the file would walk every
          # alias in full, which a small nested-alias file makes exponential.
          if grep -q '^!ALIASBOMB' <<< "${FINDINGS}"; then
            echo "::error::A gating file's YAML aliases expand past the guard's budget at head:"
            grep '^!ALIASBOMB' <<< "${FINDINGS}" | cut -f2 | sed 's/^/  - /'
            echo "Expanded, it exceeds the expansion budget (nodes plus scalar bytes,"
            echo "ALIAS_EXPANSION_BUDGET) or aliases itself, so it cannot be digested in"
            echo "bounded time. Use fewer nested aliases, or do not alias a large scalar"
            echo "many times."
            exit 1
          fi

          # YAML 1.1 respellings: this check parses YAML 1.1 (PyYAML), Actions parses
          # YAML 1.2, and they disagree on some plain scalars, so a respelled gate can
          # digest as unchanged while Actions reads something else.
          if grep -q '^!YAML11' <<< "${FINDINGS}"; then
            echo "::error::A gating file has scalars or line breaks that YAML 1.1 and 1.2 read differently at head:"
            grep '^!YAML11' <<< "${FINDINGS}" | cut -f2 | sed 's/^/  - /'
            echo "This check parses YAML 1.1 and GitHub Actions is assumed to parse YAML 1.2, so a key or"
            echo "value such as yes/no/on/off, 1:00, 074, 0b1, 6_0 or 1e3, an explicit or '!'"
            echo "tag on a non-string, a U+0085/U+2028/U+2029 line break, a mid-file U+FEFF, a"
            echo "%YAML directive or an over-long plain scalar means one thing"
            echo "here and another to Actions (the top-level 'on:' key is the one exemption)."
            echo "Write a form both read alike (true/false, 60, an untagged quoted string)."
            exit 1
          fi

          # Duplicate keys: PyYAML keeps the last of two equal keys (and Python makes
          # `on`/True, 1 and 1.0 equal), while Actions rejects duplicates.
          if grep -q '^!DUPKEY' <<< "${FINDINGS}"; then
            echo "::error::A gating file has two keys in one mapping that read as equal at head:"
            grep '^!DUPKEY' <<< "${FINDINGS}" | cut -f2 | sed 's/^/  - /'
            echo "This check keeps the LAST of two equal keys (and reads 'on', true, 1 and"
            echo "1.0 as equal) while Actions rejects a duplicate, so the digest is not what"
            echo "Actions runs. Remove the duplicate, or use a key that cannot collide."
            exit 1
          fi

          # Invalid UTF-8: decoded with replacement characters, two different files
          # could read as one text. Decoded strictly, it cannot be digested.
          if grep -q '^!UTF8' <<< "${FINDINGS}"; then
            echo "::error::A gating file is not valid UTF-8 (the side that failed is named):"
            grep '^!UTF8' <<< "${FINDINGS}" | awk -F '\t' '{ print "  - " $2 " (at the " ($3 == "base" ? "merge base" : "PR head") ")" }'
            echo "It cannot be decoded exactly, so it cannot be verified. Save it as UTF-8."
            exit 1
          fi

          # Labels are read LIVE: the event payload's array is stale on a re-run.
          LABELS="$(gh api --paginate "repos/${REPO}/issues/${PR_NUMBER}/labels" --jq '.[].name')"
          DECLARED=""
          if grep -qxF 'ci:gate-change=declared'      <<< "${LABELS}"; then DECLARED="declared"; fi
          if grep -qxF 'ci:gate-change=alters-a-gate' <<< "${LABELS}"; then DECLARED="alters-a-gate"; fi

          if [ -z "${DECLARED}" ]; then
            echo "::error::This PR changes gating workflow(s) without declaring it:"
            printf '%s' "${HIT_PATHS}" | sed 's/^/  - /'
            echo ""
            echo "Declare it, then RE-RUN this job — applying a label does not"
            echo "re-trigger this workflow on its own:"
            # The findings are already computed, so name the declaration that will
            # pass. Printing the weak label for an altered surface only earns a second
            # red (qontinui-runner#2485).
            if [ -n "${FINDINGS}" ]; then
              echo "  gh pr edit ${PR_NUMBER} --add-label 'ci:gate-change=alters-a-gate'"
              echo ""
              echo "and add exactly these line(s) to the PR body:"
              while IFS=$'\t' read -r kind path tok; do
                [ -z "${tok:-}" ] && continue
                case "${kind}" in
                  REMOVED) echo "  Gate-Removal: ${tok}" ;;
                  *)       echo "  Gate-Change: ${tok}"  ;;
                esac
              done <<< "${FINDINGS}"
              echo ""
            else
              echo "  gh pr edit ${PR_NUMBER} --add-label 'ci:gate-change=declared'"
            fi
            echo "An agent applies this itself with gh; no operator and no coord call is needed."
            exit 1
          fi

          # Anything touching an EXISTING gate surface needs the stronger label
          # AND each item named on its own line in the PR body.
          if [ -n "${FINDINGS}" ]; then
            echo "Existing gate surface altered by this PR:"
            while IFS=$'\t' read -r kind path tok; do
              [ -z "${tok:-}" ] && continue
              echo "  ${kind}  ${tok}   (${path})"
            done <<< "${FINDINGS}"
            echo ""

            BODY="$(gh api "repos/${REPO}/pulls/${PR_NUMBER}" --jq '.body // ""')"
            MISSING=""
            while IFS=$'\t' read -r kind path tok; do
              if [ -z "${tok:-}" ]; then
                echo "::error::Internal: a finding carried no token; refusing to pass."
                exit 1
              fi
              case "${kind}" in
                REMOVED) directive="Gate-Removal" ;;
                *)       directive="Gate-Change"  ;;
              esac
              # -x (WHOLE LINE), not a substring. Unanchored, a body naming
              # "Gate-Removal: ci#test-integration" would ALSO satisfy a job
              # called "ci#test"; an HTML comment, or a pasted CI log (which is
              # indented and bulleted), would satisfy it too. CRLF-stripped
              # because GitHub returns PR bodies with CRLF line endings.
              # Herestring, no pipe: a PR body may be 65,536 CHARACTERS, i.e. ~262KB
              # of UTF-8, well past the 64KiB pipe buffer. Piping here fails CLOSED
              # (141 -> ! -> true -> MISSING) rather than open, but that is a false red
              # telling an author to add lines that are already present.
              if ! grep -qxF "${directive}: ${tok}" <<< "${BODY//$'\r'/}"; then
                MISSING="${MISSING}  ${directive}: ${tok}"$'\n'
              fi
            done <<< "${FINDINGS}"

            if [ "${DECLARED}" != "alters-a-gate" ] || [ -n "${MISSING}" ]; then
              echo "::error::This PR alters an existing gate. That needs the stronger"
              echo "label AND each altered item named on its own line in the PR body,"
              echo "so the change is recorded explicitly rather than buried in a diff:"
              echo ""
              echo "  gh pr edit ${PR_NUMBER} --add-label 'ci:gate-change=alters-a-gate'"
              echo ""
              if [ -n "${MISSING}" ]; then
                echo "and add exactly these line(s) to the PR body:"
                printf '%s' "${MISSING}"
                echo ""
              fi
              echo "Then re-run this job. No operator is involved."
              exit 1
            fi
          fi

          # The durable, attributed record — this, not a human click, is what
          # protects the repo, so it is written on every pass path.
          {
            echo "### Gating change — declared and verified"
            echo ""
            echo "Declaration: \`ci:gate-change=${DECLARED}\`"
            echo "Compared \`${MERGE_BASE}\` (merge base) to \`${HEAD_SHA}\` (head)."
            echo ""
            echo "Gating file(s) changed:"
            printf '%s' "${HIT_PATHS}" | sed 's/^/- `/;s/$/`/'
            echo ""
            if [ -n "${FINDINGS}" ]; then
              echo "Existing gate surface altered (each named in the PR body):"
              while IFS=$'\t' read -r kind path tok; do
                [ -z "${tok:-}" ] && continue
                echo "- \`${kind}\` \`${tok}\`"
              done <<< "${FINDINGS}"
            else
              echo "No existing gate surface was altered — this change is purely additive."
            fi
          } > "${RUNNER_TEMP}/notice.md"

          cat "${RUNNER_TEMP}/notice.md" >> "${GITHUB_STEP_SUMMARY}"
          gh pr comment "${PR_NUMBER}" --repo "${REPO}" --body-file "${RUNNER_TEMP}/notice.md"

          echo ""
          echo "Gating change declared, verified and recorded — CI integrity intact."
