name: CI timeout marker selftest

# Pins the in-band job-timeout marker contract (scripts/tests/test_ci_timeout_marker.py).
#
# WHY IT EXISTS. GitHub concludes a JOB-level `timeout-minutes` expiry as
# `cancelled`, never `failure` -- the same conclusion a `cancel-in-progress`
# supersede produces. The Frontend Coverage Producer timed out on 30 of 40 runs
# at its old 45-minute bound and every one read as a supersede. Its fix is
# in-band: a first-step start stamp, a budget-creep tripwire on green runs, and a
# marker step that says in the log whether a cancelled run was a TIMEOUT, an
# external cancel, or UNKNOWN. Those steps carry a literal `JOB_TIMEOUT_MINUTES`
# that must track `timeout-minutes` by hand, and their bodies must never turn a
# missing measurement into a verdict. This selftest executes the SHIPPED bodies
# (extracted from the workflow YAML) against a fake clock and a stubbed `gh`,
# and fails when the lockstep, the `if:` conditions, the stamp position or any
# arm's routing drifts -- and when a carrier is added without its roster row.
#
# Hermetic: no network, no credentials (`gh` is stubbed), so it runs on `push`
# to main as well and therefore has a baseline coord can read.
#
# NOT a merge gate. It tests a diagnostic, so it is deliberately absent from the
# repo ruleset's required contexts. It IS inside ci-integrity.yml's scope
# (`.github/workflows/**`) on a main-based PR, so the PR that adds or edits this
# file needs `ci:gate-change=declared` (see advisory-red-detector.yml's header
# for the full label grammar).

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/tests/test_ci_timeout_marker.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/tests/test_ci_timeout_marker.py"
  workflow_dispatch:

permissions:
  contents: read

# PR-SCOPED SUPERSESSION (shared hosted-job cap relief, 2026-10-05). A FIRST-
# attempt `pull_request` run joins a per-workflow, per-PR group and cancels the
# run it supersedes there: a `synchronize` cancels the older head's run, and a
# `reopened` cancels the same-head run it re-does (coord's ci-abandoned
# recovery is a close+reopen). Every OTHER run -- whichever of push (main,
# develop, merge-candidate*/** -- coord's candidate CI), schedule,
# workflow_dispatch and workflow_run this file has, and EVERY re-run (run_attempt > 1) -- gets a
# group unique to its run id + attempt, so it is never cancelled, never reaped
# while pending, and never queues behind anything.
# The group is ONE expression on purpose: coord models a group template by
# interpolating only `github.event_name` / `github.ref` and collapsing every
# other expression to "" (qontinui-coord ci_observer.rs resolve_group_template),
# and run_is_reaper_at_risk never matches an empty group, so no push run here is
# modelled as reapable by a land. (KNOWN coord gap: the budget-cancel candidate
# scan in stuck_pr_watcher.rs compares groups with `=`, so every "" group
# matches every other one and suppresses its auto re-run; fix belongs in coord.)
# RESIDUAL: two pushes seconds apart can have
# their runs CREATED out of order, so the older head's run cancels the newer
# head's; the next push (or a close+reopen) heals it.
# Pattern: qontinui-claude-config#1475.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  selftest:
    name: CI timeout marker selftest
    runs-on: ubuntu-latest
    # A checkout plus a few dozen short bash invocations.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Test the job-timeout marker and budget tripwire (no network)
        shell: bash
        run: python3 scripts/tests/test_ci_timeout_marker.py
