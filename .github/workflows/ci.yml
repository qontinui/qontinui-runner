name: CI

on:
  push:
    # `merge-candidate/**` etc.: the coord merge engine validates a proposal by
    # pushing the rebased tip to `refs/heads/merge-candidate/<proposal_id>` and
    # waiting for that ref's CI to go green before landing. Without these globs
    # a candidate push matched no trigger, so runner CI never ran for a
    # candidate → coord's awaiting-ci poll of `coord.pr_check_runs` stayed empty
    # → proposals livelocked (the 2026-06-13 runner #566 incident). coord/web
    # already trigger on these; runner was never wired. Runner's CI has no
    # `paths:` filter, so adding the branches here suffices (no separate
    # workflow needed — see plan 2026-06-13-merge-candidate-ci-coverage-...).
    branches:
      - main
      - develop
      - 'merge-candidate/**'
      - 'merge-candidate-spec/**'
      - 'merge-candidate-batch/**'
  pull_request:
    # `session-restore-**`: stacked PRs that target a long-lived integration
    # branch (e.g. `session-restore-redesign`) instead of `main` matched no
    # `pull_request` trigger, so runner CI never ran on them → coord's
    # awaiting-ci poll of `coord.pr_check_runs` stayed empty → the PRs sat at
    # `ci-pending` forever and never auto-landed (runner #651/#652, 2026-06-26).
    # The base-branch filter is matched against the PR's *base*, so the
    # integration branch must be listed here for stacked-PR CI to fire. CI has
    # no `paths:` filter, so adding the branch suffices.
    branches: [main, develop, 'session-restore-**']

env:
  CARGO_TERM_COLOR: always
  # Authenticate the `postgresql_embedded` (bundled) build script's GitHub
  # API calls (it enumerates theseus-rs/postgresql-binaries releases at
  # compile time). Unauthenticated api.github.com is 60 req/hr keyed on the
  # shared GitHub-hosted-runner IP, which the multi-page enumeration blows
  # through → intermittent 403 build failures. The Actions token moves it to
  # the ~1000/hr per-token budget. Plan: 2026-07-04-runner-ci-postgresql-embedded-403-fix.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    strategy:
      # Surface platform-specific failures independently. Default fail-fast
      # cancels ubuntu/windows the moment macos clippy trips, masking
      # whether the linux/win build is actually OK. Now blocked only by
      # genuine per-platform failures.
      fail-fast: false
      matrix:
        # macOS temporarily disabled — PR cycle time was bottlenecked at
        # ~90 min p90 by the mac leg (see step-level timeout discussion
        # below). Joshua does not develop on macOS; re-add `macos-latest`
        # when cross-platform demos / mac users matter.
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      # qontinui-runner's frontend cross-repo deps now resolve via npm
      # (see package.json: @qontinui/* moved from link: to ^x.y.z ranges).
      # The remaining sibling-checkouts are:
      #   - qontinui-schemas: src-tauri/Cargo.toml's `qontinui-types = { path
      #     = "../../qontinui-schemas/rust" }` — Rust publication is deferred
      #     per the cross-repo dep redesign plan.
      #   - qontinui-web: src/lib/spec-registry.ts is auto-generated and
      #     statically imports 14 .spec.uibridge.json files from
      #     qontinui-web/frontend/src/app at typecheck/build time. These are
      #     cross-repo file imports rather than npm deps, so the redesign
      #     doesn't migrate them.
      #   - ui-bridge: the SDK↔runner manifest diff test
      #     (`sdk_manifest_routes_are_exposed_by_runner` in
      #     `mcp/ui_bridge/mod.rs`) reads `UI_BRIDGE_ROUTES` from
      #     `ui-bridge/packages/ui-bridge/src/server/types.ts`. Without this
      #     clone the test hits its "file unreadable, skip" branch and
      #     silently passes, so SDK-vs-runner drift would not be flagged.
      # qontinui-schemas, qontinui-web, and ui-bridge are public org-owned
      # repos; the default github.token authenticates the clone, no PAT needed.
      - name: Checkout sibling repos
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/qontinui/qontinui-web.git
          git clone --depth 1 https://github.com/qontinui/ui-bridge.git
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # Pin matches rust-toolchain.toml (channel = "1.95.0"). The toolchain
      # file overrides any other channel for every cargo invocation, so the
      # rustfmt/clippy components must be installed for 1.95.0 specifically —
      # otherwise `cargo fmt`/`cargo clippy` auto-switch to a component-less
      # 1.95.0 and fail with "'cargo-fmt' is not installed".
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            at-spi2-core

      # Hosted ubuntu runners ship only ~14 GB free on /. This workspace's
      # Rust dep tree (atspi/zbus, image codecs, tree-sitter, sentry) plus the
      # 12 GB swapfile below and the cargo target cache exhaust it — the test
      # compile died writing rmeta with "No space left on device" (2026-06-13,
      # PR #572 first run). Reclaim the preinstalled toolchains we never use
      # (~25-30 GB) BEFORE the swapfile + cache restore so both have headroom.
      # tool-cache/swap-storage/large-packages left intact: setup-node/setup-rust
      # use the tool cache; the swapfile step manages swap itself; and
      # `large-packages: true` cascade-removes GTK/GDK apt libs that the runner's
      # webkit build links against (observed: "system library gdk-3.0 required by
      # crate gdk-sys was not found" — gdk-sys compile fails). android + dotnet +
      # haskell + docker-images alone reclaim ~20 GB, which is ample headroom
      # without touching the apt libs installed above.
      - name: Free disk space (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      # Hosted ubuntu-22.04 / windows-latest both ship with 16 GB RAM and a
      # small default pagefile/swap. `cargo test` peak codegen memory on
      # this workspace exceeds that and the rustc/LLVM allocator dies (on
      # Linux the OOM-killer takes the runner agent down → "shutdown
      # signal … exit code 143"; on Windows rustc-LLVM emits
      # "out of memory" / "Allocation failed" then aborts, surfaced by the
      # OS as exit code 0xc000001d / STATUS_ILLEGAL_INSTRUCTION). Capping
      # CARGO_BUILD_JOBS alone wasn't enough — link is single-threaded.
      # Pre-allocate paging space so the OS can absorb the spike instead
      # of the runner agent dying.
      - name: Add swapfile (Ubuntu — guard against link-time OOM)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== free / df after swap setup ==="
          free -h
          df -h

      # 32 GB (was 16 → 24): headroom for CARGO_BUILD_JOBS=2 in the test step.
      # The May 2026 windows OOMs (runs 25612844640 / 75193978255, PR #65)
      # happened at JOBS=2 with a 16 GB pagefile — two concurrent large-crate
      # rustc codegens exhausted the 16 GB RAM + 16 GB pagefile commit limit.
      # 24 GB made JOBS=2 pass on 2026-07-08 (run 28977560427, test step
      # 37m47s vs the 50-min JOBS=1 baseline), but a week of workspace
      # growth (ci-node module et al.) re-tripped the same signature on
      # 2026-07-16 (run 29531039112: rustc-LLVM OOM compiling the
      # qontinui_runner test binary, exit 0xc000001d). Each failure sat
      # just past the previous ceiling, so 32 GB buys the same +8 GB
      # increment that fixed it last time. Observed pagefile usage right
      # before cargo test is only ~330 MB (2026-07-08 run 28948290993) —
      # the commit spike is transient peak, not steady-state; disk cost on
      # D: is the only cost. If JOBS=2 OOMs again at 32 GB, stop climbing:
      # revert the test step to JOBS=1 and keep this pagefile.
      - name: Configure pagefile (Windows — guard against link-time OOM)
        if: matrix.platform == 'windows-latest'
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 32GB
          maximum-size: 32GB
          disk-root: "D:"

      # macOS: The accessibility (AX) adapter links against system CoreFoundation
      # frameworks which are always available. No additional brew packages needed.
      # Note: AX integration tests require accessibility permissions at runtime,
      # which CI environments typically do not grant. Compilation is unaffected.

      # Swatinem/rust-cache replaces the previous actions/cache stanza, which
      # was broken two ways and never cached a single build artifact:
      #   1. It cached `src-tauri/target/` — but the cargo workspace root is
      #      the REPO root (./Cargo.toml → ./target; see the [workspace]
      #      table), so the cached path never existed. Observed restore was
      #      1-6 s and save ~38 s (registry only) on every 2026-07-08 run.
      #   2. Exact-match key with no restore-keys: any Cargo.lock change was
      #      a total miss even for the registry portion.
      # Measured cost of running cache-less (windows leg, runs 28948290993 /
      # 28947330992 / 28940758985): the full dependency graph compiles THREE
      # times per run — Clippy ~755 check-compiles (~17 min), cargo test
      # ~534 dep compiles (~12 min of the 50-min step), tauri build ~767
      # compiles (~13 min of the 35-min step; its flag set differs from the
      # test step's, so even host proc-macros rebuild). rust-cache keys on
      # toolchain + Cargo.lock + cargo config + job/os, provides prefix
      # restore-keys, and prunes workspace-member artifacts at save time, so
      # dependency artifacts for ALL flag-sets are restored while the
      # workspace's own crates always rebuild from real sources (no stale-
      # artifact flake). NOTE on scoping: GitHub cache is branch-isolated —
      # saves from merge-candidate/* refs are invisible to sibling
      # candidates. The cache that matters is the one saved by `main` runs
      # (every land), which all candidates and PRs can restore.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Workspace root is the repo root: ./Cargo.toml -> ./target
          workspaces: ". -> target"
          # Candidate/PR runs often fail on steps after the Rust compiles
          # succeeded; still save so the next run on the ref stays warm.
          cache-on-failure: true

      # sccache spike — plan 2026-07-13-runner-candidate-ci-windows-throughput
      # Phase 1. A COMPILATION cache for the workspace's OWN crates. rust-cache
      # (above) restores dependency artifacts but PRUNES workspace-member
      # artifacts at save time, so qontinui-runner's crates recompile every run
      # at three differing flag-sets (Clippy / cargo test / tauri build; the
      # cache-comment above measured ~17+12+13 min of that). sccache caches
      # those rustc invocations across steps AND across runs via the GHA backend
      # (same branch-isolation as rust-cache — `main` saves warm candidates/PRs).
      # It COMPOSES WITH rust-cache; it does not replace it.
      #
      # FAIL-OPEN by construction, in THREE parts (the 2026-07-17 red proved the
      # original two were not enough): (1) the install is continue-on-error;
      # (2) RUSTC_WRAPPER is exported ONLY when the sccache binary is present;
      # (3) a preflight probe (below) round-trips the cache backend and UNSETS
      # the wrapper if it can't be reached — so a GHA-cache outage or a mis-wired
      # token can NEVER red a required check (test / seam-gate); the build just
      # falls back to plain rustc. This is a MEASURED SPIKE: compare
      # `sccache --show-stats` hit-rate + step wall-clock against warm rust-cache
      # over >=10 runs before making it load-bearing (a green run != "adopt").
      #
      # SCCACHE_GHA_ENABLED MUST be `env:` on the action step, NOT written to
      # $GITHUB_ENV afterward: the action reads it at eval time and re-exports
      # the GitHub Actions cache token (ACTIONS_RESULTS_URL + ACTIONS_RUNTIME_TOKEN,
      # otherwise invisible to plain run-steps) into $GITHUB_ENV for the compile
      # steps. Setting it after the fact left the auto-started sccache server with
      # no backend, so it fell through to an S3/AWS path and died on
      # "request to AWS EC2 Metadata Services failed" — the spike's original red.
      - name: Install sccache (spike; fail-open)
        id: sccache_install
        continue-on-error: true
        uses: mozilla/sccache-action@v0.0.10
        env:
          SCCACHE_GHA_ENABLED: "true"

      - name: Enable sccache wrapper if available
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1; then
            echo "sccache present: $(command -v sccache) — $(sccache --version 2>/dev/null | head -1)"
            {
              echo "RUSTC_WRAPPER=sccache"
              # sccache cannot cache incremental artifacts; CI is effectively
              # non-incremental anyway, so disabling it lets the cache populate.
              echo "CARGO_INCREMENTAL=0"
              echo "SCCACHE_ERROR_LOG=${RUNNER_TEMP}/sccache.log"
              echo "SCCACHE_LOG=warn"
            } >> "$GITHUB_ENV"
            # NB: do NOT start the server here — this step's process env does not
            # yet carry the GHA backend vars (they land in $GITHUB_ENV for the
            # NEXT step). The server auto-starts in the preflight below, where the
            # backend is fully configured. Starting it here booted it backendless.
          else
            echo "::warning::sccache unavailable — building without a compilation cache (fail-open, rustc direct)."
          fi

      # Preflight probe — the only reliable fail-open guard. RUSTC_WRAPPER +
      # SCCACHE_GHA_ENABLED + the re-exported tokens are all applied by now, so a
      # trivial `sccache rustc` genuinely exercises the backend. If it fails, the
      # wrapper is cleared for every later step (plain rustc, no red); if it
      # succeeds, stats are zeroed so the end-of-job measurement reflects the real
      # build, not this probe.
      - name: sccache preflight (fail-open probe)
        if: env.RUSTC_WRAPPER == 'sccache'
        shell: bash
        run: |
          probe="${RUNNER_TEMP}/sccache_probe.rs"
          err="${RUNNER_TEMP}/sccache_probe.err"
          echo 'pub fn _p() -> u8 { 0 }' > "$probe"
          if sccache rustc --crate-name sccache_probe --crate-type lib "$probe" \
               --out-dir "${RUNNER_TEMP}/sccache_probe_out" 2> "$err"; then
            echo "sccache preflight OK — backend reachable, wrapper stays active."
            sccache --zero-stats >/dev/null 2>&1 || true
          else
            echo "::warning::sccache preflight FAILED — disabling the wrapper for this run (fail-open, plain rustc). Backend error:"
            sed 's/^/  sccache-probe: /' "$err" 2>/dev/null || true
            # Clear the wrapper for all subsequent steps and stop the bad server.
            echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
            sccache --stop-server >/dev/null 2>&1 || true
          fi

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend code
        run: pnpm run lint

      # Typecheck before the bundler runs. Fails fast on consumer-side
      # camelCase / deny_unknown_fields drift from qontinui-schemas before
      # paying for `vite build`. Closes Item 4 of the
      # schemas-camelcase-cascade-2026-04-18 plan.
      - name: Typecheck frontend code
        run: pnpm run typecheck

      # Frontend unit tests (vitest). Until 2026-06-03 nothing in CI ran the
      # vitest suite, so frontend-logic regressions (e.g. the
      # ui-bridge-auto@0.1.6 regression-generator field drift that broke
      # generateRegressionSuite for every IR, or the specs.compile guard
      # silently walking an empty directory) merged green and rotted on main.
      # Runs after typecheck (cheap fail-fast first) and before the vite
      # build / cargo steps.
      - name: Run frontend unit tests
        run: pnpm test

      # Build the frontend before any cargo step. tauri::generate_context!()
      # in src-tauri/src/lib.rs reads tauri.conf.json at compile time and
      # panics if frontendDist (../dist) is missing — which broke `Clippy
      # check`, `Run Rust tests`, and `Build Tauri app` on every platform.
      - name: Build frontend
        run: pnpm run build

      - name: Format Rust code check
        run: |
          cd src-tauri
          cargo fmt -- --check

      - name: Clippy check
        # Plain `cargo clippy` (no `-D warnings`): lint levels come solely from
        # src-tauri/Cargo.toml [lints.clippy]. T1 correctness/suspicious groups
        # are `deny` there, so a correctness lint still exits non-zero and fails
        # this required check; T3 style/complexity/perf stay `warn` (emitted,
        # non-blocking). See plan 2026-07-05-lint-tiers-and-diff-scoped-gates.
        env:
          # Disable the sccache spike wrapper for clippy ONLY. `cargo clippy`
          # invokes `sccache clippy-driver … -vV`, but sccache can only front
          # rustc — it dies on the clippy-driver version probe (exit 2 → cargo
          # exit 101), which red-flagged this required check on the 2026-07-17
          # spike. clippy produces no cacheable rustc artifacts anyway, so
          # unwrapping it loses zero cache benefit. An empty RUSTC_WRAPPER is
          # treated as unset by cargo; the test/tauri-build steps keep sccache.
          RUSTC_WRAPPER: ""
        run: |
          cd src-tauri
          cargo clippy

      - name: Run Rust tests
        # Accessibility integration tests that require a real desktop session are
        # skipped in CI. Only pure unit tests (no system dependencies) run here.
        #
        # Step has a hard 90-minute timeout. Empirical durations from
        # main-branch runs on 2026-05-11/12 (10-run sample): Ubuntu p50
        # ~43 min, Windows p50 ~70 min, macOS p50 ~58 min / p90 ~70 min /
        # max(success) ~72 min. The earlier 75-min cap sat at p90+5 min;
        # PR #104 and PR #105 (both content-trivial — terminal-sessions
        # endpoint additions / JSON spec) blew it three times in 36 h
        # with `Run Rust tests` landing at 75.2 / 75.4 / 75.5 min.
        # Variance is dominated by GitHub-hosted macOS runner load +
        # cache state (cold-cache runs land at 65-72 min, warm-cache at
        # 30-40 min). 90 min = p90 + 20 min headroom covers the slow
        # tail without hiding genuine regressions. The original cap
        # rationale ("fail fast on swap-thrash hangs") is preserved —
        # JOBS=1 below prevents the 80+ min swap-thrash scenario from
        # PR #84, so the cap is just bounding normal variance now.
        timeout-minutes: 90
        env:
          # `auth::tests::test_device_id_*` and `test_token_storage` exercise
          # `AuthManager::get_device_id` / `store_tokens`, which fall through
          # to `keyring::Entry::{get,set}_password()` when file storage is
          # empty (the test helper wipes the storage file). On macOS GitHub
          # runners the Keychain blocks indefinitely waiting for a permission
          # dialog (no TTY/desktop session), hanging the three tests past
          # cargo's per-test heartbeat — the entire test step then eats the
          # 90-min budget. Bumping the step timeout only delays the hang.
          # The fix is to skip the keychain-backup path in CI entirely: see
          # `keychain_enabled()` in `src-tauri/src/auth.rs`, which
          # short-circuits all keychain ops when this var is set. File
          # storage remains the source of truth, so auth tests stay real
          # integration tests against the encrypted file backend.
          QONTINUI_DISABLE_KEYCHAIN: "1"
          # `CARGO_BUILD_JOBS` reduces the parallel-rustc memory peak.
          # Empirically:
          #   - Windows: was passing at JOBS=2 with a 16 GB pagefile (run
          #     25336049561), but cumulative dep growth through PRs #59-#62
          #     pushed peak past the threshold — runs 25612844640 +
          #     75193978255 (PR #65) both OOM'd with `rustc-LLVM ERROR:
          #     out of memory / Allocation failed`, exit `0xc000001d`
          #     (STATUS_ILLEGAL_INSTRUCTION = the rustc allocator
          #     aborting). Dropped to JOBS=1 for single-threaded compile,
          #     matching Ubuntu's mitigation.
          #     2026-07-08: back to JOBS=2 on Windows, paired with the
          #     pagefile bump 16→24 GB above (the failed JOBS=2 runs were at
          #     16 GB commit headroom; +8 GB targets exactly that failure
          #     mode). Evidence JOBS=1 is far too conservative today: the
          #     `Clippy check` and `Build Tauri app` steps in this same job
          #     compile the SAME full dep graph at cargo's DEFAULT
          #     parallelism (4 jobs) and have not OOM'd — only this step was
          #     pinned. JOBS=1 also starves rustc's internal codegen
          #     parallelism via the jobserver: the post-dep phase
          #     (workspace-crate codegen + test-binary links) measured
          #     ~38 min of the 50-min step (run 28948290993: last dep
          #     compile 14:31, `Finished` 15:09). If 0xc000001d /
          #     rustc-LLVM OOM recurs here, revert to JOBS=1 AND keep the
          #     24 GB pagefile.
          #   - Ubuntu OOM-killer is harsher: even with a 12 GB swapfile,
          #     JOBS=2 still trips the runner-agent shutdown. Drop Ubuntu
          #     to JOBS=1 for a single-threaded compile.
          #   - macOS: GitHub-hosted M1/aarch64 runners ship with only
          #     7 GB RAM (confirmed via `sysctl hw.memsize` in the
          #     pre-test diagnostic) — NOT 16 GB like ubuntu/windows.
          #     The older "fatter runner" comment was wrong. With
          #     JOBS=4 the peak from two parallel large-crate rustc
          #     invocations (qontinui_runner_lib + wrappers_mcp)
          #     exceeds RAM and macOS swap-thrashes indefinitely (no
          #     OOM-killer like Linux). PR #84's macOS leg hung 80+
          #     min mid-compile before admin-cancel. PR #86 first
          #     tried JOBS=2 — also still swap-pressured, hit the 45-
          #     min timeout. JOBS=1 matches ubuntu/windows: one rustc
          #     at a time, ~no swap pressure, slower wall-clock but
          #     deterministic.
          CARGO_BUILD_JOBS: ${{ matrix.platform == 'windows-latest' && '2' || '1' }}
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "=== free / df before cargo test ==="
            free -h
            df -h
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "=== Windows memory state before cargo test ==="
            powershell -NoProfile -Command "Get-CimInstance Win32_PageFileUsage | Format-List *; Get-CimInstance Win32_OperatingSystem | Select-Object FreePhysicalMemory,TotalVisibleMemorySize,TotalVirtualMemorySize,FreeVirtualMemory | Format-List"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "=== macOS memory state before cargo test ==="
            sysctl -n hw.memsize | awk '{print "physical RAM:", $1/1024/1024/1024, "GB"}'
            vm_stat
            df -h
          fi
          cd src-tauri
          cargo test --verbose
        shell: bash

      - name: Live AI extractor smoke
        # Single live API call per PR — Haiku 4.5, ~$0.001 each. Ubuntu-only so the
        # 3-platform matrix doesn't 3x the cost for no extra signal. continue-on-error
        # is true because Haiku output is non-deterministic; we want the signal
        # without flake-blocking PRs.
        #
        # The secret presence check runs INSIDE the shell, not in `if:` — the
        # `secrets` context is not available to step-level `if:` (only job-level
        # `if:` and step `env:`/`run:`/`with:`). Setting an empty env var is
        # safe; we early-exit before invoking cargo.
        if: matrix.platform == 'ubuntu-22.04'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret not set — skipping live AI smoke test."
            exit 0
          fi
          cd src-tauri
          cargo test --bin qontinui-runner -- --ignored --exact \
            util::path_extraction::tests::test_extract_paths_via_ai_real_call
        continue-on-error: true

      - name: Build Tauri app (development)
        # @tauri-apps/cli 2.11 changes that affect this step:
        #   1. Args after `--` are forwarded straight to `cargo build`, which
        #      rejects `--debug` (cargo's default profile, not a flag). So
        #      `--debug` must be parsed by tauri CLI directly — no `--`.
        #   2. `createUpdaterArtifacts: true` in tauri.conf.json now forces
        #      updater signing at bundle time even when `pubkey: ""`, failing
        #      the build with "A public key has been found, but no private
        #      key." CI doesn't ship artifacts, so skip bundling entirely with
        #      `--no-bundle` — compilation + link is the sanity gate we want.
        run: pnpm run tauri build --debug --no-bundle

      # sccache spike measurement — the whole point of this PR. Captures the
      # cumulative hit-rate across all three Rust compile passes (Clippy /
      # cargo test / tauri build) for THIS run. `if: always()` so it still
      # reports when an earlier compile step failed; continue-on-error so it
      # never affects the job verdict. Read "Compile requests" vs "Cache hits"
      # per platform across >=10 runs; only adopt sccache if the warm hit-rate
      # + step wall-clock beats warm rust-cache (plan Phase 1.1 spike gate).
      - name: sccache stats (spike measurement)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if command -v sccache >/dev/null 2>&1 && [ "${RUSTC_WRAPPER:-}" = "sccache" ]; then
            echo "=== sccache stats (${{ matrix.platform }}) ==="
            sccache --show-stats || true
          else
            echo "sccache not active this run (fail-open path) — no stats."
          fi

      # SDK↔runner behavior-contract gate. Boots the just-built debug exe
      # supervisor-free (`-DirectExe`), walks every UI_BRIDGE_ROUTES entry from
      # the sibling ui-bridge clone, and asserts the shape contracts the offline
      # manifest tests can't see. Windows-only: the runner is Windows-primary
      # and the WebView2 render `frontendReady:true` needs is a Windows surface.
      # Reuses `target/debug/qontinui-runner.exe` from the step above
      # (built from src-tauri, so `.cargo/config.toml`'s /STACK:8388608 applies
      # — no separate cargo build, no 0xc00000fd stack-overflow). `-Profile ci`
      # skips the two model-loading routes (extract/describe) that need
      # llama-swap, absent in CI. This step doubles as the Phase-0 WebView2
      # probe: if it fails at WebView2 init, the fallback is a parallel hosted
      # windows job (per the plan), not a blocker for the script mode.
      #
      # DB-LESS BOOT (QONTINUI_ALLOW_NO_DB=1): the runner used to HARD-PANIC at
      # main.rs:419 when it couldn't reach PostgreSQL, so this job previously
      # compiled pgvector from source and stood up a local PG cluster (~highest-
      # variance step in the gate) just to let the runner boot for a route-shape
      # smoke that needs no DB *rows*. The runner now supports a flag-gated
      # degraded boot: with QONTINUI_ALLOW_NO_DB=1 it builds an unverified PG
      # pool, skips connectivity + self-provision, and serves a clean 503 on the
      # known DB-backed routes (crate::mcp::pg_guard) while the control/vision/
      # contract surfaces stay fully functional. The contract smoke walks those
      # surfaces, so no database is provisioned here at all. Prod is unaffected:
      # without the flag the runner still fail-fasts on an unreachable PG.
      # See plans/2026-06-07-runner-degraded-no-db-boot-and-dbless-ci.md.
      - name: SDK↔runner contract smoke (direct-exe)
        if: matrix.platform == 'windows-latest'
        env:
          QONTINUI_ALLOW_NO_DB: "1"
        run: powershell -File scripts/contract-smoke.ps1 -DirectExe target/debug/qontinui-runner.exe -Profile ci -SdkTypesPath ../ui-bridge/packages/ui-bridge/src/server/types.ts
        shell: bash

  # Gating frontend unit-test lane (vitest).
  #
  # The matrix `test` job above also runs `pnpm test`, but it is wedged between
  # the heavy Rust/Tauri steps (sibling clones, swapfile, ~40-70 min cargo) and
  # only completes after that whole leg. A frontend-logic regression therefore
  # can't fail fast and the signal is entangled with cargo flakiness/timeouts.
  # This standalone job runs ONLY the frontend toolchain (pnpm install + vitest)
  # on ubuntu-latest in ~1-2 min, giving a fast independent gate. It deliberately
  # does NOT clone sibling repos or install the Rust toolchain: the vitest suite
  # imports @qontinui/* exclusively from npm (see vitest.config.ts — the stale
  # sibling-repo aliases were removed) and never reads the auto-generated
  # src/lib/spec-registry.ts (that static import is a typecheck/build concern,
  # not a test-time one). 764 tests across 64 files all pass on main as of this
  # job's introduction, so it is born green and is a real required check.
  frontend-tests:
    name: Frontend unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Mirror the matrix job's frontend setup EXACTLY: pnpm 10.33.2, node 20,
      # pnpm cache keyed on the root lockfile, frozen-lockfile install.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test

  # Phase 3 / F2 — debug test-fixtures seam gate.
  #
  # The `mcp::test_fixtures` module (the `/ui-bridge/test/*` session-injection
  # seam used by the manual-UI acceptance harness) must NEVER compile into a
  # production release build. It is gated by
  # `#[cfg(any(debug_assertions, feature = "test-fixtures"))]` in three places.
  # The honest "binary does not contain the route string" check needs a full
  # `cargo build --release` (~30 min) which this repo's CI deliberately omits
  # (the test job builds `--debug --no-bundle`). So we enforce the gate at
  # SOURCE level here: a fast (seconds, no cargo) grep that the three cfg
  # anchors are intact. Deleting any one of them — which is exactly how the
  # seam would leak into release — fails this job. A complementary set of
  # Rust unit tests (`module_cfg_gate_is_first_non_comment_line` &c. in
  # test_fixtures.rs) asserts the same anchors from inside the debug test leg;
  # this job additionally holds if the whole module is ever removed.
  seam-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Assert test-fixtures seam stays cfg-gated out of release builds
        shell: bash
        run: |
          set -euo pipefail
          # PCRE patterns — parens MUST be escaped (unescaped they're capture
          # groups and the literal source text never matches).
          gate_outer='#\[cfg\(any\(debug_assertions, feature = "test-fixtures"\)\)\]'

          fail=0

          # 1. Module-level inner attribute must be the first significant line
          #    of test_fixtures.rs. NOTE: `-m1` (not `| head -n1`) — under
          #    `pipefail`, head quitting after one line SIGPIPEs grep and
          #    fails the job with exit 2 before any anchor is checked.
          tf=src-tauri/src/mcp/test_fixtures.rs
          first=$(grep -m1 -vE '^\s*(//|$)' "$tf")
          if [ "$first" != '#![cfg(any(debug_assertions, feature = "test-fixtures"))]' ]; then
            echo "::error file=$tf::module cfg gate missing or not the first significant line (got: $first)"
            fail=1
          fi

          # 2. `pub mod test_fixtures;` in mcp/mod.rs must be cfg-gated on the
          #    line directly above it.
          if ! grep -Pzo "$gate_outer\r?\n\s*pub mod test_fixtures;" src-tauri/src/mcp/mod.rs >/dev/null; then
            echo "::error file=src-tauri/src/mcp/mod.rs::pub mod test_fixtures; is not immediately preceded by the cfg gate"
            fail=1
          fi

          # 3. The routes() merge in mcp_api.rs must be cfg-gated on the line
          #    directly above it.
          if ! grep -Pzo "$gate_outer\r?\n\s*let base_router = base_router.merge\(crate::mcp::test_fixtures::routes\(\)\);" src-tauri/src/mcp_api.rs >/dev/null; then
            echo "::error file=src-tauri/src/mcp_api.rs::test_fixtures::routes() merge is not immediately preceded by the cfg gate"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Debug test-fixtures seam gate FAILED — the /ui-bridge/test/* injection seam could leak into a release build."
            exit 1
          fi
          echo "Debug test-fixtures seam gate OK — all three cfg anchors intact."

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # cargo audit walks the workspace and resolves path: deps. The runner's
      # src-tauri/Cargo.toml depends on `qontinui-types` from a sibling repo.
      # Same multi-checkout pattern as the test job. Frontend link: deps have
      # moved to npm so ui-bridge no longer needs cloning here.
      - name: Checkout sibling repos
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git

      - name: Run security audit on Rust dependencies
        # Cargo.lock lives at the workspace root (./Cargo.lock), not under
        # src-tauri/. cargo-audit doesn't auto-walk to the workspace root,
        # so --file points it at the right lockfile.
        #
        # --ignore RUSTSEC-2023-0071: Marvin Attack timing sidechannel in
        # rsa 0.9.x, pulled in transitively by adb_client v3 (ADB device
        # auth). Upstream advisory says "No fixed upgrade is available!".
        # Threat model is mitigated for desktop ADB host-side use:
        # attacker would need physical/local access AND the ability to
        # drive many timing-measured auth attempts. Revisit when rsa
        # ships a fix or adb_client switches RSA implementations.
        #
        # --ignore RUSTSEC-2026-0194 + RUSTSEC-2026-0195: two quick-xml
        # < 0.41 DoS advisories published together on 2026-07-02 (quadratic
        # attribute-duplicate check; unbounded NsReader namespace-declaration
        # allocation). The tree carries FOUR quick-xml versions
        # (0.30/0.37/0.38/0.39), all pinned transitively by the tauri/gtk
        # stack — none upgradeable to 0.41 from this repo. The runner does
        # not parse untrusted network XML through these paths (build-time
        # manifests/plists). These are the ONLY two quick-xml advisories in
        # the DB as of 2026-07-02. Revisit when tauri/gtk bump to >= 0.41.
        run: |
          # --locked: install cargo-audit against its OWN bundled Cargo.lock.
          # Without it, cargo resolves cargo-audit's transitive deps to latest
          # compatible, which pulled in kstring 2.0.3 (MSRV rustc 1.96.0) on
          # 2026-07-14 — that fails to compile on CI's pinned 1.95.0 toolchain
          # and reds this job on every PR (an upstream ecosystem drift, not a
          # runner vulnerability). --locked pins to cargo-audit's tested deps.
          cargo install cargo-audit --locked
          cargo audit --file Cargo.lock --ignore RUSTSEC-2023-0071 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate || true

