name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      # Surface platform-specific failures independently. Default fail-fast
      # cancels ubuntu/windows the moment macos clippy trips, masking
      # whether the linux/win build is actually OK. Now blocked only by
      # genuine per-platform failures.
      fail-fast: false
      matrix:
        # macOS temporarily disabled — PR cycle time was bottlenecked at
        # ~90 min p90 by the mac leg (see step-level timeout discussion
        # below). Joshua does not develop on macOS; re-add `macos-latest`
        # when cross-platform demos / mac users matter.
        platform: [ubuntu-22.04, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      # qontinui-runner's frontend cross-repo deps now resolve via npm
      # (see package.json: @qontinui/* moved from link: to ^x.y.z ranges).
      # The remaining sibling-checkouts are:
      #   - qontinui-schemas: src-tauri/Cargo.toml's `qontinui-types = { path
      #     = "../../qontinui-schemas/rust" }` — Rust publication is deferred
      #     per the cross-repo dep redesign plan.
      #   - qontinui-web: src/lib/spec-registry.ts is auto-generated and
      #     statically imports 14 .spec.uibridge.json files from
      #     qontinui-web/frontend/src/app at typecheck/build time. These are
      #     cross-repo file imports rather than npm deps, so the redesign
      #     doesn't migrate them.
      #   - ui-bridge: the SDK↔runner manifest diff test
      #     (`sdk_manifest_routes_are_exposed_by_runner` in
      #     `mcp/ui_bridge/mod.rs`) reads `UI_BRIDGE_ROUTES` from
      #     `ui-bridge/packages/ui-bridge/src/server/types.ts`. Without this
      #     clone the test hits its "file unreadable, skip" branch and
      #     silently passes, so SDK-vs-runner drift would not be flagged.
      # qontinui-schemas, qontinui-web, and ui-bridge are public org-owned
      # repos; the default github.token authenticates the clone, no PAT needed.
      - name: Checkout sibling repos
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/qontinui/qontinui-web.git
          git clone --depth 1 https://github.com/qontinui/ui-bridge.git
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # Pin matches rust-toolchain.toml (channel = "1.95.0"). The toolchain
      # file overrides any other channel for every cargo invocation, so the
      # rustfmt/clippy components must be installed for 1.95.0 specifically —
      # otherwise `cargo fmt`/`cargo clippy` auto-switch to a component-less
      # 1.95.0 and fail with "'cargo-fmt' is not installed".
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            at-spi2-core

      # Hosted ubuntu-22.04 / windows-latest both ship with 16 GB RAM and a
      # small default pagefile/swap. `cargo test` peak codegen memory on
      # this workspace exceeds that and the rustc/LLVM allocator dies (on
      # Linux the OOM-killer takes the runner agent down → "shutdown
      # signal … exit code 143"; on Windows rustc-LLVM emits
      # "out of memory" / "Allocation failed" then aborts, surfaced by the
      # OS as exit code 0xc000001d / STATUS_ILLEGAL_INSTRUCTION). Capping
      # CARGO_BUILD_JOBS alone wasn't enough — link is single-threaded.
      # Pre-allocate paging space so the OS can absorb the spike instead
      # of the runner agent dying.
      - name: Add swapfile (Ubuntu — guard against link-time OOM)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== free / df after swap setup ==="
          free -h
          df -h

      - name: Configure pagefile (Windows — guard against link-time OOM)
        if: matrix.platform == 'windows-latest'
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 16GB
          disk-root: "D:"

      # macOS: The accessibility (AX) adapter links against system CoreFoundation
      # frameworks which are always available. No additional brew packages needed.
      # Note: AX integration tests require accessibility permissions at runtime,
      # which CI environments typically do not grant. Compilation is unaffected.

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend code
        run: pnpm run lint

      # Typecheck before the bundler runs. Fails fast on consumer-side
      # camelCase / deny_unknown_fields drift from qontinui-schemas before
      # paying for `vite build`. Closes Item 4 of the
      # schemas-camelcase-cascade-2026-04-18 plan.
      - name: Typecheck frontend code
        run: pnpm run typecheck

      # Frontend unit tests (vitest). Until 2026-06-03 nothing in CI ran the
      # vitest suite, so frontend-logic regressions (e.g. the
      # ui-bridge-auto@0.1.6 regression-generator field drift that broke
      # generateRegressionSuite for every IR, or the specs.compile guard
      # silently walking an empty directory) merged green and rotted on main.
      # Runs after typecheck (cheap fail-fast first) and before the vite
      # build / cargo steps.
      - name: Run frontend unit tests
        run: pnpm test

      # Build the frontend before any cargo step. tauri::generate_context!()
      # in src-tauri/src/lib.rs reads tauri.conf.json at compile time and
      # panics if frontendDist (../dist) is missing — which broke `Clippy
      # check`, `Run Rust tests`, and `Build Tauri app` on every platform.
      - name: Build frontend
        run: pnpm run build

      - name: Format Rust code check
        run: |
          cd src-tauri
          cargo fmt -- --check

      - name: Clippy check
        run: |
          cd src-tauri
          cargo clippy -- -D warnings

      - name: Run Rust tests
        # Accessibility integration tests that require a real desktop session are
        # skipped in CI. Only pure unit tests (no system dependencies) run here.
        #
        # Step has a hard 90-minute timeout. Empirical durations from
        # main-branch runs on 2026-05-11/12 (10-run sample): Ubuntu p50
        # ~43 min, Windows p50 ~70 min, macOS p50 ~58 min / p90 ~70 min /
        # max(success) ~72 min. The earlier 75-min cap sat at p90+5 min;
        # PR #104 and PR #105 (both content-trivial — terminal-sessions
        # endpoint additions / JSON spec) blew it three times in 36 h
        # with `Run Rust tests` landing at 75.2 / 75.4 / 75.5 min.
        # Variance is dominated by GitHub-hosted macOS runner load +
        # cache state (cold-cache runs land at 65-72 min, warm-cache at
        # 30-40 min). 90 min = p90 + 20 min headroom covers the slow
        # tail without hiding genuine regressions. The original cap
        # rationale ("fail fast on swap-thrash hangs") is preserved —
        # JOBS=1 below prevents the 80+ min swap-thrash scenario from
        # PR #84, so the cap is just bounding normal variance now.
        timeout-minutes: 90
        env:
          # `auth::tests::test_device_id_*` and `test_token_storage` exercise
          # `AuthManager::get_device_id` / `store_tokens`, which fall through
          # to `keyring::Entry::{get,set}_password()` when file storage is
          # empty (the test helper wipes the storage file). On macOS GitHub
          # runners the Keychain blocks indefinitely waiting for a permission
          # dialog (no TTY/desktop session), hanging the three tests past
          # cargo's per-test heartbeat — the entire test step then eats the
          # 90-min budget. Bumping the step timeout only delays the hang.
          # The fix is to skip the keychain-backup path in CI entirely: see
          # `keychain_enabled()` in `src-tauri/src/auth.rs`, which
          # short-circuits all keychain ops when this var is set. File
          # storage remains the source of truth, so auth tests stay real
          # integration tests against the encrypted file backend.
          QONTINUI_DISABLE_KEYCHAIN: "1"
          # `CARGO_BUILD_JOBS` reduces the parallel-rustc memory peak.
          # Empirically:
          #   - Windows: was passing at JOBS=2 with a 16 GB pagefile (run
          #     25336049561), but cumulative dep growth through PRs #59-#62
          #     pushed peak past the threshold — runs 25612844640 +
          #     75193978255 (PR #65) both OOM'd with `rustc-LLVM ERROR:
          #     out of memory / Allocation failed`, exit `0xc000001d`
          #     (STATUS_ILLEGAL_INSTRUCTION = the rustc allocator
          #     aborting). Dropped to JOBS=1 for single-threaded compile,
          #     matching Ubuntu's mitigation.
          #   - Ubuntu OOM-killer is harsher: even with a 12 GB swapfile,
          #     JOBS=2 still trips the runner-agent shutdown. Drop Ubuntu
          #     to JOBS=1 for a single-threaded compile.
          #   - macOS: GitHub-hosted M1/aarch64 runners ship with only
          #     7 GB RAM (confirmed via `sysctl hw.memsize` in the
          #     pre-test diagnostic) — NOT 16 GB like ubuntu/windows.
          #     The older "fatter runner" comment was wrong. With
          #     JOBS=4 the peak from two parallel large-crate rustc
          #     invocations (qontinui_runner_lib + wrappers_mcp)
          #     exceeds RAM and macOS swap-thrashes indefinitely (no
          #     OOM-killer like Linux). PR #84's macOS leg hung 80+
          #     min mid-compile before admin-cancel. PR #86 first
          #     tried JOBS=2 — also still swap-pressured, hit the 45-
          #     min timeout. JOBS=1 matches ubuntu/windows: one rustc
          #     at a time, ~no swap pressure, slower wall-clock but
          #     deterministic.
          CARGO_BUILD_JOBS: 1
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            echo "=== free / df before cargo test ==="
            free -h
            df -h
          elif [ "$RUNNER_OS" = "Windows" ]; then
            echo "=== Windows memory state before cargo test ==="
            powershell -NoProfile -Command "Get-CimInstance Win32_PageFileUsage | Format-List *; Get-CimInstance Win32_OperatingSystem | Select-Object FreePhysicalMemory,TotalVisibleMemorySize,TotalVirtualMemorySize,FreeVirtualMemory | Format-List"
          elif [ "$RUNNER_OS" = "macOS" ]; then
            echo "=== macOS memory state before cargo test ==="
            sysctl -n hw.memsize | awk '{print "physical RAM:", $1/1024/1024/1024, "GB"}'
            vm_stat
            df -h
          fi
          cd src-tauri
          cargo test --verbose
        shell: bash

      - name: Live AI extractor smoke
        # Single live API call per PR — Haiku 4.5, ~$0.001 each. Ubuntu-only so the
        # 3-platform matrix doesn't 3x the cost for no extra signal. continue-on-error
        # is true because Haiku output is non-deterministic; we want the signal
        # without flake-blocking PRs.
        #
        # The secret presence check runs INSIDE the shell, not in `if:` — the
        # `secrets` context is not available to step-level `if:` (only job-level
        # `if:` and step `env:`/`run:`/`with:`). Setting an empty env var is
        # safe; we early-exit before invoking cargo.
        if: matrix.platform == 'ubuntu-22.04'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY secret not set — skipping live AI smoke test."
            exit 0
          fi
          cd src-tauri
          cargo test --bin qontinui-runner -- --ignored --exact \
            util::path_extraction::tests::test_extract_paths_via_ai_real_call
        continue-on-error: true

      - name: Build Tauri app (development)
        # @tauri-apps/cli 2.11 changes that affect this step:
        #   1. Args after `--` are forwarded straight to `cargo build`, which
        #      rejects `--debug` (cargo's default profile, not a flag). So
        #      `--debug` must be parsed by tauri CLI directly — no `--`.
        #   2. `createUpdaterArtifacts: true` in tauri.conf.json now forces
        #      updater signing at bundle time even when `pubkey: ""`, failing
        #      the build with "A public key has been found, but no private
        #      key." CI doesn't ship artifacts, so skip bundling entirely with
        #      `--no-bundle` — compilation + link is the sanity gate we want.
        run: pnpm run tauri build --debug --no-bundle

  # Gating frontend unit-test lane (vitest).
  #
  # The matrix `test` job above also runs `pnpm test`, but it is wedged between
  # the heavy Rust/Tauri steps (sibling clones, swapfile, ~40-70 min cargo) and
  # only completes after that whole leg. A frontend-logic regression therefore
  # can't fail fast and the signal is entangled with cargo flakiness/timeouts.
  # This standalone job runs ONLY the frontend toolchain (pnpm install + vitest)
  # on ubuntu-latest in ~1-2 min, giving a fast independent gate. It deliberately
  # does NOT clone sibling repos or install the Rust toolchain: the vitest suite
  # imports @qontinui/* exclusively from npm (see vitest.config.ts — the stale
  # sibling-repo aliases were removed) and never reads the auto-generated
  # src/lib/spec-registry.ts (that static import is a typecheck/build concern,
  # not a test-time one). 764 tests across 64 files all pass on main as of this
  # job's introduction, so it is born green and is a real required check.
  frontend-tests:
    name: Frontend unit tests (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      # Mirror the matrix job's frontend setup EXACTLY: pnpm 10.33.2, node 20,
      # pnpm cache keyed on the root lockfile, frozen-lockfile install.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        run: pnpm test

  # Phase 3 / F2 — debug test-fixtures seam gate.
  #
  # The `mcp::test_fixtures` module (the `/ui-bridge/test/*` session-injection
  # seam used by the manual-UI acceptance harness) must NEVER compile into a
  # production release build. It is gated by
  # `#[cfg(any(debug_assertions, feature = "test-fixtures"))]` in three places.
  # The honest "binary does not contain the route string" check needs a full
  # `cargo build --release` (~30 min) which this repo's CI deliberately omits
  # (the test job builds `--debug --no-bundle`). So we enforce the gate at
  # SOURCE level here: a fast (seconds, no cargo) grep that the three cfg
  # anchors are intact. Deleting any one of them — which is exactly how the
  # seam would leak into release — fails this job. A complementary set of
  # Rust unit tests (`module_cfg_gate_is_first_non_comment_line` &c. in
  # test_fixtures.rs) asserts the same anchors from inside the debug test leg;
  # this job additionally holds if the whole module is ever removed.
  seam-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Assert test-fixtures seam stays cfg-gated out of release builds
        shell: bash
        run: |
          set -euo pipefail
          # PCRE patterns — parens MUST be escaped (unescaped they're capture
          # groups and the literal source text never matches).
          gate_outer='#\[cfg\(any\(debug_assertions, feature = "test-fixtures"\)\)\]'

          fail=0

          # 1. Module-level inner attribute must be the first significant line
          #    of test_fixtures.rs. NOTE: `-m1` (not `| head -n1`) — under
          #    `pipefail`, head quitting after one line SIGPIPEs grep and
          #    fails the job with exit 2 before any anchor is checked.
          tf=src-tauri/src/mcp/test_fixtures.rs
          first=$(grep -m1 -vE '^\s*(//|$)' "$tf")
          if [ "$first" != '#![cfg(any(debug_assertions, feature = "test-fixtures"))]' ]; then
            echo "::error file=$tf::module cfg gate missing or not the first significant line (got: $first)"
            fail=1
          fi

          # 2. `pub mod test_fixtures;` in mcp/mod.rs must be cfg-gated on the
          #    line directly above it.
          if ! grep -Pzo "$gate_outer\r?\n\s*pub mod test_fixtures;" src-tauri/src/mcp/mod.rs >/dev/null; then
            echo "::error file=src-tauri/src/mcp/mod.rs::pub mod test_fixtures; is not immediately preceded by the cfg gate"
            fail=1
          fi

          # 3. The routes() merge in mcp_api.rs must be cfg-gated on the line
          #    directly above it.
          if ! grep -Pzo "$gate_outer\r?\n\s*let base_router = base_router.merge\(crate::mcp::test_fixtures::routes\(\)\);" src-tauri/src/mcp_api.rs >/dev/null; then
            echo "::error file=src-tauri/src/mcp_api.rs::test_fixtures::routes() merge is not immediately preceded by the cfg gate"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "Debug test-fixtures seam gate FAILED — the /ui-bridge/test/* injection seam could leak into a release build."
            exit 1
          fi
          echo "Debug test-fixtures seam gate OK — all three cfg anchors intact."

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # cargo audit walks the workspace and resolves path: deps. The runner's
      # src-tauri/Cargo.toml depends on `qontinui-types` from a sibling repo.
      # Same multi-checkout pattern as the test job. Frontend link: deps have
      # moved to npm so ui-bridge no longer needs cloning here.
      - name: Checkout sibling repos
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git

      - name: Run security audit on Rust dependencies
        # Cargo.lock lives at the workspace root (./Cargo.lock), not under
        # src-tauri/. cargo-audit doesn't auto-walk to the workspace root,
        # so --file points it at the right lockfile.
        #
        # --ignore RUSTSEC-2023-0071: Marvin Attack timing sidechannel in
        # rsa 0.9.x, pulled in transitively by adb_client v3 (ADB device
        # auth). Upstream advisory says "No fixed upgrade is available!".
        # Threat model is mitigated for desktop ADB host-side use:
        # attacker would need physical/local access AND the ability to
        # drive many timing-measured auth attempts. Revisit when rsa
        # ships a fix or adb_client switches RSA implementations.
        run: |
          cargo install cargo-audit
          cargo audit --file Cargo.lock --ignore RUSTSEC-2023-0071

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate || true
