name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # qontinui-runner has cross-repo deps to two sibling repos:
      #   - frontend eslint config imports `@qontinui/ui-bridge-eslint-plugin`
      #     (link: protocol via pnpm, points at ../ui-bridge/packages/...)
      #   - src-tauri/Cargo.toml has `qontinui-types = { path = "../../qontinui-schemas/rust" }`
      # CI must clone both as siblings before pnpm install / cargo build.
      # Both repos are public; no auth needed.
      - name: Checkout sibling repos
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/ui-bridge.git
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            at-spi2-core

      # macOS: The accessibility (AX) adapter links against system CoreFoundation
      # frameworks which are always available. No additional brew packages needed.
      # Note: AX integration tests require accessibility permissions at runtime,
      # which CI environments typically do not grant. Compilation is unaffected.

      - name: Cache Rust dependencies
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint frontend code
        run: pnpm run lint

      - name: Format Rust code check
        run: |
          cd src-tauri
          cargo fmt -- --check

      - name: Clippy check
        run: |
          cd src-tauri
          cargo clippy -- -D warnings

      - name: Run Rust tests
        # Accessibility integration tests that require a real desktop session are
        # skipped in CI. Only pure unit tests (no system dependencies) run here.
        run: |
          cd src-tauri
          cargo test --verbose

      - name: Build frontend
        run: pnpm run build

      - name: Build Tauri app (development)
        run: pnpm run tauri build -- --debug

  security:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # cargo audit walks the workspace and resolves path: deps. The runner's
      # src-tauri/Cargo.toml depends on `qontinui-types` from a sibling repo.
      # Same multi-checkout pattern as the test job.
      - name: Checkout sibling repos
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/qontinui/ui-bridge.git

      - name: Run security audit on Rust dependencies
        run: |
          cargo install cargo-audit
          cd src-tauri
          cargo audit

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Run pnpm audit
        run: pnpm audit --audit-level=moderate || true
