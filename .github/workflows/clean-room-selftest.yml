name: Clean-room harness selftest

# The offline half of the clean-room acceptance run (plan
# 2026-09-20-the-published-product-works-without-knowing-a-development-environment-exists,
# Phase E): scripts/tests/test_clean_room.py, at PR time.
#
# The run itself is a nightly/release job in published-parity.yml on a
# GitHub-hosted Windows box; its unit tests run first there too. They also run
# HERE, on every PR that touches the harness, so a change that would turn an
# `unknown` into a `pass`, miss a planted fleet noun, or let a dirty box through
# the preflight is caught before it lands rather than on the next night.
#
# The fleet-noun vocabulary and the NextActionKind enum are read from the
# qontinui-schemas sibling (checked out through the shared action, so a
# declared adaptation PR is honoured); the test FAILS, never skips, when they
# are absent.
#
# NOT a merge gate: deliberately absent from the ruleset's required contexts,
# like the harness it tests. Hermetic apart from the sibling checkout.

on:
  push:
    branches: [main]
    paths:
      - "scripts/clean_room/**"
      - "scripts/tests/test_clean_room.py"
      - "scripts/tests/fixtures/clean_room_fake_runner.py"
      - ".github/workflows/clean-room-selftest.yml"
      - ".github/workflows/published-parity.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/clean_room/**"
      - "scripts/tests/test_clean_room.py"
      - "scripts/tests/fixtures/clean_room_fake_runner.py"
      - ".github/workflows/clean-room-selftest.yml"
      - ".github/workflows/published-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: Clean-room harness selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Check out sibling qontinui-schemas
        uses: ./.github/actions/checkout-sibling

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The fixture's failing test is only proven failing when Go is present;
      # without it that one test skips. Pin the toolchain so it always runs.
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Clean-room harness unit tests (no network)
        shell: bash
        run: python3 scripts/tests/test_clean_room.py
