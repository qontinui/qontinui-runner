name: Clippy tiers

# T3 lint tiering jobs — plan 2026-07-05-lint-tiers-and-diff-scoped-gates.
#
# Kept in a DEDICATED workflow (not ci.yml) on purpose: adding `schedule:` to
# ci.yml would fire its whole unguarded job matrix (test ubuntu+windows, etc.)
# every night, since those jobs have no event guard. Isolating the nightly +
# diff-scoped clippy jobs here means only these run on the cron / on PRs.
on:
  pull_request:
    branches: [main, develop, 'session-restore-**']
  # Nightly cron drives `clippy-nightly-unscoped` (whole-tree, all-targets) so
  # test-module / untouched-file lint rot is surfaced loudly on a schedule
  # rather than ambushing an unrelated PR at push time.
  schedule:
    - cron: '23 7 * * *'
  # On-demand trigger for the nightly unscoped clippy sweep.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# PR-SCOPED SUPERSESSION (shared hosted-job cap relief, 2026-10-05). A FIRST-
# attempt `pull_request` run joins a per-workflow, per-PR group and cancels the
# run it supersedes there: a `synchronize` cancels the older head's run, and a
# `reopened` cancels the same-head run it re-does (coord's ci-abandoned
# recovery is a close+reopen). Every OTHER run -- whichever of push (main,
# develop, merge-candidate*/** -- coord's candidate CI), schedule,
# workflow_dispatch and workflow_run this file has, and EVERY re-run (run_attempt > 1) -- gets a
# group unique to its run id + attempt, so it is never cancelled, never reaped
# while pending, and never queues behind anything.
# The group is ONE expression on purpose: coord models a group template by
# interpolating only `github.event_name` / `github.ref` and collapsing every
# other expression to "" (qontinui-coord ci_observer.rs resolve_group_template),
# and run_is_reaper_at_risk never matches an empty group, so no push run here is
# modelled as reapable by a land.
# RESIDUAL: two pushes seconds apart can have
# their runs CREATED out of order, so the older head's run cancels the newer
# head's; the next push (or a close+reopen) heals it.
# Pattern: qontinui-claude-config#1475.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  # Nightly UNSCOPED clippy sweep. The per-PR ubuntu `Clippy check` step in
  # ci.yml runs plain `cargo clippy` (default target only, levels from
  # Cargo.toml); ci.yml's `clippy-windows` runs `--all-targets` per PR, so
  # shared and cfg(windows) test code is already linted there, and THIS job is
  # the only all-targets pass over Linux-only (cfg(unix)) test code in the
  # src-tauri package. This job supplies whole-tree coverage on a schedule:
  # `--all-targets` compiles #[cfg(test)] modules too, surfacing warn-tier rot
  # loudly once a day
  # (and on-demand via workflow_dispatch) without gating any PR. It is allowed to
  # fail on its own to make rot visible; it is NOT a required check and blocks
  # nothing. Runs on schedule/manual only.
  clippy-nightly-unscoped:
    name: Clippy nightly (unscoped, all-targets)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      # Same sibling checkouts the matrix `test` job needs: qontinui-schemas
      # for the `qontinui-types` path dep, and (for --all-targets test compile)
      # ui-bridge for the SDK↔runner manifest diff test source.
      - name: Check out sibling qontinui-schemas
        uses: ./.github/actions/checkout-sibling

      - name: Checkout sibling repos
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-web.git
          git clone --depth 1 https://github.com/qontinui/ui-bridge.git
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      # Bounded against a job-time apt hang — see the rationale on the same
      # step in .github/workflows/ci.yml, where one cost qontinui-runner 3h45m
      # of merge-train throughput on 2026-08-19.
      # Sizing: 11 successful runs of this nightly job, 2026-08-09..08-19:
      # p50 32s, max 50s outside the 08-19 apt incident (150s inside it).
      # 10 min = ~19x the healthy median (~12x its max), matching the bound on the identical
      # package list in ci.yml so the two do not drift apart.
      - name: Install dependencies (Ubuntu)
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            at-spi2-core

      - name: Free disk space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Add swapfile (Ubuntu — guard against link-time OOM)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # Swatinem/rust-cache, matching ci.yml. The `actions/cache` stanza this
      # replaces was the same one ci.yml documents at its own cache step as
      # "broken two ways and never cached a single build artifact":
      #   1. It cached `src-tauri/target/`, but the cargo workspace root is the
      #      REPO root (./Cargo.toml holds the [workspace] table → ./target), so
      #      that path never existed. Observed on run 30211607823: the step
      #      restored 112 MB — the cargo registry alone, zero build artifacts.
      #   2. Exact-match key with no restore-keys, so any Cargo.lock change was
      #      a total miss even for the registry portion.
      # ci.yml was migrated off it; these two jobs were left behind.
      #
      # `shared-key` is load-bearing. rust-cache keys on `github.job` by
      # default, so without it this nightly (the only job here that may save —
      # `schedule` runs on main) and `clippy-diff` would sit in separate cache
      # scopes and clippy-diff would restore nothing at all.
      #
      # `cache-targets: false` is deliberate, not an oversight. The repo's
      # Actions cache sits at ~95% of the 10 GB cap, and the entries that gate
      # the merge train are ci.yml's ~2.2 GB main-scoped rust caches — the ones
      # PR #792's `save-if` exists to stop candidate/PR runs from evicting.
      # Neither job in this workflow is a required check, so they must not buy
      # their own speedup with the cap main's caches depend on. Revisit only if
      # `gh api repos/qontinui/qontinui-runner/actions/cache/usage` shows real
      # headroom.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Workspace root is the repo root: ./Cargo.toml -> ./target
          workspaces: ". -> target"
          shared-key: clippy-tiers
          cache-targets: false
          # Same policy as ci.yml (PR #792): save from main only. This job runs
          # on main via `schedule`, so it is what populates the cache; the
          # clippy-diff PR runs restore it and never save.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri::generate_context!() reads ../dist at compile time; clippy compiles
      # the crate, so the frontend must be built first (same as the matrix job).
      - name: Build frontend
        run: pnpm run build

      - name: Clippy (unscoped, all-targets)
        # No `-D warnings`: report rot, don't deny-block the world. Levels come
        # from Cargo.toml; --all-targets adds the Linux test-module coverage no
        # per-PR gate has (the ubuntu PR leg lints the default target; at
        # default parallelism its --all-targets run exhausted the hosted runner
        # on qontinui-runner#2392). A deny-tier lint anywhere in the tree still
        # fails this job (by design — that's the loud signal), but this job
        # gates no PR.
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          cd src-tauri
          cargo clippy --all-targets

  # DIFF-SCOPED T3 style gate (reviewdog). Runs plain `cargo clippy` with JSON
  # output and pipes it through reviewdog with -filter-mode=diff_context so it
  # comments/fails ONLY on findings introduced on the lines this PR changed —
  # style rot elsewhere in the tree is ignored. This is the T3 mechanism: warn-
  # tier lints (style/complexity/perf) stay non-blocking globally but a NEW one
  # you introduce is surfaced on your diff. DEFAULT TARGET ONLY: a warn-tier
  # lint added in #[cfg(test)] code gets no annotation here (ci.yml's
  # `clippy-windows` prints it without blocking, and fails on deny-tier ones).
  #
  # ADVISORY / NOT A REQUIRED CHECK — do NOT add to required-status-checks or
  # branch protection. Promote to required only after burn-in (plan Phase 2).
  # Being non-required guarantees it cannot wedge the coord merge train even if
  # reviewdog misbehaves.
  #
  # NOT LIVE-VERIFIED at authoring time: reviewdog's clippy errorformat +
  # diff_context behavior on this Tauri crate — treat the first live PR run as
  # the verification; keep it non-required until confirmed green-and-useful.
  clippy-diff:
    name: Clippy diff-scoped (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
      checks: write

    # Every step before the `clippy` (reviewdog) step needs an `id`, a matching
    # `O_*` env entry and a `row` line in the final "Declare a setup death"
    # step -- a setup step without them fails silently (no annotation).
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v5

      - name: Check out sibling qontinui-schemas
        id: sibling_schemas
        uses: ./.github/actions/checkout-sibling

      - name: Checkout sibling repos
        id: sibling_repos
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-web.git
          git clone --depth 1 https://github.com/qontinui/ui-bridge.git
        shell: bash

      - name: Setup pnpm
        id: setup_pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        id: setup_rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      # Pinned, not `latest`: the orphan-completion step below reads
      # reviewdog's stderr for `failed to create check` / `failed to post` /
      # `check-runs/<id>`, wording checked against v0.21.2 (the version
      # qontinui-coord's ci.yml pins). Re-check that wording, and
      # complete-orphaned-check-runs.sh's markers, on any bump.
      - name: Setup reviewdog
        id: setup_reviewdog
        uses: reviewdog/action-setup@d8a7baabd7f3e8544ee4dbde3ee41d0011c3a93f # v1
        with:
          reviewdog_version: v0.21.2

      # Bounded against a job-time apt hang — see the rationale on the same
      # step in .github/workflows/ci.yml.
      # Sizing: 76 successful runs of this job, 2026-08-08..08-20. Outside the
      # 08-18..08-20 apt incident (n=52): p50 33s, p90 44s, max 75s. Inside it
      # the tail is 115 / 185 / 226 / 273 / 318 / 367 / 750 / 981 / 2754s.
      # 10 min = ~13x the healthy p90, matching ci.yml's bound on the identical
      # package list.
      - name: Install dependencies (Ubuntu)
        id: apt
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            at-spi2-core

      - name: Free disk space (Ubuntu)
        id: free_disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Add swapfile (Ubuntu — guard against link-time OOM)
        id: swapfile
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # Same migration as the nightly job above — see its comment for why the
      # replaced `actions/cache` stanza cached nothing. `shared-key` puts this
      # job in the nightly's cache scope so it RESTORES what the nightly saved
      # from main; `save-if` then evaluates false on every `pull_request` run,
      # so this job never adds a save against the 10 GB repo cache cap. That is
      # PR #792's policy applied here: restore unrestricted, save from main only.
      - name: Cache Rust dependencies
        id: rust_cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: clippy-tiers
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        id: pnpm_install
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        id: pnpm_build
        run: pnpm run build

      - name: Clippy diff-scoped via reviewdog
        id: clippy
        # Capture clippy JSON to a file first so cargo's non-zero exit (a deny
        # lint) does NOT abort the step under `set -eo pipefail` before
        # reviewdog runs — reviewdog owns the pass/fail decision here, scoped to
        # the diff. `-filter-mode=diff_context` = fail only on findings on
        # changed lines; `-fail-on-error=true` makes those diff findings fail
        # THIS (advisory, non-required) check only.
        #
        # Outputs whenever this shell exits (a normal end, a death under
        # `set -e`, a SIGTERM/SIGINT from a cancel; not a SIGKILL or a runner
        # death, which write nothing and read as unknown, while a helper that
        # cannot be sourced writes rc=not-run-source-failed), for the completion
        # step below: `rc`
        # (reviewdog's exit status; `unknown` when the step dies before
        # reviewdog returns), `started_at` / `ended_at` (the window a
        # `clippy-diff` run of this job's reviewdog must have STARTED in, on
        # GitHub's clock; a run outside it belongs to another workflow run on
        # the same head -- a re-run gets its own concurrency group here),
        # `clock` and `stderr_log` (reviewdog's stderr, whose `failed to post`
        # / `check-runs/<id>` lines say whether it finished its run). Written
        # by the sourced helper .github/scripts/reviewdog-step-outputs.sh,
        # whose header is the contract and whose test checks every output read
        # below; it is vendored from qontinui-coord and pinned with the other
        # copies (see the completion step). The step still exits with
        # reviewdog's status, so its pass/fail is unchanged.
        env:
          CARGO_BUILD_JOBS: 1
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A helper that cannot be sourced writes no trap, so say so here:
          # rc=not-run-source-failed tells the completion step reviewdog never
          # ran. Exit 1 as before -- the failure is real and must be seen.
          source .github/scripts/reviewdog-step-outputs.sh || {
            echo "rc=not-run-source-failed" >> "$GITHUB_OUTPUT"
            echo "::warning title=reviewdog-step-outputs::.github/scripts/reviewdog-step-outputs.sh could not be sourced; reviewdog did not run"
            exit 1
          }
          rso_begin "${RUNNER_TEMP}/reviewdog-clippy-diff.stderr"
          cd src-tauri
          cargo clippy --message-format=json > clippy-report.json 2>/dev/null || true
          # rso_run marks the window's start, captures reviewdog's stderr for
          # the completion step and replays it into this log (after reviewdog
          # returns, not interleaved), and sets rc only once reviewdog has
          # returned -- a cancel mid-reviewdog leaves `unknown`, never a pass.
          rso_run reviewdog \
            -f=clippy \
            -name="clippy-diff" \
            -filter-mode=diff_context \
            -reporter=github-pr-check \
            -fail-on-error=true \
            < clippy-report.json
          exit "$rc"
        shell: bash

      # reviewdog CREATES the `clippy-diff` check run through the API and
      # completes it with a later PATCH. When that PATCH fails, the run stays
      # `in_progress` for good: nothing else ever completes it, and the PR's
      # check page says CI is still running when nothing is. On
      # qontinui-coord#4159, rust-ci job 132648536974 logged `reviewdog:
      # failed to post result: PATCH .../check-runs/132651515896: 404 Not
      # Found` at 01:06:21.105Z, about 1 s after the step started at
      # 01:06:20.22Z (log line 4367; verified by an independent reviewer's
      # read of that job's log on 2026-11-17, and recorded in coord finding
      # c58cd00f-7651-4dde-bd3d-d69fcc59f291; likely cause: read-after-write
      # lag at GitHub, a hypothesis). That finding also records that coord
      # held qontinui-coord#4159 and #4053 at block_reason_code ci-pending
      # with the orphan as the only non-terminal check (plan
      # 2026-11-16-finish-session-refuses-a-finish-whose-only-owed-pr-is-ci-pending,
      # Phase 2b). Here a reviewdog failure already reds THIS job, so this step
      # only completes the orphaned run as `neutral` -- with a summary naming
      # reviewdog's rc and this job -- and leaves the job's own red to report
      # the failure. It acts only when reviewdog itself reported that it did
      # not finish its run (`failed to create check` / `failed to post` /
      # `check-runs/<id>` in its stderr), or when the step ended before
      # reviewdog returned: a clean reviewdog exit -- 0, or 1 for diff
      # findings -- and a skipped step make no API call at all. It aims at
      # the run THIS job's reviewdog created: the id
      # in reviewdog's own failure line when there is one, otherwise a listing
      # limited to `github-actions` runs that started inside reviewdog's
      # window, read from GitHub's clock. A concurrent run on the same head
      # whose reviewdog overlapped that window can still be a candidate; the
      # window narrows that case, it does not exclude it (the script's header
      # states exactly what is guaranteed, and what happens when a bound is
      # unknown). Each run is read again before every PATCH; a run completed
      # as of that re-read (by reviewdog, pass or fail) is not PATCHed, though
      # one a concurrent job completes between the re-read and the PATCH can
      # still be overwritten. Advisory:
      # the script retries a 404, a 5xx, a secondary rate limit and a
      # connection-class failure with a bounded backoff and otherwise warns
      # and exits 0, and `continue-on-error` covers a failure in the script
      # itself. It needs the checkout, so it runs only when that succeeded.
      #
      # This script, reviewdog-step-outputs.sh (sourced by the reviewdog step
      # above) and their two tests are VENDORED byte-identical from
      # qontinui-coord (canonical copies: qontinui-coord .github/scripts/, same
      # names), the way secret-scan.yml vendors fetch-gitleaks.sh. Their sha256s live in
      # ONE file, .github/scripts/complete-orphaned-check-runs.sha256, which this
      # step and the test step below both check; update it with the copies.
      # That pin catches only an edit to a copy made without updating the pin.
      # It is NOT a drift or security control against coord's canonical copy:
      # a copy that falls behind coord, with the pin updated alongside, passes.
      # A scheduled drift check against coord is out of scope here. A mismatch
      # in this step only skips the completion (with a warning); the test step
      # below is the one that reds on it.
      - name: Complete an orphaned clippy-diff check run
        if: always() && github.event_name == 'pull_request' && steps.checkout.outcome == 'success'
        continue-on-error: true
        # The script bounds itself: each gh call is capped at 25 s (20 s plus
        # a 5 s kill), retry sleeps share a 30 s budget, and -- since the
        # calls are not capped by that budget -- it starts no new API call
        # after 180 s of wall clock, warns and exits 0, so it ends in about
        # 215 s at most. This timeout is a backstop that should never fire.
        timeout-minutes: 4
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          STEP_RC: ${{ steps.clippy.outputs.rc }}
          STEP_OUTCOME: ${{ steps.clippy.outcome }}
          REVIEWDOG_STARTED_AT: ${{ steps.clippy.outputs.started_at }}
          REVIEWDOG_ENDED_AT: ${{ steps.clippy.outputs.ended_at }}
          REVIEWDOG_CLOCK: ${{ steps.clippy.outputs.clock }}
          REVIEWDOG_STDERR_LOG: ${{ steps.clippy.outputs.stderr_log }}
          JOB_CHECK_RUN_ID: ${{ job.check_run_id }}
        run: |
          if ! sha256sum -c --quiet .github/scripts/complete-orphaned-check-runs.sha256; then
            echo "::warning title=complete-orphaned-check-runs does not match its sha256 pin::a vendored copy was changed without updating .github/scripts/complete-orphaned-check-runs.sha256, so no orphaned clippy-diff run was completed."
            exit 0
          fi
          # Which API client the script will use: gh where it is installed,
          # else curl with GH_TOKEN. Printed so a run's log shows it.
          if command -v gh >/dev/null 2>&1; then
            gh --version | head -n 1
          else
            echo "gh is not on PATH on this runner; complete-orphaned-check-runs.sh falls back to curl with GH_TOKEN"
          fi
          bash .github/scripts/complete-orphaned-check-runs.sh \
            "$GITHUB_REPOSITORY" "$HEAD_SHA" "clippy-diff" \
            "the reviewdog step ended with outcome '${STEP_OUTCOME:-unknown}'"
        shell: bash

      # The vendored scripts' own fixture tests, byte-identical to coord's
      # (canonical: qontinui-coord .github/scripts/test-complete-orphaned-check-runs.sh
      # and test-reviewdog-step-outputs.sh; the second also checks that every
      # steps.clippy.outputs.* read in this file is one the helper writes).
      # Hermetic (a stub gh and curl, an injected sleep), seconds on this
      # existing hosted job. All four files are checked against
      # complete-orphaned-check-runs.sha256 (see the step above for what that
      # pin does and does not catch); a mismatch reds this advisory check, as
      # secret-scan.yml's pin does for fetch-gitleaks.sh. `!cancelled()` so
      # its verdict stands even when clippy or a setup step failed; it needs
      # only the checkout. A failure here is a verdict on this PR (the
      # vendored copy or its pin), so it is deliberately NOT one of the setup
      # steps the next step names.
      - name: Orphaned check-run completion tests
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          sha256sum -c --quiet .github/scripts/complete-orphaned-check-runs.sha256 \
            || { echo "::error title=complete-orphaned-check-runs pin mismatch::a vendored copy was changed without updating .github/scripts/complete-orphaned-check-runs.sha256; copy the files from qontinui-coord and regenerate that file."; exit 1; }
          bash .github/scripts/test-complete-orphaned-check-runs.sh
          bash .github/scripts/test-reviewdog-step-outputs.sh

      # A setup death is NOT a verdict on this PR (plan
      # 2026-11-05-repair-classifier-reads-why-a-check-failed, Phase 3) -- but
      # only when this PR cannot have caused it (plan
      # 2026-11-17-runner-clippy-setup-death-guards-frontend-steps). When a
      # step BEFORE clippy fails, .github/scripts/declare-setup-death.sh titles
      # an annotation with the literal phrase "(not a verdict on this PR)" --
      # coord's repair classifier (author_feedback.rs is_no_verdict_annotation)
      # matches it and re-runs once instead of blaming the PR's code. It
      # withholds that title (a notice instead) when the PR touches this job's
      # harness, when a step that reads the PR's frontend tree died on a PR
      # that changed a frontend input, whenever the sibling resolver died (it
      # reads live labels on this PR and on sibling PRs that name it, which no
      # step here can see), or when any of that is unreadable. Each row is
      # `<name> <conclusion> <class>`; the class says what of the PR that step
      # reads. Outcomes arrive via env only; names are static literals.
      # A failed Checkout is declared inline: the script never arrived.
      # Accepted residual: a PR can itself fail checkout (a path too long for
      # the runner's filesystem) and would still be declared here.
      - name: Declare a setup death (not a verdict on this PR)
        if: failure()
        timeout-minutes: 3
        env:
          O_CHECKOUT: ${{ steps.checkout.conclusion }}
          O_SIBLING_SCHEMAS: ${{ steps.sibling_schemas.conclusion }}
          O_SIBLING_REPOS: ${{ steps.sibling_repos.conclusion }}
          O_SETUP_PNPM: ${{ steps.setup_pnpm.conclusion }}
          O_SETUP_NODE: ${{ steps.setup_node.conclusion }}
          O_SETUP_RUST: ${{ steps.setup_rust.conclusion }}
          O_SETUP_REVIEWDOG: ${{ steps.setup_reviewdog.conclusion }}
          O_APT: ${{ steps.apt.conclusion }}
          O_FREE_DISK: ${{ steps.free_disk.conclusion }}
          O_SWAPFILE: ${{ steps.swapfile.conclusion }}
          O_RUST_CACHE: ${{ steps.rust_cache.conclusion }}
          O_PNPM_INSTALL: ${{ steps.pnpm_install.conclusion }}
          O_PNPM_BUILD: ${{ steps.pnpm_build.conclusion }}
          O_CLIPPY: ${{ steps.clippy.conclusion }}
          DECLARE_JOB: Clippy diff-scoped (advisory)
          # rust-toolchain.toml steers rustup in the workspace (Setup Rust).
          HARNESS_PATHS_RE: '^(\.github/(workflows/clippy-tiers\.yml|actions/|sibling-pins\.conf)|rust-toolchain(\.toml)?$)'
        shell: bash
        run: |
          if [ "$O_CHECKOUT" = "failure" ]; then
            echo "::error title=Clippy diff-scoped (advisory) SETUP FAILED (not a verdict on this PR)::step 'Checkout' failed before clippy ran (a checkout failure caused by this PR's own tree is an accepted residual): re-run once"
            exit 0
          fi
          if [ ! -f .github/scripts/declare-setup-death.sh ]; then
            echo "::notice title=Clippy diff-scoped (advisory) setup death left as a verdict::.github/scripts/declare-setup-death.sh is absent from the checkout"
            exit 0
          fi
          row() { printf '%s\t%s\t%s\n' "$1" "$2" "$3"; }
          SETUP_STEPS="$(
            row 'Checkout' "$O_CHECKOUT" tree-free
            row 'Check out sibling qontinui-schemas' "$O_SIBLING_SCHEMAS" sibling-labels
            row 'Checkout sibling repos' "$O_SIBLING_REPOS" tree-free
            row 'Setup pnpm' "$O_SETUP_PNPM" frontend
            row 'Setup Node.js' "$O_SETUP_NODE" frontend
            row 'Setup Rust' "$O_SETUP_RUST" tree-free
            row 'Setup reviewdog' "$O_SETUP_REVIEWDOG" tree-free
            row 'Install dependencies (Ubuntu)' "$O_APT" tree-free
            row 'Free disk space (Ubuntu)' "$O_FREE_DISK" tree-free
            row 'Add swapfile (Ubuntu — guard against link-time OOM)' "$O_SWAPFILE" tree-free
            # rust-cache reads the PR's Cargo manifests via cargo metadata but
            # reports its own errors without failing the step, hence tree-free.
            row 'Cache Rust dependencies' "$O_RUST_CACHE" tree-free
            row 'Install frontend dependencies' "$O_PNPM_INSTALL" frontend
            row 'Build frontend' "$O_PNPM_BUILD" frontend
          )"
          VERDICT_STEPS="$(printf '%s\t%s\n' 'Clippy diff-scoped via reviewdog' "$O_CLIPPY")"
          export SETUP_STEPS VERDICT_STEPS
          bash .github/scripts/declare-setup-death.sh || echo "::notice::declare-setup-death.sh exited $? (a reporter never decides this check)"
