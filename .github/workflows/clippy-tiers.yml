name: Clippy tiers

# T3 lint tiering jobs — plan 2026-07-05-lint-tiers-and-diff-scoped-gates.
#
# Kept in a DEDICATED workflow (not ci.yml) on purpose: adding `schedule:` to
# ci.yml would fire its whole unguarded job matrix (test ubuntu+windows, etc.)
# every night, since those jobs have no event guard. Isolating the nightly +
# diff-scoped clippy jobs here means only these run on the cron / on PRs.
on:
  pull_request:
    branches: [main, develop, 'session-restore-**']
  # Nightly cron drives `clippy-nightly-unscoped` (whole-tree, all-targets) so
  # test-module / untouched-file lint rot is surfaced loudly on a schedule
  # rather than ambushing an unrelated PR at push time.
  schedule:
    - cron: '23 7 * * *'
  # On-demand trigger for the nightly unscoped clippy sweep.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Nightly UNSCOPED clippy sweep. The per-PR `Clippy check` step in ci.yml runs
  # plain `cargo clippy` (default target only, levels from Cargo.toml) so it
  # never ambushes an unrelated PR with test-module / whole-tree lint rot. This
  # job restores that whole-tree coverage on a schedule instead: `--all-targets`
  # compiles #[cfg(test)] modules too, surfacing warn-tier rot loudly once a day
  # (and on-demand via workflow_dispatch) without gating any PR. It is allowed to
  # fail on its own to make rot visible; it is NOT a required check and blocks
  # nothing. Runs on schedule/manual only.
  clippy-nightly-unscoped:
    name: Clippy nightly (unscoped, all-targets)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v5

      # Same sibling checkouts the matrix `test` job needs: qontinui-schemas
      # for the `qontinui-types` path dep, and (for --all-targets test compile)
      # ui-bridge for the SDK↔runner manifest diff test source.
      - name: Check out sibling qontinui-schemas
        uses: ./.github/actions/checkout-sibling

      - name: Checkout sibling repos
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-web.git
          git clone --depth 1 https://github.com/qontinui/ui-bridge.git
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            at-spi2-core

      - name: Free disk space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Add swapfile (Ubuntu — guard against link-time OOM)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # Swatinem/rust-cache, matching ci.yml. The `actions/cache` stanza this
      # replaces was the same one ci.yml documents at its own cache step as
      # "broken two ways and never cached a single build artifact":
      #   1. It cached `src-tauri/target/`, but the cargo workspace root is the
      #      REPO root (./Cargo.toml holds the [workspace] table → ./target), so
      #      that path never existed. Observed on run 30211607823: the step
      #      restored 112 MB — the cargo registry alone, zero build artifacts.
      #   2. Exact-match key with no restore-keys, so any Cargo.lock change was
      #      a total miss even for the registry portion.
      # ci.yml was migrated off it; these two jobs were left behind.
      #
      # `shared-key` is load-bearing. rust-cache keys on `github.job` by
      # default, so without it this nightly (the only job here that may save —
      # `schedule` runs on main) and `clippy-diff` would sit in separate cache
      # scopes and clippy-diff would restore nothing at all.
      #
      # `cache-targets: false` is deliberate, not an oversight. The repo's
      # Actions cache sits at ~95% of the 10 GB cap, and the entries that gate
      # the merge train are ci.yml's ~2.2 GB main-scoped rust caches — the ones
      # PR #792's `save-if` exists to stop candidate/PR runs from evicting.
      # Neither job in this workflow is a required check, so they must not buy
      # their own speedup with the cap main's caches depend on. Revisit only if
      # `gh api repos/qontinui/qontinui-runner/actions/cache/usage` shows real
      # headroom.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Workspace root is the repo root: ./Cargo.toml -> ./target
          workspaces: ". -> target"
          shared-key: clippy-tiers
          cache-targets: false
          # Same policy as ci.yml (PR #792): save from main only. This job runs
          # on main via `schedule`, so it is what populates the cache; the
          # clippy-diff PR runs restore it and never save.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # tauri::generate_context!() reads ../dist at compile time; clippy compiles
      # the crate, so the frontend must be built first (same as the matrix job).
      - name: Build frontend
        run: pnpm run build

      - name: Clippy (unscoped, all-targets)
        # No `-D warnings`: report rot, don't deny-block the world. Levels come
        # from Cargo.toml; --all-targets adds the test-module coverage the PR
        # gate intentionally drops. A deny-tier lint anywhere in the tree still
        # fails this job (by design — that's the loud signal), but this job
        # gates no PR.
        env:
          CARGO_BUILD_JOBS: 1
        run: |
          cd src-tauri
          cargo clippy --all-targets

  # DIFF-SCOPED T3 style gate (reviewdog). Runs plain `cargo clippy` with JSON
  # output and pipes it through reviewdog with -filter-mode=diff_context so it
  # comments/fails ONLY on findings introduced on the lines this PR changed —
  # style rot elsewhere in the tree is ignored. This is the T3 mechanism: warn-
  # tier lints (style/complexity/perf) stay non-blocking globally but a NEW one
  # you introduce is surfaced on your diff.
  #
  # ADVISORY / NOT A REQUIRED CHECK — do NOT add to required-status-checks or
  # branch protection. Promote to required only after burn-in (plan Phase 2).
  # Being non-required guarantees it cannot wedge the coord merge train even if
  # reviewdog misbehaves.
  #
  # NOT LIVE-VERIFIED at authoring time: reviewdog's clippy errorformat +
  # diff_context behavior on this Tauri crate — treat the first live PR run as
  # the verification; keep it non-required until confirmed green-and-useful.
  clippy-diff:
    name: Clippy diff-scoped (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: read
      pull-requests: write
      checks: write

    steps:
      - uses: actions/checkout@v5

      - name: Check out sibling qontinui-schemas
        uses: ./.github/actions/checkout-sibling

      - name: Checkout sibling repos
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-web.git
          git clone --depth 1 https://github.com/qontinui/ui-bridge.git
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          components: rustfmt, clippy

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Install dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            at-spi2-core

      - name: Free disk space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Add swapfile (Ubuntu — guard against link-time OOM)
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      # Same migration as the nightly job above — see its comment for why the
      # replaced `actions/cache` stanza cached nothing. `shared-key` puts this
      # job in the nightly's cache scope so it RESTORES what the nightly saved
      # from main; `save-if` then evaluates false on every `pull_request` run,
      # so this job never adds a save against the 10 GB repo cache cap. That is
      # PR #792's policy applied here: restore unrestricted, save from main only.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          shared-key: clippy-tiers
          cache-targets: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Clippy diff-scoped via reviewdog
        # Capture clippy JSON to a file first so cargo's non-zero exit (a deny
        # lint) does NOT abort the step under `set -eo pipefail` before
        # reviewdog runs — reviewdog owns the pass/fail decision here, scoped to
        # the diff. `-filter-mode=diff_context` = fail only on findings on
        # changed lines; `-fail-on-error=true` makes those diff findings fail
        # THIS (advisory, non-required) check only.
        env:
          CARGO_BUILD_JOBS: 1
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd src-tauri
          cargo clippy --message-format=json > clippy-report.json 2>/dev/null || true
          reviewdog \
            -f=clippy \
            -name="clippy-diff" \
            -filter-mode=diff_context \
            -reporter=github-pr-check \
            -fail-on-error=true \
            < clippy-report.json
        shell: bash
