name: Flake escalation

# Phase 2 of plan
# 2026-08-30-runner-ci-has-no-flake-detection-so-one-flaky-test-freezes-the-train:
# "make a flake a defect, not a fact of life".
#
# Phase 1 (`Report test results to coord` in ci.yml) fills coord.test_results
# with every per-test outcome the gating `cargo test` prints. coord scores
# that history into a per-test flake_rate (`flakiness_priors`, readable at
# POST /coord/test-flakiness). Until this workflow, nothing READ that score:
# the first — and only — escalation the rail produced was a session reading
# the endpoint by hand, finding wedge_diagnostics' spinning-child test at
# 0.400 and fixing it in #1444. This workflow is that read, made recurring:
# scripts/ci-flake-escalate.mjs upserts one `flaky test: <test id>` issue
# (label `flake`) per test at or above the plan's threshold of 3 disagreeing
# runs in coord's window.
#
# Trigger posture (deliberately NOT a per-PR check, and NOT in ci.yml):
#   - schedule (daily): the rate moves per landed run, not per PR, and an
#     escalation is a repo-level fact rather than a verdict on one branch.
#     Same reasoning as atlas-exclude-fresh.yml's nightly.
#   - workflow_dispatch: on-demand read, with `dry_run` to print the plan
#     without touching a single issue.
#   - workflow_run (CI on main, completed): the plan's SECOND arm — "any
#     occurrence on a push to refs/heads/main". A red push to main is the one
#     that freezes the merge train and, until now, left no trace once someone
#     re-ran it. When the triggering CI run concluded `failure`, the script
#     reads its failed `test (<platform>)` jobs' logs (`actions: read`) and
#     files/refreshes an issue per failing test (capped — a mass failure is a
#     broken commit, not N flakes). The coord read is skipped on this trigger
#     (`--no-rate`): it belongs to the nightly, and repeating it ~20x/day
#     would also make every push red while the rail is dark.
#     Why not a step in ci.yml: the escalator needs `issues: write`, and the
#     gating `test` job runs the PR's own code under `cargo test` with the job
#     token in its environment — ci.yml's header says no job there needs a
#     write scope, and widening it for a telemetry step would hand every
#     same-repo PR's test code an issues-write token. `workflow_run` executes
#     the default branch's copy of this file, after CI concluded, with its
#     own token, and runs no PR code. Its `branches:` filter is on the
#     TRIGGERING run's head branch, so this fires for runs on main only; the
#     event this workflow's own runs carry is `workflow_run`, which coord's
#     `establishes_main_baseline` does not admit (it admits `push` only), so
#     a red run here cannot hold the train.
#   - pull_request (paths: the script, its tests, this file): runs the
#     script's unit tests so a regression cannot ship untested. Kept OUT of
#     ci.yml's "Run CI-tooling unit tests" step on purpose — editing ci.yml
#     alters a required gate's surface and costs an `alters-a-gate`
#     declaration for what is a non-gating tool; here the tests gate only the
#     PRs that touch this tool. Self-inclusion is deliberate: a paths-filtered
#     job that omits its own path does not run on the PR that edits it.
#
# What a RED run means, and why it is red rather than green-and-empty: the
# script exits 1 when coord reports `history_read: failed` (or serves a body it
# cannot read as an observation). Measured 2026-09-12 against this repo the
# read failed server-side after ~60 s on every probe — a qontinui-coord defect
# (`load_result_history` over coord.test_results), not this repo's. A red
# nightly says "the rail is dark"; a green one with no issues would say "no
# flakes", which is the false clean bill of health the plan exists to abolish.
# That condition is tracked as coord finding e5311ec9-1592-430e-a7f8-9cc6eb84032e
# (topic `test-flakiness`); the fix is a coord/web index or a horizon-bounded
# read, never a change to this workflow.
# `history_read: thin` (no test has 20 samples yet) is a notice and exits 0.
#
# The plan's second escalation arm — "any occurrence on a push to
# refs/heads/main" — is the `workflow_run` trigger above. It does not need
# per-run outcomes from the flakiness endpoint at all: the failing tests are
# in the CI run's own job logs, parsed with the same parser Phase 1 ingests
# with, so the issue title matches the coord identity and both arms land on
# one issue.

on:
  schedule:
    # Daily, 06:17 UTC — off the hour so it does not stack on the top-of-hour
    # schedules GitHub throttles hardest.
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the escalations without creating or editing any issue"
        type: boolean
        default: false
      min_occurrences:
        description: "Disagreeing runs in coord's window needed to escalate (plan default 3)"
        type: string
        default: "3"
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - scripts/ci-flake-escalate.mjs
      # The parser the main-red arm imports; a change to it must run these
      # tests too, not only ci-flake-analyze's own.
      - scripts/ci-flake-analyze.mjs
      - scripts/__tests__/ci-flake-escalate.test.mjs
      - .github/workflows/flake-escalation.yml

permissions:
  contents: read

jobs:
  unit-tests:
    name: Flake-escalate unit tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # No setup-node and no `pnpm install`: the script and its tests import
      # only Node built-ins, and ubuntu-latest ships a Node new enough for
      # them (>= 18: global fetch, node:test). setup-node@v5 is deliberately
      # NOT used here — it reads `packageManager: pnpm@…` from package.json and
      # enables pnpm caching on its own, which fails with "Unable to locate
      # executable file: pnpm" unless pnpm/action-setup ran first (ci.yml does
      # that; this job has nothing to install). Measured on this PR's first run.
      - name: Run unit tests
        run: |
          node --version
          node --test scripts/__tests__/ci-flake-escalate.test.mjs

  escalate:
    name: Escalate flaky tests from coord's history
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The coord read is bounded at 120 s inside the script; the rest is a
    # handful of `gh` calls.
    timeout-minutes: 10
    # One group per TRIGGERING CI run, and one for the nightly/dispatch.
    # A single shared group would be worse than a race: GitHub keeps at most
    # one running and one PENDING job per group, and a third arrival CANCELS
    # the pending one — with ~20 main pushes a day that silently drops a
    # push-red's evidence, and can drop the nightly itself. Keying per CI run
    # means two main-red runs for the same test can race list-then-create;
    # `planIssueActions` already picks the lowest open owner and warns on the
    # duplicate, which is the cheaper failure.
    concurrency:
      group: flake-escalation-${{ github.event.workflow_run.id || 'nightly' }}
      cancel-in-progress: false
    # `issues: write` covers creating/editing/reopening issues AND creating
    # the `flake` label (labels are an issues-scoped resource). Nothing here
    # opens a PR, so the repo's "Allow GitHub Actions to create and approve
    # pull requests" setting is irrelevant.
    permissions:
      contents: read
      # Reading the triggering run's jobs and their logs (main-red arm).
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      # Runner-provided Node, for the same reason as the unit-tests job above.
      - name: Read coord's flake history and upsert escalation issues
        # Step-level, never job-level: a job-level `if:` publishes a
        # `skipped` check run that coord reads as passing
        # (ci-rerun-on-declaration.yml documents this). A `workflow_run` whose
        # triggering event was not a `push` (a `workflow_dispatch` of CI) has
        # no train-freeze meaning and is skipped here.
        if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          # Default in the script is https://coord.qontinui.io; set explicitly
          # so a future ambient-poison step (see ci.yml) cannot redirect this.
          COORD_HTTP_URL: https://coord.qontinui.io
          EVENT_NAME: ${{ github.event_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          MIN_OCCURRENCES: ${{ github.event.inputs.min_occurrences }}
          # Routed through env rather than interpolated into `run:` — none of
          # these is attacker-controlled today, but the interpolated form is
          # the one a future edit copies with a value that is.
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # The TRIGGERING CI run (main-red arm); empty on schedule/dispatch.
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          CI_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          CI_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: |
          set -euo pipefail
          # --run-url is always THIS run (where the cap / unreadable-log
          # warnings live); the script derives the CI run's URL from --run-id.
          args=(--repo "$REPO" --run-url "$RUN_URL")
          if [ "${EVENT_NAME}" = "workflow_run" ]; then
            args+=(--run-id "${CI_RUN_ID}" --run-conclusion "${CI_RUN_CONCLUSION}")
            args+=(--run-attempt "${CI_RUN_ATTEMPT}" --no-rate)
          fi
          if [ "${DRY_RUN:-false}" = "true" ]; then args+=(--dry-run); fi
          if [ -n "${MIN_OCCURRENCES:-}" ]; then args+=(--min-occurrences "${MIN_OCCURRENCES}"); fi
          node scripts/ci-flake-escalate.mjs "${args[@]}"
