name: forbid untimed subprocess waits

# Phase 1 enforcement deliverable of plan
# `2026-08-30-runner-blocking-pool-exhaustion-and-wedge-diagnostics`.
#
# WHAT IT FORBIDS: a NEW `std::process::Command` waited on with no time bound —
# `.output()`, `.status()`, `Child::wait()`, `Child::wait_with_output()` —
# anywhere in the Rust that runs inside the runner process, unless the enclosing
# function is listed with a written reason in
# `scripts/untimed-subprocess-baseline.json`.
#
# WHY IT EXISTS: those four calls have NO timeout. A child that never exits
# parks the calling thread forever, and when that thread came from tokio's
# blocking pool it is never given back. tokio's default `max_blocking_threads`
# is 512. On 2026-08-30 eight independent PERIODIC callers each leaked one
# thread per tick until the pool was exhausted; `spawn_blocking` then stopped
# scheduling at all, which starved the PG pool, which disabled `zombie_sweep`,
# which made the spiral self-reinforcing until `/livez` went dark.
#
# That was the FOURTH independently-discovered instance of the same defect
# shape, across two incidents four days apart. Code review did not catch it any
# of the first three times, so review is a demonstrated-insufficient control
# here and the class gets a machine check. A one-time grep-and-fix would have
# left the class open for a fifth.
#
# THE SANCTIONED BOUNDED WRAPPERS (src-tauri/src/process_helpers.rs):
#
#   run_with_timeout(cmd: Command, timeout: Duration) -> io::Result<TimedOutput>
#   output_with_timeout(cmd: Command, timeout: Duration) -> io::Result<Output>
#   run_probe(cmd: Command, timeout: Duration, label: &str) -> ProbeOutcome
#
# A site routed through any of these never calls `.output()`/`.status()` at all
# — it hands the BUILT command to the wrapper — so "is it bounded?" needs no
# heuristic. The presence of the blocking wait IS the finding.
#
# WHAT IS SCANNED — DISCOVERED, NOT HARD-CODED, BUT DECLARED. Every in-repo crate
# LINKED INTO
# THE RUNNER BINARY, i.e. every crate that shares the runner's tokio runtime and
# therefore its blocking pool: `src-tauri/src` plus the transitive closure of
# the dependencies of `src-tauri/Cargo.toml`, restricted to paths inside this
# repo. Each contributes `<crate>/src/**/*.rs` (the `.rs` suffix matched
# case-INSENSITIVELY — `hidden.RS` compiles on the Windows dev box and used to
# escape the Linux glob) plus every file a `#[path = "…"] mod` attribute reaches,
# including one pointing OUTSIDE the crate tree. A `#[cfg(test)]`-gated `#[path]`
# include is not followed, which is what keeps `wedge_diagnostics.rs`' test-only
# pull-in of `../build.rs` — a build script, a separate process with no blocking
# pool — out of scope.
#
# The DISCOVERED list is compared against `EXPECTED_SCAN_ROOTS` in the checker on
# every run, and a difference in either direction FAILS. Discovery alone was not a
# gate: `src-tauri/Cargo.toml` decides the scan scope and is not a guarded file,
# so deleting one `path = "…"` line moved a whole crate tree out of coverage and
# the job still printed `OK`, with the shrunken list going only to `--list-roots`
# — a log nobody diffs. Changing coverage is now a deliberate two-line diff in
# `scripts/check_untimed_subprocess.py`, which IS in ci-integrity.yml's GATING
# set, so it gets operator review. Note what is NOT done: `src-tauri/Cargo.toml`
# is deliberately NOT added to that GATING set. Adding an ordinary dependency
# edits it constantly and would flag every such PR for review; the declared-roots
# check catches the only edits to it that matter — the ones that change what this
# gate covers.
#
# BOTH dependency spellings are followed — `foo = { path = "…" }` and
# `foo = { workspace = true }`, the latter resolved through the workspace root's
# `[workspace.dependencies]`. Following only the first meant that converting a
# path dep to the standard workspace-inheritance idiom — a routine, safe-looking
# refactor — silently dropped that crate out of the scan AND printed it under
# `--list-roots`' "NOT SCANNED … they ship as their own processes", an
# affirmatively false statement about a crate linked into the runner.
#
# A Cargo.toml the checker cannot PARSE is fatal. It used to become "no path
# dependencies", so one malformed line in src-tauri/Cargo.toml shrank the scan
# from five crate trees to one and the job still went green. A discovery failure
# is UNKNOWN, not empty — which is also why there is no longer a regex manifest
# reader for pre-3.11 interpreters (it could not see `workspace = true`, so it
# under-scanned silently). This job pins Python 3.12.
#
# This is not cosmetic. Plan
# `2026-08-21-runner-extract-crates-frontier-first` is actively carving modules
# OUT of `src-tauri/src` into sibling crates (`crates/runner-stats`,
# `crates/runner-win32` so far, per src-tauri/Cargo.toml's own comment), so a
# hard-coded `src-tauri/src` root would let every future phase silently remove
# code from coverage — and the ratchet would then instruct the contributor to
# DELETE the newly-unresolvable baseline entries, permanently ungating them. An
# extraction necessarily adds a path dependency, so the closure picks the new
# crate up with no edit to the checker.
#
# Two things are deliberately out of scope, and
# `check_untimed_subprocess.py --list-roots` prints both so the boundary is
# inspectable rather than assumed: path deps that resolve OUTSIDE this repo
# (`../../qontinui-schemas/*` — a different repository with its own CI, not even
# checked out in this job), and in-repo workspace members the dependency closure
# does not REACH (`crates/comprehension`, `crates/qontinui-app-generator`,
# `crates/qontinui-backend-generator`). The second list is a statement about the
# scan, not a claim about how those crates run: today they ship as their own
# processes, so a blocking wait there cannot consume a runner blocking-pool
# thread — but the list is only as trustworthy as the closure that computed it,
# which is precisely what went wrong while `workspace = true` was unfollowed. If
# one ever becomes a runner dependency the closure starts scanning it
# automatically.
#
# WHY `.spawn()` IS NOT IN THE PATTERN: `.spawn()` returns immediately and parks
# nothing. Gating it would fire on every deliberately-detached long-lived child
# (the python sidecar, ffmpeg, rathole, claude CLI sessions, terminal spawns,
# the managed services in process_capture) and on every hand-rolled bounded
# `spawn` + `try_wait` poll loop — a large, legitimate, statically
# indistinguishable population, i.e. exactly the false-positive flood that gets
# a gate disabled. The defect is the unbounded WAIT, so the gate follows the
# wait. That also covers the `spawn`-then-`wait` shape a bare-`spawn` rule
# would have had to allow through anyway. `try_wait()` is absent on purpose: it
# does not block.
#
# HOW std IS TOLD FROM tokio: not by regex — many files use both, and
# `reqwest`'s `Response::status()` alone would produce hundreds of false hits.
# The checker resolves each blocking wait's RECEIVER back to its constructor
# (`no_window` / `cmd_no_window` / `std::process::Command::new`, and the aliased
# spellings `use std::process::Command as C;` / `type Cmd = …;` = sync and
# gated; the `tokio::process` equivalents = async and ignored, because an
# awaited async wait occupies no blocking-pool thread). Anything it cannot
# resolve to a sync origin is NOT flagged. The receiver is resolved at three
# positions, not one: the chained spelling `git_cmd(p).output()`, a `let`
# BINDING of a helper's result (`let mut c = pm_command("cargo"); c.output();` —
# the only way to write it when you need to add arguments, and previously
# invisible), and the chain's last link (`self.build_command().output()`).
#
# EVERY BINDING FORM IS READ, not just `let <ident>`. A pattern binds each of its
# names to the initialiser's origin, so `if let Ok(mut child) = cmd.spawn()`,
# `match cmd.spawn() { Ok(mut child) => … }`, `let Ok(mut child) = cmd.spawn()
# else { … };` and `let (mut child, _t) = (cmd.spawn().unwrap(), 1u8)` all
# resolve. All four were invisible while the binding regex demanded a bare
# identifier — the gate saw the least idiomatic spelling and missed the four most
# idiomatic ones — and the let-else shape is already in this tree
# (`env_agent/collectors.rs`).
#
# THIS GATE IS A SYNTACTIC APPROXIMATION OF A SEMANTIC PROPERTY, so it has holes,
# and they are written down rather than glossed. A green run means "no unbounded
# wait of a shape this checker can see", not "no unbounded wait". The full list
# is in the module docstring of `scripts/check_untimed_subprocess.py`; the ones
# worth knowing before you trust a green tick:
#
#   * A `macro_rules!` at MODULE scope can hold an arbitrary number of unbounded
#     waits and this gate stays green. Its body is read as text, but the finding
#     has no enclosing `fn` to key against and is dropped. Essentially every
#     macro in this tree is declared at module scope. (This header used to claim
#     macro bodies were covered. They are not.)
#   * A wait assembled from macro FRAGMENTS (`$recv.$method()`) is never seen.
#   * UFCS is invisible: `Command::output(&mut c)` / `Child::wait(&mut child)`
#     yield zero findings.
#   * Nested-group `use std::{process::Command, …}` imports, and a receiver whose
#     kind is only knowable from a struct FIELD's declared type.
#   * A `#[cfg]`-gated kill still suppresses the wait below it (a portability arm
#     is not a proof). A cfg predicate that is false BY CONSTRUCTION —
#     `#[cfg(any())]` and friends — does NOT suppress: that is a kill which
#     exists in no compilation, dressed as one that exists in some.
#   * The program token is resolved SYNTACTICALLY AT THE WAIT SITE, so it names
#     the spelling, not the program. `fn:git_cmd` survives editing the helper
#     from `Command::new("git")` to `Command::new("aws")`; `dyn:prog` survives
#     editing `let prog = "osascript"` to `"curl"`; and basename normalization
#     collapses `./tools/git`, `C:/attacker/git.exe` and `GIT` onto `git`.
#     7 of the 55 baselined waits carry a non-discriminating token today, and for
#     those entries the ratchet enforces the COUNT and nothing more.
#
# What is skipped wholesale (`#[cfg(test)]` items, and a `wait()` that follows an
# UNCONDITIONAL `kill()` ON THE SAME RECEIVER within 3 statements) is in the same
# docstring.
#
# NOTHING IS SKIPPED BY FILE. `process_helpers.rs` used to be — it implements
# the bounded primitives, so it necessarily contains the raw calls — but that
# made the one file whose name reads as "sanctioned" a blind spot: a
# `pub fn output_now(mut cmd: Command) { cmd.output() }` dropped in beside the
# three real wrappers passed, and so did every periodic caller routed through
# it. It is scanned like any other file now.
#
# It has NO baseline entry, and this header used to say its raw waits "are
# baselined like any other exemption" — which was false, and false in the
# direction that matters: a reader checking the claim finds nothing in the JSON
# and concludes the file is still skipped. What actually happens is that its one
# raw wait (`run_with_timeout`'s expiry path, `child.kill(); child.wait();`) is
# suppressed by the kill-adjacency rule, which applies to every file equally.
#
# THE BASELINE IS A RATCHET. `scripts/untimed-subprocess-baseline.json`
# enumerates the surviving sites — one-shot CLI paths, user-triggered actions,
# startup and shutdown work, and commands whose runtime is unbounded by design
# (a build, a Playwright run) — keyed by `<path>::<QUALIFIED fn>` with a
# REQUIRED written reason. The key carries every enclosing `impl` / `trait` /
# `mod` / outer `fn`, so `impl A { fn run }` and `impl B { fn run }` are
# different sites; with a bare function name they collided, and moving a wait
# from one to the other left the count constant and the gate green. GENERIC
# ARGUMENTS are part of the label too (`impl Bar<u8>` vs `impl Bar<u16>`) —
# truncating the type at the first `<` reinstated that same collision for any
# such pair.
#
# Each entry records WHAT it covers, not how many: `waits` is one normalized
# PROGRAM token per untimed wait in the function (a string-literal program as
# its lowercased basename without `.exe`, a computed one as
# `dyn:<identifier>`, a helper-built one as `fn:<helper>`, an unresolvable one
# as `?`), and `reason_covers_waits` is the list the prose was authored against,
# which must equal it. The list is compared exactly, so the baseline can only
# shrink and cannot silently rot.
#
# A COUNT COULD NOT SEE A SWAP. Replacing the baselined `osascript` one-shot in
# `window_manager::list_windows_macos` with
# `Command::new("aws").args(["s3","ls",…]).output()` keeps the count at 1, so a
# count ratchet stays green while an unbounded NETWORK call ships under prose
# reading "User-triggered window enumeration via `osascript`, one pass per
# click". The token is deliberately NOT a hash of the call text: that would go
# red on `git status` -> `git status --porcelain`, an edit that cannot
# invalidate any reason, and a gate that cries wolf gets disabled.
#
#   * a brand-new key                     -> empty reason -> rejected
#   * a NEW wait inside an already-exempt function -> `--update-baseline`
#     CLEARS the reason (it does not carry the old prose forward) -> rejected
#   * a wait SWAPPED for a different program -> reason CLEARED -> rejected
#   * a baseline DOWNGRADED to a pre-format-3 (count-only) schema and then
#     migrated -> every reason CLEARED, because a count cannot say WHICH programs
#     the prose covered. That arm used to ADOPT the observed programs whenever the
#     count still matched, which made the tool's own supported migration path a
#     way to launder a swapped program under prose written for the old one — the
#     exact attack format 3 exists to close.
#   * hand-editing `waits` and leaving the reason alone ->
#     `reason_covers_waits` mismatch -> rejected
#   * a pure REMOVAL -> reason kept; a strict improvement needs no new prose
#
# What it does NOT detect is a human who hand-edits BOTH lists and leaves stale
# prose, or a swap between two waits whose program is `?`. The first is a false
# statement standing in a reviewable diff, not a silent bypass; no static check
# can tell apposite prose from inapposite prose. The second is enumerated in the
# checker's own "WHAT IT DOES NOT SEE".
# Adding an entry for a PERIODIC caller is a policy violation, not a lint fix.
#
# A baseline that is not the current `"format"` is REJECTED outright rather than
# matched against — an unrecognised file would otherwise match nothing, which
# the ratchet reads as "every site was fixed" and which would ungate all of them
# at once. The rejection prints the migration steps.
#
# NOT PATH-FILTERED, deliberately — same posture as forbid-runner-schema.yml,
# and the opposite of forbid-sibling-clone.yml. Two reasons:
#   1. The gate's inputs are every scanned crate's Rust PLUS the checker PLUS
#      the baseline PLUS `src-tauri/Cargo.toml` (which decides the scan scope).
#      Enumerating that as a `paths:` filter is a list that rots — a PR that
#      only edits the baseline JSON, or that renames a directory, or that adds a
#      path dependency, would slip a wrongly-filtered gate. The check costs ~8s
#      of stdlib Python over the whole Rust tree, so filtering buys nothing
#      worth that risk.
#   2. Because it is unfiltered it creates a check-run on EVERY pull request, so
#      it does not carry forbid-sibling-clone's hazard — a path-filtered trigger
#      makes no check-run on a non-matching PR, so registering one as required
#      leaves it "Expected" forever and wedges every unrelated PR (the
#      2026-06-26 fleet wedge). This gate is therefore *eligible* to be a
#      required context.
#
# THE BASE-BRANCH FILTER WAS REMOVED to make (2) literally true. It used to read
# `pull_request: branches: [main, develop]`, which produces NO check-run at all
# on a stacked PR whose base is another feature branch — and this repo actively
# uses stacked PRs (see stacked-pr-fastlane.yml). That did not endanger a
# required-context registration (a ruleset on `main` does not gate a PR that
# targets a feature branch), but it did mean an untimed wait introduced inside a
# stack went ungated until the stack re-targeted `main`. At ~8s a run, closing
# that is cheaper than reasoning about it. `push:` stays pinned to the trunk
# branches: a push run on every feature branch would be pure duplication of the
# PR run.
#
# It is still NOT REGISTERED as a required context today: red CI is this repo's
# sanctioned merge-stopper and `main` carries pre-existing red, so promoting a
# brand-new gate to required is an operator decision about ruleset 16044811, not
# a side-effect of adding the workflow. Do not register it without making that
# call explicitly.
#
# SELF-PROTECTION: this workflow and `scripts/check_untimed_subprocess.py` are
# both listed in ci-integrity.yml's GATING set (and the checker's path is in
# that workflow's `paths:` trigger), so a PR that neuters the gate — narrowing
# BLOCKING_WAITS, loosening the receiver resolver, widening what suppresses a
# finding, deleting the workflow —
# goes RED and gets operator review instead of auto-merging under the weakened
# gate. `scripts/untimed-subprocess-baseline.json` is deliberately NOT in that
# set: it is edited by every legitimate ratchet-tightening PR, and its integrity
# is enforced by the required-reason / `reason_covers_waits` / exact-wait-list
# rules, which live in the guarded checker.
#
# That self-protection was ALSO conditional on where a PR happened to be based.
# ci-integrity.yml triggered on `pull_request_target: branches: [main]`, so a
# STACKED PR editing this checker produced no ci-integrity run at all — on a
# repo that actively stacks PRs (stacked-pr-fastlane.yml) — and a later
# re-target fires the `edited` activity type, which a default
# `pull_request_target` trigger does not listen for. That base filter is now
# removed, for the same reason this workflow removed its own.

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, develop]

# Serialise per ref. `cancel-in-progress: false` on purpose, matching
# atlas-exclude-fresh.yml and page-spec-paths.yml rather than the two
# cancel-in-progress siblings: a cancelled run on a gating workflow presents to
# coord as an unverified tip (the condition ci-rerun-on-declaration.yml's header
# describes), and this gate is eligible to become a required context. An 8s job
# is not worth manufacturing that.
concurrency:
  group: forbid-untimed-subprocess-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  forbid-untimed-subprocess:
    name: Forbid untimed std::process::Command waits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan the runner's Rust crates for unbounded blocking subprocess waits
        shell: bash
        run: |
          set -euo pipefail

          # Print the discovered scan scope first: the gate's coverage is
          # computed from src-tauri/Cargo.toml's path dependencies, so a phase
          # of the crate-extraction plan that changes it changes what is gated,
          # and that must be visible in the log rather than inferred.
          python3 scripts/check_untimed_subprocess.py --list-roots

          # Pure stdlib — no `pip install` step, so this leg cannot go red on a
          # package-index outage. The same command is what a developer runs
          # locally before pushing (on the Windows dev box: `python
          # scripts\check_untimed_subprocess.py`).
          python3 scripts/check_untimed_subprocess.py --ci
