name: gen-events hook suites

# Runs the toolchain-free test suites behind the `gen-events-drift` pre-push hook
# in CI, so that a change to the hook or to the registry it reads is checked
# even when the author's local hooks are not armed.
#
# The local wiring in `.pre-commit-config.yaml` (`gen-events-attribution-test`,
# `gen-events-file-attribution-test`, `push-range-test`, `gen-events-drift-root`)
# stays as it is. It gives the fast answer at commit time, and CONTRIBUTING.md
# makes arming it opt-in. This workflow is the enforced copy of the same check.
# It matters most for `gen-events-file-attribution-test.sh`, which also checks
# that THIS tree's `schema_export.rs`, `lib.rs` and `bin/export_schemas.rs`
# still satisfy the registry reader's premises. A refactor that breaks one does
# not produce wrong bindings: CI's `qontinui-types drift` still regenerates for
# real. It silently returns every runner push to the whole-push verdict, which
# is the over-blaming qontinui-runner#2733 removed. Without this job, nothing
# but an armed local hook catches that.
#
# `paths:` is wide on purpose. The suites do not only read the hook files: the
# whole-push suite also checks the REAL tree (the `.rs` files under
# `src-tauri/src/`, `src-tauri/clorinde/`, `crates/*/` and `vendor/`, every
# `Cargo.toml`'s path dependencies, the build scripts including
# `src-tauri/build.rs`, and `src-tauri/src/fleet_skills/`), and
# `push-range-test.sh` runs `cargo-prepush.sh`. A narrower filter would let a PR
# break a check here and leave the red to the next unrelated PR that touches a
# hook file.
#
# No Rust toolchain, no qontinui-schemas checkout, no network: every case builds
# throwaway git repos under $RUNNER_TEMP. The per-file suite needs `node`, and
# without it every case reports SKIPPED and the script still exits 0, so the
# step below refuses a run that skipped anything or passed nothing.
#
# Follow-up to qontinui-runner#2733.
# Plan: qontinui-dev-notes plans/2026-10-30-runner-gen-events-drift-blames-pushes-for-drift-already-on-main.md

on:
  push:
    branches: [main]
    paths:
      - ".pre-commit-hooks/**"
      - "src-tauri/src/**"
      - "src-tauri/build.rs"
      - "src-tauri/clorinde/**"
      - "crates/**"
      - "vendor/**"
      - "**/Cargo.toml"
      - ".github/workflows/gen-events-hook-suites.yml"
  pull_request:
    branches: [main]
    paths:
      - ".pre-commit-hooks/**"
      - "src-tauri/src/**"
      - "src-tauri/build.rs"
      - "src-tauri/clorinde/**"
      - "crates/**"
      - "vendor/**"
      - "**/Cargo.toml"
      - ".github/workflows/gen-events-hook-suites.yml"
  workflow_dispatch:

permissions:
  contents: read

# Same PR-scoped supersession shape as qontinui-types-drift-wait-tests.yml: a
# first-attempt pull_request run cancels the run it supersedes for that PR;
# every other run gets a group of its own.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  suites:
    name: gen-events hook suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      # Explicit, so the per-file suite never runs on a runner without node.
      # No dependency cache: these suites install nothing.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Run the suites, refusing a vacuous pass
        shell: bash
        run: |
          # GitHub runs `shell: bash` as `bash -eo pipefail`. Turn -e OFF: a
          # failing suite must still print its log and its ::error, and the
          # remaining suites must still run.
          set +e -uo pipefail
          export TMPDIR="$RUNNER_TEMP"
          status=0
          # suite|may_skip. Only push-range-test has arms it may skip: two
          # real-cargo arms, skipped only where `cargo` is absent (ubuntu-latest
          # ships it, so they normally run here).
          for entry in \
            gen-events-file-attribution-test.sh\|no \
            gen-events-drift-attribution-test.sh\|no \
            gen-events-drift-root-test.sh\|no \
            push-range-test.sh\|yes; do
            suite="${entry%|*}"; may_skip="${entry#*|}"
            log="$RUNNER_TEMP/${suite%.sh}.log"
            echo "::group::${suite}"
            bash ".pre-commit-hooks/${suite}" > "$log" 2>&1
            rc=$?
            cat "$log"
            echo "::endgroup::"
            summary="$(grep -E '[0-9]+ passed, [0-9]+ failed' "$log" | tail -n 1)" || summary=""
            passed="$(sed -nE 's/.*\b([0-9]+) passed, ([0-9]+) failed.*/\1/p' <<< "$summary")"
            failed="$(sed -nE 's/.*\b([0-9]+) passed, ([0-9]+) failed.*/\2/p' <<< "$summary")"
            if [ "$rc" -ne 0 ]; then
              echo "::error::${suite} exited ${rc}"; status=1
            elif [ -z "$passed" ] || [ -z "$failed" ]; then
              echo "::error::${suite} printed no 'N passed, M failed' summary, so it cannot be shown to have run"; status=1
            elif [ "$passed" -eq 0 ] || [ "$failed" -ne 0 ]; then
              echo "::error::${suite}: ${summary}"; status=1
            elif [ "$may_skip" = no ] && grep -q 'SKIPPED' <<< "$summary"; then
              echo "::error::${suite} skipped cases (${summary}); on this runner every case must run"; status=1
            else
              echo "${suite}: ${summary}"
            fi
          done
          exit "$status"
