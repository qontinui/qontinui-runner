name: onboarding doc freshness

# Regenerates the runner onboarding checklist from `coord_doctor`'s CHECK_SPECS
# and fails if the checked-in `docs/runner-onboarding.md` differs from a fresh
# regen. This is the Phase-5 anti-drift gate of plan
# 2026-06-13-runner-coord-credential-and-gate-access-reliability: the doc is
# GENERATED from the same CHECK_SPECS the live `coord doctor` report sources its
# names + fixes from, so the onboarding doc and the report can never drift.
#
# Regenerate locally with:
#   cargo run --bin coord_doctor -- --onboarding-doc > docs/runner-onboarding.md
#
# Trigger / required-check posture
# --------------------------------
# Mirrors `clorinde-bindings-fresh.yml` / `schema-pg-sql-fresh.yml`:
#   - `detect`               : lightweight; computes whether the PR touches the
#                              doctor source, the generator, or the checked-in
#                              doc.
#   - `onboarding-doc-verify`: builds the coord_doctor bin, regenerates the doc,
#                              and `git diff --exit-code`s it. Gated on detect.
#   - `onboarding-doc-fresh` : aggregator shim; always runs; reflects the
#                              verify result, or trivially passes on
#                              no-relevant-changes PRs.
#
# On "required": unlike the two workflows above, `onboarding-doc-fresh` is NOT
# currently one of the required contexts in the `main-merge-gates` ruleset
# (`schema-fresh` and `clorinde-fresh` are). Verified 2026-08-05 against
# `gh api repos/qontinui/qontinui-runner/rulesets/16044811`. Note this repo has
# no CLASSIC branch protection at all — `/branches/main/protection` returns 404,
# which is NOT "ungated"; read the ruleset. The shim still matters, because
# coord's merge predicate observes EVERY check, not only ruleset-required ones,
# so a red one still stops the train. Keep the always-reports shape: it is what
# lets this become a required context without re-introducing the deadlock below,
# and it matches the siblings.
#
# We don't use a trigger-level `paths:` filter, because that would skip the
# entire workflow (including the shim) on non-relevant PRs, which for a REQUIRED
# context is the "ghost required check" deadlock — a skipped-but-required check
# sits pending forever. `workflow_dispatch` is kept for manual reruns.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

# Least-privilege, stated explicitly rather than inherited.
#
# This workflow resolves the sibling qontinui-schemas ref. On a `pull_request`
# event that resolution reads this PR's labels and the sibling's open PRs via
# the API, so `pull-requests: read` is a real requirement here, not
# boilerplate. (On every other event the resolver short-circuits to the default
# branch and makes no API call at all — but the grant is stated once, at
# workflow level, rather than per-job.)
#
# It USED to work by inheriting the repo-level `default_workflow_permissions`
# (currently "read"), an operator-flippable setting that is INVISIBLE in this
# file. Flipping it to `restricted` would have broken sibling resolution across
# six workflows at once, with nothing in any diff to explain it. State it here.
#
# No job in this workflow needs a write scope; `contents: read` covers the
# checkouts and the sibling clones. Narrow this further at your peril, and
# widen it only for a job that genuinely writes.
permissions:
  contents: read
  pull-requests: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      doc_relevant: ${{ steps.changes.outputs.doc_relevant }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect onboarding-doc-relevant changes
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "doc_relevant=true" >> "$GITHUB_OUTPUT"
            echo "Non-PR trigger (${{ github.event_name }}); running full verification."
            exit 0
          fi
          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          # Relevant paths:
          #   - the doctor source (CHECK_SPECS + render_onboarding_doc live here)
          #   - the bin that emits the doc
          #   - the checked-in generated doc itself
          #
          # Compare against the MERGE BASE, not the base branch tip.
          # `base.sha` is main's tip when the event fired, so a two-dot
          # `git diff "$base_sha" "$head_sha"` also reports main's own
          # commits since the fork point as if this PR had made them.
          # A single commit to coord_doctor.rs on main then fires this
          # gate on every open PR whose head predates it, even though
          # none of them touched a trigger path — and `onboarding-doc-
          # fresh` is a REQUIRED check, so any drift in the generated
          # doc makes all of them unlandable at once. This is the same
          # defect #914 fixed in the two sibling freshness workflows
          # this one is modelled on; it predates that PR and was missed.
          #
          # The checkout above uses fetch-depth: 0, which makes checkout
          # fetch `+refs/heads/*` (carrying `base_sha`) on top of the PR
          # merge ref (whose second parent carries `head_sha`, the only
          # route for a fork PR) — so the merge base resolves locally.
          # If it ever doesn't, fail loudly: a required verification must
          # never be skipped because a git command quietly failed.
          #
          # `--all` because a criss-cross history can have more than one
          # merge base and they can disagree. Union their diffs: with an
          # ambiguous fork point, over-triggering wastes CI, whereas
          # under-triggering ships real drift past a required check.
          if ! merge_bases="$(git merge-base --all "$base_sha" "$head_sha")"; then
            echo "::error::Cannot resolve a merge base for base $base_sha and head $head_sha; refusing to guess at the change set."
            exit 1
          fi
          echo "Merge base(s) of base ($base_sha) and head ($head_sha): $(echo "$merge_bases" | tr '\n' ' ')"
          # Capture instead of piping into `grep`: a `git diff` failure
          # produces empty output, which through a pipe is
          # indistinguishable from "nothing changed" and would silently
          # skip a required verification.
          changed=""
          while IFS= read -r merge_base; do
            if [ -n "$merge_base" ]; then
              if ! from_base="$(git diff --name-only "$merge_base" "$head_sha" -- \
                  'src-tauri/src/coord_doctor.rs' \
                  'src-tauri/src/bin/coord_doctor.rs' \
                  'docs/runner-onboarding.md')"; then
                echo "::error::git diff against merge base $merge_base failed; cannot determine path-change scope."
                exit 1
              fi
              if [ -n "$from_base" ]; then
                changed="${changed}${from_base}"$'\n'
              fi
            fi
          done <<< "$merge_bases"
          if [ -n "$changed" ]; then
            echo "doc_relevant=true" >> "$GITHUB_OUTPUT"
            echo "Onboarding-doc-relevant paths changed; running full verification:"
            printf '%s' "$changed"
          else
            echo "doc_relevant=false" >> "$GITHUB_OUTPUT"
            echo "No relevant changes; verification will be skipped (required check satisfied trivially)."
          fi

  onboarding-doc-verify:
    needs: detect
    if: needs.detect.outputs.doc_relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout qontinui-runner
        uses: actions/checkout@v5

      # src-tauri/Cargo.toml path-depends on the SIBLING qontinui-schemas
      # checkout (`qontinui-types` = ../../qontinui-schemas/rust,
      # `qontinui-code-graph` = ../../qontinui-schemas/code-graph). Without it
      # cargo cannot even load the workspace manifest, so `cargo run` fails
      # before it ever reaches the doc emit. Pinned to the resolved ref for the
      # same reason ci.yml does it: a breaking types change must be able to go
      # green as a DECLARED pair (a coord dep-edge label naming the schemas PR)
      # rather than deadlock. Branch names resolve nothing.
      - name: Resolve sibling qontinui-schemas ref
        id: schemas-ref
        uses: ./.github/actions/resolve-schemas-ref

      - name: Checkout sibling qontinui-schemas
        run: |
          cd "$GITHUB_WORKSPACE/.."
          : "${SCHEMAS_REF:?resolve-schemas-ref produced no output}"
          git clone --depth 1 --branch "$SCHEMAS_REF" https://github.com/qontinui/qontinui-schemas.git
        env:
          SCHEMAS_REF: ${{ steps.schemas-ref.outputs.ref }}
        shell: bash

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # `coord_doctor` lives in the runner's lib crate, which pulls Tauri (and
      # therefore glib/gtk/webkit) even though the doc emit itself touches none
      # of it. Without these, cargo fails building `glib-sys` long before it
      # reaches the emit. Same list ci.yml installs for its ubuntu leg.
      - name: Install Tauri system dependencies (Ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            at-spi2-core

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: onboarding-doc-cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            onboarding-doc-cargo-${{ runner.os }}-

      # Regenerate the doc straight from CHECK_SPECS via the bin's emit mode,
      # overwriting the checked-in file, then diff. The bin writes its markdown
      # to stdout with no BOM, exactly matching the checked-in bytes.
      - name: Regenerate onboarding doc
        working-directory: src-tauri
        run: cargo run --quiet --bin coord_doctor -- --onboarding-doc > ../docs/runner-onboarding.md

      - name: Verify docs/runner-onboarding.md is fresh
        run: |
          if ! git diff --exit-code docs/runner-onboarding.md; then
            echo "::error::Onboarding doc is stale — run \`cargo run --bin coord_doctor -- --onboarding-doc > docs/runner-onboarding.md\` and commit"
            exit 1
          fi
          echo "docs/runner-onboarding.md is up to date."

  # Required-status-check shim. The job name `onboarding-doc-fresh` is what
  # branch protection requires; this aggregator always runs and reflects the
  # verify outcome (or passes trivially on no-relevant-changes PRs).
  onboarding-doc-fresh:
    needs: [detect, onboarding-doc-verify]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate verification result
        shell: bash
        env:
          DETECT_RESULT: ${{ needs.detect.result }}
          VERIFY_RESULT: ${{ needs.onboarding-doc-verify.result }}
          DOC_RELEVANT: ${{ needs.detect.outputs.doc_relevant }}
        run: |
          if [ "$DETECT_RESULT" != "success" ]; then
            echo "::error::detect job did not succeed (result=$DETECT_RESULT); cannot determine path-change scope."
            exit 1
          fi
          if [ "$DOC_RELEVANT" = "true" ]; then
            if [ "$VERIFY_RESULT" = "success" ]; then
              echo "Onboarding doc verification succeeded."
              exit 0
            fi
            echo "::error::onboarding-doc-verify result=$VERIFY_RESULT"
            echo "::error::Run \`cargo run --bin coord_doctor -- --onboarding-doc > docs/runner-onboarding.md\` and commit."
            exit 1
          fi
          echo "::notice::No onboarding-doc-relevant paths changed. Required check satisfied trivially."
          exit 0
