name: page-spec paths producer

# Phase 1b of plan 2026-06-04-page-spec-path-map-producer.
#
# Maps every page spec (`specs/pages/<page_id>/spec.uibridge.json`) to the
# source paths that render it and POSTs the snapshot to coord's page-spec
# ingest route. Best-effort: the producer NEVER gates CI.
#
# Belt-and-braces against gating the build:
#   1. the run step is `continue-on-error: true`, AND
#   2. the script itself exits 0 on any POST failure (only `--strict`, used for
#      local verification, makes a non-2xx exit 1).
#
# Until the coord ingest route + web migration are deployed the POST 404s/401s
# harmlessly and the producer logs a warning + exits 0.
#
# Concurrency: serialize overlapping pushes so coord receives snapshots in
# commit order (cancel-in-progress: false -> never drop a snapshot).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: page-spec-paths
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      # No setup-node: the script is pure Node >= 18 stdlib (no npm deps) and
      # ubuntu-latest ships Node >= 20 preinstalled. setup-node@v5 would
      # auto-detect `packageManager: pnpm` from package.json (its
      # package-manager-cache default) and fail because pnpm isn't installed
      # (first live run 26944789087 failed exactly there).
      - name: Node version
        run: node --version
      - name: Publish page-spec path map to coord
        continue-on-error: true
        env:
          COORD_HTTP_URL: ${{ vars.COORD_HTTP_URL }}
        run: node scripts/page_spec_paths/emit-page-spec-paths.mjs
