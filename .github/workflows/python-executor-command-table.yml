name: Python executor command table

# Runs the guards in python-bridge/tests/test_executor_command_table.py: every
# Rust-sent command has a Python handler, the command table matches its snapshot,
# and no mixin handler is decorated or declared twice. The file reads the executor
# and its mixins as source (ast), so it needs only pytest, numpy and Pillow (what
# tests/conftest.py imports) -- not the qontinui library or any GPU dependency.
# Also runs python-bridge/tests/test_no_temp_debug_logs.py, the same kind of
# stdlib-only ast guard: no bridge source writes a debug log under the OS temp
# dir or ~ (plan 2026-11-14-one-xlib-distribution-and-no-tmp-debug-logs-in-the-python-bridge),
# and tests/test_event_path_no_temp_writes.py, which exercises the event path with
# its heavy imports stubbed so it too needs only these packages.
# And python-bridge/tests/test_single_xlib_owner.py (stdlib tomllib only): the
# bridge lock names exactly one distribution that installs `Xlib/` (python-xlib),
# and neither pyautogui nor mouseinfo, which would bring back the python3-xlib
# fork (same plan, phase 3).
#
# The whole python-bridge/tests suite (plus the scripts/ci conformance-script
# tests) runs from python-bridge/poetry.lock, with the path-dependency siblings
# (qontinui, multistate, qontinui-schemas) beside the checkout as
# build-python-executor.yml lays them out, so a lock that stops resolving or a
# locked dependency that breaks the suite fails here rather than at release.
# Plan 2026-11-05-dependency-advisory-followups-after-the-pillow-13-lift, Phase 4.
#
# Hermetic apart from the lock install: no credentials. NOT a merge gate (absent from the repo
# ruleset's required contexts). It is inside ci-integrity.yml's scope
# (`.github/workflows/**`) on a main-based PR, so the PR that adds or edits this
# file needs `ci:gate-change=declared`.

on:
  push:
    branches: [main]
    paths:
      - "python-bridge/**"
      - "src-tauri/src/**"
      - "scripts/ci/assert-venv-matches-lock.py"
      - "scripts/ci/test_assert_venv_matches_lock.py"
      - ".github/workflows/python-executor-command-table.yml"
  pull_request:
    branches: [main]
    paths:
      - "python-bridge/**"
      - "src-tauri/src/**"
      - "scripts/ci/assert-venv-matches-lock.py"
      - "scripts/ci/test_assert_venv_matches_lock.py"
      - ".github/workflows/python-executor-command-table.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR-SCOPED SUPERSESSION (shared hosted-job cap relief, 2026-10-05). A FIRST-
# attempt `pull_request` run joins a per-workflow, per-PR group and cancels the
# run it supersedes there: a `synchronize` cancels the older head's run, and a
# `reopened` cancels the same-head run it re-does (coord's ci-abandoned
# recovery is a close+reopen). Every OTHER run -- whichever of push (main,
# develop, merge-candidate*/** -- coord's candidate CI), schedule,
# workflow_dispatch and workflow_run this file has, and EVERY re-run (run_attempt > 1) -- gets a
# group unique to its run id + attempt, so it is never cancelled, never reaped
# while pending, and never queues behind anything.
# The group is ONE expression on purpose: coord models a group template by
# interpolating only `github.event_name` / `github.ref` and collapsing every
# other expression to "" (qontinui-coord ci_observer.rs resolve_group_template),
# and run_is_reaper_at_risk never matches an empty group, so no push run here is
# modelled as reapable by a land.
# RESIDUAL: two pushes seconds apart can have
# their runs CREATED out of order, so the older head's run cancels the newer
# head's; the next push (or a close+reopen) heals it.
# Pattern: qontinui-claude-config#1475.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  command-table:
    name: Executor command table guards
    # ram-16g: the lock install pulls torch and its CUDA wheels, and the suite
    # imports them (plan 2026-10-28-heavy-ci-jobs-land-only-on-runners-sized-for-them);
    # peak unmeasured, so the class is the 16 GiB hosted VM, the one known-good bound.
    # coord-pools: [self-hosted, Linux, X64, qontinui-host-nawa, qontinui, ram-16g] | [ubuntu-latest]
    runs-on: ${{ fromJSON(((vars.RUNNER_CI_LANE_PYTHON_EXECUTOR_COMMAND_TABLE || vars.RUNNER_CI_LIGHT_LANE) == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","Linux","X64","qontinui-host-nawa","qontinui","ram-16g"]' || '"ubuntu-latest"') }}
    timeout-minutes: 45
    steps:
      # LAYOUT: the runner under `path:` with the siblings beside it, because
      # python-bridge/poetry.lock resolves them as `../../<name>`.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          path: qontinui-runner

      - name: Check out sibling qontinui
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          repository: qontinui/qontinui
          path: qontinui

      - name: Check out sibling multistate
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          repository: qontinui/multistate
          path: multistate

      - name: Check out sibling qontinui-schemas
        uses: ./qontinui-runner/.github/actions/checkout-sibling
        with:
          path: ${{ github.workspace }}/qontinui-schemas

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Poetry 2.4.1 writes python-bridge/poetry.lock (lock-version 2.1).
      # pip into a per-job venv under runner.temp, not the setup-python
      # interpreter: on a persistent self-hosted runner that interpreter
      # outlives the job.
      - name: Install Poetry
        run: |
          python -m venv "$RUNNER_TEMP/poetry-venv"
          "$RUNNER_TEMP/poetry-venv/bin/pip" install poetry==2.4.1
          echo "$RUNNER_TEMP/poetry-venv/bin" >> "$GITHUB_PATH"

      - name: Cache the bridge venv
        uses: actions/cache@v4
        with:
          path: qontinui-runner/python-bridge/.venv
          key: bridge-test-venv-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-py312-${{ hashFiles('qontinui-runner/python-bridge/poetry.lock') }}

      - name: Install from the lock
        working-directory: qontinui-runner/python-bridge
        env:
          POETRY_VIRTUALENVS_IN_PROJECT: "true"
        run: poetry sync --no-interaction

      - name: Assert the venv matches poetry.lock
        working-directory: qontinui-runner/python-bridge
        run: |
          poetry check --lock
          poetry run python ../scripts/ci/assert-venv-matches-lock.py poetry.lock

      - name: Run the lock-conformance script tests
        working-directory: qontinui-runner
        run: python-bridge/.venv/bin/python -m pytest scripts/ci/test_assert_venv_matches_lock.py -q

      # The whole suite. test_executor_command_table.py reads src-tauri/src, hence
      # the full checkout; conftest.py imports `models`, so run from python-bridge/.
      # xvfb: some tests import display-bound libraries (pyautogui family).
      # --basetemp under runner.temp: a symlinked default temp dir produced
      # setup errors on one box.
      - name: Run the python-bridge suite
        working-directory: qontinui-runner/python-bridge
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo -n apt-get update -qq && sudo -n apt-get install -y -qq xvfb || {
              echo "::error::xvfb-run is missing and cannot be installed here (no passwordless sudo): provision xvfb on this runner pool"
              exit 1
            }
          fi
          xvfb-run -a .venv/bin/python -m pytest tests -q --basetemp "$RUNNER_TEMP/pytest-tmp"
