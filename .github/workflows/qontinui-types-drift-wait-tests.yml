name: qontinui-types drift wait tests

# Fixture tests for the runner-leads wait in qontinui-types-drift.yml (partner
# search, re-check mechanics, the deciding step) and for its daily audit,
# qontinui-types-drift-wait-audit.yml. No network: GitHub answers are files and
# every git operation runs against local repos. The step bodies are read out of
# the two workflows, so the tests exercise exactly what CI runs.
# Plan: qontinui-dev-notes plans/2026-11-05-runner-leads-schemas-pair-reds-runner-main-for-the-partners-land-latency.md

on:
  push:
    branches: [main]
    paths:
      - "scripts/tests/qontinui-types-drift-wait/**"
      - ".github/workflows/qontinui-types-drift.yml"
      - ".github/workflows/qontinui-types-drift-wait-audit.yml"
      - ".github/workflows/qontinui-types-drift-wait-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/tests/qontinui-types-drift-wait/**"
      - ".github/workflows/qontinui-types-drift.yml"
      - ".github/workflows/qontinui-types-drift-wait-audit.yml"
      - ".github/workflows/qontinui-types-drift-wait-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# Same PR-scoped supersession shape as schemas-pair-follow-tests.yml (see the
# rationale there): a first-attempt pull_request run cancels the run it
# supersedes for that PR; every other run gets a group of its own.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  selftest:
    name: qontinui-types drift wait selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Test the wait's search, re-check, verdict and audit (fixtures, no network)
        shell: bash
        run: bash scripts/tests/qontinui-types-drift-wait/run.sh
