name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      include_bundled_python:
        description: "Bundle Python executor (zero-setup installation)"
        type: boolean
        default: true
      include_cuda:
        description: "Include CUDA support in bundled Python"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

jobs:
  # Build Python executor for bundling (optional)
  build-python-executor:
    if: ${{ github.event.inputs.include_bundled_python != 'false' }}
    uses: ./.github/workflows/build-python-executor.yml
    with:
      include_cuda: ${{ github.event.inputs.include_cuda == 'true' }}
      include_sam3: true
    secrets: inherit

  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
      release_version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create Release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Qontinui Runner v${{ steps.get_version.outputs.version }} (Beta)
          draft: true
          prerelease: true
          body: |
            ## Qontinui Runner v${{ steps.get_version.outputs.version }} (Beta)

            ### ⚠️ Beta Release
            This is a beta release and may contain bugs. Please report any issues you encounter.

            ### Installation
            1. Download the appropriate installer for your platform
            2. Run the installer (you may need to allow it in your security settings)
            3. Launch Qontinui Runner from your applications

            ### Features
            - AI-assisted development with visual feedback loops
            - Orchestrated AI sessions with verification and self-correction
            - UI Bridge for real-time application inspection
            - Error monitoring and automated debugging

            ### What's New
            - Comprehensive error handling and recovery
            - User-friendly error messages
            - Automatic crash reporting
            - Auto-update capability
            - Beta status indicator

            ### Known Issues
            - Please check the [issues page](https://github.com/your-username/qontinui-runner/issues) for known issues

            ### Checksums
            Checksums will be added after the build completes.

  build:
    needs: [create-release, build-python-executor]
    # Run even if build-python-executor was skipped (when include_bundled_python is false)
    if: ${{ always() && needs.create-release.result == 'success' }}
    strategy:
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macos-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      # qontinui-runner has cross-repo deps to seven sibling repos via pnpm `link:`
      # protocol (see qontinui-runner/package.json) plus a Cargo `path:` dep
      # (src-tauri/Cargo.toml -> qontinui-types) plus 14 .spec.uibridge.json
      # imports from ../qontinui-web/frontend/... in src/lib/spec-registry.ts.
      # qontinui-web lives at jspinak/qontinui-web (private, needs CROSS_REPO_TOKEN);
      # the rest are public under github.com/qontinui/. pnpm install tolerates
      # broken link: targets, but `pnpm run tauri build`'s internal `tsc`/`vite
      # build` (triggered by tauri.conf.json's `beforeBuildCommand: "npm run
      # build"`) will fail without these clones. Mirrors ci.yml's test-job step.
      - name: Checkout sibling repos
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/ui-bridge.git
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
          git clone --depth 1 https://github.com/qontinui/ui-bridge-auto.git
          git clone --depth 1 https://github.com/qontinui/qontinui-workflow-ui.git
          git clone --depth 1 https://github.com/qontinui/qontinui-workflow-utils.git
          git clone --depth 1 https://github.com/qontinui/qontinui-navigation.git
          git clone --depth 1 "https://x-access-token:${CROSS_REPO_TOKEN}@github.com/jspinak/qontinui-web.git"
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Install transitive deps inside cloned siblings — vite resolves
      # @qontinui/* from sibling source via aliases (vite.config.ts:243-245),
      # so each sibling needs its own node_modules to satisfy peer deps.
      # See ci.yml's identical step for full rationale.
      - name: Install sibling dependencies
        shell: bash
        run: |
          set -e
          for sibling in ui-bridge ui-bridge-auto qontinui-workflow-ui qontinui-workflow-utils qontinui-navigation; do
            echo "::group::npm ci in $sibling"
            cd "$GITHUB_WORKSPACE/../$sibling"
            npm ci --no-audit --no-fund
            echo "::endgroup::"
          done
          echo "::group::npm ci in qontinui-schemas/ts"
          cd "$GITHUB_WORKSPACE/../qontinui-schemas/ts"
          npm ci --no-audit --no-fund
          echo "::endgroup::"

      # Download bundled Python executor if it was built
      - name: Download Python executor
        if: ${{ needs.build-python-executor.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: python-executors
          path: src-tauri/binaries/

      - name: List bundled executors
        if: ${{ needs.build-python-executor.result == 'success' }}
        shell: bash
        run: |
          echo "Bundled Python executors:"
          ls -la src-tauri/binaries/ || echo "No binaries directory"

      # Signing is disabled for alpha releases - will be enabled when certificates arrive
      # - name: Import Apple certificates (macOS)
      #   if: runner.os == 'macOS'
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #   run: |
      #     # Create variables
      #     CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
      #     KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
      #
      #     # Import certificate from secrets
      #     echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
      #
      #     # Create temporary keychain
      #     security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
      #     security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
      #     security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
      #
      #     # Import certificate to keychain
      #     security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
      #     security list-keychain -d user -s $KEYCHAIN_PATH

      # - name: Import Windows certificate
      #   if: runner.os == 'Windows'
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #     WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      #   run: |
      #     New-Item -ItemType directory -Path certificate
      #     Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
      #     certutil -decode certificate/tempCert.txt certificate/cert.pfx
      #     Remove-Item certificate/tempCert.txt

      - name: Build Tauri app
        # Tauri signing disabled for alpha - will be enabled when certificates arrive
        # env:
        #   TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm run tauri build -- --target ${{ matrix.target }}

      # - name: Sign Windows executable
      #   if: runner.os == 'Windows'
      #   run: |
      #     & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.17763.0/x86/signtool.exe' sign /fd SHA256 /f certificate/cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 src-tauri/target/release/bundle/msi/*.msi
      #     & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.17763.0/x86/signtool.exe' sign /fd SHA256 /f certificate/cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 src-tauri/target/release/bundle/nsis/*.exe

      # - name: Notarize macOS app
      #   if: runner.os == 'macOS'
      #   env:
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     # Find the .app bundle
      #     APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" -type d | head -n 1)
      #     DMG_PATH=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n 1)
      #
      #     # Notarize the DMG
      #     xcrun notarytool submit "$DMG_PATH" \
      #       --apple-id "$APPLE_ID" \
      #       --password "$APPLE_PASSWORD" \
      #       --team-id "$APPLE_TEAM_ID" \
      #       --wait
      #
      #     # Staple the notarization
      #     xcrun stapler staple "$DMG_PATH"

      - name: Generate checksums
        shell: bash
        run: |
          cd src-tauri/target/${{ matrix.target }}/release/bundle

          if [[ "${{ matrix.platform }}" == "ubuntu-22.04" ]]; then
            sha256sum deb/*.deb appimage/*.AppImage > checksums-${{ matrix.name }}.txt
          elif [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            shasum -a 256 dmg/*.dmg > checksums-${{ matrix.name }}.txt
          elif [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            certutil -hashfile msi/*.msi SHA256 > checksums-${{ matrix.name }}.txt
            certutil -hashfile nsis/*.exe SHA256 >> checksums-${{ matrix.name }}.txt
          fi

      - name: Upload release assets (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/checksums-${{ matrix.name }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/checksums-${{ matrix.name }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: true
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/checksums-${{ matrix.name }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-update-json:
    needs: [create-release, build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Generate update manifest
        run: |
          cat > update.json << EOF
          {
            "version": "v${{ needs.create-release.outputs.release_version }}",
            "notes": "Beta release with stability improvements and auto-update support",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${{ needs.create-release.outputs.release_version }}/qontinui-runner_${{ needs.create-release.outputs.release_version }}_x64.dmg"
              },
              "darwin-aarch64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${{ needs.create-release.outputs.release_version }}/qontinui-runner_${{ needs.create-release.outputs.release_version }}_aarch64.dmg"
              },
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${{ needs.create-release.outputs.release_version }}/qontinui-runner_${{ needs.create-release.outputs.release_version }}_amd64.AppImage"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${{ needs.create-release.outputs.release_version }}/qontinui-runner_${{ needs.create-release.outputs.release_version }}_x64.msi"
              }
            }
          }
          EOF

      - name: Upload update manifest
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: true
          files: update.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
