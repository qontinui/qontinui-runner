name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      # REQUIRED, and it cannot be defaulted away: on workflow_dispatch
      # GITHUB_REF is refs/heads/<branch>, so there is no tag to derive a
      # version from. Every workflow_dispatch run in this workflow's history
      # (three, all 2026-07-06) failed for exactly that reason — see the
      # "Resolve release version" step below.
      version:
        description: "Version to release, without the leading v (e.g. 1.0.8). The tag v<version> is created at the dispatched ref if it does not exist."
        type: string
        required: true
      include_bundled_python:
        description: "Bundle Python executor (zero-setup installation)"
        type: boolean
        default: true
      include_cuda:
        description: "Include CUDA support in bundled Python"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
  # The `build` job's `tauri build` runs `cargo build`, compiling the
  # `postgresql_embedded` (bundled) build script — a compile-time GitHub API
  # release enumeration that 403s on the unauthenticated 60/hr shared-IP budget.
  # Authenticate it here at workflow scope (the build job had no GITHUB_TOKEN).
  # Plan: 2026-07-04-runner-ci-postgresql-embedded-403-fix.
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Build Python executor for bundling (optional). Opt-in via workflow_dispatch
  # only — tag releases skip it to cut build-failure surface (the macOS Python
  # dependency install is flaky and the bundled executor is optional; the runner
  # falls back to a system Python). The `build` job already tolerates its absence
  # via the conditional "Download Python executor" step.
  build-python-executor:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.include_bundled_python != 'false' }}
    uses: ./.github/workflows/build-python-executor.yml
    with:
      include_cuda: ${{ github.event.inputs.include_cuda == 'true' }}
      include_sam3: true
    secrets: inherit

  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      release_upload_url: ${{ steps.create-release.outputs.upload_url }}
      release_version: ${{ steps.get_version.outputs.version }}

    steps:
      - uses: actions/checkout@v5

      # Resolve ONE version and derive the tag from it, so the two can never
      # disagree.
      #
      # The old one-liner was `version=${GITHUB_REF#refs/tags/v}`. That is a
      # prefix strip, not a match: on a tag push refs/tags/v1.0.6 correctly
      # becomes 1.0.6, but on workflow_dispatch GITHUB_REF is refs/heads/main,
      # the prefix does not match, and the value passes through UNSTRIPPED. The
      # release was then named "Qontinui Runner vrefs/heads/main (Beta)" and
      # publish-update-json looked up `gh release view "vrefs/heads/main"` ->
      # "release not found" -> exit 1. Compounding it, `tag_name` was
      # ${{ github.ref }}, so create-release would have tagged the release
      # "refs/heads/main" — the two did not even agree with each other. All
      # three workflow_dispatch runs in history failed this way (2026-07-06,
      # runs 28759763447 / 28761370633 / 28764507838); the trigger has never
      # once succeeded.
      - name: Resolve release version
        id: get_version
        env:
          # Bound through env rather than spliced in with ${{ }}: a dispatch
          # input is caller-supplied text, and interpolating it directly into a
          # run block would make it shell code.
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF#refs/tags/}"
            version="${version#v}"
          else
            version="${INPUT_VERSION#v}"
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Could not resolve a release version (got '${version}'). On a tag push the tag must look like vX.Y.Z; on workflow_dispatch pass the 'version' input, e.g. 1.0.8."
            exit 1
          fi

          # The resolved version MUST match the app version, because Tauri names
          # every bundle from tauri.conf.json — not from this input. Releasing
          # v1.0.8 against an app still pinned at 1.0.7 produces a release tagged
          # v1.0.8 whose assets are all named ..._1.0.7_..., and the Windows
          # updater manifest then advertises
          #   .../download/v1.0.8/Qontinui.Runner_1.0.8_x64-setup.exe
          # which 404s for every auto-updating client. Nothing downstream would
          # catch it: the Windows hard gate and the asset report both match on
          # `setup.exe` and are version-agnostic, so the release publishes green
          # with a dead updater. Assert it here, where it is still cheap.
          # This also guards the tag path against tagging without bumping.
          app_version="$(jq -r .version src-tauri/tauri.conf.json)"
          if [[ "${version}" != "${app_version}" ]]; then
            echo "::error::Release version '${version}' does not match src-tauri/tauri.conf.json version '${app_version}'. Tauri names bundles from tauri.conf.json, so these must agree or the release ships mislabelled assets and a 404ing updater manifest. Bump tauri.conf.json (and Cargo.toml) first."
            exit 1
          fi

          echo "Resolved version=${version} tag=v${version} (matches tauri.conf.json)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        id: create-release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Derived from the resolved version, never from github.ref. On a tag
          # push this is the tag that triggered the run; on workflow_dispatch
          # the tag is created at the dispatched ref. Either way it agrees with
          # release_version, which publish-update-json looks the release up by.
          tag_name: ${{ steps.get_version.outputs.tag }}
          # Without an explicit commitish the Releases API defaults
          # target_commitish to the repository's DEFAULT branch, so a dispatch
          # from any other branch would tag main's HEAD while the build job
          # builds the dispatched ref — tag and shipped code silently diverge.
          # Pin it to the ref this run is actually building.
          commitish: ${{ github.sha }}
          release_name: Qontinui Runner v${{ steps.get_version.outputs.version }} (Beta)
          draft: true
          prerelease: true
          body: |
            ## Qontinui Runner v${{ steps.get_version.outputs.version }} (Beta)

            ### ⚠️ Beta Release
            This is a beta release and may contain bugs. Please report any issues you encounter.

            ### Installation
            1. Download the appropriate installer for your platform
            2. Run the installer (you may need to allow it in your security settings)
            3. Launch Qontinui Runner from your applications

            ### Features
            - AI-assisted development with visual feedback loops
            - Orchestrated AI sessions with verification and self-correction
            - UI Bridge for real-time application inspection
            - Error monitoring and automated debugging

            ### What's New
            - Comprehensive error handling and recovery
            - User-friendly error messages
            - Automatic crash reporting
            - Auto-update capability
            - Beta status indicator

            ### Known Issues
            - Please check the [issues page](https://github.com/your-username/qontinui-runner/issues) for known issues

            ### Checksums
            Checksums will be added after the build completes.

  build:
    needs: [create-release, build-python-executor]
    # Run even if build-python-executor was skipped (when include_bundled_python is false)
    if: ${{ always() && needs.create-release.result == 'success' }}
    strategy:
      # Don't let one platform's failure cancel the others — a broken macOS leg
      # must not take down healthy Windows/Linux builds.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: linux-x64
          # NATIVE Intel image, deliberately not `macos-latest`.
          #
          # `macos-latest` is Apple Silicon (arm64), so building
          # `x86_64-apple-darwin` there is a CROSS-compile — and this workspace
          # cannot cross-compile it. The dependency chain
          # `qontinui-runner -> git2 -> libgit2-sys / libssh2-sys -> openssl-sys`
          # resolves OpenSSL through pkg-config in a build script, and pkg-config
          # refuses to run cross ("pkg-config has not been configured to support
          # cross-compilation"), so the leg died on every tagged release with
          # `error: failed to run custom build command for openssl-sys v0.9.116`
          # / "Could not find directory of OpenSSL installation" (v1.0.6 job
          # 88059428655, v1.0.7 job 92082478456). The arm64 leg was always green
          # precisely because it is native — pkg-config finds the image's own
          # OpenSSL. `macos-15-intel` is a GA native x86_64 image, so the Intel
          # leg becomes the same native build the arm64 leg already is.
          #
          # Do NOT "simplify" this back to macos-latest + git2/vendored-openssl.
          # OpenSSL was only the FIRST blocker; vendoring it would not have been
          # sufficient. tauri.conf.json's beforeBuildCommand runs
          # scripts/bundle-profile-sidecar.mjs, which derives the sidecar target
          # triple from `rustc -vV` HOST and states outright that cross-compile
          # "is NOT handled". Cross-building on the arm64 image would therefore
          # emit qontinui_profile-aarch64-apple-darwin while bundle.externalBin
          # demands the -x86_64-apple-darwin name — a bundle failure waiting
          # immediately behind the OpenSSL one. A native image fixes both at
          # once, and vendoring OpenSSL would additionally have saddled the
          # shipped binary with a statically linked copy for us to keep patched.
          #
          # EXPIRY: macos-15-intel / macos-26-intel are the last x86_64 macOS
          # images GitHub will offer (announced through Aug 2027). Before then,
          # either drop this leg or ship a universal binary from the arm64 leg
          # (lipo / universal-apple-darwin).
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            name: macos-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macos-arm64
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x64
            # NSIS only: the WiX/MSI bundler fails on the GitHub windows-latest
            # image with a bare "cannot find the file specified (os error 2)" at
            # bundle start (tool not found). NSIS is self-contained and produces
            # the -setup.exe installer the download page offers. Re-add msi once
            # WiX is fixed.
            bundles: nsis

    runs-on: ${{ matrix.platform }}
    # macOS + Linux installer legs are being restored (issue #656). Each platform
    # that DOES build now uploads its real installer (dmg / deb+AppImage / nsis)
    # via the per-platform upload steps below — so a green macOS or Linux leg
    # publishes its installer to the draft release. They remain non-blocking
    # (continue-on-error) until a tagged release run confirms they build clean:
    # this keeps a still-flaky non-Windows leg from taking down the proven Windows
    # build (the only platform shipped historically). Windows stays the sole hard
    # gate, so publish-update-json runs iff the Windows installers build (never an
    # empty/assetless release).
    #
    # GOAL: once a tagged release run shows macOS (x86_64 + aarch64) and Linux
    # build and bundle cleanly, DROP continue-on-error entirely (set it to false /
    # remove this expression) so every platform becomes a hard gate again.
    #
    # 2026-08-05 — the two root causes that kept that GOAL out of reach are fixed
    # in this change (Intel macOS moved to a native x86_64 image; the Linux leg
    # got ci.yml's disk + swap + CARGO_BUILD_JOBS guards). continue-on-error is
    # deliberately NOT flipped in the same change, because the GOAL above states
    # an EVIDENCE bar — "once a tagged release run shows ... cleanly" — and that
    # evidence cannot exist until a tag is pushed with these fixes in place.
    # Flipping the gate on unproven fixes would trade "two platforms silently
    # broken" for "no release can ship at all", which is strictly worse. The
    # invisibility that let this rot for eight releases is addressed instead by
    # the asset-completeness report in publish-update-json below, which surfaces
    # a missing platform installer on every run without blocking it.
    #
    # FLIP CONDITION (do this, don't leave it open-ended): when a tagged release
    # run shows all four legs green AND the release carries a .deb/.AppImage and
    # both x64 + aarch64 .dmg, delete this expression. If a leg proves flaky
    # rather than broken, gate the STABLE ones and leave only the flaky leg
    # non-blocking — do not keep all three non-blocking because one is unreliable.
    #
    # Keyed on matrix.name, NOT on the runner image label. This expression
    # decides which leg is the sole hard gate, so getting it wrong inverts the
    # gate rather than merely skipping a step. `matrix.platform != 'windows-latest'`
    # would silently evaluate TRUE for the Windows leg the moment that image is
    # pinned or renamed (`windows-2025`) — exactly what just happened to the
    # macOS Intel image — making Windows non-blocking and letting an assetless
    # release publish. matrix.name is workflow-authored and stable; image labels
    # churn. (`runner.os` is not available in a job-level expression.)
    continue-on-error: ${{ matrix.name != 'windows-x64' }}

    steps:
      - uses: actions/checkout@v5

      # qontinui-schemas is a workspace path-dep
      # (`qontinui-types = { path = "../../qontinui-schemas/rust" }`
      # in src-tauri/Cargo.toml). Without the sibling clone,
      # `cargo build` (invoked by `tauri build` below) fails to
      # resolve the path. Public org-owned repo, default github.token.
      #
      # Deliberately NOT using .github/actions/resolve-schemas-ref here, unlike
      # every other schemas clone in this repo: a release must be built against
      # LANDED schemas, never against an unlanded PR head.
      #
      # THE EXCLUSION IS A POLICY ABOUT RELEASE PROVENANCE — NOT a consequence
      # of how the action is keyed. It is worth being precise about that,
      # because the "in practice" version of this note goes stale every time the
      # action's key changes, and a stale reason invites a future session to
      # "tidy up" the exclusion. The action resolves only in a `pull_request`
      # context; this workflow is tag-push / workflow_dispatch and has none, so
      # wiring it up WOULD resolve to the default branch anyway — but that
      # coincidence is not the reason, and if it ever stopped being true the
      # exclusion would still stand.
      - name: Checkout sibling repos
        run: |
          cd "$GITHUB_WORKSPACE/.."
          git clone --depth 1 https://github.com/qontinui/qontinui-schemas.git
        shell: bash

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      # The repo pins the toolchain via `rust-toolchain.toml` (channel = "1.95.0").
      # dtolnay/rust-toolchain@stable installs *stable* and adds `targets:` to
      # stable — but `cargo build` (run inside the repo by `tauri build`) honors
      # the rust-toolchain.toml override and uses 1.95.0 instead, which does NOT
      # have the cross-target std. That mismatch is the real cause of the macOS
      # `error[E0463]: can't find crate for 'core'` (libc) failure on the Intel
      # leg: the target was added to the wrong toolchain. Install the toolchain
      # that the override actually selects, and add the matrix target to IT.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      # Belt-and-braces: `rustup target add` is run from the repo dir, so it
      # respects the rust-toolchain.toml override and adds the target to the
      # 1.95.0 toolchain the build actually uses (dtolnay's `targets:` adds it to
      # whatever toolchain IT installed, which is the same one here — but state
      # it explicitly). Both macOS legs now run on an image whose native arch
      # matches matrix.target, so this is a no-op in the normal case; it is kept
      # as a cheap guard against a future image/target mismatch. Idempotent, and
      # gated to macOS so the Linux/Windows legs are untouched.
      - name: Add Rust target (macOS)
        if: runner.os == 'macOS'
        run: rustup target add ${{ matrix.target }}
        shell: bash

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # ---- Linux OOM / disk guards ----------------------------------------
      # The ubuntu leg has NEVER completed a release build. v1.0.6 (job
      # 88059428656) died with
      #   "##[error]The runner has received a shutdown signal. This can happen
      #    when the runner service is stopped, or a manually started runner is
      #    canceled."
      # and v1.0.7 (job 92082478521) went silent for 9m31s mid-compile
      # (18:19:08 -> 18:28:39) and was then cancelled. That is verbatim the
      # signature ci.yml already documents for this exact workspace on this
      # exact image: "on Linux the OOM-killer takes the runner agent down ->
      # 'shutdown signal ... exit code 143'". ci.yml's ubuntu leg compiles this
      # workspace successfully only BECAUSE of the two guards below; release.yml
      # had neither, which is the whole difference. Keep them in sync with
      # ci.yml — if one is retuned there, retune it here.
      - name: Free disk space (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        uses: jlumbroso/free-disk-space@main
        with:
          # tool-cache stays: setup-node / setup-rust read from it.
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          # MUST stay false — `large-packages: true` cascade-removes the GTK/GDK
          # apt libs the Tauri build links against (ci.yml observed "system
          # library gdk-3.0 required by crate gdk-sys was not found").
          large-packages: false
          docker-images: true
          # The swapfile step below manages swap itself.
          swap-storage: false

      - name: Add swapfile (Ubuntu — guard against link-time OOM)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "=== free / df after swap setup ==="
          free -h
          df -h
          # Second half of the guard: cap parallel rustc codegen so the peak is
          # lower to begin with. ci.yml pins JOBS=1 on ubuntu for its `Run Rust
          # tests` step on this same workspace.
          #
          # Cite that precisely, because ci.yml is NOT uniformly JOBS=1: its
          # `Build Tauri app (development)` step runs at cargo's default
          # parallelism without OOMing. That is not evidence this step is safe
          # at the default, though — ci.yml's Tauri build is `--debug
          # --no-bundle`, whereas this one is a bundling release build, whose
          # per-crate codegen peak is the higher of the two. Since the Linux leg
          # has never once completed here, there is no local evidence of what
          # parallelism it survives at, so start conservative.
          #
          # If wall-clock becomes the problem rather than OOM, JOBS=2 is the
          # next thing to try (that is the value ci.yml settled on for Windows)
          # — do not just delete the cap. Note this also caps the sidecar build
          # that tauri.conf.json's beforeBuildCommand kicks off, so the ubuntu
          # leg serializes two cold compiles; there is no cargo cache here.
          #
          # Exported here rather than as a matrix-wide `env:` on the build step
          # so the macOS/Windows legs — which already build clean — keep their
          # default parallelism and are not slowed down.
          echo "CARGO_BUILD_JOBS=1" >> "$GITHUB_ENV"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # Download bundled Python executor if it was built
      - name: Download Python executor
        if: ${{ needs.build-python-executor.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: python-executors
          path: src-tauri/binaries/

      - name: List bundled executors
        if: ${{ needs.build-python-executor.result == 'success' }}
        shell: bash
        run: |
          echo "Bundled Python executors:"
          ls -la src-tauri/binaries/ || echo "No binaries directory"

      # Signing is disabled for alpha releases - will be enabled when certificates arrive
      # - name: Import Apple certificates (macOS)
      #   if: runner.os == 'macOS'
      #   env:
      #     APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      #     APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      #     APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #   run: |
      #     # Create variables
      #     CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
      #     KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
      #
      #     # Import certificate from secrets
      #     echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $CERTIFICATE_PATH
      #
      #     # Create temporary keychain
      #     security create-keychain -p "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
      #     security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
      #     security unlock-keychain -p "$APPLE_CERTIFICATE_PASSWORD" $KEYCHAIN_PATH
      #
      #     # Import certificate to keychain
      #     security import $CERTIFICATE_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
      #     security list-keychain -d user -s $KEYCHAIN_PATH

      # - name: Import Windows certificate
      #   if: runner.os == 'Windows'
      #   env:
      #     WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      #     WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      #   run: |
      #     New-Item -ItemType directory -Path certificate
      #     Set-Content -Path certificate/tempCert.txt -Value $env:WINDOWS_CERTIFICATE
      #     certutil -decode certificate/tempCert.txt certificate/cert.pfx
      #     Remove-Item certificate/tempCert.txt

      # Tauri's NSIS bundler auto-downloads its toolset (makensis + plugins) and
      # the WebView2 bootstrapper into %LOCALAPPDATA%\tauri on first use. On a
      # fresh windows-latest runner that download happens every run; caching the
      # dir skips it on cache-hit. (Note: the recurring "os error 2" at bundle
      # start, once suspected to be this download — issue #654 — was actually
      # the --target flag being hidden from tauri behind `--`; see the Build
      # step below.) Keyed on the OS so each platform gets its own cache slot.
      - name: Cache Tauri bundler toolchain
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-toolchain-${{ runner.os }}-v1

      # Belt-and-braces for the os-error-2 failure: pre-install a system NSIS so
      # `makensis` is guaranteed on PATH even if Tauri's own download of its NSIS
      # toolset fails or is rate-limited. Chocolatey is preinstalled on the
      # GitHub windows-latest image. This is fast and idempotent (cache-friendly).
      - name: Ensure NSIS is installed (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          } else {
            Write-Host "makensis already available: $((Get-Command makensis).Source)"
          }

      - name: Build Tauri app
        # Updater signing: with createUpdaterArtifacts=true, `tauri build`
        # signs each bundle and emits a `<installer>.sig` next to it. The
        # runner's updater plugin verifies that signature against the pubkey in
        # tauri.conf.json. Both secrets must be set in the repo.
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # --target must be tauri's OWN flag, not behind `--`. Under npm the
        # first `--` was eaten by npm itself, so tauri saw `--target`; pnpm
        # passes `--` through verbatim, which made tauri forward --target to
        # cargo only. Cargo then wrote the exe to target/<triple>/release/
        # while the bundler (unaware of the target) looked in target/release/
        # — the root cause of the "cannot find the file specified (os error
        # 2)" right after "Built application" on every 1.0.x release run.
        run: pnpm run tauri build --verbose ${{ matrix.bundles && format('--bundles {0}', matrix.bundles) || '' }} --target ${{ matrix.target }}

      # - name: Sign Windows executable
      #   if: runner.os == 'Windows'
      #   run: |
      #     & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.17763.0/x86/signtool.exe' sign /fd SHA256 /f certificate/cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 src-tauri/target/release/bundle/msi/*.msi
      #     & 'C:/Program Files (x86)/Windows Kits/10/bin/10.0.17763.0/x86/signtool.exe' sign /fd SHA256 /f certificate/cert.pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td SHA256 src-tauri/target/release/bundle/nsis/*.exe

      # - name: Notarize macOS app
      #   if: runner.os == 'macOS'
      #   env:
      #     APPLE_ID: ${{ secrets.APPLE_ID }}
      #     APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      #     APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      #   run: |
      #     # Find the .app bundle
      #     APP_PATH=$(find src-tauri/target/release/bundle/macos -name "*.app" -type d | head -n 1)
      #     DMG_PATH=$(find src-tauri/target/release/bundle/dmg -name "*.dmg" | head -n 1)
      #
      #     # Notarize the DMG
      #     xcrun notarytool submit "$DMG_PATH" \
      #       --apple-id "$APPLE_ID" \
      #       --password "$APPLE_PASSWORD" \
      #       --team-id "$APPLE_TEAM_ID" \
      #       --wait
      #
      #     # Staple the notarization
      #     xcrun stapler staple "$DMG_PATH"

      - name: Generate checksums
        shell: bash
        # The repo root is a cargo workspace, so build artifacts land in the
        # workspace-root target/ dir (target/<triple>/release/bundle), not
        # src-tauri/target/.
        # Branch on RUNNER_OS, never on the matrix runner LABEL. The previous
        # `matrix.platform == 'macos-latest'` comparison silently matched
        # nothing the moment a macOS leg moved to a different image label
        # (macos-15-intel) — no branch would run, the step would exit 0, and the
        # upload would then fail on a checksums file that was never written. The
        # explicit `*)` arm turns any future image change into a loud failure
        # instead of a silent no-op.
        run: |
          cd target/${{ matrix.target }}/release/bundle

          case "$RUNNER_OS" in
            Linux)
              sha256sum deb/*.deb appimage/*.AppImage > checksums-${{ matrix.name }}.txt
              ;;
            macOS)
              shasum -a 256 dmg/*.dmg > checksums-${{ matrix.name }}.txt
              ;;
            Windows)
              # NSIS-only build (see matrix.bundles) — no msi/ dir is produced.
              certutil -hashfile nsis/*.exe SHA256 > checksums-${{ matrix.name }}.txt
              ;;
            *)
              echo "::error::Unhandled RUNNER_OS '$RUNNER_OS' — no checksum recipe for this image."
              exit 1
              ;;
          esac

      - name: Upload release assets (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: true
          files: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/checksums-${{ matrix.name }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release assets (macOS)
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: true
          files: |
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/checksums-${{ matrix.name }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate updater manifest (Windows)
        if: runner.os == 'Windows'
        shell: bash
        # createUpdaterArtifacts=true makes `tauri build` sign each bundle and
        # emit <installer>.sig next to it. Assemble the Tauri v2 updater
        # manifest (latest.json) carrying the REAL signature, so an installed
        # runner can verify + apply the update against the pubkey embedded in
        # tauri.conf.json. Windows is the sole shipped platform, so a
        # Windows-only manifest is correct. Fails loudly if the .sig is absent
        # (signing key not set) — never ship an unverifiable "auto-update".
        run: |
          cd target/${{ matrix.target }}/release/bundle/nsis
          sig_file=$(ls *-setup.exe.sig 2>/dev/null | head -1)
          if [[ -z "$sig_file" ]]; then
            echo "::error::No .sig produced — is TAURI_SIGNING_PRIVATE_KEY set and createUpdaterArtifacts=true?";
            exit 1;
          fi
          sig=$(cat "$sig_file")
          ver="${{ needs.create-release.outputs.release_version }}"
          cat > latest.json << EOF
          {
            "version": "v${ver}",
            "notes": "See https://github.com/${{ github.repository }}/releases/tag/v${ver} for release notes.",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "windows-x86_64": {
                "signature": "${sig}",
                "url": "https://github.com/${{ github.repository }}/releases/download/v${ver}/Qontinui.Runner_${ver}_x64-setup.exe"
              }
            }
          }
          EOF
          echo "Generated latest.json:"; cat latest.json

      - name: Upload release assets (Windows)
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: true
          files: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            target/${{ matrix.target }}/release/bundle/nsis/latest.json
            target/${{ matrix.target }}/release/bundle/checksums-${{ matrix.name }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-update-json:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    # Run even when the non-blocking (continue-on-error) macOS/Linux legs fail.
    # A failed leg makes `needs.build` non-success, which was SILENTLY SKIPPING
    # this whole job — so releases never actually auto-published (v1.0.0 and
    # v1.0.1 both had to be un-drafted by hand). `always()` lets it run; the
    # asset-verify step below still guarantees we never publish an assetless
    # release, keeping Windows the sole hard gate.
    if: ${{ always() && needs.create-release.result == 'success' }}

    steps:
      - uses: actions/checkout@v5

      # VISIBILITY, not a gate. Every release from v1.0.0 through v1.0.7
      # published green while the macOS x86_64 and Linux legs were failing —
      # invisible precisely because the non-Windows legs are continue-on-error,
      # so the RUN was green and nobody had a reason to look. v1.0.6 and v1.0.7
      # each shipped with no Linux .deb/.AppImage and no Intel .dmg at all.
      # This step makes the gap legible on the run itself (job-summary table +
      # a warning annotation per missing platform) WITHOUT changing what gates
      # the publish. It is `continue-on-error` so a bug in this reporting can
      # never be the thing that blocks a release — the hard gate below is
      # deliberately left untouched and remains the only merge-stopper.
      - name: Report platform asset completeness
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Bound through env, not spliced in with ${{ }}: a tag name may contain
          # backticks, $(), ; and | (git check-ref-format permits them), which
          # inside double quotes would be command substitution.
          RELEASE_VERSION: ${{ needs.create-release.outputs.release_version }}
        run: |
          {
            echo "### Release asset completeness"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          # `|| true`: this step runs under bash -e, so a failed `gh` would
          # abort it at line 1 — no table, no warnings, nothing said. A silent
          # green step reads exactly like "all four platforms present", which is
          # the very invisibility this step exists to defeat. Say so instead.
          names=$(gh release view "v${RELEASE_VERSION}" \
            --repo "${{ github.repository }}" --json assets --jq '.assets[].name') || names=""

          if [ -z "$names" ]; then
            echo "::warning::Asset report unavailable — could not read the release 'v${RELEASE_VERSION}'. This is NOT a statement that assets are present; the check did not run."
            echo "Asset report **unavailable** — \`gh release view\` returned nothing for \`v${RELEASE_VERSION}\`. This is not evidence the assets are present." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "| Platform | Expected installer | Present |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          missing=""
          check() {
            if printf '%s\n' "$names" | grep -qiE "$2"; then
              echo "| $1 | \`$2\` | yes |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $1 | \`$2\` | **NO** |" >> "$GITHUB_STEP_SUMMARY"
              missing="${missing}${1} "
            fi
          }
          # Patterns match Tauri's bundle naming, e.g.
          # Qontinui.Runner_1.0.7_x64-setup.exe / _aarch64.dmg / _x64.dmg.
          # Anchor the leading underscore so _x64.dmg cannot be confused with
          # _aarch64.dmg (and vice versa).
          check "windows-x64" '_x64-setup\.exe$'
          check "macos-arm64" '_aarch64\.dmg$'
          check "macos-x64"   '_x64\.dmg$'
          check "linux-x64"   '\.(deb|AppImage)$'

          for m in ${missing}; do
            if [ "$m" != "windows-x64" ]; then
              echo "::warning::No installer asset for ${m} — that platform's build leg did not produce one. Check the build job for ${m}; it is continue-on-error, so its failure does NOT show up as a red run."
            fi
          done

      # Hard gate: only proceed if the Windows installer actually built and
      # uploaded. Fails the job (leaving the release a draft) otherwise, so a
      # broken Windows leg never yields a published-but-empty "latest" release.
      - name: Verify Windows installer uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          names=$(gh release view "v${{ needs.create-release.outputs.release_version }}" \
            --repo "${{ github.repository }}" --json assets --jq '.assets[].name')
          echo "Release assets:"; echo "$names"
          echo "$names" | grep -qi 'setup\.exe' || {
            echo "::error::No Windows -setup.exe asset on the release — refusing to publish an empty release.";
            exit 1;
          }

      # The updater manifest (latest.json) is now produced by the Windows
      # build leg ("Generate updater manifest (Windows)") with the REAL
      # signature read from the bundler's .sig, and uploaded to the draft
      # release there. The old hand-rolled update.json here carried empty
      # signatures + a wrong (.msi) URL, so the updater could never verify —
      # it has been removed. This job now only gates on the Windows installer
      # and flips the release to published + latest.

      # All platform installers, checksums, and the update manifest are now
      # uploaded to the draft release. Flip it to published + non-prerelease as
      # the final step so it resolves as GitHub's "latest" release (which the
      # qontinui.io download endpoints query) and the auto-updater can see it.
      # Doing this last means users never see a release with missing assets.
      # The "(Beta)" label stays in the release title.
      - name: Publish release (un-draft, mark as latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "v${{ needs.create-release.outputs.release_version }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --prerelease=false \
            --latest
