name: resource-report tests

# Fixture tests for scripts/ci/resource-report.sh, the emitter `ci.yml`'s
# `Report this job's resources` steps run at the end of every heavy job, plus
# a parse check of scripts/ci/resource-report-windows.ps1 and a LIVE reading
# on each OS (the only place the Windows reader runs against a real host).
# No network and no cargo.
# Plan: 2026-10-27-coord-routes-ci-jobs-by-runner-capability, Phase 2.

on:
  push:
    branches: [main]
    paths:
      - "scripts/ci/resource-report.sh"
      - "scripts/ci/resource-report-windows.ps1"
      - "scripts/tests/test_resource_report.sh"
      - "scripts/tests/fixtures/resource-report/**"
      - ".github/workflows/resource-report-tests.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/ci/resource-report.sh"
      - "scripts/ci/resource-report-windows.ps1"
      - "scripts/tests/test_resource_report.sh"
      - "scripts/tests/fixtures/resource-report/**"
      - ".github/workflows/resource-report-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR-SCOPED SUPERSESSION (shared hosted-job cap relief, 2026-10-05). A FIRST-
# attempt `pull_request` run joins a per-workflow, per-PR group and cancels the
# run it supersedes there: a `synchronize` cancels the older head's run, and a
# `reopened` cancels the same-head run it re-does (coord's ci-abandoned
# recovery is a close+reopen). Every OTHER run -- whichever of push (main,
# develop, merge-candidate*/** -- coord's candidate CI), schedule,
# workflow_dispatch and workflow_run this file has, and EVERY re-run (run_attempt > 1) -- gets a
# group unique to its run id + attempt, so it is never cancelled, never reaped
# while pending, and never queues behind anything.
# The group is ONE expression on purpose: coord models a group template by
# interpolating only `github.event_name` / `github.ref` and collapsing every
# other expression to "" (qontinui-coord ci_observer.rs resolve_group_template),
# and run_is_reaper_at_risk never matches an empty group, so no push run here is
# modelled as reapable by a land. (KNOWN coord gap: the budget-cancel candidate
# scan in stuck_pr_watcher.rs compares groups with `=`, so every "" group
# matches every other one and suppresses its auto re-run; fix belongs in coord.)
# RESIDUAL: two pushes seconds apart can have
# their runs CREATED out of order, so the older head's run cancels the newer
# head's; the next push (or a close+reopen) heals it.
# Pattern: qontinui-claude-config#1475.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  selftest:
    name: resource-report selftest (${{ matrix.os }})
    # windows-latest too: the report runs under Git Bash on the Windows legs
    # of `test` and `clippy-windows`, reading through powershell, and that
    # reader can only be exercised on a real Windows host.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Test the resource-report emitter (fixtures + live reading, no network)
        shell: bash
        run: bash scripts/tests/test_resource_report.sh
