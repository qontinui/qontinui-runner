name: schema.pg.sql.generated freshness

# Runs the Clorinde schema regenerator and fails if the checked-in
# schema.pg.sql.generated differs from a fresh dump. This is the
# Phase 6 deliverable of the migration consolidation
# (D:/qontinui-root/tmp_migration_consolidation_plan.md §"Phase 5"
# verification gate).
#
# Trigger posture
# ---------------
# Active on every PR (post-transplant). The consolidation chain now lives
# in `qontinui-web/backend/alembic/versions/` and the workflow checks out
# both repos; the gate ensures `schema.pg.sql.generated` doesn't drift
# from a fresh `alembic upgrade head + pg_dump`. `workflow_dispatch` is
# kept for manual reruns. Paths are repo-relative (no `qontinui-runner/`
# prefix — the trigger filter operates on changed files in this repo).

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "src-tauri/queries/**"
      - "src-tauri/schema.pg.sql.generated"

jobs:
  schema-fresh:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: qontinui_user
          POSTGRES_PASSWORD: qontinui_dev_password
          POSTGRES_DB: qontinui_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U qontinui_user -d qontinui_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout qontinui-runner
        uses: actions/checkout@v4
        with:
          path: qontinui-runner

      - name: Resolve qontinui-web sibling ref
        id: web_ref
        # Probe whether the PR's branch name exists on jspinak/qontinui-web;
        # fall back to `main` when it doesn't. The previous logic used
        # `${{ github.head_ref || github.ref_name }}` directly, which made
        # the subsequent checkout fail with `git` exit 1 whenever the PR
        # branch only existed in qontinui-runner — see the cross-repo
        # branch-fallback gap noted in CONTRIBUTING-merge-readiness.
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${CANDIDATE_REF:-}" ]; then
            echo "No candidate ref available; falling back to main."
            echo "ref=main" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/jspinak/qontinui-web/branches/${CANDIDATE_REF}" >/dev/null 2>&1; then
            echo "Sibling branch ${CANDIDATE_REF} exists on jspinak/qontinui-web."
            echo "ref=${CANDIDATE_REF}" >> "$GITHUB_OUTPUT"
          else
            echo "Sibling branch ${CANDIDATE_REF} not found on jspinak/qontinui-web; falling back to main."
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout qontinui-web (sibling)
        uses: actions/checkout@v4
        with:
          # Hardcoded to jspinak/qontinui-web because the repo was
          # transferred from the qontinui org to the jspinak account.
          # `${{ github.repository_owner }}/qontinui-web` resolved to
          # `qontinui/qontinui-web` (since this repo lives in the
          # qontinui org) and the HTTPS clone returns 404 — GitHub's
          # repo-rename redirect doesn't help when the cross-repo token
          # only has access to jspinak/*.
          repository: jspinak/qontinui-web
          path: qontinui-web
          # Use the same branch name if it exists in qontinui-web,
          # otherwise main. The previous step probes branch existence
          # so this checkout never tries to clone a nonexistent ref.
          ref: ${{ steps.web_ref.outputs.ref }}
          # CROSS_REPO_TOKEN must have Contents:Read on jspinak/qontinui-web
          # (qontinui-web is private). Falling back to github.token will fail.
          token: ${{ secrets.CROSS_REPO_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install alembic dependencies
        working-directory: qontinui-web/backend
        run: |
          python -m pip install --upgrade pip
          # `pgvector` is required because qontinui-web's models import
          # `pgvector.sqlalchemy.Vector` at module load time
          # (see backend/app/models/execution_issue.py); alembic env.py
          # imports the model graph during `upgrade head`, so without
          # this dep the gate dies with ModuleNotFoundError before any
          # migration runs. Pin matches backend/pyproject.toml's
          # `pgvector = "^0.4.2"`.
          pip install alembic sqlalchemy psycopg2-binary python-dotenv "pgvector>=0.4.2,<0.5"

      - name: Apply alembic chain
        working-directory: qontinui-web/backend
        env:
          DATABASE_URL: postgresql://qontinui_user:qontinui_dev_password@localhost:5433/qontinui_db
        run: alembic upgrade head

      - name: Install Postgres client (for pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client-16

      - name: Stash checked-in artifact
        working-directory: qontinui-runner/src-tauri
        run: cp schema.pg.sql.generated /tmp/schema.checked-in.sql

      - name: Regenerate (native pg_dump, no docker)
        working-directory: qontinui-runner
        env:
          # Empty CLORINDE_PG_CONTAINER triggers the script's native
          # pg_dump path (no docker-exec). Postgres client was installed
          # in the previous step.
          CLORINDE_PG_CONTAINER: ""
          CLORINDE_PG_HOST: localhost
          CLORINDE_PG_PORT: "5433"
          PGPASSWORD: qontinui_dev_password
        run: bash src-tauri/scripts/regenerate_schema_pg_sql.sh

      - name: Diff against checked-in
        working-directory: qontinui-runner/src-tauri
        run: |
          if ! diff -q /tmp/schema.checked-in.sql schema.pg.sql.generated; then
            echo "::error::schema.pg.sql.generated is stale relative to a fresh alembic upgrade head + pg_dump."
            echo "::error::Regenerate locally via:"
            echo "::error::  bash src-tauri/scripts/regenerate_schema_pg_sql.sh"
            echo ""
            echo "Diff:"
            diff -u /tmp/schema.checked-in.sql schema.pg.sql.generated | head -80
            exit 1
          fi
          echo "schema.pg.sql.generated is up to date."
