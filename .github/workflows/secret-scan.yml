name: Secret Scan
on:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run gitleaks (binary — the marketplace action requires a paid org license)
        run: |
          set -euo pipefail
          # Pinned: the anonymous /releases/latest probe gets rate-limited on
          # shared runners (60 req/hr/IP across the whole hosted fleet). The
          # response then has no tag_name, `grep -oP` exits 1, and `bash -e`
          # kills this step in ~88ms — BEFORE the download, having scanned
          # nothing — which surfaces as a bogus secret-scan FAILURE on a clean
          # diff. A secret gate that cries wolf is worse than no gate: it
          # trains reviewers to wave through exactly the check that must never
          # be waved through. Bump deliberately, in its own PR, so a gitleaks
          # rule change is reviewed like any other change to a security
          # control. Matches qontinui-schemas' fix for the same defect.
          GL=8.30.1
          echo "gitleaks v${GL} (pinned)"
          curl -fsSL --retry 3 --retry-delay 2 --retry-all-errors \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          # A scanner we could not obtain must fail ATTRIBUTABLY, never as a
          # bare exit 1 that reads as a leak finding.
          test -x ./gitleaks || {
            echo "::error::gitleaks binary missing after download — THE SCAN DID NOT RUN. This is an infrastructure failure, not a leak finding."
            exit 1
          }
          ./gitleaks version
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
