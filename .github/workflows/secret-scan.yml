name: Secret Scan
on:
  pull_request:
permissions:
  contents: read
# PR-SCOPED SUPERSESSION (shared hosted-job cap relief, 2026-10-05). A FIRST-
# attempt `pull_request` run joins a per-workflow, per-PR group and cancels the
# run it supersedes there: a `synchronize` cancels the older head's run, and a
# `reopened` cancels the same-head run it re-does (coord's ci-abandoned
# recovery is a close+reopen). Every OTHER run -- whichever of push (main,
# develop, merge-candidate*/** -- coord's candidate CI), schedule,
# workflow_dispatch and workflow_run this file has, and EVERY re-run (run_attempt > 1) -- gets a
# group unique to its run id + attempt, so it is never cancelled, never reaped
# while pending, and never queues behind anything.
# The group is ONE expression on purpose: coord models a group template by
# interpolating only `github.event_name` / `github.ref` and collapsing every
# other expression to "" (qontinui-coord ci_observer.rs resolve_group_template),
# and run_is_reaper_at_risk never matches an empty group, so no push run here is
# modelled as reapable by a land. (KNOWN coord gap: the budget-cancel candidate
# scan in stuck_pr_watcher.rs compares groups with `=`, so every "" group
# matches every other one and suppresses its auto re-run; fix belongs in coord.)
# RESIDUAL: two pushes seconds apart can have
# their runs CREATED out of order, so the older head's run cancels the newer
# head's; the next push (or a close+reopen) heals it.
# Pattern: qontinui-claude-config#1475.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.run_attempt == 1) && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}-{2}', github.workflow, github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  gitleaks:
    name: Gitleaks Secret Detection
    # coord-pools: [self-hosted, Linux, X64, qontinui-host-nawa, qontinui, ram-2g] | [ubuntu-latest]
    runs-on: ${{ fromJSON(((vars.RUNNER_CI_LANE_SECRET_SCAN || vars.RUNNER_CI_LIGHT_LANE) == 'self-hosted' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)) && '["self-hosted","Linux","X64","qontinui-host-nawa","qontinui","ram-2g"]' || '"ubuntu-latest"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned, sha256-verified, host-cached fetch; the script's header says
      # why (canonical copy: qontinui-coord .github/scripts/fetch-gitleaks.sh).
      # Never rename this step with a "Set up "/"Setup "/"Cache" prefix:
      # coord's INFRA_STEP_PREFIXES would make a failed fetch bypass-landable
      # on merge-candidate CI, and a secret scan that did not run must block.
      # A version bump is its own PR and re-derives GITLEAKS_SHA256 from the
      # release's gitleaks_<version>_checksums.txt. The script itself is pinned
      # by sha256 below, so a change to it is a change to this file too (and so
      # seen by every workflow-file guard); update the pin in all seven repos.
      - name: Fetch gitleaks (pinned, sha256-verified, host-cached)
        id: gitleaks
        # Cold worst case about 3 min (curl --retry-max-time 120 plus one
        # --max-time 60 attempt); a cache hit is a copy and a sha256 check.
        timeout-minutes: 4
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          echo "f2702c6bee2275cc9d3daaf0d8f6d22b05fe3a3fadfd4fe7e13a93546d1f2de2  .github/scripts/fetch-gitleaks.sh" | sha256sum -c --quiet - \
            || { echo "::error title=fetch-gitleaks.sh does not match its pinned sha256::the script this workflow pins was changed without updating the pin here."; exit 1; }
          bash .github/scripts/fetch-gitleaks.sh
      - name: Run gitleaks
        env:
          GITLEAKS: ${{ steps.gitleaks.outputs.bin }}
          SCAN_BASE: ${{ github.event.pull_request.base.sha }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "scan range: ${SCAN_BASE}..${SCAN_HEAD}"
          "$GITLEAKS" version
          # --exit-code 3: leaks found = 3; a gitleaks error is any other nonzero
          # (1, or 2 on a config panic); the fetch step's 75 is neither. Both ARE
          # verdicts (a broken .gitleaks.toml can come from the diff), so neither
          # title carries coord's not-a-verdict phrase.
          rc=0
          "$GITLEAKS" detect --source . --config .gitleaks.toml --redact --no-banner \
            --exit-code 3 --log-opts="${SCAN_BASE}..${SCAN_HEAD}" || rc=$?
          case "$rc" in
            0) ;;
            3) echo "::error title=Gitleaks found leaks::gitleaks reported leaks in ${SCAN_BASE}..${SCAN_HEAD} (see the findings above)."
               exit 3 ;;
            *) echo "::error title=Gitleaks errored (exit $rc)::gitleaks itself failed (exit $rc), so the scan did not complete; a broken .gitleaks.toml in the diff can cause this."
               exit "$rc" ;;
          esac
