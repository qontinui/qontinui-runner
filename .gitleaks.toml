# Self-contained gitleaks config. `[extend] useDefault = true` is load-bearing:
# without it gitleaks has NO rules and detects nothing.
[extend]
useDefault = true

[allowlist]
description = "qontinui allowlist — paths/regexes exempt from scanning"
paths = [
  '''docs/examples/.*''',
  '''.*/__snapshots__/.*''',
  '''.*\.lock$''',
]
regexes = [
  '''(?i)(dummy|example|sample|test|placeholder|changeme|your[-_]?)[-_]?(secret|token|key|password)''',
  '''AKIAIOSFODNN7EXAMPLE''',
  # Synthetic fixtures in src-tauri/src/session_archive/secret_detector.rs's own
  # unit tests. A secret DETECTOR has to contain secret-shaped strings to prove
  # it fires on them -- and, for the JWT, to prove it deliberately does NOT.
  # Neither string is a credential: both are keyboard-sequence filler, and the
  # JWT's signature segment is the base64 of the literal word "signature".
  #
  # Allowlisted as exact literals rather than by path, matching
  # AKIAIOSFODNN7EXAMPLE above (already exempted for this same file). A path
  # exemption would stop scanning the detector's REAL code too, which is the one
  # place in this repo most likely to grow a copy-pasted live credential.
  # Widening either literal by one character re-arms the rule.
  '''ghp_1234567890abcdefABCDEF1234567890abcd''',
  '''eyJhbGciOiJSUzI1NiIsImtpZCI6ImFiYyJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIiwiZXhwIjoxNzg3NzM1MjMzfQ\.c2lnbmF0dXJl''',
  # Synthetic report-token fixtures in src-tauri/src/agent_runtime.rs's own unit
  # tests (all inside `#[cfg(test)]`, which begins well above every use). The
  # code under test VALIDATES a report token's shape -- exactly 32 lowercase hex
  # -- so its fixtures have to BE 32 lowercase hex, which is also precisely the
  # shape `generic-api-key` fires on. Neither value is a credential: the first
  # is filler, the second is `0123456789abcdef` twice.
  #
  # Exact literals, not a path exemption, for the same reason the two entries
  # above give: exempting the path would stop scanning agent_runtime.rs's real
  # code, which POSTs to coord and attaches device auth -- a far likelier home
  # for a pasted live credential than its test module. Widening either literal
  # by one character re-arms the rule, so the 31- and 33-char boundary fixtures
  # on the neighbouring lines stay scanned.
  '''9f1c4b2ad0e34f7a8b6c5d4e3f2a1b09''',
  '''0123456789abcdef0123456789abcdef''',
  # The RFC 6455 section 1.3 example `Sec-WebSocket-Key` -- base64 of the ASCII
  # "the sample nonce" -- sent by the origin guard's WebSocket handshake test in
  # src-tauri/src/mcp/origin_guard/tests.rs to prove a refused Origin never gets
  # a 101. A handshake key is a per-connection nonce the client makes up, never
  # a credential; `generic-api-key` fires on it only because of the header name.
  # Exact literal, matching the entries above: any other key value stays scanned.
  '''dGhlIHNhbXBsZSBub25jZQ==''',
  # The fake agent JWT the bundled return-to-main skill's own suite hands its
  # curl stub (src-tauri/src/fleet_skills/return-to-main/recovery-ref-census-test.sh,
  # the `/agents/credential` arm): header `{"alg":"none"}`, payload
  # `{"exp":9999999999}`, signature the base64 of the literal "sig". It proves
  # the census reads a minted token off the response; it opens nothing. The
  # file is a byte-for-byte carry of qontinui-claude-config's
  # `.claude/skills/return-to-main/` (the fleet-skills parity check compares
  # them), so the fixture cannot be respelled here without forking the bundle.
  # Exact literal, as above: any other token value in that tree stays scanned.
  '''eyJhbGciOiJub25lIn0\.eyJleHAiOjk5OTk5OTk5OTl9\.c2ln''',
]
