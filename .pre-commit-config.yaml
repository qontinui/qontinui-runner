repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict

  # ESLint and cargo clippy are intentionally omitted here — they run too
  # slowly to gate every commit in the shared multi-agent tree. CI and
  # cargo-guard.sh already enforce them.

  - repo: local
    hooks:
      # Drift guard for the Tauri event payload TypeScript bindings.
      # Triggers when any of the source-of-truth Rust files change. The hook
      # regenerates the bindings INTO A SCRATCH DIRECTORY IT OWNS and compares
      # them against `qontinui-schemas/ts/src/generated/`; it never writes into
      # the qontinui-schemas checkout, which on a dev box is a shared working
      # tree holding other sessions' uncommitted work. See the header of
      # `.pre-commit-hooks/gen-events-drift.sh` for the full rationale and the
      # three guards that enforce it.
      #
      # To refresh the bindings for real:
      #   bash src-tauri/scripts/generate_types.sh --ts-only
      # then commit the result in qontinui-schemas. (There is no
      # `npm run gen-events` script — the old comment here named one that has
      # never existed in package.json.)
      #
      # No `stages:` — this runs at BOTH pre-commit and pre-push. On pre-push
      # pre-commit hands us every file in the pushed range, which for a
      # long-lived rebased branch spans old-base..main rather than the PR's own
      # diff, so the hook fires far more often than the change warrants. That
      # over-firing is now only a time cost (a release build of
      # `export_schemas`), not a risk: the hook is read-only with respect to
      # every repo but this one. Bypass a single push with
      # `SKIP=gen-events-drift git push` — never `--no-verify`, which also
      # disables the cargo fmt/clippy gate below.
      #
      # That same range is why the hook no longer blames every pusher for the
      # drift it finds: a PEER's schema commit inside the pushed range fires it
      # while the pusher's own diff is unrelated. `lib/gen-events-attribution.sh`
      # splits the verdict into pusher-caused (hard failure, unchanged) and
      # pre-existing (reported in full, not blocking; STRICT still blocks), and
      # fails closed when it cannot tell. Its tests need no Rust toolchain and
      # are wired up as `gen-events-attribution-test` below.
      - id: gen-events-drift
        name: Tauri Event Bindings Drift Guard
        entry: bash .pre-commit-hooks/gen-events-drift.sh
        language: system
        # `verbose: true` is load-bearing, not decoration. pre-commit prints a
        # hook's output ONLY when the hook fails. Without it, every path where
        # this hook declines to run — missing sibling checkout, missing
        # baseline, codegen unavailable — renders as a bare "Passed" with no
        # text, which is precisely the silent skip the hook's messages exist to
        # prevent.
        verbose: true
        # Repo-relative paths only. The old pattern also listed
        # `../qontinui-schemas/rust/src/*.rs`, which could never match:
        # pre-commit only ever passes paths relative to THIS repo's root, so
        # that alternative was dead weight implying a cross-repo trigger that
        # does not exist. Schemas-side Rust changes are caught by
        # qontinui-schemas/.github/workflows/schema-drift.yml instead.
        #
        # `relay_envelopes.rs` and `scripts/generate_types.sh` added to match
        # the runner-side source-of-truth set that
        # qontinui-schemas/.github/workflows/schema-drift.yml already documents
        # as this repo's schema inputs — the local trigger set was narrower
        # than the contract it implements.
        files: '^src-tauri/(src/(event_system/types|tauri_event_payloads|relay_envelopes|findings/types|schema_export)\.rs|scripts/generate_types\.sh)$'
        pass_filenames: false

      # The attribution decision `gen-events-drift` splits its verdict on had
      # no gate at all: until now the only thing that named this test was a
      # comment saying "run me by hand", which is how a test stops being run.
      #
      # Here rather than in ci.yml, deliberately. `ci.yml` is on
      # `ci-integrity.yml`'s GATING_WORKFLOWS list, so a PR that edits it fails
      # that check BY DESIGN and coord will not land it — adding the job would
      # have made the PR carrying it unmergeable. That is a real constraint, not
      # a preference; revisit only via a standalone workflow file.
      #
      # Triggered ONLY by edits to the decision or its test, so a normal commit
      # pays nothing. That is what lets it live at pre-commit at all: it needs no
      # Rust toolchain, no qontinui-schemas checkout and no network, only
      # throwaway git repos under $TMPDIR (which it now cleans up after itself).
      #
      # It is deliberately NOT `always_run`. A guard's guard that fires on every
      # commit gets SKIP=-ed, and then neither runs.
      - id: gen-events-attribution-test
        name: gen-events drift attribution — decision tests
        entry: bash .pre-commit-hooks/gen-events-drift-attribution-test.sh
        language: system
        # Same rationale as the drift guard above: pre-commit prints a hook's
        # output only when it fails, and a passing run should still say which
        # arms it exercised (it reports skips, which a bare "Passed" would hide).
        verbose: true
        files: '^\.pre-commit-hooks/(lib/gen-events-attribution\.sh|gen-events-drift-attribution-test\.sh)$'
        pass_filenames: false

      # Same reasoning one file over: the base-ref cascade in
      # `lib/push-range.sh` and the diff-scoping + workspace-preflight
      # behaviour `cargo-prepush.sh` builds on it now have tests, and a test
      # that nothing invokes is a test that quietly stops being run.
      #
      # Toolchain-free by construction: throwaway git repos under $TMPDIR plus
      # a recording `cargo` shim on PATH, so "did the gate run?" is answered
      # without a Rust build. (Two arms DO use a real `cargo metadata` to
      # assert on cargo's own manifest-load error text; they SKIP with a stated
      # reason when cargo is absent.)
      #
      # Explicitly `stages: [pre-commit]`, unlike the entry above. The pre-push
      # stage set is what a direct-shim installer has to mirror, so this test
      # deliberately does not enlarge it — it gates the edit, which is when it
      # can actually catch something.
      - id: push-range-test
        name: push-range cascade + cargo-prepush scoping — tests
        entry: bash .pre-commit-hooks/push-range-test.sh
        language: system
        stages: [pre-commit]
        # A passing run should still say which arms it exercised (it reports
        # skips, which a bare "Passed" would hide).
        verbose: true
        files: '^\.pre-commit-hooks/(lib/push-range\.sh|push-range-test\.sh|cargo-prepush\.sh)$'
        pass_filenames: false

      # Pre-push only: cargo fmt (auto-apply, never blocks) + cargo clippy
      # (deny-tier blocks), mirroring CI's Rust gate. Runs once per
      # `git push` (not per commit), and only when src-tauri/ changed in
      # the pushed range. Lets you catch the same lint/fmt failures CI
      # would 8-15 min later in 60-90s locally.
      #
      # "The pushed range" is resolved by the cascade in
      # `.pre-commit-hooks/lib/push-range.sh` (`@{upstream}` -> `origin/HEAD`
      # -> `origin/main`), NOT by a bare `@{u}`. Until 2026-08-26 this comment
      # was simply wrong: the hook keyed the scoping on `@{u}` alone, an
      # allocated agent worktree's branch has no upstream until its first push
      # completes, so the scoping never fired there and every worktree push —
      # TS-only ones included — paid the full Rust gate. When the cascade can
      # resolve nothing at all, the hook still runs the gate: it fails OPEN,
      # deliberately.
      #
      # The halves are decoupled: QONTINUI_PREPUSH_SKIP=1 skips only the
      # expensive clippy build and still auto-applies fmt.
      # QONTINUI_PREPUSH_SKIP_ALL=1 skips both.
      #
      # QONTINUI_PREPUSH_STRICT=1 turns the hook's typed DECLINE into a hard
      # failure. It declines (exit 0, with a framed message naming cause,
      # remedy and residual coverage) when `cargo metadata` cannot load the
      # workspace at all — the normal case being a checkout with no sibling
      # `qontinui-schemas`, which src-tauri/Cargo.toml path-deps. That is a
      # property of the local environment, not of the pushed code, and CI
      # still gates BOTH halves (`cargo fmt -- --check` and `cargo clippy`
      # inside the required `test (ubuntu-22.04)` context, plus the parallel
      # `clippy-windows` job), so declining costs latency and not coverage.
      #
      # ARMING IT. The hook does nothing until this repo's git hooks are
      # installed, and that is opt-in. One command:
      #
      #   bash ../qontinui-claude-config/scripts/install-repo-git-hooks.sh
      #   bash ../qontinui-claude-config/scripts/install-repo-git-hooks.sh --check
      #
      # The installer's primary mechanism is still
      # `pre-commit install --hook-type pre-push` — it just also handles the
      # machines where `pre-commit` itself is absent, and its `--check` answers
      # "is the gate armed here, and by which mechanism?" without reading any
      # file by eye. Installing once in the primary checkout arms every linked
      # worktree, because worktrees share `.git/hooks` through the git common
      # dir.
      - id: cargo-prepush
        name: cargo fmt + clippy (pre-push)
        entry: bash .pre-commit-hooks/cargo-prepush.sh
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true

ci:
  autofix_prs: true
  autofix_commit_msg: 'chore: pre-commit auto fixes'
