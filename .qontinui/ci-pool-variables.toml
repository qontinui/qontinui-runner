# Lane variables coord decides for this repo (plan
# qontinui-dev-notes/plans/2026-11-11-coord-owns-ci-lane-variables.md, Phase 2c).
#
# Each entry opts one GitHub Actions variable into coord's pool-variable
# controller (qontinui-coord crates/coord/src/ci_pool_alerts/variables.rs) and
# names the self-hosted pool the jobs it routes need. Every eligibility pass,
# coord decides the value it would hold the variable at: `self-hosted` while
# that pool is healthy, `hosted` once it is not.
#
# SHADOW ONLY today: coord records each decision as an Info
# `ci_pool_variable_hosted` alert episode and serves it in
# `coord_query_train_health` `pool_variables`. It writes NO variable; the
# value is still set by hand until the plan's Phase 3.
#
# `pool` must equal the forced-lane literal of every routed `runs-on` that
# reads the variable (.github/workflows/ci.yml's Linux legs). No lint compares
# them yet. Once coord can read expression-routed pools (the plan's Phase 2b,
# the `# coord-pools:` reader), a pool the workflows do not name reads
# `declaration_mismatch`; until then every entry reads
# `pool_not_in_eligibility_pass`, right or wrong.
# Unknown keys are refused by coord (deny_unknown_fields), never ignored.

[[variables]]
name = "RUNNER_CI_LINUX_LANE"
pool = ["self-hosted", "Linux", "X64", "qontinui-runner-ci", "ram-40g"]
