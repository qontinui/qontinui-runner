# CI TARGET MAP — which files each CI job AS RUN observes. Read by coord's
# overlap counterfactual (plan
# 2026-11-08-coord-lands-one-candidate-per-repo-where-a-file-overlap-gate-would-admit-parallel-units,
# Phase 1a/1b). It changes NO CI behaviour; it describes it.
#
# ---------------------------------------------------------------------------
# SEMANTICS (the coord reader implements exactly this — do not reinterpret)
#
# - Paths are repo-relative globset patterns (`**` allowed).
# - A unit (a set of changed files) TOUCHES target T iff any of its files
#   matches a pattern in T.observes.
# - A file matching `global`, or matching NO target's `observes`, touches
#   EVERY target (conservative: an unmapped file is never "disjoint").
# - Two units are TARGET-DISJOINT iff their touched-target sets are disjoint.
# - Every verdict records the lowercase hex sha256 of this file's bytes.
#
# ---------------------------------------------------------------------------
# WHAT IS CLAIMED, EXACTLY. Each target's `observes` is meant to be a
# SUPERSET of that job's dependency closure in the sense of Definition 1 of
# qontinui-research theory/merging-modularity.md (Obs∩Obs, plus Dep∩F in both
# directions; global units observed by every target). The closure was
# derived BY READING, not by a tool: no build-graph extractor was run, so a
# read this derivation missed is a soundness gap, not a design decision.
# Where a job's closure could not be bounded below the whole tree, the
# target says `**`. Read at qontinui-runner origin/main bf090571b
# (2026-11-15) from:
#   - .github/workflows/*.yml — every job that runs on a `pull_request` (to
#     main or, for stacked PRs, to any other base) or on a
#     `merge-candidate*/**` push (coord's merge predicate
#     observes EVERY check, not only the `main-merge-gates` ruleset contexts,
#     so each such job is a target), mirroring each workflow's `paths:`
#     filter as the target's roots;
#   - .qontinui/ci.toml (the ci_node mirror of ci.yml's `test` job);
#   - Cargo / package manifests, build.rs, tauri.conf.json, vite and vitest
#     config, and the compile-time reads (`include_str!`, `include_bytes!`,
#     `include_dir!`, `tauri::generate_context!`), JS/TS imports and
#     literal-path test reads that reach outside the compiling package.
#
# WHOLE-TREE OBSERVERS: EVERY JOB THAT RUNS A VITE BUILD. src/index.css
# imports "tailwindcss" with no `source()`, and vite.config.ts sets no
# `root`, so @tailwindcss/vite's automatic source detection scans every
# non-gitignored file under the repo root for class candidates (measured
# with @tailwindcss/oxide's Scanner on a 2026-11-15 working tree at 5230 files, .pre-commit-hooks/**,
# .gitleaks.toml and docs/ included). Any tracked file can therefore change
# the emitted CSS, hence ../dist, hence what `tauri::generate_context!`
# embeds. Every job that runs `pnpm run build` (or `tauri build`, whose
# beforeBuildCommand runs it) observes `**`: `test`, `test-windows`, `clippy-windows`,
# `clippy-tiers:clippy-diff`, `stacked-pr-fastlane` and
# `published-parity:negative-control`. Narrowing them needs a CI-side change
# (an explicit Tailwind `source()`), not an edit here.
#
# Jobs that compile src-tauri WITHOUT a vite build (onboarding-doc-fresh's
# coord_doctor run, qontinui-types-drift's export_schemas build) embed the
# placeholder dist build.rs provisions, so their closure is the Rust compile
# set: src-tauri/**, crates/**, vendor/**, the compile-time includes
# (specs/pages, examples/, atlas/schema.hcl, docs/runner-config-layers.md,
# scripts/*), and src/** — build.rs reads src/components/app/tab-types.ts
# and src/components/app/useAppNavigation.ts.
#
# THE OUTCOME THIS MAP ENCODES. `test` observes the whole tree, so every
# unit touches it and no two units are target-disjoint (zeta_target 1.0).
# Only a CI-structure change (bounding Tailwind's scan, and then splitting
# what `test` compiles) could open a lane.
#
# DIFF-LOCAL CHECKS. gitleaks (`--log-opts base..head`), forbid-runner-schema
# (a pathspec over the PR's changed files) and bot-owned-paths judge each
# change's OWN diff; their verdict on a composition is the OR of the parts'
# verdicts, so they create no sharing. They observe only their own config.
#
# MAINTENANCE. Enforced in part by
# src-tauri/tests/ci_targets_map_covers_every_gating_job.rs: every gating
# job has a target, every target names a gating job, every literal path
# exists. Re-scoping is not mechanical. This map must be updated in the
# same PR whenever a CI job is added, removed or re-scoped (a new workflow,
# a changed `paths:` filter, a new compile-time, import or test-time read
# outside the compiling package).
# A stale map is unsound in one direction only: a path a target observes but
# that the map lists ONLY under a different target. Omitting a path entirely
# is safe (it touches every target).
# ---------------------------------------------------------------------------

version = 1

# Files observed by EVERY target: workspace manifests, lockfiles, toolchain,
# the shared CI workflow/actions/pins every gating job runs through, and the
# CI declarations themselves (including this map).
global = [
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
  "clippy.toml",
  "package.json",
  "pnpm-lock.yaml",
  ".npmrc",
  ".gitattributes",
  ".github/workflows/ci.yml",
  ".github/actions/**",
  ".github/scripts/**",
  ".github/sibling-pins.conf",
  ".qontinui/ci.toml",
  ".qontinui/ci-requirements.toml",
  ".qontinui/ci-targets.toml",
]

# ---------------------------------------------------------------------------
# ci.yml — the gating workflow (no `paths:` filter on pull_request; also runs
# on merge-candidate/** pushes)
# ---------------------------------------------------------------------------

[[targets]]
# test (ubuntu-22.04) (and, with the same steps, `test-windows` below):
# CI-tooling node tests, purge
# script, pnpm install/lint/effect-fixture/typecheck/vitest/BUILD, cargo fmt,
# clippy (ubuntu), cargo test -p qontinui-runner -p session-lifecycle (dist
# embedded), the Windows PS 5.1 contract smokes and the CI-integrity guard.
# Whole tree: the vite build's Tailwind scan (header). Known reads beyond
# the scan, for when that is bounded: src/**, src-tauri/**, crates/**,
# vendor/**, icons/**, specs/**, examples/**, atlas/**, scripts/**, tests/**,
# python-bridge/**, python/**, .github/workflows/** (workflow_paths_
# self_inclusion.rs), docs/runner-config-layers.md, docs/workspace-
# assumptions.{json,md} and docs/workspace-assumptions.dispositions.toml
# (workspace_assumptions_are_enumerated.rs), and the frontend config files.
name = "test"
observes = [
  "**",
]

[[targets]]
# test (windows-latest): the windows leg, its own job since plan
# 2026-11-25-shard-runner-candidate-ci-after-moving-it-off-the-hosted-queue so
# it waits only on `route-windows`. Runs the SAME steps as `test` (one YAML
# anchor in ci.yml), so it observes what `test` observes: the whole tree.
name = "test-windows"
observes = [
  "**",
]

[[targets]]
# Clippy (windows): pnpm build (dist for generate_context!; vite.config.ts
# imports scripts/frontend-provenance.mjs) + cargo clippy --all-targets.
# Whole tree: the vite build's Tailwind scan (header).
name = "clippy-windows"
observes = [
  "**",
]

[[targets]]
# Holder crates (ubuntu-latest + windows-latest): cargo test -p
# qontinui-pty-holder -p qontinui-runner-win32; clippy -p qontinui-pty-holder.
# ALSO READ BY CI: ci.yml `holder-changes` runs the windows-latest arm only
# when a changed file matches `global` or this list, so a path missing here
# now skips a Windows run, not only a coord verdict. Keep it a superset.
name = "holder-crates"
observes = [
  "crates/pty-holder/**",
  "crates/runner-win32/**",
  "vendor/**",
]

[[targets]]
# Frontend unit tests (vitest; vitest.config.ts has no Tailwind plugin, so no
# whole-tree scan): src/** plus the files its tests import or read.
name = "frontend-tests"
observes = [
  "src/**",
  "index.html",
  "*.html",
  "vitest.config.ts",
  "vite.config.ts",
  "tsconfig.json",
  "tsconfig.node.json",
  # imported by src/components/terminal/transportCorpus.ts
  "scripts/tui-repaint-generator.mjs",
  "scripts/tui-repaint-generator.d.mts",
  # read by src/specs/specs.compile.test.ts
  "specs/pages/**",
  # literal-path reads by *.test.ts
  "src-tauri/src/mcp/ui_bridge/set_tab_readback.js",
  "src-tauri/src/resource_guard.rs",
  "src-tauri/src/ci_node/settings_directive.rs",
  "src-tauri/src/session/session_lifecycle_store.rs",
  "src-tauri/src/commands/web_integration.rs",
]

[[targets]]
# seam-gate: three grep anchors on the test-fixtures cfg gate.
name = "seam-gate"
observes = [
  "src-tauri/src/mcp/test_fixtures.rs",
  "src-tauri/src/mcp/mod.rs",
  "src-tauri/src/mcp_api.rs",
]

[[targets]]
# security: cargo audit over Cargo.lock, pnpm audit (non-gating) — both global.
name = "security"
observes = ["Cargo.lock", "pnpm-lock.yaml"]

[[targets]]
# route: runner-pool routing for the test job.
name = "route"
observes = [".github/scripts/route-ci-lane.py"]

[[targets]]
# route-windows: Windows pool routing (merge-candidate push only).
name = "route-windows"
observes = [".github/scripts/route-ci-lane.py"]

[[targets]]
# design-guide: `design-kit compile --root . --check` over the design-language
# source against the committed src/design-system/ outputs, then validate-guide
# over the two fixtures. The kit is installed from design/kit/ outside the
# app's pnpm tree, so no app manifest is read.
name = "design-guide"
observes = [
  "design/**",
  "src/design-system/**",
]

[[targets]]
# holder-changes: picks holder-crates' matrix by matching the change's files
# against THIS map's `global` + `holder-crates` lists (git + python only).
name = "holder-changes"
observes = [".qontinui/ci-targets.toml"]

# ---------------------------------------------------------------------------
# Unfiltered companion workflows
# ---------------------------------------------------------------------------

[[targets]]
# ci-integrity (pull_request_target, paths .github/workflows/**,
# .github/actions/**, scripts/check_untimed_subprocess.py).
name = "ci-integrity:guard-gating-workflows"
observes = [
  ".github/workflows/**",
  ".github/actions/**",
  "scripts/check_untimed_subprocess.py",
]

[[targets]]
# forbid-untimed-subprocess: scans the in-repo crates linked into the runner
# binary (roots from src-tauri/Cargo.toml's path deps) against its baseline.
name = "forbid-untimed-subprocess"
observes = [
  "scripts/check_untimed_subprocess.py",
  "scripts/untimed-subprocess-baseline.json",
  "src-tauri/Cargo.toml",
  "src-tauri/src/**",
  "src-tauri/clorinde/**",
  "crates/**",
  ".github/workflows/forbid-untimed-subprocess.yml",
]

[[targets]]
# ci-rerun-on-declaration (pull_request to main): re-fires required CI when a
# sibling declaration or base retarget arrives; reads PR metadata only.
name = "ci-rerun-on-declaration"
observes = [".github/workflows/ci-rerun-on-declaration.yml"]

[[targets]]
# forbid-runner-schema: a pathspec over the PR's own changed files (diff-local).
name = "forbid-runner-schema"
observes = [".github/workflows/forbid-runner-schema.yml"]

[[targets]]
# gitleaks over base..head (diff-local).
name = "secret-scan:gitleaks"
