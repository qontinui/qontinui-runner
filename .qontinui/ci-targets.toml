[[targets]]
# bot-owned-paths (advisory): judges the PR's own paths (diff-local).
name = "bot-owned-paths"
observes = [
  "scripts/ci/bot-owned-paths.sh",
  ".github/workflows/bot-owned-paths.yml",
]

[[targets]]
# bot-owned-paths-selftest (unfiltered): the script's own test suite.
name = "bot-owned-paths-selftest"
observes = [
  "scripts/ci/bot-owned-paths.sh",
  "scripts/ci/bot-owned-paths-test.sh",
  ".github/workflows/bot-owned-paths-selftest.yml",
]

[[targets]]
# clippy-tiers: clippy-diff (advisory; pnpm build + cargo clippy).
# Whole tree: the vite build's Tailwind scan (header).
name = "clippy-tiers:clippy-diff"
observes = [
  "**",
]

[[targets]]
# onboarding-doc-fresh: detect on coord_doctor sources + the doc; verify
