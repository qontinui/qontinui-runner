[[targets]]
# stacked-pr-fastlane: scope + rust-fast (pnpm build + fmt + clippy) /
# frontend-fast (stacked PRs). Whole tree: rust-fast's vite build (header).
name = "stacked-pr-fastlane"
observes = [
  "**",
]

