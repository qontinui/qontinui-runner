# CI manifest for the runner-as-CI-node lane
# (plan qontinui-dev-notes/plans/2026-07-15-runner-as-ci-node-migration.md §4.1).
#
# PARITY IS A REVIEW-TIME INVARIANT: these steps mirror the gate commands of
# .github/workflows/ci.yml's `test` job. When ci.yml's gates change, update
# this file in the same PR. Step order matches ci.yml: the frontend build
# must precede every COMPILING cargo step (tauri::generate_context! reads
# ../dist at compile time), and lint/typecheck fail fast before paying for
# the build. What this lane runs differently from `test (windows-latest)`,
# and why, is enumerated in the STEP PARITY block above [[steps]] — a gap
# not listed there is drift, not a decision.
#
# Commands are argv arrays (never shell strings); env is limited to the
# runner's allowlist; cargo runs single-job (this workspace OOMs otherwise)
# into a persistent per-repo CI target dir the executor supplies.

version = 1

# ---------------------------------------------------------------------------
# SIBLING REPOS — the ci_node analogue of ci.yml's "Check out sibling <repo>"
# steps, which this section mirrors one-for-one. (Until 2026-08-26 two of those
# were a single "Checkout sibling repos" step running `git clone --depth 1`;
# that step is gone, and all three siblings now go through
# .github/actions/checkout-sibling.) Declared rather than cloned by
# a step: the executor materialises each one NEXT TO this repo's worktree
# inside the dispatch-scoped directory, so `../../qontinui-schemas/rust` (the
# path deps at src-tauri/Cargo.toml:125-127) resolves, and so cleanup stays a
# single directory removal. An in-manifest `git clone` would pass validation
# but would be unpinned and would leak — and .github/workflows/
# forbid-sibling-clone.yml gates the Actions half against the same shape.
#
# Each entry's REASON is ci.yml's, restated so the two lanes stay auditable
# against each other. When ci.yml's clone list changes, change this list in
# the same PR.
# ---------------------------------------------------------------------------

[[siblings]]
# src-tauri/Cargo.toml's `qontinui-types` / `qontinui-code-graph` /
# `qontinui-vision-core` path deps. Pinned by DECLARED ADAPTATION PR — the
# coord dep edge this PR and its qontinui-schemas PR already have to declare
# for merge ordering — exactly as .github/actions/checkout-sibling does, so a
# breaking types change can go green as a declared pair instead of
# deadlocking. A branch NAME resolves nothing: matching on one let an un-PR'd
# scratch branch satisfy the mirror gate in production on 2026-07-28.
#
# DECLARED DIVERGENCE (since plan 2026-08-31-schemas-releases-strand-consumer-cargo-locks
# Phase 3): the Actions lane now PINS qontinui-schemas in .github/sibling-pins.conf,
# while this lane, with no declared adaptation PR, still resolves the default
# branch. It stays `declared-adaptation` for the same reason as the two entries
# below: coord's allocate-lane reader must accept `pin = "pin-file"` in a DEPLOYED
# build first (that plan's follow-up F4), and every CI-node runner must be at or
# past be5d87af8, whose closed `SiblingPin` enum is the first to know `pin-file`
# (an older one refuses the whole manifest). Flip it together with them, and drop it
# from `KNOWN_DIVERGENT` in src-tauri/src/ci_node/mod.rs in the same PR.
repo = "qontinui/qontinui-schemas"
pin = "declared-adaptation"

# ===========================================================================
# DECLARED DIVERGENCE FROM ci.yml — the two entries below still float, and
# the flip that ends it is ONE LINE EACH, gated on a coord deploy.
#
# The Actions lane stopped floating on these two in #1158: ci.yml routes them
# through .github/actions/checkout-sibling at a commit recorded in
# .github/sibling-pins.conf, because a floating checkout let a ui-bridge land
# red this repo's main and hold the merge train for 5h+ on 2026-08-20 with no
# runner commit involved.
#
# This lane CAN now express that: `pin = "pin-file"` (`SiblingPin::PinFile`,
# qontinui-schemas ci-exec/src/manifest.rs) is the action's rule in full — a declared
# adaptation PR outranks the pin, and with no declaration the sibling resolves
# to the commit recorded in .github/sibling-pins.conf, read from THIS checkout
# at the dispatched commit and parsed field-for-field as the action's
# `apply_pin` parses it (qontinui-schemas ci-exec/src/sibling.rs `lookup_pin`). The
# SHA is deliberately never restated here: one file, three readers, and the
# `sibling pin bump` workflow moves it for both lanes at once. Stricter than
# the action in two places: a sibling that says `pin-file` here but is absent
# from that file, or a missing file, is a hard error, not a float — here the
# opt-in is this line.
#
# WHY THE TWO LINES BELOW STILL SAY `default-branch`: this file has a THIRD
# reader. coord's agent-allocation lane (`POST /agents/allocate`,
# qontinui-coord crates/coord/src/ci_siblings.rs) parses these same
# [[siblings]] blocks to provision a worktree's sibling build deps, with its
# own CLOSED `pin` enum — and a value it does not know fails OPEN to "no
# siblings declared", so every allocated qontinui-runner worktree would
# silently lose its qontinui-schemas checkout (the exact defect coord's reader
# was added to end). Flip these two lines to `pin = "pin-file"` only once a
# coord build that accepts `pin-file` is DEPLOYED — merged is not enough, the
# reader runs in production at allocate time. Until then, `default-branch`
# here is a recorded divergence, and the ci_node lane stays exposed to the
# defect the Actions lane closed.
# ===========================================================================

[[siblings]]
# Believed VESTIGIAL. This entry used to restate ci.yml's claim that
# "src/lib/spec-registry.ts statically imports 14 .spec.uibridge.json files
# from qontinui-web/frontend/src/app at typecheck/build time". That file no
# longer exists anywhere in this repo, and a tree-wide search finds no
# build-time, test-time or tsconfig reference to a sibling qontinui-web
# checkout — every *.spec.uibridge.json this repo loads lives under its own
# specs/ and src/specs/. The claim was removed from ci.yml in the same PR that
# added this note; it is removed here too rather than left contradicting the
# lane it is supposed to mirror.
#
# `default-branch`: see the DECLARED DIVERGENCE block above — flip to
# `pin-file` once coord's reader accepts it. Pinned in the Actions lane only
# to make it inert as a red-main source while its vestigiality is confirmed;
# deleting the checkout outright (here AND in ci.yml, in one PR) is the better
# end state.
repo = "qontinui/qontinui-web"
pin = "default-branch"

[[siblings]]
# The SDK↔runner manifest diff test (`sdk_manifest_routes_are_exposed_by_runner`
# in mcp/ui_bridge/mod.rs) reads UI_BRIDGE_ROUTES from
# ui-bridge/packages/ui-bridge/src/server/types.ts. WITHOUT this checkout the
# test takes its "file unreadable, skip" branch and silently passes, so
# SDK-vs-runner drift would go unflagged — a vacuous green, which is why the
# sibling is declared rather than left to chance.
#
# `default-branch`: see the DECLARED DIVERGENCE block above — flip to
# `pin-file` once coord's reader accepts it. This is the exact edge that
# caused the 2026-08-20 outage; the Actions lane pins it and this lane, for
# the one reason recorded above, does not yet.
repo = "qontinui/ui-bridge"
pin = "default-branch"

[limits]
# A CEILING, not an override: the executor exports
# min(this, host-derived-sizing), so this cannot raise a small host's cap and
# a large host cannot raise this one.
#
# The runner workspace needs CARGO_BUILD_JOBS=1 (+ large pagefile) to
# compile at all — memory reference_runner_workspace_ci_compile_needs_swap_jobs1.
# That is a measurement of THIS workspace, which is why it is stated here
# rather than left to the host sizing (which would hand a 32 GiB box 10).
cargo_build_jobs = 1

# test_threads is deliberately ABSENT: no measurement of this suite's
# per-process footprint exists, and the executor's host-derived value
# (~1 GiB per test process, capped at nproc) is a better answer than a guess.
# Omitting a limit means "size me from the host" — the executor exports the
# result as RUST_TEST_THREADS and NEXTEST_TEST_THREADS, so `cargo test` no
# longer defaults to nproc on a 32-vCPU box.

# ===========================================================================
# STEP PARITY WITH ci.yml's `test` JOB — every gate step of that job is
# either mirrored below, in ci.yml's order, or listed here as a DECLARED
# DIVERGENCE with its reason. A shadow verdict from this lane is meant to be
# a like-for-like of `test (windows-latest)` (plan
# 2026-09-27-arm-ci-node-dispatch-for-runner-windows-leg §1a row 7, Phase A
# item 2), so a step added to that job without a line here is drift.
#
# MIRRORED WITH A DECLARED ADAPTATION
#
# - "Clippy check" is UBUNTU-ONLY in the `test` job; Windows clippy is the
#   separate `clippy-windows` job. `rust-clippy` below runs on every host
#   anyway — extra coverage (it is the only cfg(windows) lint pass a Windows
#   CI node gets), not a parity break, but it is a third full compile that
#   `test (windows-latest)` does not pay, so wall-clock comparisons against
#   that leg must subtract it.
#
# - The separate `holder-crates` job (ci.yml, matrix ubuntu + windows) runs
#   `cargo test -p qontinui-pty-holder -p qontinui-runner-win32` and
#   `cargo clippy -p qontinui-pty-holder --all-targets` from the repo root,
#   because every src-tauri step selects the src-tauri package only and never
#   reaches those crates' own tests or [lints]. Mirrored below as
#   `holder-crates-test` / `holder-crates-clippy` on the same reasoning as
#   `rust-clippy`: extra coverage over `test (windows-latest)`, not a parity
#   break — and on a Windows CI node it is where the pty-holder's named-pipe /
#   DACL / LockFileEx code executes. Both are small crates, seconds to build.
#
# - "Build Rust tests" + "Run Rust tests" (the `cargo test --no-run` / run-
#   the-recovered-binaries split) are ONE `cargo test` below. Same pass/fail
#   meaning (fail-fast on the first failing binary), without the per-phase
#   bounds; and `cargo test` also runs the doctests the split drops. The
#   split exists to attribute an Actions-timeout expiry, which this lane's
#   own per-step timeout does not need. ci.yml runs it at CARGO_BUILD_JOBS=2
#   on windows; this lane is capped at 1 by [limits] above — a declared
#   difference (compile is slower here), not an equivalence. And because
#   `cargo test` also runs the doctests the Actions split drops, a broken
#   doctest reds THIS lane alone: that red is a real doctest defect, not drift.
#
# - ci.yml's `test` job checks out with `fetch-depth: 0` + `filter: blob:none`
#   so the workspace-assumption roster's SWAP RULE
#   (src-tauri/tests/workspace_assumptions_are_enumerated.rs, merge_base_roster)
#   can read the roster at `merge-base HEAD origin/main`. This lane fetches only
#   the candidate ref (src-tauri/src/ci_node/checkout.rs), which updates no
#   remote-tracking ref, so its base is whatever `origin/main` (else local
#   `main`) the host last fetched — UNPINNED. A stale base can red a key main
#   already carries, and can also let through a key main has since removed and
#   this change re-adds; the Actions leg is the authority for this rule. An
#   unreadable base is a loud `SWAP RULE UNKNOWN`. A swap-rule red here with
#   the Actions leg green is this divergence, not a defect.
#
# DECLARED DIVERGENCES — ci.yml runs these in the `test` job, this lane does
# not. The manifest has NO per-OS step selector (CiManifest is a flat
# `steps` list with deny_unknown_fields) and no shell strings, so an
# OS-conditional step cannot be expressed without either failing on the
# other OS or inventing a wrapper. Adding a selector is a runner-first
# schema change (older runners refuse an unknown key); until then:
#
# - "Cargo.lock is in sync with the pinned qontinui-schemas" (`cargo metadata
#   --locked`): NOT mirrored while qontinui-schemas floats in this lane (the
#   sibling DECLARED DIVERGENCE above). Measured 2026-09-27: schemas
#   origin/main declares qontinui-types 3.1.0 while Cargo.lock (and the
#   sibling-pins.conf pin) record 3.0.0, so a `--locked` resolve here would red
#   EVERY dispatch while the pinned Actions lane stays green — a guaranteed
#   false red, which poisons the verdict-parity this manifest exists for. Add
#   it back (as `cargo tree --locked --workspace --depth 0`: argv has no
#   redirect, and `cargo metadata` prints one multi-megabyte line that this
#   lane would push to coord as a single progress line) in the SAME PR that
#   flips the schemas sibling to `pin = "pin-file"`.
#
# - "Build Tauri app (development)" (`pnpm run tauri build --debug
#   --no-bundle`): NOT mirrored for the first shadow soak. Its
#   beforeBuildCommand also runs `bundle:profile-sidecar`, i.e. a full
#   `cargo build --release` of the graph (scripts/bundle-profile-sidecar.mjs),
#   on top of the debug build — and this lane compiles at CARGO_BUILD_JOBS=1.
#   Unmeasured on a CI node, it is a likely timeout (false red) and the
#   largest wall-clock and memory cost on a host that also serves interactive
#   sessions. Add it once a soak has measured the rest of the lane's
#   wall-clock on a real node.
#
# - Hosted-infra setup ("Configure pagefile (Windows)", the Node 20 /
#   pnpm / Rust toolchain setup actions, the Rust cache): not mirrored — a CI
#   node uses the host's own toolchain and pagefile. Toolchain versions can
#   therefore differ from the hosted runner's; a red that reproduces only on
#   one toolchain is that difference.
#
# - "Contract-smoke effect-probe verdict (PS 5.1)" (windows only),
#   `powershell -File scripts/tests/test-effect-probe.ps1`, and
# - "Contract-smoke summary invariants (PS 5.1)" (windows only),
#   `powershell -File scripts/tests/test-smoke-summary.ps1`: both must run
#   under Windows PowerShell 5.1 specifically (the defects they pin are 5.1-
#   only), and `powershell` does not exist on a non-Windows CI node, where
#   the step would fail to spawn rather than skip. Pure-logic, ~1s each,
#   runnable on any Windows box by hand.
#
# - "SDK↔runner contract smoke (direct-exe)" (windows only): BOOTS the
#   just-built runner exe on the host and walks its HTTP routes. On a CI node
#   that is a second runner process on a user's machine, beside the live one
#   serving the dispatch — outside what this lane may do to a host — and its
#   `-DirectExe target/debug/...` path does not exist here anyway: the
#   executor supplies CARGO_TARGET_DIR outside the worktree.
#
# - "Poison ambient state" / "Unpoison ambient state": multi-line bash that
#   writes machine.json, profiles.json and coord-device-jwt into the REAL
#   `~/.qontinui/` (and %USERPROFILE%) and exports COORD_HTTP_URL,
#   QONTINUI_ROOT, QONTINUI_SERVER_MODE, QONTINUI_RUNNER_TIER through
#   $GITHUB_ENV. On a CI node that home is the operator's live runner
#   identity; overwriting it is destructive, not a test fixture. Those four
#   env keys are also outside the step env allowlist (qontinui-schemas ci-exec/src/manifest.rs
#   ENV_ALLOWLIST), deliberately. Consequence: this lane does NOT catch a new
#   test that reads ambient machine state — and on a configured operator box
#   such a test can fail HERE while passing on the clean Actions runner. A
#   red of that shape is the ambient-state defect, not lane drift.
#
# - "CI-integrity guard policy" (ubuntu only in ci.yml) and "Live AI
#   extractor smoke" (ubuntu only, continue-on-error, needs a secret): not
#   part of `test (windows-latest)`, so a Windows shadow correctly omits them.
#
# - Non-gate diagnostics and reporting ("Explain which Rust test phase the
#   bound expired in", "Windows memory peak after the Rust test steps",
#   "Report test results to coord"): they read Actions-only state and decide
#   nothing, so they have nothing to mirror. The workflow-level
#   GITHUB_TOKEN env (rate-limit headroom for the postgresql_embedded build
#   script) is not available to this lane either; a 403 from that build
#   script here is that gap.
# ===========================================================================

[[steps]]
# ci.yml "Run CI-tooling unit tests" — first, before any install: all
# three files import only Node built-ins, and a break is cheap to see early.
name = "ci-tooling-node-tests"
command = [
  "node",
  "--test",
  "scripts/__tests__/ci-flake-analyze.test.mjs",
  "scripts/__tests__/ci-test-results-ingest.test.mjs",
  "scripts/__tests__/ci-expiry-phase-summary.test.mjs",
]

[[steps]]
name = "frontend-install"
command = ["pnpm", "install", "--frozen-lockfile"]

[[steps]]
name = "frontend-lint"
command = ["pnpm", "run", "lint"]

[[steps]]
# ci.yml "Verify component-action effect fixture" — node-only, sub-second,
# placed before typecheck exactly as ci.yml places it.
name = "effect-fixture-check"
command = ["pnpm", "run", "effect:fixture:check"]

[[steps]]
name = "frontend-typecheck"
command = ["pnpm", "run", "typecheck"]

[[steps]]
name = "frontend-test"
command = ["pnpm", "test"]

[[steps]]
name = "frontend-build"
command = ["pnpm", "run", "build"]

[[steps]]
name = "rust-fmt"
command = ["cargo", "fmt", "--", "--check"]
working_dir = "src-tauri"

[[steps]]
name = "rust-clippy"
# PLAIN clippy, exactly like ci.yml: lint levels come solely from
# src-tauri/Cargo.toml [lints.clippy] (T1 correctness/suspicious = deny,
# T3 style/perf = warn). Adding `-D warnings` here would fail every
# dispatch on the ~200 pre-existing warn-tier lints CI deliberately
# tolerates — breaking the verdict-parity this manifest exists for.
command = ["cargo", "clippy"]
working_dir = "src-tauri"
timeout_secs = 7200

[[steps]]
name = "rust-test"
command = ["cargo", "test"]
working_dir = "src-tauri"
# Skip keychain-backed auth paths in CI (ci.yml parity — keychain prompts
# hang headless environments).
env = { QONTINUI_DISABLE_KEYCHAIN = "1" }
timeout_secs = 7200

[[steps]]
# ci.yml `holder-crates` job, "Test holder crates" — see STEP PARITY above.
# From the repo root: `-p` selects workspace members src-tauri never tests.
name = "holder-crates-test"
command = ["cargo", "test", "-p", "qontinui-pty-holder", "-p", "qontinui-runner-win32"]
timeout_secs = 1800

[[steps]]
# ci.yml `holder-crates` job, "Clippy holder crates" — PLAIN clippy, levels
# from the crate's own [lints] table, exactly like `rust-clippy`.
name = "holder-crates-clippy"
command = ["cargo", "clippy", "-p", "qontinui-pty-holder", "--all-targets"]
timeout_secs = 1800
