# Repo-root clippy config: clippy resolves this file by walking up from
# CARGO_MANIFEST_DIR, so it reaches `src-tauri` (the only member that depends on
# tokio-postgres). Plan 2026-09-03-coord-row-get-panic-class-closed-by-lint-and-supervisor,
# Phase 3. The lint level (`deny`) lives in `src-tauri/Cargo.toml` `[lints.clippy]`;
# `src-tauri/src/expect_ratchet.rs` asserts this entry is still present.
disallowed-methods = [
  { path = "tokio_postgres::Row::get", reason = "Row::get PANICS on NULL/type/index mismatch and kills the enclosing task silently — use try_get and handle the Err arm. Dossier row-get-panic-kills-spawned-loop." },
  # reqwest's default GaiResolver runs getaddrinfo on the calling runtime's
  # shared blocking pool, so DNS queues behind unrelated blocking work when the
  # pool is exhausted. Every async client starts from
  # `outbound_net::client_builder()` / `outbound_net::client()`, which install
  # the bounded OS resolver (`src-tauri/src/outbound_net/os_dns.rs`, the one
  # sanctioned `#[expect]`). Coord finding 1d5d6c2e; `expect_ratchet.rs` pins
  # these entries. `reqwest::blocking` is not listed: its own runtime owns its
  # lookups.
  { path = "reqwest::Client::new", reason = "resolves DNS on tokio's shared blocking pool — use qontinui_runner_lib::outbound_net::client() (OS resolver on bounded dedicated threads)." },
  { path = "reqwest::Client::builder", reason = "resolves DNS on tokio's shared blocking pool — use qontinui_runner_lib::outbound_net::client_builder() (OS resolver on bounded dedicated threads)." },
  { path = "reqwest::ClientBuilder::new", reason = "resolves DNS on tokio's shared blocking pool — use qontinui_runner_lib::outbound_net::client_builder() (OS resolver on bounded dedicated threads)." },
]

# An owned `tokio::runtime::Runtime` dropped from inside an async context panics
# ("Cannot drop a runtime in a context where blocking is not allowed") — the
# `CloseRequested` panic plan runner-arc-runtime-root-cause removed by taking
# every `Arc<Runtime>` field out. This entry is that plan's missing regression
# guard (plan 2026-09-12-residual-work-from-the-april-2026-plan-audit, Phase 1).
# Level `deny` is in `src-tauri/Cargo.toml`; `expect_ratchet.rs` pins it.
disallowed-types = [
  { path = "tokio::runtime::Runtime", reason = "dropping an owned Runtime from an async context panics (`Cannot drop a runtime in a context where blocking is not allowed`) — hold a tokio::runtime::Handle or use tauri::async_runtime. Plan runner-arc-runtime-root-cause." },
]
