[package]
name = "qontinui-app-generator"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "IR inversion: FunctionalSpec.ui_states (IrState) -> UI-Bridge-instrumented Expo screens"

[dependencies]
# The frozen v0 contract types (IrState / IrAssertion / FunctionalSpec / Profile /
# endpoint_for). Path-dep mirrors the spec-check crate's convention; resolves to the
# shared qontinui-schemas checkout (NOT a worktree-local copy).
qontinui-types = { path = "../../../qontinui-schemas/rust", version = ">=0.1.3, <2.0.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# The real matcher — the Phase-1 golden test runs spec_check::evaluate against a
# snapshot derived from the generator's own instrumentation manifest, proving the
# IR -> instrumented-element mapping is matcher-correct deterministically (no Expo
# render in the loop; that is the runtime-deferred leg, see tests/).
qontinui-spec-check = { path = "../spec-check" }
