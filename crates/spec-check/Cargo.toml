[package]
name = "qontinui-spec-check"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Pure-Rust matcher: IR page spec × UI Bridge snapshot → SpecCheckResult"

[dependencies]
qontinui-types = { path = "../../../qontinui-schemas/rust", version = ">=0.1.3, <2.0.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
# sha2 + hex + serde_jcs are pulled in transitively via qontinui_types::canonical_hash
# (the workspace's single source of truth for content hashing). Removed direct deps
# to keep the dep graph minimal — see Cargo.lock for the resolved versions.
regex = "1.10"
thiserror = "2"
once_cell = "1.19"
uuid = { version = "1", features = ["v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
strsim = "0.11"
tracing = "0.1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.5"
insta = { version = "1", features = ["json"] }
# serde_jcs is only used in tests for byte-equality canonicalization (the
# production code routes through qontinui_types::canonical_hash, which
# returns a hash rather than canonical bytes — different purpose).
serde_jcs = "0.1"
# Plan 06 Step 7: capture tracing output in observability_smoke.rs to verify
# spec_check.evaluate / evaluate_batch spans round-trip with snapshot_id.
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[features]
# Plan 06 Step 7: the integration smoke test is gated behind this feature so
# day-to-day `cargo test` skips it. CI runs `cargo test --features integration`.
integration = []

[[bench]]
name = "matcher"
harness = false
