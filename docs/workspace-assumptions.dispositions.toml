# Dispositions for docs/workspace-assumptions.{md,json} — the HAND-EDITED input.
#
# Keyed by (class, file, symbol); symbol is the ENCLOSING fn (or `const X`,
# `struct X`, `Type::<impl>`, `<module>`) exactly as the roster prints it, so
# line drift does not orphan an entry. A key with no entry is `unreviewed`.
#
# disposition = unreviewed | fallback_correct | dev_only_surface | defect(<plan stem>)
#   - defect(<stem>) cites the plan that OWNS THE FIX, not this roster's plan.
# reviewed = the exact roster excerpts the disposition was judged against. A
#   hit under the same key with any other excerpt renders `unreviewed`
#   ("NEW since review") until someone reads it and adds it here. An entry, or
#   a reviewed excerpt, that matches no hit fails the freshness test.
#
# After editing, regenerate the roster:
#   UPDATE_WORKSPACE_ASSUMPTIONS=1 cargo-guard.sh test --test workspace_assumptions_are_enumerated
#
# First triage pass (plan 2026-09-20-published-runner-parity-count-comes-from-a-run-not-from-reports Phase 4):
# every supervisor_dependency, tenant_literal and machine_path key. The
# supervisor is dev-only; a user-facing path that depends on :9875 is a defect
# (src-tauri/src/webview_recovery.rs module doc).

