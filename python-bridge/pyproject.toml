[tool.poetry]
name = "qontinui-runner-bridge"
version = "0.1.0"
description = "Python bridge for Qontinui Runner"
authors = ["Joshua Spinak <jspinak@hotmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.14.1 || >3.14.1,<3.15"
pillow = "^12"
qontinui = {path = "../../qontinui", develop = true}
qontinui-schemas = {path = "../../qontinui-schemas", develop = true}
websockets = "^15.0.1"
requests = "^2.31"
pynput = "^1.7"
httpx = "^0.28"
aiohttp = "^3.9"
# Pin opencv-python-headless explicitly.
#
# IMPORTANT: Do NOT allow `opencv-python` (non-headless) to be installed
# alongside `opencv-python-headless`. Both ship the same `cv2/` package;
# having both in the same venv causes Windows crashes at import time:
#   ImportError: DLL load failed while importing cv2:
#     Invalid access to memory location.
#
# `supervision` (a transitive dep via qontinui) declares `opencv-python`,
# which will clobber the headless install unless pinned here. If you ever
# see the above error, run:
#   poetry run pip uninstall -y opencv-python
#   poetry run pip install --force-reinstall --no-deps "opencv-python-headless"
# Version constraint must stay in sync with qontinui's own constraint.
opencv-python-headless = "^4.13"


[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^0.24"
black = "^24.10"
ruff = "^0.14"
mypy = "^1.14"
pylint = "^3.3"
flake8 = "^7.3"
pre-commit = "^4.4"
types-requests = "^2.31"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = false
disable_error_code = ["import-untyped"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90", "N", "UP", "B", "A", "C4", "ICN", "PIE", "SIM"]
ignore = ["E501", "C901", "T201", "SIM102", "N806"]

[tool.pylint]
max-line-length = 100
disable = ["C0114", "C0115", "C0116"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# Required because the `qontinui` path dep pins torch/torchvision to this
# source. Poetry resolves a path dep's source requirements against the
# parent project's configured sources, so this block must mirror
# qontinui/pyproject.toml.
[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

# Optional ML dependencies
[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
qontinui-train = {path = "../../qontinui-train", develop = true}
