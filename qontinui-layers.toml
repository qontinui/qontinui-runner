# Ξ_Layering declared architecture (Phase 4b). Tauri: Rust src-tauri/src + TS src.
# See qontinui-dev-notes plan 2026-06-07-twin-layering-architecture-drift.md (Appendix A).
[order]   # Tauri commands/mcp legitimately query the DB directly — sanction api→data.
allowed = [["ui","api"],["ui","service"],["api","service"],["service","data"],["api","data"]]
forbid_skip = true

[layers]
"src/**"                                  = "ui"        # the whole TS frontend = the ui layer
"src-tauri/src/commands/**"               = "api"
"src-tauri/src/mcp/**"                    = "api"
"src-tauri/src/spec_api/**"               = "api"
"src-tauri/src/trace_api/**"              = "api"
"src-tauri/src/database/**"               = "data"
"src-tauri/src/known_issues/**"           = "utility"   # shared reference data
"src-tauri/src/state_machine_configs/**"  = "utility"
"src-tauri/src/util/**"                   = "utility"
"src-tauri/src/accessibility/adapters/**" = "service"   # OS a11y adapters = infra/service, not data
"src-tauri/src/**"                        = "service"

[exempt]
modules = ["src-tauri/src"]              # crate root (main.rs composes every layer)

[carve_out]
edges = [ { from_glob = "src-tauri/src/database/**", to_layer = "service", reason = "persistence imports domain types owned by the service for (de)serialization; ideally those types move to a shared crate" } ]
