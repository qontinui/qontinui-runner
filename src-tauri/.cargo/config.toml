# sccache defaults for the compile-unit cache — local-disk backend.
#
# Cut over from shared AWS S3 (qontinui-sccache-shared, us-east-1) to the
# machine-default local disk on 2026-07-23, after the S3 backend was proven to
# cause a client-pileup build stall (~3-4s/op latency, ~0-2.5% hit rate,
# serialized through one sccache server → a ~100-client pileup that stalled all
# cargo builds under fleet concurrency). See
# plans/2026-07-23-sccache-client-pileup-root-cause.md. Local disk is sub-ms and
# pileup-proof; the S3 goal of cross-machine sharing was never realized (0%
# cross-worktree hit). SCCACHE_DIR / SCCACHE_CACHE_SIZE are intentionally NOT
# pinned here (a hardcoded path would break other machines + CI-Linux) — sccache
# uses its machine default; per-machine overrides go in User-scope env.
# RUSTC_WRAPPER stays opt-in/unpinned (export RUSTC_WRAPPER=sccache). CI runs
# its own GHA-backed sccache and already overrode this S3 default, so dropping
# the S3 keys is inert there.
# See plans/2026-05-14-fleet-topology-and-build-pool-design.md §3.3.
[env]
# Ξ_sccache: Docker/WSL hold sccache's default port 4226 on the build hosts;
# clients that land there wedge ("version mismatch") + respawn. Pin off 4226 so
# every cargo-spawned sccache client agrees on the port regardless of OS-env
# inheritance (the User-env value was not inherited by all contexts).
SCCACHE_SERVER_PORT = { value = "4230", force = false }

# Increase linker stack size to prevent STATUS_STACK_BUFFER_OVERRUN
# when linking the large test binary on Windows. Default MSVC stack is
# 1 MB; this binary needs more due to deep async-graphql type expansion
# and Tauri codegen.
#
# /Brepro tells link.exe to zero the PE COFF timestamp and the RSDS
# debug GUID so identical inputs produce byte-identical .exe / .pdb
# outputs. Required by the content-addressed build cache rolled out in
# Row 10 / Wave 0 — without it, two cargo builds of the same source
# differ in 16 bytes at PE offset 107636 (the RSDS GUID is regenerated
# per link), defeating cross-worktree CAS dedup. Spike artifacts at
# tmp_spike_bazel_remote/ + memory `proj_canonical_diff_hash_recipe`
# document the empirical proof.
#
# --remap-path-prefix collapses the per-worktree absolute prefix in
# rustc's compile-unit identity so sccache cache keys are path-
# independent across worktrees on the same machine. Without it,
# sccache hit rate cross-worktree is 0% (Row 2 Phase 2 baseline
# 2026-05-14, `qontinui-dev-notes/sccache-baseline-2026-05-14.md`).
#
# The WINDOWS pair used to be spelled here as an absolute literal
# (a drive-lettered workspace root). It has moved to each machine's own
# `$CARGO_HOME/config.toml`, written by
# qontinui-claude-config/scripts/install-cargo-machine-config.{ps1,sh},
# because an absolute per-machine path in a file every machine shares is
# correct on whichever machine it was written for and inert everywhere
# else. Cargo JOINS rustflags across config files with the machine-level
# values FIRST, so the remap still reaches rustc; what stays here is only
# the machine-NEUTRAL flags. All four fleet machines were confirmed
# carrying the machine config before this was removed (coord gate
# a42ce9cd, evidence in finding fa5b6675).
#
# The Linux entries below are NOT the same kind of value and stay: they
# name the CI runner checkout root, a constant across runners that no
# installer covers.
#
# ORDER DOES NOT MATTER. This comment used to say it did -- that rustc
# "applies remaps in given order and first-match wins", so the longer
# `.wt` prefix had to come first or `<workspace-root>.wt/agent/` would
# rewrite to `/qontinui.wt/agent`. That describes a failure rustc cannot
# produce. rustc takes the LONGEST matching prefix whatever order it is
# given in; order only breaks ties between IDENTICAL prefixes, where the
# LAST wins -- so first is the losing position, not the winning one.
# Measured on two platforms and two toolchains 2026-09-05
# (qontinui-claude-config#773).
#
# For variable per-agent worktree paths (e.g. `<workspace-root>.wt/<id>/`),
# the agent shell additionally sets RUSTFLAGS at invocation time:
#     $env:RUSTFLAGS = "--remap-path-prefix=$WORKTREE_ROOT=/qontinui-worktree"
# See plans/2026-05-14-fleet-topology-and-build-pool-design.md §3.5 +
# Row 2 Phase 3.
[target.x86_64-pc-windows-msvc]
rustflags = [
    "-C", "link-args=/STACK:8388608 /Brepro",
]

# Linux equivalent of /Brepro. ld embeds a per-link build-id by default,
# which varies across builds of identical inputs. --build-id=none drops
# the .note.gnu.build-id section so two builds produce byte-identical
# ELFs. The build-id is only used by debuginfo-lookup tooling; ELFs
# without it run normally, and the workspace profile already strips
# debuginfo so nothing downstream depends on it. Same Row 10 / Wave 0
# rationale.
#
# Linux path-remap covers the typical CI runner checkout location and
# the dev-machine `~/qontinui-root.wt/` convention. CI runners use
# ephemeral workers where path-remap value matters less; entries here
# stay in sync with the Windows form for cache-key parity. Per-shell
# RUSTFLAGS still needed for variable worktree-root paths.
[target.x86_64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-Wl,--build-id=none",
    "--remap-path-prefix=/home/runner/qontinui-root.wt=/qontinui",
    "--remap-path-prefix=/home/runner/qontinui-root=/qontinui",
]

[target.aarch64-unknown-linux-gnu]
rustflags = [
    "-C", "link-arg=-Wl,--build-id=none",
    "--remap-path-prefix=/home/runner/qontinui-root.wt=/qontinui",
    "--remap-path-prefix=/home/runner/qontinui-root=/qontinui",
]
