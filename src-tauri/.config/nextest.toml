# cargo-nextest configuration for the runner suite.
#
# Plan: 2026-08-30-runner-ci-has-no-flake-detection-so-one-flaky-test-freezes-the-train
#
# This file ONLY affects `cargo nextest` runs. Plain `cargo test` never reads
# nextest config, so adding it changes nothing for anyone running the suite
# locally, and nothing for the GATING `Run Rust tests` step in ci.yml — which
# is still `cargo test --verbose` and still decides every PR's verdict.
#
# WHAT THIS IS FOR: nextest is the only way to get STRUCTURED per-test output
# out of a stable-Rust suite (libtest's JSON format is nightly-only). The
# JUnit report written here is POSTed to coord's
# `POST /coord/test-results/ingest`, which appends one row per test to
# `coord.test_results`. coord's `test_run_effects::flakiness_priors` then
# computes a per-test `flake_rate = 1 - (modal_count / total)` over the last K
# runs (K = QONTINUI_TEST_FLAKE_MIN_K, default 20), served at
# `POST /coord/test-flakiness`. THAT is the flake detector. This repo has never
# written a single row there, which is the gap the plan opens on.
#
# ---------------------------------------------------------------------------
# WHY `retries = 0`, when the sibling repo's profiles use `retries = 2`
# ---------------------------------------------------------------------------
#
# qontinui-coord's `.config/nextest.toml` sets `retries = 2` on both its
# profiles, on the reasoning that a retry-passed test is reported "flaky (a
# PASS)" rather than failed, so a transient flake stops redding main.
#
# That reasoning does NOT carry over here, and copying it would have been a
# silent regression. coord's own JUnit parser
# (`crates/coord/src/test_run_effects.rs::parse_junit_xml`) classifies a
# testcase by its body: `<error` -> Error, `<failure` -> Fail, `<skipped` ->
# Skip, **anything else -> Pass**. nextest reports a retry-passed test as a
# PASSING testcase carrying `<flakyFailure>` elements — and `"<flakyFailure"`
# does not contain the substring `"<failure"`. `grep -i flakyFailure` across
# all of coord returns nothing; its four parser tests cover only
# pass/fail/skip/error.
#
# So under `retries = 2` a flake would ingest as a plain **Pass**, and the
# cross-run detector above would never see it. Retrying here does not preserve
# the signal in a different form — it DELETES it.
#
# With `retries = 0` a flake ingests as an honest `Fail`, its outcome differs
# from its modal outcome, and `flakiness_priors` scores it exactly as intended.
# Zero retries is the DETECTING configuration, not the weaker one.
#
# If coord ever learns `<flakyFailure>` (a `TestOutcome::Flaky` variant plus a
# parser arm), revisit this — but change coord FIRST and this file second, or
# the signal goes dark in between.

[profile.ci-pr]
# Let the whole suite run even when some tests fail: a failing test is exactly
# the per-test row the detector needs, and stopping at the first one would
# truncate the report to a single data point.
fail-fast = false
# See the long note above. Do not raise this without changing coord's parser.
retries = 0

[profile.ci-pr.junit]
# Written to target/nextest/ci-pr/junit.xml, WORKSPACE-relative — this path is
# not derived from CARGO_TARGET_DIR (verified fleet-side in
# qontinui-runner/src-tauri/src/ci_node/junit.rs, whose module doc records the
# same surprise for the dispatch lane). The ci.yml ingest step therefore looks
# under src-tauri/target/, since it runs cargo from src-tauri/.
#
# coord derives each test_id as `{classname}::{name}`; for nextest's JUnit that
# is `{binary_id}::{test_path}`, e.g.
# `qontinui-runner::qontinui-runner::agent_runtime::tests::some_test`.
path = "junit.xml"
store-success-output = false
store-failure-output = true
