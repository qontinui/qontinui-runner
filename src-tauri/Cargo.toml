[package]
name = "qontinui-runner"
version = "1.0.0"
description = "Desktop application for running Qontinui automation projects"
authors = ["Qontinui <contact@qontinui.org>"]
edition = "2021"
default-run = "qontinui-runner"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qontinui_runner_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.5"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2.5"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
erased-serde = "0.4"
schemars = "1"
jsonschema = { version = "0.45", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
thiserror = "2"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "chrono"] }
tracing-appender = "0.2"
chrono = "0.4"
sentry = { version = "0.35", default-features = false, features = ["backtrace", "contexts", "panic", "anyhow", "reqwest", "rustls"] }
dirs = "6.0"
keyring = "3.6"
reqwest = { version = "0.13", features = ["json", "multipart", "blocking", "stream", "form"] }
open = "5"
hostname = "0.4"
base64 = "0.22"
bollard = "0.18"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "http-json", "reqwest-client"] }
tracing-opentelemetry = "0.28"
axum = { version = "0.8", features = ["ws"] }
async-graphql = { version = "8.0.0-rc.4", features = ["chrono", "uuid", "tracing"] }
async-graphql-axum = "8.0.0-rc.4"
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
urlencoding = "2.1"
zip = "8"
sha2 = "0.10"
hmac = "0.12"
rand = "0.9"
aes-gcm = "0.10"
hex = "0.4"
scopeguard = "1.2"
regex = "1.10"
# PostgreSQL (Clorinde-generated queries)
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
deadpool-postgres = "0.14"
qontinui-db = { path = "./clorinde" }
socket2 = "0.6"
cron = "0.15"
chrono-tz = "0.10"
once_cell = "1.19"
flate2 = "1.0"
notify = "8"
glob = "0.3"
petgraph = "0.6"
imageproc = "0.25"
toml = "1"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
portable-pty = "0.8"
arboard = "3.4"
dashmap = "6"
xcap = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "webp"] }
# notify-rust removed — replaced by tauri-plugin-notification (session 15)

# MCP (Model Context Protocol) client
rmcp = "0.1"

# Code analysis (tree-sitter for parsing)
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
streaming-iterator = "0.1"  # For iterating over tree-sitter query matches
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"
walkdir = "2.5"
glob-match = "0.2"
jsonpath-rust = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.22"
zbus = "4"

[[bin]]
name = "mock_claude_cli"
path = "src/bin/mock_claude_cli.rs"

[[bin]]
name = "export_schemas"
path = "src/bin/export_schemas.rs"

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"
unused_assignments = "allow"
unused_mut = "allow"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
ptr_arg = "allow"
enum_variant_names = "allow"
module_inception = "allow"
unnecessary_cast = "allow"
redundant_closure = "allow"
useless_format = "allow"
manual_strip = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
clone_on_copy = "allow"
manual_clamp = "allow"
iter_cloned_collect = "allow"
unwrap_or_default = "allow"
format_in_format_args = "allow"
needless_return = "allow"
large_enum_variant = "allow"
while_let_loop = "allow"
manual_let_else = "allow"
needless_range_loop = "allow"
unused_self = "allow"
wrong_self_convention = "allow"
struct_field_names = "allow"
doc_lazy_continuation = "allow"
redundant_clone = "allow"
unnecessary_to_owned = "allow"
unnecessary_unwrap = "allow"
filter_map_bool_then = "allow"
struct_excessive_bools = "allow"
match_single_binding = "allow"
single_match = "allow"
needless_pass_by_value = "allow"
explicit_deref_methods = "allow"
deref_addrof = "allow"
await_holding_lock = "allow"
read_zero_byte_vec = "allow"
mut_range_bound = "allow"
if_same_then_else = "allow"
same_item_push = "allow"
result_large_err = "allow"
unnecessary_literal_unwrap = "allow"
regex_creation_in_loops = "allow"

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = 0  # No debug info — prevents LLVM OOM during linking
split-debuginfo = "packed"
