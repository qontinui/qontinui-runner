[package]
name = "qontinui-runner"
version = "1.0.3"
description = "Desktop app for AI-assisted development: orchestrated AI coding sessions with visual feedback, self-verification, and real-time UI inspection"
authors = ["Qontinui <contact@qontinui.org>"]
edition = "2021"
license = "AGPL-3.0-or-later"
default-run = "qontinui-runner"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qontinui_runner_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.5"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2.5"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
# Phase F.1 — Wake-from-web custom URL scheme + system-startup autostart.
# `qontinui://wake?intent=<id>&task_id=<id>` triggers an immediate scheduler
# tick from a remote-dispatch payload, and the autostart toggle gives users a
# durable solution for overnight scheduled tasks without leaving the runner
# running. Both plugins are part of the official Tauri 2.x plugin family.
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
serde_yaml = "0.9"
erased-serde = "0.4"
schemars = "1"
jsonschema = { version = "0.45", default-features = false }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tokio-util = "0.7"
uuid = { version = "1.0", features = ["v4", "v5", "v7", "serde"] }
thiserror = "2"
anyhow = "1.0"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "chrono"] }
tracing-appender = "0.2"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
url = "2"
sentry = { version = "0.35", default-features = false, features = ["backtrace", "contexts", "panic", "anyhow", "reqwest", "rustls"] }
dirs = "6.0"
# Without an explicit backend feature the keyring crate compiles a no-op
# stub that returns Ok(()) from set_password and NoEntry from get_password
# — silently dropping every credential. Enable the platform-native
# backends so wrapper credentials actually persist.
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
mdns-sd = "0.11"
# Pure-Rust ADB client (Plan 1A) — replaces fragile subprocess adb.exe parsing.
# Plan mention: cocool97/adb_client. Features: `usb` for direct USB device I/O,
# `mdns` for adb mDNS services. The crate is sync; call via tokio::spawn_blocking.
adb_client = { version = "3", features = ["usb", "mdns"] }
reqwest = { version = "0.13", features = ["json", "multipart", "blocking", "stream", "form"] }
open = "5"
hostname = "0.4"
# Row 2 Phase 1 (fleet topology): used by `fleet::detect_resources` to
# read RAM / disk / CPU on startup so the runner can publish its
# MachineBudget per §3.2. `default-features = false` strips the
# Linux-only `network`/`processes`/`users` collectors we don't need.
sysinfo = { version = "0.32", default-features = false, features = ["system", "disk"] }
subtle = "2"
mime_guess = "2"
base64 = "0.22"
bollard = "0.18"
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry_sdk = { version = "0.27", features = ["trace", "rt-tokio"] }
opentelemetry-otlp = { version = "0.27", default-features = false, features = ["http-proto", "http-json", "reqwest-client"] }
tracing-opentelemetry = "0.28"
axum = { version = "0.8", features = ["ws"] }
async-graphql = { version = "8.0.0-rc.4", features = ["chrono", "uuid", "tracing"] }
async-graphql-axum = "8.0.0-rc.4"
futures = "0.3"
futures-util = "0.3"
async-stream = "0.3"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.6", features = ["cors", "limit", "trace", "catch-panic"] }
urlencoding = "2.1"
zip = "8"
sha2 = "0.10"
hmac = "0.12"
rand = "0.9"
aes-gcm = "0.10"
hex = "0.4"
scopeguard = "1.2"
regex = "1.10"
# PostgreSQL (Clorinde-generated queries)
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
deadpool-postgres = "0.14"
qontinui-db = { path = "./clorinde" }
# Embedded/managed PostgreSQL so the shipped desktop app is self-contained:
# it starts a private Postgres under the app's data dir when no external DB is
# configured/reachable (see src/embedded_pg.rs), instead of panicking on boot.
# `bundled` embeds the PG archive at COMPILE time — no runtime download, offline
# first run. Provisioning only; the tokio-postgres/clorinde query layer above is
# unchanged. Version resolves via the POSTGRESQL_VERSION build env (defaults to
# the crate's latest); keep it consistent across builds for on-disk cluster
# compatibility.
postgresql_embedded = { version = "0.20.2", features = ["bundled"] }
qontinui-spec-check = { path = "../crates/spec-check" }
qontinui-types = { path = "../../qontinui-schemas/rust", version = ">=0.1.2, <2.0.0" }
qontinui-code-graph = { path = "../../qontinui-schemas/code-graph", version = ">=0.1.0, <2.0.0" }
qontinui-vision-core = { path = "../../qontinui-schemas/rust-vision-core", version = "^0.1.0" }
socket2 = "0.6"
cron = "0.15"
chrono-tz = "0.10"
once_cell = "1.19"
flate2 = "1.0"
# Section 4 (UI Bridge redesign) — embed `<runner>/specs/pages/` into the
# release binary at compile time. Production runners served outside the repo
# (no sibling specs/ directory) fall back to this snapshot in
# `spec_api::storage` so the Spec API still answers /spec/page/<id>.
include_dir = "0.7"
notify = "8"
# libgit2 bindings for git supervision channel (D5 Phase 1).
# Used by `trigger_system::watchers::git_watcher` to populate commit
# metadata (sha, message, author, changed files) on `commit` events.
# Default features include `https`/`ssh` transports that the watcher
# doesn't need — kept on to match the simplest install path. Binary-size
# cost is acceptable per the plan §3.5 decision.
git2 = "0.20"
glob = "0.3"
petgraph = "0.6"
imageproc = "0.25"
toml = "1"
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
portable-pty = "0.8"
# VT parser (Paul Williams state machine) used by alacritty/wezterm.
# Powers per-session terminal grids in `terminal::grid`.
vte = "0.15"
unicode-width = "0.2"
arboard = "3.4"
dashmap = "6"
lru = "0.16"
xcap = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tempfile = "3"
# notify-rust removed — replaced by tauri-plugin-notification (session 15)

# Restate durable execution (optional — behind `restate` feature flag)
restate-sdk = { version = "0.10", optional = true }
# Required when the `restate` feature is on so local types can implement
# `restate_sdk::serde::Serialize`/`Deserialize` — the trait methods take/return
# `bytes::Bytes` (see `src/restate/types.rs::impl_restate_serde_via_json!`).
# Restate-sdk 0.10 still depends on bytes ^1.11, so this stays in sync.
bytes = "1"

# Code analysis (tree-sitter for parsing)
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
streaming-iterator = "0.1"  # For iterating over tree-sitter query matches
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }
# Cross-platform: imported from non-cfg-gated source files. Previously
# misplaced under [target.'cfg(windows)'.dependencies], which broke
# Linux + macOS builds.
walkdir = "2.5"
glob-match = "0.2"
jsonpath-rust = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Variant",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.58"
# Occlusion-immune runner-window capture via WebView2 `CapturePreview`
# (`screenshots::capture_webview_contents`). `webview2-com` is resolved
# transitively by `wry` already; promoting it to a direct dep pins it in
# lockstep with WRY's version so `PlatformWebview::controller()` returns the
# *same* `ICoreWebView2Controller` type (a version skew would be a hard type
# mismatch). The capture path needs `Microsoft::Web::WebView2::Win32`
# (re-exported by webview2-com as `Microsoft`) plus a few `windows`-crate COM
# helpers (`IStream`, `SHCreateMemStream`). webview2-com 0.38 links against
# `windows 0.61` (NOT our direct `windows = 0.58`), so the COM helpers must
# come from a renamed 0.61 dep — using 0.58 here would yield an `IStream` type
# that `CapturePreview`'s generic bound rejects. See
# `reference_runner_modules_in_bin_not_lib.md` (capture lives in the BIN).
webview2-com = "0.38"
windows-capture = { package = "windows", version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Shell",
] }
libloading = "0.8"  # JAB adapter (Windows-only) loads WindowsAccessBridge-64.dll

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
core-foundation-sys = "0.8"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = "0.22"
zbus = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"  # SIGTERM/SIGKILL via libc::kill in cfg(not(windows)) blocks

[features]
default = ["restate", "spec-authoring"]
restate = ["restate-sdk"]
# Tells Tauri to embed the frontend from dist/ instead of loading from devUrl.
# Without this, debug builds load from localhost:1420 (Vite dev server).
custom-protocol = ["tauri/custom-protocol"]
# Phase 5.1 of the UI Bridge discoverability/effectiveness plan
# (qontinui-dev-notes/ui-bridge/docs/2026-05-03-...): exposes the debug-only
# `/ui-bridge/test/inject-session` + `/ui-bridge/test/clear-sessions`
# endpoints in release builds. Debug builds always carry them via
# `cfg(debug_assertions)`; this feature is the explicit opt-in for
# release-mode regression / smoke harnesses.
test-fixtures = []
# Stream E (Flywheel) — coverage-growth loop. Gates `spec_authoring`,
# the proposals endpoints, and the supervisor cron. Off by default for
# spec-check v1.0 ship; the user-facing `--enable-spec-authoring` alias
# maps to this feature in the runner CLI/env layer.
spec-authoring = []
# PG-bound integration tests for the proposals subsystem (Stream E).
# Off by default; enable with `--features spec-authoring,pg_integration_tests`
# when a live PG (canonical or local) is available.
pg_integration_tests = []

[[bin]]
name = "mock_claude_cli"
path = "src/bin/mock_claude_cli.rs"

[[bin]]
name = "export_schemas"
path = "src/bin/export_schemas.rs"

[[bin]]
name = "wrappers_mcp"
path = "src/bin/wrappers_mcp.rs"

[[bin]]
name = "scan_spec_distinctness"
path = "src/bin/scan_spec_distinctness.rs"

[[bin]]
name = "qontinui_specs"
path = "src/bin/qontinui_specs.rs"

[[bin]]
name = "qontinui-git-credential"
path = "src/bin/qontinui_git_credential.rs"

# `qontinui-pr` session CLI (plan qontinui-pr-credential-provisioning, Phase 2b).
# Delivered onto every terminal's PATH by the identity-shim materializer and
# bundled into installed runners as a Tauri externalBin sidecar (see
# `tauri.conf.json` + `scripts/bundle-profile-sidecar.mjs`). Named `qontinui-pr`
# (NOT `qontinui`) so it never shadows the Python qontinui library's `qontinui`
# console script on the PATH-prepended shim dir. `qontinui-pr create` POSTs the
# runner's loopback `/vcs/pull-requests` proxy, which forwards to coord's
# JWT-authed PR-creation route — so agents can open PRs without a personal
# `gh auth login` on the machine.
[[bin]]
name = "qontinui-pr"
path = "src/bin/qontinui_cli.rs"

# `coord doctor` headless self-check (plan 2026-06-13 Phase 4). Reuses the
# lib-crate `coord_doctor` module (driver + 7-check wiring) so it produces the
# same report as the in-app Tauri command. Runnable on any machine to diagnose
# "no credentials / can't set gates" with the one failing link + its fix.
[[bin]]
name = "coord_doctor"
path = "src/bin/coord_doctor.rs"

# Install-interception Windows `.exe` shadow stub (plan §6). The materializer
# copies this binary into the per-terminal shim dir as cargo.exe/pip.exe/pip3.exe
# so it can shadow the real `.exe` under PowerShell/cmd (a `.cmd` cannot — `.EXE`
# precedes `.CMD` in PATHEXT). Pure + dependency-light: reuses the lib-crate
# `intercept_core::{classify,gate}` and a minimal std::net HTTP POST.
[[bin]]
name = "qontinui-shim"
path = "src/bin/qontinui_shim.rs"

[lints.rust]
dead_code = "allow"
unused_variables = "allow"
unused_imports = "allow"
unused_assignments = "allow"
unused_mut = "allow"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
ptr_arg = "allow"
enum_variant_names = "allow"
module_inception = "allow"
unnecessary_cast = "allow"
redundant_closure = "allow"
useless_format = "allow"
manual_strip = "allow"
collapsible_if = "allow"
collapsible_match = "allow"
clone_on_copy = "allow"
manual_clamp = "allow"
iter_cloned_collect = "allow"
unwrap_or_default = "allow"
format_in_format_args = "allow"
needless_return = "allow"
large_enum_variant = "allow"
while_let_loop = "allow"
manual_let_else = "allow"
needless_range_loop = "allow"
unused_self = "allow"
wrong_self_convention = "allow"
struct_field_names = "allow"
doc_lazy_continuation = "allow"
redundant_clone = "allow"
unnecessary_to_owned = "allow"
unnecessary_unwrap = "allow"
filter_map_bool_then = "allow"
struct_excessive_bools = "allow"
match_single_binding = "allow"
single_match = "allow"
needless_pass_by_value = "allow"
explicit_deref_methods = "allow"
deref_addrof = "allow"
await_holding_lock = "allow"
read_zero_byte_vec = "allow"
mut_range_bound = "allow"
if_same_then_else = "allow"
same_item_push = "allow"
result_large_err = "allow"
unnecessary_literal_unwrap = "allow"
regex_creation_in_loops = "allow"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# Deterministic mtime control for tests (e.g. transcript::get_latest_session_id
# `since` filter coverage). Cross-platform; on Windows wraps SetFileTime.
filetime = "0.2"

## Profile overrides moved to the workspace root Cargo.toml — cargo
## ignores [profile.*] in package manifests when a workspace exists.
