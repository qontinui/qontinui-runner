[package]
name = "qontinui-runner"
version = "0.1.0"
description = "Desktop application for running Qontinui automation projects"
authors = ["Qontinui <contact@qontinui.org>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qontinui_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.5", features = [] }
tauri-plugin-opener = "2.3"
tauri-plugin-dialog = "2.3"
tauri-plugin-updater = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
erased-serde = "0.4"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "chrono"] }
tracing-appender = "0.2"
chrono = "0.4"
sentry = { version = "0.35", default-features = false, features = ["backtrace", "contexts", "panic", "anyhow", "reqwest", "rustls"] }
dirs = "5.0"
keyring = "3.6"
reqwest = { version = "0.12", features = ["json", "multipart"] }
hostname = "0.4"
base64 = "0.22"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "limit"] }
urlencoding = "2.1"
zip = "0.6"
sha2 = "0.10"
rand = { version = "0.8", features = ["std_rng"] }
aes-gcm = "0.10"
hex = "0.4"
scopeguard = "1.2"
regex = "1.10"
socket2 = "0.5"
cron = "0.12"
once_cell = "1.19"

[dev-dependencies]
tempfile = "3"
