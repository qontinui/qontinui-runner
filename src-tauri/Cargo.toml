[package]
name = "qontinui-runner"
version = "0.1.0"
description = "Desktop application for running Qontinui automation projects"
authors = ["Qontinui <contact@qontinui.org>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "qontinui_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
tauri = { version = "2.5", features = ["protocol-asset"] }
tauri-plugin-opener = "2.5"
tauri-plugin-dialog = "2.5"
tauri-plugin-updater = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
erased-serde = "0.4"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "chrono"] }
tracing-appender = "0.2"
chrono = "0.4"
sentry = { version = "0.35", default-features = false, features = ["backtrace", "contexts", "panic", "anyhow", "reqwest", "rustls"] }
dirs = "5.0"
keyring = "3.6"
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
hostname = "0.4"
base64 = "0.22"
axum = { version = "0.7", features = ["ws"] }
futures-util = "0.3"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "limit"] }
urlencoding = "2.1"
zip = "0.6"
sha2 = "0.10"
rand = { version = "0.8", features = ["std_rng"] }
aes-gcm = "0.10"
hex = "0.4"
scopeguard = "1.2"
regex = "1.10"
rusqlite = { version = "0.31", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"
socket2 = "0.5"
cron = "0.12"
once_cell = "1.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }
walkdir = "2.5"
glob-match = "0.2"
jsonpath-rust = "0.5"

# MCP (Model Context Protocol) client
rmcp = "0.1"

# Code analysis (tree-sitter for parsing)
tree-sitter = "0.24"
tree-sitter-python = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.23"
streaming-iterator = "0.1"  # For iterating over tree-sitter query matches
syn = { version = "2.0", features = ["full", "parsing", "visit"] }
proc-macro2 = { version = "1.0", features = ["span-locations"] }

[dev-dependencies]
tempfile = "3"
